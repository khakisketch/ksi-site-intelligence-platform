# Model Registry — 모델·가중치 계보 SSOT (INV-043: Dataset/Model 라이선스·출처 계보 고정)
#
# 규칙:
# - 모델 이름에 "coco"가 들어 있다는 것만으로 계보를 신뢰하지 않는다 — revision·sha256 이
#   신원이다. adapter 는 이 파일의 digest 와 대조 검증한 파일만 로드한다.
# - 런타임 자동 다운로드 금지. 파일은 tools/fetch_model.py 로만 받는다.
# - deployment_status.production 은 MODEL-B1-001 production_gate 전부 통과 전에는
#   BLOCKED_LEGAL_REVIEW 를 유지한다. ENGINEERING 승인 ≠ PRODUCTION 승인.

models:
  - model_id: ksi-person-detector-dfine-s-coco
    architecture: D-FINE-S
    decision_ref: MODEL-B1-001

    source:
      repository: Peterande/D-FINE
      repository_commit: "7fe2f8889f0b7b817f20c315b40fc15a4fb64ae6"  # master 2026-07-09
      code_license: Apache-2.0

    weights:
      source: ustc-community/dfine-small-coco
      revision: "f79e65b5fbb33ceb9d3ebba042955d7410c608f8"  # immutable HF revision
      files:
        - name: model.safetensors
          sha256: "a144baff3a27bfd538fe37b11fa8d4fca5744b8c054b5301e7c699a1379cd18f"
        - name: config.json
          sha256: "9f206c4c935c67c957af2f15c3333b4ff224e72b1881bc7bbde9f873edf4448e"
        - name: preprocessor_config.json
          sha256: "7e9e2245806aa3ef068a5321f5eebee3116fa4cec560173231954ffaca930eca"
      declared_license: Apache-2.0

    model_facts:
      num_labels: 80            # COCO 80-class (config.json id2label 확인)
      person_label_id: 0        # id2label["0"] == "person"
      input_size: [640, 640]    # RTDetrImageProcessor resize
      params_m: 10.2
      coco_ap_50_95: 48.5       # 공식 README (T4 기준 — Manifold 실측 아님)

    pretraining:
      declared_dataset: COCO
      objects365_used: false
      visdrone_used: false
      # "깨끗"이 아니라 잔여 위험 포함 검토 완료 — COCO 이미지는 Flickr 개별 라이선스로
      # 권리가 이질적이다(대표자 판정 2026-07-27). Objects365 대비 명확히 낮은 위험의
      # 엔지니어링 기준선이지, 상용 법무 승인을 의미하지 않는다.
      lineage_status: REVIEWED_WITH_RESIDUAL_RISK

    # ONNX Export Recipe (B2 선결 — onnx-export-recipe risk 폐쇄, 2026-07-28 실측).
    # 산출물 자체는 git 에 넣지 않는다 — export 시 <output>.manifest.json 이 전체
    # 계보를 담고, 여기는 재현 계약의 요약이다. digest 는 **아래 toolchain 고정
    # 환경에서의 실측**이며, toolchain 이 바뀌면 digest 도 바뀐다(재실측 필요).
    export:
      exporter: "torch.onnx.export(dynamo=False)  # legacy — dynamo 는 aten._is_all_true 미지원(실측)"
      opset: 17
      toolchain:
        python: "3.12.13"
        torch: "2.13.0+cpu"
        transformers: "5.14.1"
        onnx: "1.22.0"
        onnxruntime: "1.28.0"
      inputs:
        - name: pixel_values
          shape: [1, 3, 640, 640]
          dtype: float32
          axes: "static (전처리가 640x640 고정, batch=1)"
      outputs: [logits, pred_boxes]
      graph_transforms:
        - "position embedding constants float64 → float32 (7 지점 — ORT CPU·TensorRT 는 double Cos/Sin 미지원)"
        - "surplus trace outputs 제거 — legacy exporter 가 남긴 내부 텐서 출력을 걷어내 그래프 출력을 선언 계약(logits·pred_boxes)으로 고정(재검토 P0 #8 세션 실계약 대조의 전제)"
      determinism: "BYTE-IDENTICAL — 동일 입력 2회 export sha256 일치 (2026-07-28 재실측, surplus 제거 반영)"
      onnx_sha256: "1becd2d3ae559cd075157f542bf754d2bdbf1982e71433d2ed367364df03298a"
      conformance:
        corpus: "tools/build_onnx_corpus.py 10종 (단일/다수/무탐지/소형/경계/겹침/차량/미지원/노이즈/부분가시) — 장면별 의도 현상은 실측 앵커로 고정(test_onnx_conformance)"
        criteria: "detection 수·canonical class·원시 id/이름/버전 정확 일치 · confidence atol 1e-3 · bbox atol 0.5px · drop 사유 정확 일치 · 경로별 결정성"
        cross_path_fingerprint: >-
          미보장 — ONNX 와 PyTorch 는 연산 순서가 달라 bit-exact 를 보장하지 않으므로
          cross-경로는 허용오차 기반 의미 비교, fingerprint 결정성은 경로 내 2회
          실행으로 고정(tests/contract/test_onnx_conformance.py)
      tensorrt_note: "TensorRT 변환·성능·발열 판정은 B2 Manifold HIL 의 몫 — 이 섹션은 export 계약까지만"

    deployment_status:
      b1_adapter: APPROVED
      manifold_hil: PENDING
      production: BLOCKED_LEGAL_REVIEW
