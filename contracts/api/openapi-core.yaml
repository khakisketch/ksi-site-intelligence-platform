  /v1/sites:
    post:
      summary: Register a new Site (initial status always UNMAPPED)
      description: >-
        SITES_WRITE 권한 필요. siteId 중복은 409, 구조 위반은 422 — 최종상태
        직접 등록은 불가하다(§6.1, 항상 UNMAPPED 로 시작). aoi 는 선택 — 등록과
        함께 줄 수도, 나중에 PUT /v1/sites/{site_id}/aoi 로 설정할 수도 있다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [siteId, name, siteFrame]
              properties:
                siteId: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                siteFrame:
                  type: object
                  additionalProperties: false
                  required: [crs, verticalDatum, unit, transformVersion]
                  properties:
                    crs: { type: string }
                    verticalDatum: { type: string }
                    unit: { const: meter }
                    transformVersion: { type: string }
                aoi:
                  type: object
                  additionalProperties: false
                  required: [vertices]
                  description: >-
                    선택 필드. 닫힌 단순 폴리곤(마지막→첫 꼭짓점 변이 암묵적으로
                    닫는다, 3~256 꼭짓점). 생략하면 등록 후 PUT
                    /v1/sites/{site_id}/aoi 로 설정한다.
                  properties:
                    vertices:
                      type: array
                      minItems: 3
                      items:
                        type: object
                        additionalProperties: false
                        required: [latDeg, lonDeg]
                        properties:
                          latDeg: { type: number, minimum: -90, maximum: 90 }
                          lonDeg: { type: number, minimum: -180, maximum: 180 }
                dataResidency:
                  type: object
                  additionalProperties: false
                  required: [egressAllowed, jurisdiction]
                  description: >-
                    선택 필드지만 **생략은 반출 불가를 뜻한다**(INV-050) — 관대한
                    기본값이 아니다. 처리 작업(POST /v1/missions/{mission_id}/
                    processing-jobs)이 executionLocus=vendor_cloud 를 요청할 때
                    이 값만 본다. 등록 이후 변경 경로는 의도적으로 없다 — 반출
                    허용은 법적 판단이라 SITES_WRITE 로 조용히 바꿀 값이 아니다.
                  properties:
                    egressAllowed: { type: boolean }
                    jurisdiction: { type: string, minLength: 1 }
                aiEgressAllowed:
                  type: boolean
                  default: false
                  description: >-
                    외부 AI 구조화 데이터 반출에 대한 별도 명시 동의. 생략은 false이며
                    dataResidency.egressAllowed=true가 이 값을 암묵적으로 켜지 않는다.
      responses:
        '201':
          description: REGISTERED — verdict + 등록된 SiteView
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMutationResponse' }
        '409': { description: DUPLICATE_SITE_ID }
        '422':
          description: >-
            INVALID_SITE(siteId/name/siteFrame 필드 공백 — INV-020 / siteId 가
            경로-안전 문자 밖 — '/'·공백 등, /v1/sites/{site_id} 경로 세그먼트
            제약) / aoi 구조 위반(자기교차·중복 꼭짓점·범위 밖 좌표 등 —
            AreaOfInterest 파싱 실패, FastAPI 표준 422)
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
    get:
      summary: List sites (siteId 오름차순 결정적 정렬)
      description: SITES_READ 권한 필요.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 등록된 현장 전체
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}:
    get:
      summary: Get one Site by id
      description: SITES_READ 권한 필요. 미지 siteId 는 존재 여부 힌트 없는 일반 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 현장 하나
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDetailView' }
        '404': { description: 현장을 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}/transitions:
    post:
      summary: Transition a Site's status (10-state machine, MASTER_PRD §6.3)
      description: >-
        SITES_WRITE 권한 필요. evidence·reason 비공백 필수. SUSPENDED 이탈은
        저장소가 기억한 진입 직전 상태로만 복귀 허용(§6.1). PATROL_READY 도달은
        MODEL_VALIDATION→PROVISIONAL_AUTONOMY 경유가 강제된다(품질검증 생략 금지).
        blast radius 가 큰 간선(자율 시작 승인 MODEL_VALIDATION→
        PROVISIONAL_AUTONOMY·정식 순찰 승인 PROVISIONAL_AUTONOMY→PATROL_READY·
        모든 상태→SUSPENDED 진입·SUSPENDED→직전 상태 복귀)은 SITES_WRITE 만으로는
        부족하고 추가로 SITES_AUTONOMY_APPROVE 권한(관리자 전용)을 요구한다
        (ADR-KSI-015 D2). 간선(현재 상태 → 요청 상태) 쌍 기준 판정이다 —
        PATROL_ACTIVE→PATROL_READY(순찰 복귀)는 같은 목적지라도 게이트되지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus, evidence, reason]
              properties:
                targetStatus:
                  enum:
                    - UNMAPPED
                    - BASELINE_MAPPING
                    - MODEL_PROCESSING
                    - MODEL_VALIDATION
                    - PROVISIONAL_AUTONOMY
                    - PATROL_READY
                    - PATROL_ACTIVE
                    - MODEL_STALE
                    - REMAP_REQUIRED
                    - SUSPENDED
                evidence: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: TRANSITIONED — verdict + 전이된 SiteView
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMutationResponse' }
        '404': { description: UNKNOWN_SITE }
        '409': { description: ILLEGAL_TRANSITION }
        '422': { description: INVALID_SITE(evidence/reason 공백) }
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403':
          description: >-
            SITES_WRITE 권한 없음, 또는 관리자 전용 간선인데 SITES_AUTONOMY_APPROVE
            권한이 없음(ADR-KSI-015 D2).
  /v1/sites/{site_id}/aoi:
    put:
      summary: Set or replace a Site's AOI (Area of Interest polygon)
      description: >-
        SITES_WRITE 권한 필요. AOI 는 ``UNMAPPED`` 상태에서만 설정·교체할 수
        있다(409 AOI_LOCKED — 매핑이 시작된 뒤 외곽을 바꾸면 이전 임무·누적
        중인 커버리지와의 대조가 무너진다, 막는 쪽이 기본). siteFrame 은
        등록된 site 의 것과 정확 일치해야 한다(422 SITE_FRAME_MISMATCH — 다른
        좌표계를 전제로 그려진 AOI 를 수락하지 않는다, POST /v1/missions/plans
        의 동일 게이트와 같은 관용구).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [aoi, siteFrame]
              properties:
                aoi:
                  type: object
                  additionalProperties: false
                  required: [vertices]
                  description: >-
                    닫힌 단순 폴리곤(마지막→첫 꼭짓점 변이 암묵적으로 닫는다,
                    3~256 꼭짓점).
                  properties:
                    vertices:
                      type: array
                      minItems: 3
                      items:
                        type: object
                        additionalProperties: false
                        required: [latDeg, lonDeg]
                        properties:
                          latDeg: { type: number, minimum: -90, maximum: 90 }
                          lonDeg: { type: number, minimum: -180, maximum: 180 }
                siteFrame:
                  type: object
                  additionalProperties: false
                  required: [crs, verticalDatum, unit, transformVersion]
                  properties:
                    crs: { type: string }
                    verticalDatum: { type: string }
                    unit: { const: meter }
                    transformVersion: { type: string }
                  description: 등록된 site 의 것과 정확 일치해야 한다(SITE_FRAME_MISMATCH).
      responses:
        '200':
          description: AOI_SET — verdict + 갱신된 SiteView
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMutationResponse' }
        '404': { description: UNKNOWN_SITE }
        '409': { description: AOI_LOCKED(UNMAPPED 이후 상태에서 시도) }
        '422':
          description: >-
            SITE_FRAME_MISMATCH / aoi 구조 위반(자기교차·중복 꼭짓점·범위 밖
            좌표 등 — AreaOfInterest 파싱 실패, FastAPI 표준 422)
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
  /v1/sites/{site_id}/model-age-policy:
    put:
      summary: Declare, replace or withdraw the site's spatial-model staleness threshold
      description: >-
        SITES_WRITE 권한 필요. maxAgeDays 는 이 현장의 공간모델이 며칠 지나면 낡은
        것으로 볼지의 기준이다. null 이면 **철회**이고, 철회된 현장은 노후를
        판정하지 않는다(GET /v1/sites/{site_id}/spatial-model 의
        AGE_POLICY_UNDECLARED). 서버는 기본값을 두지 않는다 — MASTER_PRD §6.3 이
        MODEL_STALE 이라는 상태만 정의하고 기준은 정하지 않았으므로, 서버가 숫자를
        지어내면 근거 없는 값이 현장의 자율운영 가능 여부를 가른다(ADR-KSI-019 G1).
        AOI 와 달리 현장 상태로 잠기지 않는다 — 변화 속도는 매핑 시작 이후에 알게
        되는 사실이고, 그때 기준을 못 고치면 정책이 첫 추측에 갇힌다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [maxAgeDays]
              properties:
                maxAgeDays:
                  type: [integer, "null"]
                  minimum: 1
                  description: >-
                    공간모델 노후 판정 기준(일). null 이면 철회. 0·음수는 "매 순간
                    낡음"이라 정책이 아니라 사고이므로 422 로 거부한다.
      responses:
        '200':
          description: MODEL_AGE_POLICY_SET — verdict + 갱신된 SiteView
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMutationResponse' }
        '404': { description: UNKNOWN_SITE }
        '422': { description: INVALID_SITE — maxAgeDays 가 1 미만 }
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
  /v1/sites/{site_id}/equipment-states:
    post:
      summary: Ingest equipment/worker kinematic states (Phase 3, PRD RISK-002)
      description: >-
        EDGE_SYNC_INGEST 권한 + EDGE_DEVICE 신원 필요 — **장비만** 올린다. 사람이
        손으로 위치·속도를 주장할 수 없다(coverage-report 와 동일 원칙).

        서버는 siteFrame 을 현장 등록 좌표계와 대조한다(SITE_FRAME_MISMATCH). 위치·
        속도는 좌표계 없이는 숫자일 뿐이고, cpa_ttc 의 site_frame 검사는 **두 상태
        끼리**만 보므로 둘 다 같은 잘못된 좌표계면 통과한다 — 그 구멍을 여기서 막는다.
        배치는 전부-또는-전무다. 상태는 덮어쓰지 않고 전부 append 한다("언제 어디
        있었다고 봤는가"가 사고 조사의 입력이다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [states]
              properties:
                states:
                  type: array
                  minItems: 1
                  items: { type: object, additionalProperties: true }
      responses:
        '201':
          description: RECORDED — durable 기록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentStateBatchResponse' }
        '404': { description: UNKNOWN_SITE — 등록된 적 없는 현장 }
        '422': { description: SITE_FRAME_MISMATCH — 현장 등록 좌표계와 다름 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: EDGE_DEVICE 가 아니거나 EDGE_SYNC_INGEST 권한 없음 }
    get:
      summary: List the latest kinematic state per entity at a site
      description: >-
        SITES_READ 권한 필요. 개체별 **최신** 상태 스냅샷이다(이력이 아니다).
        positionUncertaintyM 은 공분산 trace 의 제곱근(RMS 반경 근사) — 화면이
        "이 추정을 얼마나 믿을 수 있나"를 표시할 수 있게 서버가 함께 낸다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 개체별 최신 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentStateListView' }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}/risk-assessment:
    get:
      summary: Compute CPA/TTC and the reobservation recommendation for a named pair
      description: >-
        SITES_READ 권한 필요. **쌍과 정책 파라미터를 전부 호출자가 지목한다** —
        "어느 쌍이 평가 대상인가"는 이 저장소 어디에도 정해져 있지 않은 정책
        문제라 서버가 지어내지 않는다(전조합을 돌리면 N² 개의 근거 없는 위험장이
        생기고 그중 무엇이 의미 있는지는 여전히 아무도 모른다). 서버가 하는 것은
        지어낼 수 없는 계산(CPA 거리·TTC·재관찰 권고)뿐이다.

        `timeToCollisionS: null` 은 **"위험 없음"이 아니라 "이 지평선 안에서는
        확인되지 않음"**이다 — 화면이 둘을 같게 표시하면 안 된다.

        두 상태의 observedAt 시간차가 maxObservationGapS 를 넘으면 422 다 — 10분
        전 굴착기 상태와 방금 작업자 상태로 "TTC 2.1초"를 내지 않는다(INV-023
        계열). 200 으로 빈 값을 돌려주면 화면이 안전하다고 읽는다.

        `reobservationRecommended` 는 권고다 — 어떤 Viewpoint 로 재관측할지는
        Edge/Manifold 의 Next Best View 소관이고(PRD §14.2) 이 응답은 비행 좌표를
        만들지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
        - { in: query, name: equipmentEntityId, required: true, schema: { type: string } }
        - { in: query, name: subjectEntityId, required: true, schema: { type: string } }
        - in: query
          name: horizonS
          required: true
          description: 외삽 지평선(초). 등속 가정의 오차를 억제하는 것은 호출자 몫이다.
          schema: { type: number, exclusiveMinimum: 0 }
        - in: query
          name: combinedRadiusM
          required: true
          description: 두 개체의 합산 안전 반경(m) — 이 거리 이내를 충돌로 본다.
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxObservationGapS
          required: true
          description: 두 상태의 observedAt 이 이만큼까지 벌어져도 동시각으로 취급한다.
          schema: { type: number, minimum: 0 }
        - in: query
          name: positionUncertaintyThresholdM
          required: true
          description: 위치 불확실성이 이를 **초과**하면 재관찰 권고(RISK-005).
          schema: { type: number, minimum: 0 }
      responses:
        '200':
          description: CPA/TTC + 재관찰 권고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskAssessmentView' }
        '404': { description: 두 개체 중 하나라도 이 현장에 상태가 보고된 적 없음 }
        '422':
          description: >-
            observedAt 시간차가 maxObservationGapS 초과 / 두 상태의 siteFrame 불일치
            — **계산 불가**이지 "위험 없음"이 아니다
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/equipment-support:
    get:
      summary: List equipment class support levels (MASTER_PRD §23.3/§26.7)
      description: >-
        SITES_READ 권한 필요. **`productionSupported` 가 true 인 것만 상용 지원으로
        표시해야 한다** — 나머지는 전부 "검증 중"이다(REQ-MODEL-101,
        00_READ_FIRST 구현금지 "미검증 장비를 상용지원으로 표시").

        이 플래그는 서버가 `is_production_supported()` 로 계산해서 낸다 — 화면이
        `state` 문자열을 보고 스스로 판단하면 단계가 추가되는 날 조용히 틀린다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 등록된 장비 클래스 전체
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentSupportListView' }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
    post:
      summary: Register an equipment class at DATASET_AVAILABLE
      description: >-
        EQUIPMENT_SUPPORT_APPROVE 권한 필요(ADMIN 전용). 등록은 **최하위 단계로만**
        가능하다 — 임의 단계로 바로 등록할 수 있으면 "승급은 한 단계씩"이 등록 한
        번으로 우회된다(PRODUCTION_SUPPORTED 신규 등록).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [classId]
              properties:
                classId: { type: string, minLength: 1 }
                evidenceRefs: { type: array, items: { type: string } }
                modelVersion: { type: [string, 'null'] }
                riskPackVersion: { type: [string, 'null'] }
      responses:
        '201':
          description: RECORDED — DATASET_AVAILABLE 로 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentSupportMutationResponse' }
        '409': { description: ALREADY_REGISTERED — 단계 변경은 PATCH 다 }
        '422':
          description: >-
            요청 본문 검증 실패(FastAPI 표준 `{detail: [...]}` — verdict 없음).
            `state` 를 실어 보내는 것도 여기 걸린다: 등록은 최하위 단계 전용이라
            요청에 단계를 지정할 자리가 없다(additionalProperties: false).
        '503': { description: STORE_UNAVAILABLE — 봉인됨 }
        '401': { description: 인증 실패 }
        '403': { description: EQUIPMENT_SUPPORT_APPROVE 권한 없음 }
  /v1/equipment-support/{class_id}:
    get:
      summary: Read one equipment class support level
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: class_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 그 클래스의 현재 지원단계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentSupportView' }
        '404': { description: 등록된 적 없는 장비 클래스 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
    patch:
      summary: Promote or demote an equipment class support level (INV-041 강제 지점)
      description: >-
        EQUIPMENT_SUPPORT_APPROVE 권한 필요(ADMIN 전용). 전이 판정은
        `ksi_domain.capability.assert_support_level_transition` 하나가 소유한다 —
        이 엔드포인트는 그 함수를 부를 뿐 자체 판정표를 갖지 않는다.

        **승급은 한 단계씩, evidenceRefs 필수**(빈 배열·공백 문자열도 증거 없음이다).
        단계를 건너뛴 승급은 422 다.

        **강등은 증거 없이도 허용된다** — 현장 재검증 실패에 즉시 대응해야 하는
        방향에 마찰을 넣지 않는다. 다만 그 전이도 원장에 남고, 강등된 상태는 승급
        때의 evidenceRefs 를 물려받지 않는다(예전 증거를 달고 있으면 "이 단계는
        검증됐다"는 잘못된 신호가 된다).

        **부분 갱신 의미론**: `modelVersion`/`riskPackVersion` 을 요청에 싣지 않으면
        승급·재선언에서는 이전 값을 **이어받고**, 강등에서는 **비운다**. 강등에서
        비우는 이유는 evidenceRefs 와 같다 — "이 모델로 그 단계를 세웠다"는 사실은
        내려온 뒤에는 더 이상 이 레코드의 근거가 아니고, 모델 회귀로 강등하는
        경우가 특히 그렇다. 값을 명시적으로 null 로 지우는 경로는 없다(생략과
        구분되지 않는다) — 지우려면 강등하거나 새 값을 준다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: class_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state:
                  description: contracts/schemas/equipment-support-state.v1.json 의 state enum.
                  enum:
                    [DATASET_AVAILABLE, BASELINE_DETECTION, FIELD_VALIDATED,
                     GEO_VALIDATED, RISK_VALIDATED, PRODUCTION_SUPPORTED]
                evidenceRefs: { type: array, items: { type: string } }
                modelVersion: { type: [string, 'null'] }
                riskPackVersion: { type: [string, 'null'] }
      responses:
        '200':
          description: RECORDED — 전이 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentSupportMutationResponse' }
        '404': { description: UNKNOWN_CLASS — 등록된 적 없는 장비 클래스 }
        '422':
          description: >-
            두 종류가 같은 코드로 온다 — 본문으로 구분한다.
            ① 게이트 거부: `{verdict: "ILLEGAL_TRANSITION", detail, record: null}`
            (단계 스킵 승급 / 증거 없는 승급 / **증거 없는 동일 단계 재선언**).
            동일 단계도 증거를 요구하는 이유: 그건 강등이 아니라 "이 단계가 여전히
            유효하다"는 주장이고, 증거 없이 통과시키면 단계 표시만 남고 근거가 지워진다.
            ② 요청 본문 검증 실패: FastAPI 표준 `{detail: [...]}` (verdict 없음).
            증거 판정은 공백뿐 아니라 U+200B·U+FEFF 같은 보이지 않는 format 문자도
            "내용 없음"으로 본다.
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: EQUIPMENT_SUPPORT_APPROVE 권한 없음 }
  /v1/edge-sync/event-bundles:
    post:
      summary: Ingest one idempotent EventBundle journal entry
      description: >-
        본문은 offline_sync JournalEntry(camelCase — idempotencyKey,
        deviceSequence, edgeDeviceId, payloadDigest "sha256:<hex64>", payload).
        payload 는 event-bundle.v1.2.json 을 만족해야 하며(분류 계보 필수,
        INV-031), wire 직렬화는 exclude_none 규약이다. 201/200 만 ACK 다 —
        Edge 는 그 둘을 받은 항목만 로컬에서 삭제한다. EDGE_SYNC_INGEST 권한
        필요(EDGE_DEVICE Principal 전용) — 인증 장비의 deviceId 가 본문
        edgeDeviceId 와 다르면 원장 반영 전에 403 DEVICE_MISMATCH 로 거부한다
        (ADR-KSI-008 §2 — 위조 순번 주입이 장비 신원 뒤로 차단된다).

        수신 전 세 정책 게이트(멱등 원장·순번축 선점 전에 판정 — events.py
        ``classify_edge_bundle``)를 통과해야 event projection 이 이뤄진다.
        ① payload.eventId·인증 edgeDeviceId 중 하나라도 경로-안전 문자
        (``ksi_core.identifiers``, 영숫자 시작 + 영숫자/``_``/``.``/``-``)
        밖의 문자('/'·공백·예약 구분자 ``::`` 등)를 포함하면 서버 정본 신원
        ``event_key = "{edgeDeviceId}::{eventId}"`` 가 라우트 경로 세그먼트로
        쓰일 수 없어 422 INVALID_EVENT_IDENTITY 로 거부(ACK 없음 — 검증 없이
        수락하면 상세·전이 라우트에 영구히 도달 못 하는 사건이 만들어진다).
        ② payload.occurredAt 이 tz-aware(offset 포함)가 아니면 422
        INVALID_EVENT_TIMESTAMP 로 거부(ACK 없음) — naive 값은 서버 로컬
        타임존으로 조용히 재해석돼 감사 시간축이 어긋난다. ③ payload.status 가
        CONFIRMED_EVENT/DISMISSED(종단 상태)면 422 STATUS_NOT_EDGE_ASSERTABLE
        로 거부(ACK 없음) — 확정/기각은 서버 트리아지(``POST
        /v1/events/{event_key}/transitions``)의 업무 판정 전용이며 Edge 가
        주장할 수 없다(MASTER_PRD §8.1/§7.6, INV-021 우회 차단). 실제 인지
        파이프라인은 OBSERVATION→CANDIDATE 까지만 발행한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, deviceSequence, edgeDeviceId, payloadDigest, payload]
              properties:
                idempotencyKey: { type: string, minLength: 1 }
                deviceSequence: { type: integer, minimum: 0 }
                edgeDeviceId: { type: string, minLength: 1 }
                payloadDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                payload:
                  $ref: ../schemas/event-bundle.v1.2.json
      responses:
        '201':
          description: ACCEPTED — durable persistence 후 ACK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '200':
          description: DUPLICATE_IGNORED — 멱등 재전송(ACK)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '403': { description: DEVICE_MISMATCH(인증 장비 ≠ 요청 edgeDeviceId) / EDGE_SYNC_INGEST 권한 없음 }
        '409': { description: IDEMPOTENCY_CONFLICT / SEQUENCE_DUPLICATE / SEQUENCE_REGRESSION }
        '422':
          description: >-
            DIGEST_MISMATCH / MALFORMED_PAYLOAD / INVALID_EVENT_BUNDLE /
            INVALID_EVENT_IDENTITY(eventId·edgeDeviceId 가 경로-안전 문자
            밖 — '/'·공백·`::` 등) / INVALID_EVENT_TIMESTAMP(occurredAt 이
            tz-aware 아님) / STATUS_NOT_EDGE_ASSERTABLE(status 가
            CONFIRMED_EVENT/DISMISSED — 확정/기각은 서버 트리아지 전용)
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After 후 재전송 }
        '401': { description: 인증 실패 }
  /v1/edge-sync/missions/next:
    get:
      summary: Pull the next signed MissionDispatchEnvelope for this Edge device
      description: >-
        EDGE_MISSION_PULL 권한 + EDGE_DEVICE 신원이 필요하다. Core는 명시적으로
        ``assignedDeviceId``가 일치하는 mission만 반환하고, Mission Contract v1.2
        원문·그 canonical digest·RiskPolicyPack v1.0 원문·그 digest·EdgeRuntimeProfile
        v1.0 원문·그 digest·device ID·TTL을 outer Ed25519 서명으로 묶는다
        (REQ-MSN-101, INV-011/012/042). 미배정 mission, 없는/만료된 policy/profile,
        만료 계약은 **빈 큐(204)** 로만 보이며 기본 장비 형상·보정값을 지어내지
        않는다. 같은 미활성 dispatch의 재조회는 ACK
        유실에도 같은 dispatchId를 되돌린다.

        이 API는 판단/수집 계약 전달만 하며 DJI flight-control command를 만들지
        않는다. wire 정본은 `contracts/schemas/mission-dispatch-envelope.v1.1.json`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 현재 장비에 바인딩된 서명 dispatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionDispatchEnvelopeV1' }
        '204': { description: 현재 device에 dispatch할 mission 없음 }
        '401': { description: 인증 실패 }
        '403': { description: EDGE_MISSION_PULL 권한 없음 }
        '503': { description: EDGE_DISPATCH_STORE_UNAVAILABLE }
  /v1/edge-sync/missions/{dispatch_id}/activation-receipts:
    post:
      summary: Record a verified Edge activation receipt for one dispatch
      description: >-
        EDGE_MISSION_PULL 권한 + EDGE_DEVICE 신원 필요. receipt의 dispatchId,
        deviceId, missionId, contract/policy digest는 서버가 durable하게 발급한
        envelope와 정확히 같아야 하며, server time과 activatedAt 모두 dispatch TTL
        안에 있어야 하고 activatedAt은 Core 수신시각보다 미래일 수 없다. 장비는 다른 장비
        dispatch의 존재 여부를 일반 404 외에
        알 수 없다. activation은 execution proof나 CONFIRMED_EVENT가 아니라
        계약 검증을 통과한 runtime activation 사실이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: dispatch_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationReceiptV1' }
      responses:
        '201':
          description: ACTIVATED — durable receipt recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivationReceiptResponse' }
        '200': { description: ALREADY_ACTIVATED — exact retry }
        '401': { description: 인증 실패 }
        '403': { description: EDGE_MISSION_PULL 권한 없음 }
        '404': { description: dispatch가 없거나 다른 device 소유(일반 문구) }
        '422': { description: RECEIPT_MISMATCH (미래 activatedAt 포함) 또는 FastAPI body validation failure }
        '503': { description: EDGE_DISPATCH_STORE_UNAVAILABLE }
  /v1/edge-sync/missions/{dispatch_id}/flight-start-receipts:
    post:
      summary: Record that Edge signed and reported an Action(START) attempt (ADR-KSI-021 §9)
      description: >-
        EDGE_MISSION_PULL 권한 + EDGE_DEVICE 신원 필요. activation-receipts와 정확히
        같은 모양이다. 이 receipt는 "기체가 날고 있다"는 상태가 아니라 "Edge가
        START를 시도했다고 서명해 보고했다"는 사실이며, MissionExecutionStatus를
        전이하지 않는다(IN_FLIGHT는 존재하지 않는다). verdict가 STARTED가 아니면
        Action(START) 호출 자체에 도달하지 못했다는 뜻이고, 그때는
        actionReturnCode를 실을 수 없다. 거부(verdict != STARTED)도 성공과 정확히
        같은 저장 경로를 타므로 "아무도 시도 안 했다"와 "게이트가 막았다"가
        저널에서 구분된다. activation 사실이 없는 기체의 보고는 순서를 지어내지
        않고 거부한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: dispatch_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlightStartReceiptV1' }
      responses:
        '201':
          description: FLIGHT_START_RECORDED — durable receipt recorded (success or refusal alike)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightStartReceiptResponse' }
        '200': { description: FLIGHT_START_ALREADY_RECORDED — exact retry }
        '401': { description: 인증 실패 }
        '403': { description: EDGE_MISSION_PULL 권한 없음 }
        '404': { description: dispatch가 없거나 다른 device 소유(일반 문구) }
        '409': { description: NOT_ACTIVATED — activation 사실 없는 기체의 보고 }
        '422': { description: RECEIPT_MISMATCH 또는 FastAPI body validation failure }
        '503': { description: EDGE_DISPATCH_STORE_UNAVAILABLE }
  /v1/edge-sync/events/{event_key}/evidence:
    post:
      summary: Register or retry an evidence upload for the Edge-owned event
      description: >-
        EDGE_EVIDENCE_WRITE 권한 + EDGE_DEVICE 신원 필요. eventKey의 edgeDeviceId가
        인증 장비와 같을 때만 증거 원장 등록 후 presigned PUT URL을 낸다. 다른
        device event와 존재하지 않는 event는 같은 일반 404다. 순서는 **Candidate
        EventBundle durable ACK → evidence 등록·PUT → 재시도 완료 → operator
        confirmation** 이며, 이 경로는 Event status를 바꾸지 않는다. 같은
        artifactId/contentType/contentDigest 재전송은 새 URL만 발급하는 200이고,
        다른 contentType/contentDigest 또는 tombstoned artifact 재사용은 거부한다.
        응답의 requiredUploadHeaders는 presigned PUT capability의 일부이므로 Edge는
        헤더 이름·값을 바꾸지 않고 객체 스토리지 PUT에 전달해야 한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeEvidenceUploadRequest' }
      responses:
        '201':
          description: REGISTERED — durable evidence registration then upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeEvidenceUploadResponse' }
        '200': { description: existing registration retry with a fresh upload URL }
        '401': { description: 인증 실패 }
        '403': { description: EDGE_EVIDENCE_WRITE 권한 없음 }
        '404': { description: event가 없거나 다른 device 소유(일반 문구) }
        '409': { description: DUPLICATE_ARTIFACT with incompatible content type/digest or tombstone }
        '415': { description: UNSUPPORTED_CONTENT_TYPE }
        '422': { description: INVALID_ARTIFACT_ID 또는 body validation failure }
        '503': { description: EVENT_STORE_UNAVAILABLE, EVIDENCE_STORAGE_UNAVAILABLE 또는 EVIDENCE_DIGEST_BINDING_UNAVAILABLE }
  /v1/edge-sync/devices/{device_id}/sequence:
    get:
      summary: Query a device's last accepted sequence (recovery path)
      description: >-
        edge-sync-preauth-sequence-lockout 해소 경로 — 장비가 재전송 시작점을
        판단하는 복구 API. EDGE_DEVICE 는 자기 자신만(타 장비는 일반 문구 403),
        OPERATOR 는 EVENTS_READ 로 임의 장비 조회 가능. 수락 이력이 없으면
        lastSequence 는 null(미지 장비와 구분하지 않는다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: device_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 이 장비의 마지막 수신 순번(미수신 장비는 null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSequenceResponse' }
        '401': { description: 인증 실패 }
        '403': { description: 자기 자신이 아닌 장비 조회 / EVENTS_READ 권한 없음(일반 문구) }
  /v1/events:
    get:
      summary: List projected events (필터·페이지네이션)
      description: >-
        EVENTS_READ 권한 필요. siteId/missionId/edgeDeviceId/status/severity/
        triage 필터, occurredAt desc 정렬(동률은 event_key 오름차순 tie-break —
        events.py). status 는 event-bundle.v1.2 EventStatus 7종과 1:1(확장 금지
        — ADR-KSI-008 §4), triage 는 서버측 TriageStatus(배정 이후 워크플로,
        EventStatus 와 분리된 2-enum). 응답 각 항목의 ``eventKey`` (=
        ``{edgeDeviceId}::{eventId}``) 가 조회·전이 경로의 사건 신원이다(모듈
        docstring "사건 신원은 장비별로 스코프된다" 절).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: siteId
          schema: { type: string }
        - in: query
          name: missionId
          schema: { type: string }
        - in: query
          name: edgeDeviceId
          schema: { type: string }
        - in: query
          name: status
          schema:
            enum:
              [OBSERVATION, CANDIDATE, EVIDENCE_COLLECTION, FINDING, CONFIRMED_EVENT, DISMISSED, UNRESOLVED]
        - in: query
          name: severity
          description: >-
            ksi_domain.enums.Severity 실값 — CANDIDATE(미확정 관찰)·MEDIUM·
            HIGH·CRITICAL(§17.2 확정 심각도 등급). LOW 는 실존하지 않는 값이라
            422 로 거부된다(재검토 P2 — 이전 문서의 LOW 는 오기였다).
          schema: { enum: [CANDIDATE, MEDIUM, HIGH, CRITICAL] }
        - in: query
          name: triage
          schema:
            enum: [NONE, ASSIGNED, ACTION_IN_PROGRESS, REINSPECTION_REQUESTED, RESOLVED, CLOSED]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: 필터 적용된 이벤트 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_READ 권한 없음 }
  /v1/events/{event_key}:
    get:
      summary: Get one event's full detail (bundle + transitions 감사이력)
      description: >-
        EVENTS_READ 권한 필요. ``event_key`` = ``{edgeDeviceId}::{eventId}``
        (목록 응답의 ``eventKey``) — ``eventId`` 는 장비 로컬 식별자라 장비 간
        충돌이 자연 발생하므로, 서버 정본 신원은 장비로 스코프된 이 합성키다
        (events.py "사건 신원은 장비별로 스코프된다" 절). transitions 는 이
        이벤트에 관련된 journal 레코드 전체.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 사건 하나의 전체 상세(bundle + 전이 이력)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetailResponse' }
        '404': { description: 이벤트를 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_READ 권한 없음 }
  /v1/events/{event_key}/transitions:
    post:
      summary: Transition an event's status or triage workflow (INV-021 확정 게이트)
      description: >-
        EVENTS_TRIAGE 권한 필요. ``event_key`` = ``{edgeDeviceId}::{eventId}``
        (목록 응답의 ``eventKey``). targetStatus·triageTarget 중 정확히 하나만
        지정. CONFIRMED_EVENT/DISMISSED 전이는 reason 필수. CONFIRMED_EVENT
        확정은 심각도별 Evidence 정책(§17.1 — HIGH+ 는 evidence.clips 필수,
        CRITICAL 은 riskField/trajectory/viewpointHistory artifact 도 필수)을
        통과해야 한다(INV-021). triage 전이(ASSIGNED 이후)는 대응 사건이
        CONFIRMED_EVENT 일 때만 허용된다. **확정/기각(CONFIRMED_EVENT/
        DISMISSED)은 이 서버 트리아지 경로로만 이뤄진다** — Edge 가 보내는
        EventBundle 의 ``status`` 로는 이 두 종단 상태를 주장할 수 없다(아래
        ``/v1/edge-sync/event-bundles`` 의 STATUS_NOT_EDGE_ASSERTABLE 게이트가
        그 시도를 ACK 없이 거부한다 — MASTER_PRD §8.1/§7.6 "사용자가 업무적으로
        확정한다").
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                targetStatus:
                  enum:
                    [OBSERVATION, CANDIDATE, EVIDENCE_COLLECTION, FINDING, CONFIRMED_EVENT, DISMISSED, UNRESOLVED]
                triageTarget:
                  enum: [NONE, ASSIGNED, ACTION_IN_PROGRESS, REINSPECTION_REQUESTED, RESOLVED, CLOSED]
                reason: { type: string }
                assignee: { type: string }
                expectedBundleDigest:
                  type: string
                  description: >-
                    선택적 낙관적 동시성 토큰 — 화면에 표시된 bundle 의
                    payloadDigest("sha256:<hex64>")를 그대로 실어 보내면, 그
                    사이 Edge 의 후행 update 로 내용이 바뀌었을 때 409
                    STALE_EVENT_VIEW 로 거부한다(전이는 적용되지 않는다).
                    생략하면 검사하지 않는다.
      responses:
        '200':
          description: TRANSITIONED — verdict + 전이 후 사건 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionResponse' }
        '404': { description: UNKNOWN_EVENT }
        '409': { description: ILLEGAL_TRANSITION / STALE_EVENT_VIEW(expectedBundleDigest 불일치) }
        '422': { description: EVIDENCE_INCOMPLETE / INVALID_REQUEST }
        '503': { description: STORE_UNAVAILABLE — Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_TRIAGE 권한 없음 }
  /v1/events/{event_key}/evidence:
    post:
      summary: Register an evidence artifact and get a presigned upload URL
      description: >-
        EVENTS_TRIAGE 권한 필요. Core 는 미디어 바이트를 중계하지 않는다
        (ADR-KSI-010 §1) — 원장에 등록한 뒤 짧은 수명(15분)의 presigned PUT URL
        만 발급하고, 업로드는 클라이언트가 스토리지와 직접 한다. **객체 키는
        서버가 만든다**(``sites/{siteId}/events/{edgeDeviceId}/{eventId}/{artifactId}``)
        — 클라이언트 문자열을 키에 그대로 쓰면 경로 탈출·타 현장 덮어쓰기가 열린다.

        ``artifactId`` 는 호출자가 정하는 멱등 키다(같은 증거 재전송 시 중복
        등록 방지). 경로-안전 문자만 허용하고, 이미 쓰인 id 는 폐기된 것이어도
        재사용할 수 없다(앞선 증거의 객체 키를 조용히 덮어쓰게 된다).

        ``contentType`` 은 allowlist 다 — 열람 URL 에서 브라우저가 스크립트로
        해석할 수 있는 타입(text/html·image/svg+xml)은 415 로 거부한다.

        **조립 의존**: Core 가 evidence_storage 없이 조립되면 이 경로는 아예
        장착되지 않는다(404). 스토리지 없이 라우트만 살려두면 "업로드했는데
        어디에도 없다"가 2xx 로 보인다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artifactId, contentType]
              properties:
                artifactId: { type: string, minLength: 1 }
                contentType:
                  enum:
                    - application/json
                    - image/jpeg
                    - image/png
                    - image/webp
                    - video/mp4
                    - video/webm
                    - application/octet-stream
      responses:
        '201':
          description: REGISTERED — 원장 기록 완료 + presigned PUT URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceUploadResponse' }
        '404': { description: UNKNOWN_EVENT (또는 evidence_storage 미조립) }
        '409': { description: DUPLICATE_ARTIFACT — 폐기된 id 도 재사용 불가 }
        '415': { description: UNSUPPORTED_CONTENT_TYPE }
        '422': { description: INVALID_ARTIFACT_ID — 경로-안전 문자 밖 }
        '503': { description: EVIDENCE_STORAGE_UNAVAILABLE — 등록은 남고 URL 만 실패 }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_TRIAGE 권한 없음 }
  /v1/events/{event_key}/evidence/{artifact_id}:
    get:
      summary: Get a presigned view URL for one evidence artifact
      description: >-
        EVENTS_READ 권한 필요. 짧은 수명(5분)의 presigned GET URL 을 발급한다 —
        URL 자체가 인가이므로 수명을 짧게 두고 발급 경로를 유일한 관문으로 삼는다.

        폐기된 증거는 **410 Gone** 이다(404 아님, ADR-KSI-010 §3) — "증거가
        없다"와 "정책대로 폐기했다"는 사고 조사에서 다른 사실이고, 그 둘을
        구분하지 못하면 원장의 값어치가 없다.

        CRITICAL 확정이 그 바이트의 SHA-256 을 못박은 증거는 **URL 발급 전에 Core 가
        다시 읽어 재해싱**한다 — 확정 이후 같은 object_key 의 바이트가 교체되면
        409(CONTENT_DIGEST_MISMATCH)로 거부하고 열람 URL 을 내주지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: presigned GET URL + 등록 계보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceViewResponse' }
        '404': { description: 이벤트·증거를 찾을 수 없다(일반 문구) }
        '409': { description: CONTENT_DIGEST_MISMATCH — 확정 시점에 못박은 바이트와 다르다 }
        '410': { description: ALREADY_TOMBSTONED — 보관 정책으로 폐기됨 }
        '503': { description: EVIDENCE_STORAGE_UNAVAILABLE }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_READ 권한 없음 }
  /v1/missions:
    get:
      summary: List mission issuance records (durable 기록 이력)
      description: >-
        MISSIONS_READ 권한 필요. siteId 필터, (issuedAt, missionId) 결정적
        정렬. contract 전문은 이 응답에 없다(별도 /contract 엔드포인트).
        derivedFromRegion 은 그 변화 영역에서 나온 재관측 임무만 걸러 낸다
        (ADR-KSI-019 G5) — derivedFrom.regionId 대조, 서버 조회 시점 선형 스캔.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: siteId
          schema: { type: string }
        - in: query
          name: derivedFromRegion
          schema: { type: string }
      responses:
        '200':
          description: 발급된 임무 목록(siteId 필터 가능)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MissionRecordResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}:
    get:
      summary: Get one mission issuance record's metadata
      description: MISSIONS_READ 권한 필요. artifactKind(pair/contract)·kmzSha256 등 메타데이터.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 임무 하나
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionRecordResponse' }
        '404': { description: 해당 임무 레코드를 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/execution:
    get:
      summary: Read the mission's execution lifecycle status and history
      description: >-
        MISSIONS_READ 권한 필요. MissionRecord 는 **발급 기록**이라 "이 임무가 실제로
        날았는가"에 답하지 못한다 — 이 표면이 그 축을 연다(ADR-KSI-019 G2).

        전이가 한 번도 없었으면 status 는 ISSUED 이고 history 는 빈 배열이다
        (**레코드 부재 = ISSUED**). 발급 시점에 실행 원장에 쓰지 않는 것이 의도다:
        쓰면 ADR-KSI-008 §3 의 "durable 기록 전 201 금지" 경로에 두 번째 원장 쓰기가
        끼어들어, 그 쓰기가 실패할 때 이미 성립한 계약 발급이 실패한다.

        이 값은 **완료 판정의 권위가 아니라 CoverageReport 원장의 투영**이다
        (INV-010). 커버리지 접수·재구성 발급의 전제조건으로 쓰지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 현재 실행 상태 + 전이 이력(오래된 것부터)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionExecutionView' }
        '404': { description: 발급된 적 없는 임무 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/execution-transitions:
    post:
      summary: Declare an execution fact a human knows (DISPATCHED / CANCELLED only)
      description: >-
        MISSIONS_ISSUE 권한 필요. 사람이 선언할 수 있는 상태는 **DISPATCHED**(기체로
        넘겼다)와 **CANCELLED**(접는다) 둘뿐이다. 실기 확인 전까지 운영자가 KMZ 를
        손으로 옮기는 것이 공식 경로이므로(ADR-KSI-019 G3), 서버가 그 사실을 기록할
        수 있어야 임무 원장에 "날았는지 모른다"만 남지 않는다.

        ACTIVATED 는 Edge 의 서명 activation receipt 가, COMPLETED/ENDED_INCOMPLETE 는
        CoverageReport 접수가 만드는 사실이라 **누구도 선언할 수 없다**(403) —
        사람이 찍을 수 있으면 그 상태는 근거가 아니라 주장이 된다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus]
              properties:
                targetStatus:
                  type: string
                  enum: [DISPATCHED, CANCELLED]
                  description: >-
                    표에 없는 값(ACTIVATED·COMPLETED·ENDED_INCOMPLETE·ISSUED)은 403 이다.
                detail:
                  type: [string, 'null']
                  description: 어떻게 넘겼는가를 사람 말로 남기는 자리(예 "RC Plus 2 로 이관").
      responses:
        '200':
          description: TRANSITIONED — 갱신된 실행 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionExecutionView' }
        '404': { description: 발급된 적 없는 임무 }
        '409': { description: ILLEGAL_TRANSITION — 현재 상태에서 갈 수 없는 전이 }
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403': { description: 사람이 선언할 수 없는 상태이거나 MISSIONS_ISSUE 권한 없음 }
  /v1/missions/{mission_id}/coverage-report:
    post:
      summary: Submit the post-flight CoverageReport (INV-010 완료 게이트)
      description: >-
        **완료 판정의 권위는 이 보고서다** — 발급 시점의 plannedCoverageRatio 는
        요청자가 준 간격을 믿은 계획 추정치이고, 실제로 무엇을 관찰했는지는 날아본
        기체만 안다(MASTER_PRD §15.5 "임무 완료는 경로 완료가 아니라 Coverage,
        Evidence, Safety와 데이터 품질 기준으로 판단한다").

        **서버는 기체의 완료 주장을 그대로 믿지 않는다.** Cell 분류(위험구역/자산/
        일반)를 갖고 있지 않아 비율을 재계산할 수는 없지만, 그 비율이 주장을
        뒷받침하는지는 검사한다 — ① completionState=COMPLETED 인데 요약 비율이
        INV-010 임계(위험 100%·자산 100%·일반 ≥95%) 미만이면 422
        UNSUPPORTED_COMPLETION ② COMPLETED 인데 사유 없는 미관찰 Cell
        (NOT_OBSERVED)이 남으면 422 UNEXPLAINED_GAP(모든 미관찰 Cell 은 원인코드를
        가져야 한다). COMPLETED_WITH_GAPS/ABORTED_SAFE/FAILED 는 그 자체가 "완료가
        아니다"를 말하므로 임계 검사를 걸지 않는다 — 공백을 정직하게 신고한
        보고서를 거부하면 신고를 안 하게 만든다.

        보고는 **장비만** 올린다(EDGE_SYNC_INGEST, EDGE_DEVICE Principal 전용) —
        운영자가 커버리지를 손으로 주장할 수 없다. 같은 임무에 여러 번 올 수 있고
        덮어쓰지 않는다(감사 입력).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/coverage-report.v1.1.json
      responses:
        '201':
          description: RECORDED — durable 기록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageReportResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '422':
          description: >-
            SITE_MISMATCH(발급 기록의 siteId 와 불일치) /
            UNSUPPORTED_COMPLETION / UNEXPLAINED_GAP /
            INVALID_TIMESTAMP(tz-aware 아님) / 경로·본문 missionId 불일치
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403':
          description: >-
            EDGE_DEVICE 가 아니거나 EDGE_SYNC_INGEST 권한 없음 / DEVICE_NOT_ASSIGNED
            (임무가 다른 장비에 배정됐다, INV-010 — assignedDeviceId 를 신고하지
            않은 임무는 이 거부가 걸리지 않는다)
    get:
      summary: Read the latest CoverageReport for a mission
      description: >-
        MISSIONS_READ 권한 필요. 최신 보고 + 접수 건수(덮어쓰지 않으므로) + 제출한
        Principal id(reportedBy, 보통 장비 id — 독립 재검토 B-3).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 최신 보고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageReportView' }
        '404': { description: 이 임무의 보고가 아직 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/capture-quality-report:
    post:
      summary: Submit the immutable final CaptureQualityReport for a Mission
      description: >-
        EDGE_SYNC_INGEST 권한과 EDGE_DEVICE 신원이 필요하다. 보고의 organization,
        Mission, Site, WorkOrder 회차, 그리고 deviceId를 현재 authoritative binding과
        대조한다. 같은 reportId의 동일 본문 재전송은 200이고, 한 Mission에는
        변경 불가능한 최종 보고 하나만 기록한다. 이 보고만으로 분석 준비 완료가
        되지는 않으며, Analysis Readiness projection이 Coverage·원본·시간·처리를
        별도로 대조한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/capture-quality-report.v1.json }
      responses:
        '200':
          description: Identical report retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureQualityReportResponse' }
        '201':
          description: Durable final capture-quality evidence recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureQualityReportResponse' }
        '401': { description: Authentication failed }
        '403': { description: EDGE_DEVICE identity and EDGE_SYNC_INGEST permission required }
        '404': { description: Mission, WorkOrder cycle, Site, or device binding not found }
        '409': { description: reportId conflict or a final report already exists for the Mission }
        '422': { description: Path/body Mission mismatch or invalid CaptureQualityReport }
        '503': { description: Durable journal unavailable }
    get:
      summary: Read the immutable final CaptureQualityReport for a Mission
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Organization-scoped final capture-quality evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureQualityReportResponse' }
        '401': { description: Authentication failed }
        '403': { description: MISSIONS_READ permission required }
        '404': { description: No final CaptureQualityReport for this Mission in the principal organization }
  /v1/missions/{mission_id}/flight-artifacts/pilot-export:
    post:
      summary: Retain a DJI Pilot-export KMZ as an immutable, unbound FlightArtifact candidate
      description: >-
        MISSIONS_ISSUE 권한 필요. Core는 요청 바이트를 엄격한 base64 및 안전한 WPML/KMZ
        구조로만 검사하고, Mission Contract의 flight envelope와 비교 가능한 범위만
        기록한다. 성공 후보는 항상 source=DJI_PILOT_EXPORT,
        status=VALIDATED_CANDIDATE_UNBOUND, executable=false 이며 MissionRecord,
        서명 Mission Contract, dispatch, 활성 KMZ 다운로드 경로에 편입되지 않는다.

        이는 DJI Pilot 2 import·표시·비행 안전성 또는 현장 실행을 증명하지 않는다.
        동일 KMZ digest 재전송은 기존 불변 후보를 DUPLICATE(200)로 반환하고,
        다른 바이트만 다음 revision 후보가 될 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kmzBase64, provenanceRef]
              properties:
                kmzBase64:
                  type: string
                  minLength: 4
                  maxLength: 13981029
                  description: Strict base64-encoded KMZ; decoded archive is bounded to 10 MiB.
                provenanceRef:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Pilot export run/source reference retained with the candidate.
      responses:
        '200':
          description: DUPLICATE — same KMZ digest was already retained; existing immutable candidate returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightArtifactIngestResponse' }
        '201':
          description: RECORDED — exact KMZ bytes stored, then immutable candidate journaled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlightArtifactIngestResponse' }
        '401': { description: Authentication failed }
        '403': { description: MISSIONS_ISSUE permission required }
        '404': { description: UNKNOWN_MISSION in the principal organization }
        '422': { description: Invalid strict base64, unsafe/invalid KMZ, or invalid provenanceRef }
        '503': { description: Candidate journal or exact-byte storage unavailable; Retry-After 30 }
  /v1/missions/{mission_id}/flight-artifacts:
    get:
      summary: List immutable unbound FlightArtifact candidates for a Mission
      description: >-
        MISSIONS_READ 권한 필요. 같은 organization의 Mission 후보만 반환한다. 빈 목록은
        후보가 없다는 뜻이며, 후보 하나도 executable하지 않다. 이 조회는 Pilot 2
        import 또는 실기 실행이 검증되었다는 주장이 아니다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Candidate revisions in recording order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlightArtifactCandidateResponse' }
        '401': { description: Authentication failed }
        '403': { description: MISSIONS_READ permission required }
        '404': { description: Mission not found in the principal organization }
  /v1/missions/{mission_id}/flight-artifacts/{candidate_id}/download:
    get:
      summary: Download exact retained bytes for an immutable unbound FlightArtifact candidate
      description: >-
        MISSIONS_READ 권한 필요. Core는 반환 직전에 stored bytes를 다시 SHA-256 해시해
        후보 원장 digest와 일치할 때만 내려준다. 응답 헤더
        X-KSI-FlightArtifact-Status=VALIDATED_CANDIDATE_UNBOUND 및
        X-KSI-Executable=false은 이 파일이 실행 권한이 없음을 명시한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
        - { in: path, name: candidate_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Exact recorded KMZ bytes; non-executable candidate only
          headers:
            X-KSI-FlightArtifact-Status:
              schema: { const: VALIDATED_CANDIDATE_UNBOUND }
            X-KSI-Executable:
              schema: { const: 'false' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Authentication failed }
        '403': { description: MISSIONS_READ permission required }
        '404': { description: Candidate not found in the principal organization }
        '409': { description: Stored bytes no longer match the immutable candidate digest }
        '503': { description: Exact-byte storage unavailable }
  /v1/missions/{mission_id}/coverage-report/rejections:
    get:
      summary: List coverage reports the server refused (INV-010 강제의 증거)
      description: >-
        MISSIONS_READ 권한 필요. 거부 판정은 이전부터 durable 기록되고 있었지만
        **어떤 GET 으로도 조회할 수 없었다** — 판정이 제출 장비의 응답 본문으로만
        가고 소멸했다. 그러면 "서버가 근거 없는 완료 주장을 막았다"는 사실이
        운영자·감사자에게 도달하지 않고, 장비가 반복적으로 허위 완료를 주장해도
        사람은 알 수 없다. INV-010 의 강제는 성립하지만 그 강제가 작동했다는 증거가
        남지 않는 상태였다(risk coverage-report-rejection-not-auditable).

        거부된 보고의 **본문은 싣지 않는다** — 거부된 주장의 숫자를 조회 표면에
        그대로 실으면 그게 화면에서 사실처럼 읽힐 자리가 생긴다. 원문이 필요하면
        journal 을 본다.

        거부 0건은 404 가 아니라 빈 목록이다 — "이 임무에는 거부가 없었다"는 그
        자체로 답이고, 404 로 주면 "임무가 없다"와 구분되지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 거부된 보고 목록(수신 순서)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageRejectionListView' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/defect-candidates:
    post:
      summary: Submit surface defect candidates for a mission (Phase 4, MODEL-P4-001)
      description: >-
        PROCESSING_WORK 권한 필요 — **사람은 이 권한을 가질 수 없다**(어느 Role 에도
        매핑되지 않는다). 결함 후보는 실제로 추론을 돌린 워커만 주장할 수 있고,
        사람의 판단은 결함 후보가 아니라 이벤트 트리아지로 표현된다.

        **서버는 후보를 그대로 받아 적지 않는다.** 결함 후보의 값은 전부 유효 범위
        안에 있을 수 있어서(confidence 0~1, 좌표 양수) 스키마 검증만으로는 잘못된
        참조가 통과한다 — 서버가 추가로 검사하는 것은 ① sourceMediaId 가 이 임무에
        등록된 사진인가(UNKNOWN_SOURCE_MEDIA) ② imageSize 가 등록된 사진의 실제
        화소수와 같은가(IMAGE_SIZE_MISMATCH — 축소본 좌표를 원본 기준으로 신고하면
        폴리곤이 통째로 다른 자리를 가리킨다) ③ 폴리곤 정점이 이미지 안인가
        (GEOMETRY_OUT_OF_BOUNDS)다.

        **배치는 전부-또는-전무다.** 일부만 기록되면 "이 임무의 결함이 몇 건인가"에
        원장이 답할 수 없고, 그 부분 누락은 조회 시점에 정상으로 보인다. 같은
        defectCandidateId 로 **동일 내용** 재전송은 멱등 성공(recordedCount=0)이고,
        **다른 내용**이면 409 다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidates]
              properties:
                candidates:
                  type: array
                  minItems: 1
                  items: { $ref: ../schemas/defect-candidate.v1.json }
      responses:
        '201':
          description: RECORDED — durable 기록 완료(멱등 재전송이면 recordedCount=0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectCandidateBatchResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '409': { description: DUPLICATE_CANDIDATE_ID — 같은 id 로 다른 내용 }
        '422':
          description: >-
            EMPTY_BATCH / UNKNOWN_SOURCE_MEDIA / IMAGE_SIZE_MISMATCH /
            GEOMETRY_OUT_OF_BOUNDS
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(운영자 Role 포함) }
    get:
      summary: List defect candidates recorded for a mission
      description: >-
        MISSIONS_READ 권한 필요. 후보가 0건인 것은 404 가 아니라 빈 목록이다 —
        "아직 안 돌았다"와 "돌렸는데 결함이 없다"를 이 엔드포인트는 구분하지 못하고,
        구분하는 척하면 안 된다(그 구분은 처리 작업 상태가 답한다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
        - in: query
          name: sourceMediaId
          required: false
          description: 사진 1장으로 좁혀 본다(화면이 사진별 폴리곤 오버레이를 그릴 때).
          schema: { type: string }
      responses:
        '200':
          description: 그 임무의 결함 후보 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefectCandidateListView' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/change-detection:
    post:
      summary: Submit a point-cloud change detection result (PRD §15.4)
      description: >-
        PROCESSING_WORK 권한 필요 — 사람은 이 권한을 가질 수 없다(결함 후보와 동일
        원칙). 점별 거리 배열은 싣지 않는다 — 이 계약은 요약(개수·비율·최댓값)만
        나르고, 원본이 필요한 소비자는 baseline/current 산출물을 직접 읽는다.

        서버가 검증하는 것: ① baseline/current 가 실제로 등록된 point_cloud
        산출물인가(artifactId 는 작업 단위로만 고유하므로 jobId 와 짝으로 해석한다)
        ② 둘이 같은 산출물이 아닌가(자기 자신과의 C2C 는 전 점 거리 0 이라 '변화
        없음'으로 정직해 보이지만 아무것도 비교하지 않은 것이다). 카운트와 비율의
        자기모순(후보 0건인데 비율 0.9 같은 것)은 계약 모델이 파싱 시점에 거부한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/change-detection-result.v1.json
      responses:
        '201':
          description: RECORDED — durable 기록 완료(동일 내용 재전송도 RECORDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetectionResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '409': { description: DUPLICATE_RESULT_ID — 같은 id 로 다른 내용 }
        '422':
          description: UNKNOWN_ARTIFACT / ARTIFACT_KIND_MISMATCH / SELF_COMPARISON
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(운영자 Role 포함) }
    get:
      summary: Read the latest change detection result + revisit recommendation
      description: >-
        MISSIONS_READ 권한 필요. `revisitRecommended` 가 PRD §15.2 ⑤ "변화 후보
        영역은 추가 시점 수집"의 권고 신호다 — **자동 재비행을 트리거하지 않는다.**
        운영자가 이 신호를 보고 원본 site AOI 로 SPATIAL_REFRESH 임무를
        POST /v1/missions/plans 에 발급한다(Coverage Recovery 의
        recoveryRecommended 와 같은 관계).

        임계값은 요청이 정한다(revisitRatioThreshold) — "변화 후보 비율이 얼마면
        재방문이 필요한가"는 사이트·자산 종류에 따라 달라질 정책 값이라 서버가
        지어내지 않는다. 응답은 **실제로 쓴 임계값을 그대로 되돌려준다**: 권고
        불리언만 주면 화면이 "무슨 기준으로 켜졌나"를 표시할 수 없고, 그러면
        운영자가 그 신호를 신뢰할 근거가 없다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
        - in: query
          name: revisitRatioThreshold
          required: false
          description: 이 비율을 **초과**하면 재방문 권고(엄격 부등호). 생략 시 화면 초기값.
          schema: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: 최신 결과 + 재방문 권고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetectionView' }
        '404': { description: 이 임무의 변화 탐지 결과가 아직 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/source-media:
    post:
      summary: Batch-issue presigned PUT URLs for raw mapping photos (3D 파이프라인 입구)
      description: >-
        MISSIONS_ISSUE 권한 필요. 기존 evidence 업로드(사건 종속)와 달리 **Mission**
        에 종속된 별도 입구다 — 매핑 원본 수천 장에는 매달 사건이 없다. 파일마다
        신고값(sha256·bytes·width·height·contentType)을 받지만 이 시점에는
        검증하지 않는다(전 바이트를 읽는 B3 워커가 재계산해 대조) — 주장일 뿐이다.
        객체 키는 서버가 만든다(`sites/{siteId}/missions/{missionId}/source/{mediaId}`).
        `mediaId` 는 호출자가 정한다(evidence.py 의 artifactId 관습과 동일) — 같은
        mediaId·같은 신고값 재전송은 멱등 재발급(새 URL), 다른 신고값이면
        CLAIM_CONFLICT 로 거부한다. 요청 수준 판정(UNKNOWN_MISSION/BUNDLE_SEALED/
        STORE_UNAVAILABLE)은 배치 전체에 적용되고, 통과하면 파일마다 독립 판정한다
        — 한 파일의 문제가 나머지 파일의 등록을 막지 않는다. 한 요청 상한은 200장.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [mediaId, sha256, bytes, width, height, contentType]
                    properties:
                      mediaId: { type: string }
                      sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                      bytes: { type: integer, minimum: 1 }
                      width: { type: integer, minimum: 1 }
                      height: { type: integer, minimum: 1 }
                      captureTime:
                        $ref: '#/components/schemas/CaptureTimeView'
                      contentType: { type: string }
      responses:
        '201':
          description: PROCESSED — 항목별 결과는 본문 참조(개별 실패가 섞여도 요청 자체는 201)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaBatchResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '409': { description: BUNDLE_SEALED — 이미 봉인된 번들 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
    get:
      summary: Read a mission's source-media bundle status (count · digest · seal state)
      description: >-
        MISSIONS_READ 권한 필요. `verifiedAt` 은 이 단계에서 항상 null 이다 — Core
        는 신고값을 검증하지 않는다("검증된 척"하는 필드명을 쓰지 않는다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 번들 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaBundleView' }
        '404': { description: 이 임무에 등록된 미디어가 아직 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/source-media/ground-control:
    post:
      summary: Attach the survey's ground control file (GCP) — 봉인 전에만, 임무당 1건
      description: >-
        MISSIONS_ISSUE 권한 필요. 재구성 엔진은 사진의 EXIF GPS 만으로는 그 지역의
        UTM 좌표계로 성과를 낸다(2026-08-18 실측: 미국 데이터셋 재구성 2회가 모두
        EPSG:32617). 이 시스템은 현행 한국 평면직각좌표계에서만 두 시점을 비교하므로
        (INV-020), 기준점 없이 찍은 조사는 한국에서 찍어도 비교 단계에 도달하지
        못한다. 이 표면은 그 기준점 파일을 조사에 붙인다 — Core 는 자리와 업로드
        URL 만 내주고 바이트는 스토리지로 직접 간다(ADR-KSI-010 §1). 좌표계는
        **등록 시점에** 화이트리스트로 막는다(허용 목록 밖이면 UNSUPPORTED_CRS):
        재구성이 끝난 뒤 비교에서 거부되면 몇 분을 버리고 사유도 멀리서 나타난다.
        파일 첫 줄이 이 신고와 같은지는 파일을 내려받는 워커가 제출 전에 대조한다.
        같은 내용 재전송은 멱등이고, 다른 내용으로 덮어쓰려 하면 CLAIM_CONFLICT 다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroundControlRequest' }
      responses:
        '201':
          description: REGISTERED — objectKey·uploadUrl 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundControlResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '409': { description: BUNDLE_SEALED · CLAIM_CONFLICT }
        '422': { description: UNSUPPORTED_CRS — 현행 한국 평면직각좌표계가 아니다 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨 또는 URL 발급 실패, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /v1/missions/{mission_id}/source-media/seal:
    post:
      summary: Seal the source-media bundle and fix sourceBundleDigest (INV-013 재현성 앵커)
      description: >-
        MISSIONS_ISSUE 권한 필요. digest 는 Core 가 정규 정렬된 매니페스트에서
        직접 계산한다(요청이 자기 증명서를 쓰지 못한다) — 업로드 순서와 무관하게
        같은 파일 집합이면 같은 digest 가 나온다. 봉인 후 추가 업로드는
        BUNDLE_SEALED 로 거부된다. 이미 봉인된 번들의 재호출은 에러가 아니라
        ALREADY_SEALED(기존 digest 재반환) — 재시도가 안전하다. 빈 번들(등록 0건)은
        봉인할 수 없다(EMPTY_BUNDLE).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: SEALED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaSealResponse' }
        '200':
          description: ALREADY_SEALED — 기존 digest 재반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaSealResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '422': { description: EMPTY_BUNDLE — 등록된 미디어가 0건이다 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /v1/missions/{mission_id}/source-media/{media_id}/view:
    get:
      summary: Short-lived view URL for one uploaded photo
      description: >-
        MISSIONS_READ 권한 필요. 업로드용 presigned PUT 과 달리 **운영자가 보는**
        경로다 — 결함 후보 폴리곤을 원본 사진 위에 겹치기 위해 쓴다.

        화소수(width/height)를 함께 내는 이유: 결함 후보의 폴리곤은 원본 픽셀
        좌표라, 화면이 축소해 그릴 때 배율을 계산하려면 원본 크기를 알아야 한다.
        이미지 로드 후 읽어 쓰면 로드 전에 레이아웃을 잡을 수 없고, 무엇보다
        등록된 화소수와 실제 이미지가 다를 때 그 불일치가 조용히 묻힌다.

        객체가 아직 업로드되지 않았어도 URL 은 발급된다(등록과 업로드는 별개
        단계다) — 그 URL 을 열면 스토리지가 404 를 준다. Core 는 오브젝트 존재를
        확인하지 않는다(스토리지 포트에 HEAD 동작이 없다).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
        - { in: path, name: media_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 열람 URL + 원장이 아는 화소수·digest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaViewResponse' }
        '404': { description: 그 임무의 번들이 없거나 등록된 적 없는 mediaId }
        '503': { description: SOURCE_MEDIA_STORAGE_UNAVAILABLE — 스토리지 장애("사진 없음"이 아니다) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/source-media/verify:
    post:
      summary: Report measured bytes; Core compares them against the uploader's claims
      description: >-
        **PROCESSING_WORK 권한 필요**(PROCESSING_WORKER 전용). 이 권한이 여기 붙는
        것이 이 표면의 핵심이다 — 사진을 올린 주체(MISSIONS_ISSUE)가 자기 신고값을
        스스로 검증할 수 없다.


        워커가 보내는 것은 **측정값뿐이고 판정이 아니다**: 요청 스키마에
        "검증됨" 같은 필드가 없다. 일치 여부는 Core 가 매기고, journal 에 남는
        사실도 측정값이다 — 재생 시 Core 가 그 측정값으로 **다시 대조**하므로
        원장의 verdict 만 VERIFIED 로 고쳐도 기동에서 걸린다.


        **워커는 정답을 모른다.** GET /v1/processing-jobs/{jobId}/input 응답에
        업로더 신고값이 실리지 않고 워커에게 MISSIONS_READ 도 없어서, VERIFIED 를
        받으려면 실제로 바이트를 읽어 sha256 을 계산하는 수밖에 없다. (업로더와
        워커가 밖에서 공모하면 여전히 통과한다 — Core 는 바이트를 중계하지
        않는다, ADR-KSI-010 §1.)


        측정 집합은 등록 집합과 **정확히** 같아야 한다 — 빠진 것도 남는 것도
        중복도 COVERAGE_INCOMPLETE 다. 일부만 읽고 "검증했다"가 되면 verifiedAt
        이 뜻하는 바가 사라진다. 봉인 전에는 대조 대상 집합이 확정되지 않아
        409 BUNDLE_NOT_SEALED 다.


        불일치(MISMATCH)는 원장에 영구 기록되지만 번들을 잠그지는 않는다 —
        워커 버그로 생긴 오탐에 복구 경로가 없으면 정상 번들이 영구히 죽는다.
        재검증은 열려 있고 시도는 전부 남는다(lastMismatchAt).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [measurements]
              properties:
                measurements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [mediaId, sha256, bytes, width, height]
                    properties:
                      mediaId: { type: string, minLength: 1 }
                      sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                      bytes: { type: integer, minimum: 1 }
                      width: { type: integer, minimum: 1 }
                      height: { type: integer, minimum: 1 }
      responses:
        '201':
          description: VERIFIED — 전부 일치, verifiedAt 이 채워진다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaVerifyResponse' }
        '200':
          description: ALREADY_VERIFIED — 재호출은 무기록 멱등
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaVerifyResponse' }
        '404': { description: UNKNOWN_MISSION }
        '409': { description: BUNDLE_NOT_SEALED — 봉인 전에는 대조 집합이 미확정 }
        '422':
          description: >-
            MISMATCH(신고값과 실측이 어긋남) · COVERAGE_INCOMPLETE(측정 집합 불일치).
            422 인 이유: 요청 형식은 옳고 **내용이 사실과 다르다** — 같은 값으로
            재시도해도 결과가 같다.
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(사람 역할은 이 권한을 갖지 않는다) }
  /v1/sites/{site_id}/work-areas:
    post:
      summary: Register a persistent work area (M4-C)
      description: >-
        SITES_WRITE 권한 필요. **기하는 이 순간 굳는다** — 잘못 그렸으면 supersedes
        로 새 구역을 만든다(그때 이전 구역은 자동으로 ARCHIVED 된다). 제자리 수정을
        허용하면 이미 그 구역으로 낸 리포트가 가리키는 범위가 사후에 바뀌어, 숫자는
        그대로인데 그 숫자가 무엇을 잰 것인지가 달라진다.


        폴리곤은 등록 시점에 검사한다(GeoJSON Polygon · 닫힌 외곽 고리 · 유한 좌표 ·
        EPSG:4326 이면 경위도 범위) — 통과시키면 나중에 래스터 마스킹 단계에서
        사람이 이해할 수 없는 예외로 터지는 것들이다. 자기교차·구역 간 겹침·현장 AOI
        이탈은 **막지 않는다**(정당한 운용이다).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, polygon, crs]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                polygon:
                  description: GeoJSON Polygon. 요청의 zones[zoneId] 에 이 값이 그대로 복사된다.
                  type: object
                crs: { type: string, minLength: 1 }
                supersedes:
                  description: 기하를 고칠 때 이전 구역의 id. 주면 그 구역은 자동으로 보관된다.
                  type: [string, 'null']
      responses:
        '201':
          description: REGISTERED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkAreaResponse' }
        '404': { description: UNKNOWN_SITE · SUPERSEDES_NOT_FOUND }
        '409': { description: SUPERSEDES_OTHER_SITE · SUPERSEDES_NOT_ACTIVE · TOO_MANY_ACTIVE }
        '422': { description: INVALID_WORK_AREA — 폴리곤이 쓸 수 없는 모양이다 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
    get:
      summary: List a site's work areas
      description: SITES_READ 권한 필요. 기본은 고를 수 있는 것(ACTIVE)만.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
        - { in: query, name: include_archived, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: 등록 순서 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkAreaListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}/work-areas/{work_area_id}/archive:
    post:
      summary: Archive a work area — not a delete
      description: >-
        SITES_WRITE 권한 필요. 더 이상 새 비교에 고를 수 없게 한다. **지우지 않는
        이유**: 이 구역으로 낸 리포트들이 zoneId 로 이 id 를 들고 있어, 지우면 그
        리포트들이 무슨 범위였는지를 잃는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
        - { in: path, name: work_area_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ARCHIVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkAreaResponse' }
        '404': { description: UNKNOWN_WORK_AREA }
        '409': { description: ALREADY_ARCHIVED }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
  /v1/sites/{site_id}/design-progress:
    get:
      summary: Zone-by-zone progress against the design surface (M4-C)
      description: >-
        SITES_READ 권한 필요. **저장된 값이 아니라 파생값**이다 — 사람이 지정한
        '원지형 기준' 리포트와 가장 최근 리포트를 같은 구역끼리 빼서 조회 시점에
        만든다(계획 = 기준 시점 잔량, 잔여 = 최신 잔량, 완료 = 계획 − 잔여).


        **이어붙이기를 거부하는 조건**: 설계면 해시 · 집계 문턱 · 수직기준 · 좌표계
        중 하나라도 다르면 표를 만들지 않고 detail 에 사유를 낸다. 다른 자로 잰 두
        값의 차이는 진척이 아닌데, 그 결과는 어느 화면에서도 이상해 보이지 않는다.


        표를 못 내는 경우에도 200 이고 detail 이 채워진다 — 화면이 "아직 데이터가
        없다"와 "이어붙일 수 없다"를 갈라 말해야 하기 때문이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
        - { in: query, name: design_surface_id, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: 진척 표 또는 왜 못 내는지(둘 중 하나는 항상 채워진다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignProgressResponse' }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}/report-exports:
    post:
      summary: Record a browser PDF/CSV report-export audit event
      description: >-
        SITES_READ 권한 필요. Core는 PDF/CSV bytes를 받거나 만들지 않는다.
        인증 Principal의 organizationId와 경로 siteId만 scope로 쓰고, 요청의
        기준/최신 designConformanceId 두 개를 Core 원장에서 다시 찾아 설계면
        revision·정규화·processing profile·원본 lineage·complete report digest를
        immutable snapshot으로 기록한다. organizationId, 숫자, 보고서 원문, 파일
        bytes는 요청에 받을 수 없다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportExportCreateRequest' }
      responses:
        '201':
          description: RECORDED — audit fact only; contentProducedByServer is always false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportCreateResponse' }
        '200':
          description: ALREADY_RECORDED idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportCreateResponse' }
        '404': { description: UNKNOWN_SITE | UNKNOWN_REPORT | REPORT_SITE_MISMATCH }
        '409': { description: DUPLICATE_EXPORT_ID with a different actor, format, or snapshot }
        '422': { description: SNAPSHOT_NOT_COMPARABLE or invalid request JSON }
        '503': { description: STORE_UNAVAILABLE — durable journal sealed, Retry-After }
        '401': { description: Authentication failed }
        '403': { description: SITES_READ permission required }
    get:
      summary: List report-export audit events for one organization-scoped site
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Newest first; a known site with no exports returns an empty list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportListView' }
        '404': { description: Site not found in the principal organization }
        '401': { description: Authentication failed }
        '403': { description: SITES_READ permission required }
  /v1/missions/{mission_id}/design-conformance/{design_conformance_id}/progress-baseline:
    post:
      summary: Mark this report as the pre-construction baseline (M4-C)
      description: >-
        MISSIONS_ISSUE 권한 필요(설계 대비 요청 생성과 같은 자리 — 구역·현장의 영속
        자산이 아니라 "이 임무의 어느 결과를 기준으로 볼지" 판단이다). 계획 물량이
        이 리포트에서 나온다. **자동으로 고르지
        않는 이유**가 이 엔드포인트의 존재 이유다 — 가장 오래된 리포트를 기준으로
        삼으면, 첫 비행이 이미 시공 중이었을 때 계획 물량이 조용히 깎인다.


        덮어쓸 수 있다(잘못 지정하는 일이 실제로 있다). 이전 지정도 저널에 남으므로
        "언제 무엇을 기준으로 봤는가"는 되짚어진다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
        - { in: path, name: design_conformance_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [designSurfaceId]
              properties:
                designSurfaceId: { type: string, minLength: 1 }
      responses:
        '201':
          description: BASELINE_SET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressBaselineResponse' }
        '404': { description: UNKNOWN_REPORT }
        '409':
          description: >-
            REJECTED(그 리포트가 다른 설계면으로 계산됐다 · 원장이 봉인됨) ·
            UNKNOWN_SITE(요청 기록이 없어 현장을 특정할 수 없다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressBaselineResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /v1/sites/{site_id}/design-surfaces:
    post:
      summary: Register a design surface (planned-grade DEM) and issue a presigned PUT
      description: >-
        SITES_WRITE 권한 필요. 등록은 **선언의 기록**일 뿐이다 — 201 은 "파일이
        좋다"가 아니라 "어디에 올리면 되는지 정해졌다"는 뜻이다. `declared` 안의
        값(crs·sha256·verticalReference)은 전부 업로더의 주장이고 이 시점에는
        아무도 확인하지 않는다. `declared.verticalReference.source` 는
        `user_declared` 여야 한다(계약이 강제) — 파이프라인 귀속을 업로더 주장
        자리에 담지 않는다.


        `designSurfaceId` 는 서버가 만든다(`{siteId}-ds{n}`) — 객체 키도 서버가
        만든다(`sites/{siteId}/design-surfaces/{designSurfaceId}`). 같은 현장의
        같은 (name, revision) 재전송은 선언이 같으면 멱등 재발급(새 URL)이고,
        선언이 다르면 409 DECLARATION_CONFLICT 다 — 같은 개정 표기가 두 개의 서로
        다른 내용을 가리키면 리포트가 "어느 판 기준인가"에 답할 수 없다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, revision, declared]
              properties:
                name: { type: string, minLength: 1 }
                revision: { type: string, minLength: 1 }
                sourceFormat:
                  type: string
                  enum: [geotiff, landxml]
                  pattern: '^(geotiff|landxml)$'
                  default: geotiff
                  description: >-
                    원본 입구. landxml은 원본 XML을 보존하고 trusted worker가 선택한
                    TIN Surface를 canonical GeoTIFF로 정규화한다. 기능 flag가 꺼진
                    배포에서는 LANDXML_INGRESS_DISABLED로 거부된다.
                surfaceSelector:
                  type: [string, 'null']
                  minLength: 1
                  description: >-
                    sourceFormat=landxml일 때 필수인 정확한 TIN Surface 이름. 다중
                    Surface에서 서버가 기존지반/계획지반을 추측하지 않는다.
                declared:
                  type: object
                  additionalProperties: false
                  required: [crs, sha256, verticalReference]
                  description: >-
                    전부 업로더의 주장. 구조 정본은
                    contracts/schemas/design-surface.v1.json 의 declared 블록.
                  properties:
                    crs: { type: string, minLength: 1 }
                    lengthUnit: { type: string, enum: [meter], default: meter }
                    sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                    verticalReference:
                      type: object
                      additionalProperties: false
                      required: [datum, basis, source]
                      properties:
                        datum: { type: string }
                        basis: { type: string, minLength: 1 }
                        source: { type: string, enum: [user_declared] }
      responses:
        '201':
          description: REGISTERED — 업로드용 presigned PUT 동봉
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceRegisterResponse' }
        '404': { description: UNKNOWN_SITE — 등록된 적 없는 현장 }
        '409': { description: DECLARATION_CONFLICT — 같은 이름·개정이 다른 선언으로 이미 있다 }
        '422': { description: INVALID_SITE_ID — 경로-안전하지 않은 siteId }
        '503': { description: STORE_UNAVAILABLE — 봉인됨/스토리지 장애, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
    get:
      summary: List a site's design surfaces (declared vs observed, status, rejection reason)
      description: >-
        SITES_READ 권한 필요. 미검증 상태를 감추지 않는다 — 화면이 "무엇이 주장이고
        무엇이 확인된 사실인가"를 그리려면 declared·observed 두 블록이 다 보여야
        한다. 상태는 REGISTERED/SEALED/VERIFIED/REJECTED 이고, 비교 입력 자격은
        VERIFIED 하나뿐이다(SEALED 는 "업로드했다고 클라이언트가 주장했다"일 뿐).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 등록 순서 결정적 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}/design-surfaces/{design_surface_id}/seal:
    post:
      summary: Record the client's claim that the upload finished (no bytes are read)
      description: >-
        SITES_WRITE 권한 필요. **이 호출은 스토리지를 한 바이트도 읽지 않는다.**
        Core 가 증명하는 것은 "더 이상 내용을 바꾸지 않기로 봉인했다"는 원장 쪽
        사실뿐이고, 파일이 실제로 있는지·선언과 같은지는 아무도 확인하지 않았다
        (Core 는 객체 바이트를 중계하지 않는다, ADR-KSI-010 §1). 그래서 SEALED 는
        검증이 아니라 **검증 대기 큐 진입**이다.


        재호출은 에러가 아니라 200 ALREADY_SEALED(무기록 멱등)다. 이미 판정이
        끝난(VERIFIED·REJECTED) 설계면은 409 ALREADY_JUDGED — 복구 경로는
        되돌리기가 아니라 새 revision 등록이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
        - { in: path, name: design_surface_id, required: true, schema: { type: string } }
      responses:
        '201':
          description: SEALED — 검증 대기 큐 진입
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceSealResponse' }
        '200':
          description: ALREADY_SEALED — 무기록 멱등
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceSealResponse' }
        '404': { description: UNKNOWN_DESIGN_SURFACE — 없거나 다른 현장의 id }
        '409': { description: ALREADY_JUDGED — 이미 VERIFIED·REJECTED }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
  /v1/design-surfaces:
    get:
      summary: Pending-verification queue for the worker (SEALED only, download URL only)
      description: >-
        **PROCESSING_WORK 권한 필요**(워커 전용). SEALED 상태만 제공한다 —
        REGISTERED 는 아직 파일이 없을 수 있고, 판정이 끝난 것은 워커가 할 일이
        없다. `status` 를 SEALED 이외로 주면 422 다.


        **응답에 선언값(sha256·CRS)이 실리지 않는다.** 워커에게 정답을 주면 바이트를
        읽지 않고 되읊어 통과할 수 있다 — 여기서 주는 것은 "어느 파일을 어디서
        받아라"뿐이다(GET /v1/processing-jobs/{jobId}/input 과 같은 원칙).


        lease 가 없다 — 검증은 멱등이라 둘 이상의 워커가 같은 파일을 재도 먼저
        도착한 관측이 판정을 굳히고 나머지는 무기록 거절된다. 스토리지 URL 발급에
        실패한 항목은 그 1건만 목록에서 빠진다(전체를 503 으로 만들지 않는다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          required: false
          description: SEALED 만 허용(기본값). 다른 값은 422.
          schema: { type: string, default: SEALED }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 봉인 순서(FIFO) 후보 목록 + 다운로드 URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingDesignSurfaceListResponse' }
        '422': { description: status 가 SEALED 가 아니다 }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(사람 역할은 이 권한을 갖지 않는다) }
  /v1/design-surfaces/{design_surface_id}/observations:
    post:
      summary: Report measured raster facts; Core compares them against the declaration
      description: >-
        **PROCESSING_WORK 권한 필요**(워커 전용). 이 권한이 여기 붙는 것이 핵심이다
        — 설계면을 올린 주체(SITES_WRITE)가 자기 신고값을 스스로 검증할 수 없다.


        워커가 보내는 것은 **측정값뿐이고 판정이 아니다**. `measuredAt`/`measuredBy`
        도 요청에 없다 — 둘 다 Core 가 서버 시계와 인증된 principal 로 채운다.
        대조는 Core 가 하고(sha256 → 단위 → 밴드 수 → 유효셀 → CRS → 수직기준),
        journal 에 남는 사실은 측정값이라 재생이 **다시 대조**한다 — 원장의 판정만
        고쳐도 기동에서 걸린다.


        SEALED 에서만 받는다. 봉인 전이면 409 NOT_SEALED(대조 대상 내용이 아직
        확정되지 않았다), 이미 판정됐으면 200 ALREADY_JUDGED(무기록 멱등).
        거부는 422 이고 `rejectionReason` 에 typed verdict 가 실린다:
        DIGEST_MISMATCH · CRS_DECLARATION_MISMATCH · UNSUPPORTED_CRS ·
        UNSUPPORTED_UNIT · UNSUPPORTED_BAND_COUNT · NO_FINITE_CELLS ·
        VERTICAL_DECLARATION_CONTRADICTED.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: design_surface_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [sha256, crs, width, height, bandCount, dtype, pixelSizeXM, pixelSizeYM,
                 transform, boundsMinX, boundsMinY, boundsMaxX, boundsMaxY, finiteCellCount]
              properties:
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                crs: { type: string, minLength: 1 }
                # compound CRS 의 수직 성분. 대부분의 DEM 에는 없다(null 이 정상).
                verticalCrsEpsg: { type: [integer, 'null'], minimum: 1 }
                width: { type: integer, minimum: 1 }
                height: { type: integer, minimum: 1 }
                bandCount: { type: integer, minimum: 1 }
                dtype: { type: string, minLength: 1 }
                nodata: { type: [number, 'null'] }
                # NaN 은 JSON 에 없다 — NaN nodata 는 이 불리언으로 싣는다.
                nodataIsNan: { type: boolean, default: false }
                pixelSizeXM: { type: number, exclusiveMinimum: 0 }
                pixelSizeYM: { type: number, exclusiveMinimum: 0 }
                transform:
                  type: array
                  minItems: 6
                  maxItems: 6
                  items: { type: number }
                boundsMinX: { type: number }
                boundsMinY: { type: number }
                boundsMaxX: { type: number }
                boundsMaxY: { type: number }
                finiteCellCount: { type: integer, minimum: 0 }
                sourceLineage:
                  oneOf:
                    - $ref: '#/components/schemas/DesignSurfaceSourceLineage'
                    - type: 'null'
                  description: >-
                    LandXML 원본 SHA-256 → 선택 Surface → 파서/정규화 프로필 →
                    canonical GeoTIFF SHA-256의 trusted-worker 계보다. 직접 GeoTIFF
                    관측에서는 null이다.
      responses:
        '201':
          description: VERIFIED — 관측이 선언과 전부 일치했다(이제 비교 입력 자격이 있다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceObservationResponse' }
        '200':
          description: ALREADY_JUDGED — 이미 판정된 설계면(무기록 멱등)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceObservationResponse' }
        '422':
          description: >-
            REJECTED(rejectionReason 참조) 또는 INVALID_MEASUREMENT(측정치가 스스로
            모순 — 예: 유효셀 수 > 전체 셀 수). 422 인 이유: 요청 형식은 옳고
            **내용이 사실과 다르다** — 같은 값으로 재시도해도 결과가 같다.
        '404': { description: UNKNOWN_DESIGN_SURFACE }
        '409': { description: NOT_SEALED — 봉인 전에는 대조 대상이 확정되지 않았다 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/design-surfaces/{design_surface_id}/verification-failure:
    post:
      summary: Report that the file could not be opened at all (UNREADABLE_RASTER)
      description: >-
        **PROCESSING_WORK 권한 필요**(워커 전용). "관측이 선언과 다르다"가 아니라
        **관측 자체가 없다**는 보고라 관측 경로와 분리돼 있다. 이 경로가 실을 수
        있는 사유는 UNREADABLE_RASTER **하나뿐**이고 요청에 사유 필드가 없다 —
        워커가 NO_FINITE_CELLS 같은 Core 의 판정을 자기 입으로 만들어낼 수 없어야
        한다. 결과는 REJECTED(종단) 이며, 복구는 새 revision 등록이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: design_surface_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                detail: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: REJECTED — rejectionReason=UNREADABLE_RASTER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceObservationResponse' }
        '200':
          description: ALREADY_JUDGED — 이미 판정된 설계면(무기록 멱등)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceObservationResponse' }
        '404': { description: UNKNOWN_DESIGN_SURFACE }
        '409': { description: NOT_SEALED — 봉인되지 않은 설계면은 검증 대상이 아니다 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/design-surfaces/{design_surface_id}/normalization-failure:
    post:
      summary: Report a LandXML normalization failure
      description: >-
        PROCESSING_WORK 권한 필요. trusted worker가 LandXML TIN을 KSI 표준
        GeoTIFF로 정규화할 수 없었음을 기록한다. 호출자가 거부 사유를 고르지
        않으며 Core가 LANDXML_NORMALIZATION_FAILED로 봉인한다. 원본 LandXML
        bytes는 보존되고, 복구는 새 revision 등록이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: design_surface_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                detail: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: REJECTED — rejectionReason=LANDXML_NORMALIZATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceObservationResponse' }
        '200':
          description: ALREADY_JUDGED — already terminal, no new durable record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignSurfaceObservationResponse' }
        '404': { description: UNKNOWN_DESIGN_SURFACE }
        '409': { description: NOT_SEALED }
        '503': { description: STORE_UNAVAILABLE — Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/missions/{mission_id}/design-conformance-requests:
    post:
      summary: Request a design-conformance (remaining cut/fill vs the planned surface) run
      description: >-
        MISSIONS_ISSUE 권한 필요 — 계산해 제출하는 것은 워커의 일이지만 "무엇을
        무엇과 비교할지" 지목하는 것은 사람의 결정이다(비교 요청 생성과 같은 자리).


        **계산 전에 막는 것들(fail-closed)**: 검증되지 않은 설계면(409
        DESIGN_SURFACE_NOT_VERIFIED — SEALED 는 "업로드했다는 주장"일 뿐이다),
        수직기준 계열 불일치(422 VERTICAL_DATUM_INCOMPATIBLE — 타원체고와 정표고를
        그냥 빼면 한국에서 20~30m 가 조용히 섞인다), 수직기준이 기록되기 전에
        등록된 DSM(422 VERTICAL_REFERENCE_UNKNOWN — 재처리하면 비교할 수 있다),
        구역 미확정(422 ZONES_REQUIRED — 설계 대비 잔량은 "어느 범위의" 잔량인지
        없이 성립하지 않는다).


        구역·기준값·설계면 해시는 **값으로** 스냅샷된다 — 나중에 현장 경계나
        시스템 기준값이 바뀌어도 이미 만든 요청은 그때 무엇으로 쟀는지 스스로
        답한다. 같은 (설계면+현재 작업+구역) 재전송은 200 ALREADY_REQUESTED 다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [designSurfaceId, currentJobId]
              properties:
                designSurfaceId: { type: string, minLength: 1 }
                currentJobId: { type: string, minLength: 1 }
                workAreaIds:
                  description: >-
                    등록된 작업구역(M4-C)을 고른다. Core 가 폴리곤을 **값으로** 풀어
                    zones 에 넣고, zoneId 는 workAreaId 가 된다 — 그래서 다음 시점의
                    리포트와 자동으로 이어지고 진척 계산이 성립한다. zones 와 동시에
                    주면 422 WORK_AREA_UNUSABLE(어느 쪽이 진짜 지시인지 서버가 골라
                    주면 화면이 보낸 것과 계산에 쓴 것이 갈릴 수 있다).
                  type: [array, 'null']
                  items: { type: string, minLength: 1 }
                zones:
                  description: >-
                    {zoneId: GeoJSON Polygon}. 현장 AOI 를 자동으로 쓰지 않는다 —
                    사용자 확인을 거친 폴리곤 값을 화면이 싣는다. 비교 요청과 달리
                    **생략할 수 없다**(workAreaIds 를 주지 않는 한). 즉석 폴리곤은
                    매번 좌표가 달라 시계열로 이어지지 않는다.
                  type: [object, 'null']
                  additionalProperties: { type: object }
                zoneCrs: { type: [string, 'null'] }
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceRequestMutationResponse' }
        '200':
          description: ALREADY_REQUESTED — 같은 지시가 이미 있다(멱등)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceRequestMutationResponse' }
        '404': { description: UNKNOWN_MISSION · UNKNOWN_DESIGN_SURFACE }
        '409': { description: DESIGN_SURFACE_NOT_VERIFIED }
        '422':
          description: >-
            UNKNOWN_JOB · JOB_NOT_SUCCEEDED · MISSION_MISMATCH · SITE_MISMATCH ·
            NO_DSM_ARTIFACT · ZONES_REQUIRED · WORK_AREA_UNUSABLE ·
            VERTICAL_REFERENCE_UNKNOWN · VERTICAL_DATUM_INCOMPATIBLE
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
    get:
      summary: List a mission's design-conformance requests (newest first)
      description: MISSIONS_READ 권한 필요.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 최신 우선 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceRequestListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/design-conformance-requests:
    get:
      summary: Pending design-conformance requests for a worker (QUEUED + orphaned RUNNING)
      description: >-
        PROCESSING_WORK 권한 필요 — **사람은 이 표면을 쓰지 않는다.**
        `GET /v1/comparison-requests` 와 동형(최소권한 — requestId·requestedAt 만
        노출). lease 가 만료된 RUNNING(죽은 워커가 쥐고 있던 요청)도 나온다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 후보 목록(없으면 빈 배열)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingDesignConformanceRequestListResponse'
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(사람 Role 포함) }
  /v1/design-conformance-requests/{request_id}/lease:
    post:
      summary: Acquire (or renew) the lease on one design-conformance request
      description: >-
        PROCESSING_WORK 권한 필요. 같은 워커의 재호출은 갱신(200 LEASE_RENEWED,
        최초 취득 시각 보존)이다. 만료 판정은 저장된 플래그가 아니라 시각 비교라
        (`leasing.JobLease`), 죽은 워커의 요청은 별도 조치 없이 회수된다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: request_id, required: true, schema: { type: string } }
      responses:
        '201':
          description: LEASED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceRequestMutationResponse' }
        '200':
          description: LEASE_RENEWED — 같은 워커의 갱신
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceRequestMutationResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409': { description: LEASE_HELD_BY_ANOTHER · REQUEST_NOT_ACTIVE }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/design-conformance-requests/{request_id}/input:
    get:
      summary: Fetch the worker's inputs — presigned GET for the design surface and the current DSM
      description: >-
        PROCESSING_WORK 권한 필요 + **lease 를 쥔 워커만** 통과한다(상호배제와
        접근범위 축소를 동시에 한다). 설계면·현재 DSM 의 열람 URL, 두 입력의
        수직기준, 구역, 요청 시점 기준값 스냅샷, 그리고 Core 가 도출한
        designConformanceId·diffRasterId 를 준다.


        `designSurfaceSha256` 을 함께 주는 것은 설계면 **검증** 큐와 반대다 —
        거기서는 워커가 신고값을 알면 파일을 읽지 않고 되읊을 수 있어 주지
        않지만, 여기서 이 값의 용도는 판정이 아니라 "받아온 바이트가 그때 검증된
        그 파일인가"다(스토리지 교체·손상을 값싸게 잡는다).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: request_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: INPUT_READY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceInputResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409': { description: LEASE_REQUIRED · LEASE_HELD_BY_ANOTHER }
        '422': { description: VERTICAL_REFERENCE_UNKNOWN — 산출물의 수직기준을 읽을 수 없다 }
        '503': { description: STORAGE_UNAVAILABLE — URL 발급 실패, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/design-conformance-requests/{request_id}/transitions:
    post:
      summary: Transition a design-conformance request (worker only)
      description: >-
        PROCESSING_WORK 권한 필요 + lease 보유 필수. QUEUED→RUNNING→
        {SUCCEEDED,FAILED} 만 허용된다(CANCELLED 없음 — 정체된 RUNNING 은 lease
        만료로 회수된다). 종료된 요청의 결론은 고쳐 쓰지 않는다(409
        ILLEGAL_TRANSITION).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: request_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus]
              properties:
                targetStatus:
                  type: string
                  enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
                detail: { type: [string, 'null'] }
      responses:
        '200':
          description: TRANSITIONED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceRequestMutationResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409': { description: ILLEGAL_TRANSITION · LEASE_REQUIRED · LEASE_HELD_BY_ANOTHER }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/design-conformance-requests/{request_id}/diff-raster-upload-url:
    post:
      summary: Issue a presigned PUT for the diff raster (the server chooses the object key)
      description: >-
        PROCESSING_WORK 권한 필요 + lease 보유 필수. **워커가 객체 키를 고르지
        않는다** — 키는 요청에서 결정적으로 유도되므로
        (`sites/{siteId}/design-conformance/{designConformanceId}`) 재시도가 같은
        자리를 덮어써 orphan 이 쌓이지 않는다.


        종료된(SUCCEEDED·FAILED) 요청에는 발급하지 않는다(409 REQUEST_NOT_ACTIVE)
        — 이미 원장에 굳은 리포트의 래스터가 나중에 다른 바이트로 바뀌는 창을
        영구히 닫는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: request_id, required: true, schema: { type: string } }
      responses:
        '201':
          description: UPLOAD_READY — presigned PUT + 서버가 정한 objectKey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiffRasterUploadUrlResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409': { description: REQUEST_NOT_ACTIVE · LEASE_REQUIRED · LEASE_HELD_BY_ANOTHER }
        '503': { description: STORAGE_UNAVAILABLE — 발급 실패, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/design-conformance-requests/{request_id}/diff-raster-verification:
    post:
      summary: Core re-reads the uploaded object and re-hashes it — the worker's claim is not evidence
      description: >-
        PROCESSING_WORK 권한 필요 + lease 보유 필수. **이 경로가 이 milestone 의
        신뢰 경계다.** 워커가 "올렸다, 해시는 이거다"라고 말한 것만으로는 아무
        사실도 성립하지 않는다 — Core 가 그 객체 바이트를 직접 읽어 자기
        hashlib 으로 digest 를 다시 계산하고, 신고와 **같을 때만** 확인 사실을
        원장에 남긴다.


        응답의 `verifiedAt` 은 리포트의 `diffRaster.coreVerifiedDigestAt` 에
        그대로 실릴 값이다(계약 필수 필드) — 즉 이 확인 없이는 리포트를 조립할
        수조차 없다. 불일치는 422 DIFF_RASTER_DIGEST_MISMATCH 이고 응답에 Core 가
        실제로 계산한 digest 가 함께 온다. 객체를 읽지 못하면 503
        DIFF_RASTER_UNREADABLE — 확인 없이 통과시키지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: request_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digest, sizeBytes]
              description: 워커의 신고 — Core 는 이것을 믿지 않고 대조 대상으로만 쓴다.
              properties:
                digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        '201':
          description: DIFF_RASTER_VERIFIED — Core 가 직접 계산한 digest·크기·확인 시각
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiffRasterVerificationResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409': { description: REQUEST_NOT_ACTIVE · LEASE_REQUIRED · LEASE_HELD_BY_ANOTHER }
        '422': { description: DIFF_RASTER_DIGEST_MISMATCH — 재해싱 결과가 신고와 다르다 }
        '503': { description: DIFF_RASTER_UNREADABLE · STORE_UNAVAILABLE, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/missions/{mission_id}/design-conformance:
    post:
      summary: Submit a design-conformance report (Core re-hashes the diff raster before recording)
      description: >-
        **PROCESSING_WORK 권한 필요**(워커 전용) — 사람은 잔량을 주장할 수 없다.
        이 숫자는 공정·정산 판단의 근거가 될 수 있고, 그럴수록 계산된 것이어야
        한다(volume-changes 와 같은 원칙).


        Core 는 기록 **직전에** 차분 래스터 객체를 다시 읽어 해싱하고, 리포트의
        `diffRaster.digest`·`sizeBytes` 와 다르면 **리포트를 기록하지 않고** 그
        요청을 FAILED(DIFF_RASTER_DIGEST_MISMATCH)로 끝낸다. 이 재확인은 요청
        쪽 확인과 중복이 아니라 다른 창을 막는다 — 그 사이에 객체가 다른 바이트로
        덮였을 수 있다. 그래서 다음 불변식이 성립한다: **원장에 있는 모든 리포트에
        대해, 그 digest 로 스토리지 바이트를 다시 해싱하면 항상 같다.**


        설계면·현재 산출물·기준값이 요청 스냅샷과 어긋나거나, Core 가 확인한 적
        없는 래스터를 참조하면 전부 422 로 거부된다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: >-
                구조 정본은 contracts/schemas/design-conformance-report.v1.json.
              type: object
              additionalProperties: true
      responses:
        '201':
          description: RECORDED — Core 가 재해싱으로 확인한 뒤 원장에 굳혔다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceResponse' }
        '404': { description: UNKNOWN_MISSION }
        '409': { description: DUPLICATE_REPORT_ID — 같은 id 로 다른 내용을 덮어쓸 수 없다 }
        '422':
          description: >-
            UNKNOWN_REQUEST · REQUEST_MISMATCH · DESIGN_SURFACE_MISMATCH ·
            ARTIFACT_MISMATCH · UNKNOWN_ARTIFACT · ARTIFACT_KIND_MISMATCH ·
            POLICY_MISMATCH · DIFF_RASTER_NOT_VERIFIED ·
            DIFF_RASTER_DIGEST_MISMATCH
        '503': { description: DIFF_RASTER_UNREADABLE · STORE_UNAVAILABLE, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(사람 Role 포함) }
    get:
      summary: List a mission's design-conformance reports (newest first)
      description: >-
        MISSIONS_READ 권한 필요. 결과가 없으면 404 다 — 빈 목록을 주면 "아직 계산
        안 됨"과 "잔량이 0"을 소비자가 구분할 수 없다. `coreRecomputedDigest` 는
        Core 가 기록 시점에 직접 재계산한 값이라, 화면이 "확인된 사실"이라고 말할
        근거가 된다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 최신 우선 이력 + 최신 리포트의 전 구역 순 성토 필요량
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignConformanceListView' }
        '404': { description: 해당 임무의 설계 대비 잔량 리포트가 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/design-conformance/{design_conformance_id}/diff-raster:
    get:
      summary: Presigned GET for the stored diff raster — the map's only data source
      description: >-
        MISSIONS_READ 권한 필요. 대시보드는 **반드시 이 경로로만** 히트맵 데이터를
        얻는다. 브라우저가 원본 두 장을 받아 다시 차분하는 경로를 만들지 않는
        이유가 이 엔드포인트의 존재 이유다 — 그러면 지도와 표가 서로 다른 두
        진실을 갖게 되고 그 어긋남은 어느 화면에서도 보이지 않는다. 여기서
        내려주는 것은 체적 집계에 **실제로 쓴 그 격자**다(값 규약: 설계 표고 −
        현재 표고, 무효 셀은 NaN — 0 이 아니다).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: mission_id, required: true, schema: { type: string } }
        - { in: path, name: design_conformance_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: 열람 URL + digest·크기(내려받은 바이트를 화면이 대조할 수 있다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiffRasterViewResponse' }
        '404': { description: 해당 리포트를 찾을 수 없다 }
        '503': { description: 열람 URL 발급 실패 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/processing-jobs:
    post:
      summary: Issue a 3D reconstruction processing job on the sealed source bundle
      description: >-
        MISSIONS_ISSUE 권한 필요. 일반 제품 호출자는 Core registry에서 발급된
        `processingProfileId` 하나만 보낸다. Core가 immutable snapshot을 확장하고,
        작업 원장에는 profile id와 canonical digest를 함께 고정한다. raw provider,
        engine, image 또는 parameter는 새 발급 계약에 존재하지 않아 422다. 과거
        원장에 이미 있는 raw spec만 `LEGACY_UNMANAGED`로 재생되며 새 정량 비교에는
        쓸 수 없다.

        `input`(장수·총 화소·sourceBundleDigest)·`dataResidency`·`billing`·
        `status`·`jobId`도 요청 스키마에 자리가 없고, 실어 보내면 422 다.
        입력은 봉인된 번들에서 Core 가 집계하고(봉인 전이면 BUNDLE_NOT_SEALED),
        반출 허용 여부는 그 임무의 **현장**이 정하며(POST /v1/sites 의
        dataResidency), 과금은 종료 보고 시점의 몫이다. 발급 시점 billing 은
        creditsCharged=0 · rateBasis=`unmetered-at-issue` — 0 이 "무료"가 아니라
        "아직 재지 않았다"를 뜻한다. `input.totalMegapixels` 는 업로더 **신고**
        해상도의 합이라 견적이고, 응답의 `inputVerified` 가 이 단계에서 항상
        false 인 이유다. 임무당 활성(QUEUED·RUNNING) 작업은 1건 — 같은 사양
        재요청은 기존 작업을 그대로 돌려주고(ALREADY_ISSUED, 200), 다른 사양이면
        409 다. 종료된 뒤에는 재처리 작업을 새로 만들 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [processingProfileId]
              properties:
                processingProfileId:
                  type: string
                  minLength: 1
                  description: >-
                    KSI가 발급한 읽기 전용 profile id. `ksi-odm-civil-v1`은
                    NodeODM 2.2.4/ODM 3.5.6과 고정 OCI digest를 뜻한다.
      responses:
        '201':
          description: ISSUED — verdict + 발급된 작업(status=QUEUED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '200':
          description: ALREADY_ISSUED — 같은 사양의 활성 작업을 그대로 반환(멱등 재요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '404': { description: UNKNOWN_MISSION — 이 임무의 원본 미디어 번들이 없다 }
        '409': { description: ACTIVE_JOB_EXISTS — 다른 사양의 작업이 진행 중이다 }
        '422':
          description: >-
            BUNDLE_NOT_SEALED(봉인 전 — 장수·digest 미확정) /
            UNKNOWN_PROCESSING_PROFILE / PROCESSING_PROFILE_ISSUANCE_DISABLED /
            INVALID_REQUEST_SHAPE
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
    get:
      summary: List processing jobs for a mission (issuedAt·jobId 결정적 정렬)
      description: MISSIONS_READ 권한 필요. 재처리 이력을 포함한 전체 목록이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 처리 작업 목록(없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/sites/{site_id}/processing-jobs:
    get:
      summary: List reconstruction epochs for a site (newest first)
      description: >-
        MISSIONS_READ 권한 필요. ProcessingJobRecord 가 곧 reconstruction epoch
        이고(ADR-KSI-016 D3) 시계열 비교(변화·체적)는 이 목록 위에서 이뤄진다 —
        두 시점 비교 화면이 후보를 고르는 표면이다. 임무별 목록과 **같은 응답
        모델**이라 artifacts 가 그대로 실린다: 화면이 "이 epoch 에 point_cloud·
        dsm 이 있는가"를 추가 조회 없이 판단한다. 정렬은 임무별 목록과 반대로
        최신이 먼저다(저기는 한 임무의 처리 이력을 순서대로 읽는 용도고, 여기는
        "가장 최근 epoch 부터 N개"가 기본 질문이다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 그 현장의 처리 작업 목록(없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/sites/{site_id}/spatial-model:
    get:
      summary: Judge whether this site has a spatial model and how old it is
      description: >-
        SITES_READ 권한 필요. **저장된 값이 아니라 매 호출 재계산**이다 — 판정을
        어딘가에 저장하면 그 값과 처리 작업 원장이 갈라져 "둘 중 뭐가 진실이냐"가
        생긴다(ADR-KSI-016 D3 — ProcessingJobRecord 가 곧 재구성 epoch 이므로 그
        옆에 두 번째 원장을 만들지 않는다).

        ``SUCCEEDED`` 이면서 ``lineage.authority=source`` 산출물을 가진 작업만
        epoch 로 센다(INV-051) — 파생 산출물(Mesh·정사영상·DSM)만 있는 성공은
        모델로 세지 않는다. 나이 기준은 현장이 선언한 modelMaxAgeDays 이고,
        미선언이면 노후를 **판정하지 않는다**(AGE_POLICY_UNDECLARED — FRESH 로
        뭉개면 화면이 근거 없는 안심을 준다).

        siteStatusMatchesModel=false 는 현장 상태가 모델 유무와 어긋난다는 뜻이다
        (예: PATROL_READY 인데 모델이 없다). 조회는 판정만 하고 상태를 고치지
        않는다 — 조회가 원장을 되돌리면 상태가 조회 시점에 따라 달라진다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 판정 결과 + 그 판정의 근거
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpatialModelView' }
        '404': { description: 등록되지 않은 현장 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}/spatial-model/staleness-sweep:
    post:
      summary: Apply the staleness verdict now (explicit, operator/batch triggered)
      description: >-
        SITES_WRITE 권한 필요. 이 현장의 공간모델이 선언된 나이 기준을 넘었으면
        PATROL_READY/PATROL_ACTIVE → MODEL_STALE 로 전이시킨다. 기준을 선언하지 않은
        현장은 **아무것도 하지 않는다** — 서버가 기준을 지어내 자율운영을 끊지 않는다.

        조회(GET .../spatial-model)가 이 일을 하지 않는 것이 의도다: 조회가 원장을
        바꾸면 현장 상태가 "누가 언제 화면을 열었는가"에 좌우된다.

        **주기 실행은 이 서비스가 소유하지 않는다** — systemd timer·cron 같은 배포
        운영 계층이 이 엔드포인트를 부른다. 서버 안에 스케줄러를 두면 그 주기가 배포
        설정이 아니라 코드가 되고 운영에서 관측하기 어려워진다.

        SITES_AUTONOMY_APPROVE 를 요구하지 않는다 — PATROL_READY → MODEL_STALE 은
        자율을 **끊는** 방향이라 승인 간선이 아니다. 자율 복귀에는 여전히 재검증
        경로(MODEL_PROCESSING → MODEL_VALIDATION → PROVISIONAL_AUTONOMY)와 승인이
        필요하다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 스윕 후의 판정 결과(옮겼든 안 옮겼든 현재 상태를 낸다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpatialModelView' }
        '404': { description: 등록되지 않은 현장 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
  /v1/processing-profiles:
    get:
      summary: List immutable KSI processing profiles
      description: >-
        MISSIONS_READ 권한 필요. 이 표면은 profile 발급/편집 API가 아니라 Core가
        현재 발급 가능한 immutable snapshot을 UI와 local uploader에 알리는 읽기
        전용 discovery 표면이다. 프로필 변경은 기존 id 수정이 아니라 새 id와
        새 digest 발급이다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Core-issued immutable processing profile snapshots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingProfileListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/processing-jobs:
    get:
      summary: List processing jobs a worker may (re)claim — QUEUED + orphaned RUNNING (FIFO)
      description: >-
        PROCESSING_WORK 권한 필요(PROCESSING_WORKER 전용) — **사람은 이 표면을
        쓰지 않는다.** `/v1/missions/{mission_id}/processing-jobs` 와 달리
        MISSIONS_READ 가 아니다: 워커는 어떤 임무·현장의 작업인지, 계약 내용이
        무엇인지 알 필요가 없고, 알면 그 자체가 최소권한을 벗어난다(PendingProcessingJobView
        가 jobId·issuedAt 만 싣는 이유). QUEUED 뿐 아니라 **lease 가 만료된
        RUNNING**(죽은 워커가 쥐고 있던 작업)도 나온다 — 살아있는 lease 를 쥔
        RUNNING·종료 상태는 여기 없다. jobId 로
        POST /v1/processing-jobs/{job_id}/lease 를 잡은 뒤에야
        GET /v1/processing-jobs/{job_id}/input 이 전체 사양을 준다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          required: false
          description: 오래된 것부터 몇 건까지. 무제한 반환을 계약으로 굳히지 않는다.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: QUEUED 작업 목록(없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingProcessingJobListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(사람 Role 포함) }
  /v1/processing-jobs/{job_id}:
    get:
      summary: Read one processing job (계약 payload 포함)
      description: >-
        MISSIONS_READ 권한 필요. `contract` 는 어댑터로 나가는 payload 그대로다
        (processing-job.v1.json) — 화면이 계약 필드를 다시 조립하지 않게 한 벌로
        싣는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 처리 작업 1건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobView' }
        '404': { description: 해당 처리 작업을 찾을 수 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/processing-jobs/{job_id}/transitions:
    post:
      summary: Transition a processing job's status (QUEUED→RUNNING→SUCCEEDED|FAILED)
      description: >-
        **요구 권한이 대상 상태마다 다르다.** RUNNING·SUCCEEDED·FAILED 는 실제로
        엔진을 돌린 주체만 아는 사실이라 PROCESSING_WORK(PROCESSING_WORKER 전용,
        어느 사람 Role 에도 매핑되지 않는다)를 요구한다 — 사람은 성공을 손으로
        찍을 수 없다. CANCELLED 는 사람의 결정이라 MISSIONS_ISSUE 다.
        전이표는 QUEUED→RUNNING→SUCCEEDED|FAILED 와
        QUEUED|RUNNING→CANCELLED 뿐이다 — 종료 상태(SUCCEEDED·FAILED·CANCELLED)
        에서 나가는 전이는 없다(끝난 작업의 결론을 고쳐 쓰지 않는다). QUEUED 에서
        RUNNING 을 건너뛴 성공 주장도 거부된다.
        SUCCEEDED 에는 두 번째 게이트가 더 있다(INV-051): 그 작업에
        `lineage.authority=source` 산출물이 최소 1건 등록돼 있어야 하고, 없으면
        409 UNBACKED_SUCCESS 다. `actor` 는 body 가 아니라 인증 Principal 에서만
        취득한다. lease·heartbeat 는 아직 없다 — RUNNING 전이가 한 번만
        성공한다는 것이 유일한 상호배제다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus]
              properties:
                targetStatus:
                  type: string
                  enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
                detail:
                  description: 왜 그렇게 끝났는지. 종료 전이에 남긴다.
                  type: [string, 'null']
      responses:
        '200':
          description: TRANSITIONED — verdict + 전이된 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '404': { description: UNKNOWN_JOB }
        '409':
          description: >-
            ILLEGAL_TRANSITION(전이표에 없는 전이) ·
            UNBACKED_SUCCESS(원본 산출물 없이 SUCCEEDED 주장 — INV-051) ·
            LEASE_REQUIRED · LEASE_HELD_BY_ANOTHER(실행 상태 보고는 lease 를
            쥔 워커만 — CANCELLED 는 예외다).
            422 가 아니라 409 인 이유: 요청 자체는 올바르고 지금 원장 상태가 그
            주장을 받쳐주지 못하는 것이다(산출물을 등록하면 같은 요청이 통과한다).
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: 대상 상태가 요구하는 권한 없음(위 설명의 권한표) }
  /v1/processing-jobs/{job_id}/lease:
    post:
      summary: Claim (or renew) exclusive hold on a processing job
      description: >-
        PROCESSING_WORK 권한 필요(워커 전용 — 사람은 작업을 잡아 워커를 굶길 수
        없다). **워커 행위의 관문이다**: GET .../input · RUNNING/SUCCEEDED/FAILED
        보고 · 산출물 등록이 전부 이 lease 를 요구하고, 없으면 409 LEASE_REQUIRED,
        남이 쥐고 있으면 409 LEASE_HELD_BY_ANOTHER 다.


        403 이 아니라 409 인 이유: 권한은 있고 **지금 이 작업을 쥔 사람이 아닐**
        뿐이다. 403 으로 내면 워커가 자기 자격증명을 의심하게 된다.


        **만료는 저장된 플래그가 아니라 expiresAt 대 현재시각 비교다.** `released`
        같은 불리언을 두면 누군가 갱신해줘야 참이 되고, 빠뜨리면 죽은 워커가
        영원히 살아 있는 것으로 보인다. 여기서는 만료된 lease 가 곧 없는 lease 라,
        죽은 워커의 작업이 별도 반납 명령 없이 회수된다 — 죽은 워커는 정의상
        반납하지 않으므로 명시적 반납에만 의존하면 그 작업이 영구히 묶인다.


        같은 워커의 재호출은 갱신(heartbeat)이고 200 LEASE_RENEWED 다. 만료를
        밀되 최초 취득 시각(grantedAt)은 유지한다 — 얼마나 오래 쥐고 있었는지가
        남아야 "이 워커가 계속 못 끝내고 있다"를 볼 수 있다. 만료 **후** 같은
        워커가 다시 잡으면 그건 갱신이 아니라 새 취득(201 LEASED)이다.


        기본 수명은 15분이다. 이 값은 "작업이 끝나는 데 걸리는 시간"이 아니라
        (ODM 재구성은 몇 시간이다) **"워커가 죽었다고 판정하기까지 기다리는
        시간"**이다 — 살아 있는 워커는 갱신으로 계속 연장한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: LEASED — 새로 잡았다(비어 있었거나 이전 lease 가 만료됐다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '200':
          description: LEASE_RENEWED — 같은 워커의 갱신(heartbeat)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '404': { description: UNKNOWN_JOB }
        '409':
          description: >-
            LEASE_HELD_BY_ANOTHER(다른 워커가 유효한 lease 보유) ·
            JOB_NOT_ACTIVE(끝난 작업은 잡을 수 없다)
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/processing-jobs/{job_id}/input:
    get:
      summary: Fetch a job's spec and presigned source downloads (worker's only read path)
      description: >-
        PROCESSING_WORK 권한 필요. **워커의 유일한 읽기 경로다** — PROCESSING_WORK
        는 MISSIONS_READ 를 포함하지 않으므로 워커는 임무·현장·다른 작업 목록을
        볼 수 없고, 여기서 주는 것도 그 작업이 가리키는 번들 하나뿐이다.


        **업로더의 신고값(sha256·해상도)이 응답에 없다.** 이것이 실측 대조를
        형식이 아니게 만드는 지점이다 — 워커가 정답을 모르므로, VERIFIED 를
        받으려면 바이트를 실제로 읽는 수밖에 없다(POST .../source-media/verify).


        활성(QUEUED·RUNNING) 작업만 내준다 — 끝난 작업의 원본 URL 을 계속
        발급하면 작업 종료가 접근 종료를 뜻하지 않게 된다(409 JOB_NOT_ACTIVE).
        presign 이 하나라도 실패하면 부분 응답 대신 503 이다: 부분집합만 받은
        워커는 반드시 COVERAGE_INCOMPLETE 로 돌아온다.


        **아직 큐가 아니다** — "다음 작업을 달라"는 표면이 없어 워커는 jobId 를
        밖에서 받아야 한다. jobId 는 `{missionId}-pj{n}` 이라 추측 가능하므로,
        워커 토큰을 쥔 쪽은 다른 작업의 입력도 열람할 수 있다. lease 설계 시
        함께 좁힌다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: INPUT_READY — 사양 + 원본 다운로드 URL(짧은 수명)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobInputResponse' }
        '404': { description: UNKNOWN_JOB }
        '409':
          description: >-
            JOB_NOT_ACTIVE(끝난 작업의 원본은 다시 내주지 않는다) ·
            LEASE_REQUIRED(이 작업을 쥐고 있지 않다) ·
            LEASE_HELD_BY_ANOTHER(다른 워커가 쥐고 있다)
        '503': { description: STORAGE_UNAVAILABLE · STORE_UNAVAILABLE, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/processing-jobs/{job_id}/artifacts:
    post:
      summary: Register a reconstruction artifact on a running job (INV-051)
      description: >-
        PROCESSING_WORK 권한 필요(PROCESSING_WORKER 전용) — 사람은 산출물을 만들어
        넣을 수 없다. 실행 중(RUNNING)인 작업에만 붙는다: 시작 전에는 산출물이
        만들어질 수 없고, 끝난 뒤에 붙이면 이미 내려진 결론에 근거를 소급하는
        것이 된다(409 JOB_NOT_RUNNING).


        **계보 앵커는 요청이 정하지 않는다.** `lineage.sourceDigest` 와 `jobId` 는
        요청 스키마에 자리가 없고 Core 가 그 작업의 `input.sourceBundleDigest`
        (봉인된 번들의 digest)와 경로 jobId 로 채운다 — 워커가 실어 보낼 수 있으면
        산출물이 자기 출처를 스스로 적는 것이 된다. 그래서 계약의 중첩 객체
        `lineage` 대신 `authority`·`derivedFrom` 두 필드로 펼쳐서 받는다.


        `derivedFrom` 은 **같은 작업에 이미 등록된** artifactId 만 가리킬 수 있다
        (422 UNKNOWN_PARENT_ARTIFACT) — 계약 스키마는 "비어 있지 않다"만 강제하므로
        실재하지 않는 부모를 적은 파생물은 계약만으로는 통과한다. 작업 간 계보는
        아직 모델링하지 않았다.


        `crs`·`gsd`·`accuracy` 는 nullable **필수**다 — 생략과 명시적 null 을
        구분한다("측정하지 않았다"와 "필드를 잊었다"는 다른 사실이고, accuracy 가
        null 인 비율이 ADR-KSI-012 D3 전환 트리거의 계측점이다). kind 별 필수는
        계약이 강제한다(공간 산출물은 crs, 래스터 계열은 gsd).


        Core 는 산출물 **바이트를 읽지 않는다** — `digest`·`format` 은 워커의
        보고값이다. 이 표면이 강제하는 것은 계보의 무결성이지 내용의 진위가 아니다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artifactId, kind, authority, digest, format]
              properties:
                artifactId:
                  description: 경로-안전 식별자. 같은 작업 안에서 유일해야 한다.
                  type: string
                  minLength: 1
                kind:
                  type: string
                  enum: [point_cloud, camera_poses, ortho, dsm, dtm, mesh, tiles_3d, report]
                authority:
                  description: >-
                    source = 원본 capture 를 직접 처리한 결과. derived = 원본에서
                    재생성한 파생 서빙 계층(derivedFrom 최소 1건 필요).
                  type: string
                  enum: [source, derived]
                derivedFrom:
                  description: 같은 작업의 부모 artifactId 목록. authority=source 면 빈 배열.
                  type: array
                  items: { type: string }
                  default: []
                digest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                format:
                  description: 'laz·obj·gltf·cog·3dtiles·pdf 등 — kind×provider 조합마다 달라 enum 을 두지 않는다.'
                  type: string
                  minLength: 1
                crs: { type: [string, 'null'] }
                gsd: { type: [number, 'null'], exclusiveMinimum: 0 }
                accuracy:
                  description: >-
                    측량 정확도 신고 — nullable(ODM 경로는 null).
                    **rmse 는 절대정확도가 아니다**(INV-024): GCP 로 피팅한 뒤의
                    잔차, 즉 "쓴 점에 얼마나 잘 맞췄나"이지 "쓰지 않은 지점에서
                    얼마나 틀리나"가 아니다. 절대 RMSE 주장은 독립 검사점
                    (피팅에 쓰지 않고 남겨 둔 측량점)이 있을 때만 성립하므로
                    checkpointCount·checkpointRmseM 쌍으로만 표현한다 — 둘은
                    함께 있거나 함께 없어야 하고, 한쪽만 실리면 422
                    (ARTIFACT_CONTRACT_VIOLATION)로 거부한다.
                    서버는 산출물 바이트를 읽지 않으므로 이 값들은 생산자
                    신고(귀속)이지 서버 관측이 아니다.
                  type: [object, 'null']
                  additionalProperties: false
                  required: [gcpCount, rmse, reportUri]
                  properties:
                    gcpCount: { type: integer, minimum: 0 }
                    rmse: { type: number, minimum: 0 }
                    reportUri: { type: string, minLength: 1 }
                    checkpointCount:
                      description: >-
                        피팅에 쓰지 않고 남겨 둔 독립 검사점 수. 생략 시 0 이며,
                        0 이면 절대 RMSE 를 주장할 수 없다.
                      type: integer
                      minimum: 0
                      default: 0
                    checkpointRmseM:
                      description: >-
                        독립 검사점 기준 RMSE(meter) — 절대정확도 주장의 유일한
                        자리. checkpointCount > 0 일 때만 실린다.
                      type: [number, 'null']
                      minimum: 0
                auxiliaryFiles:
                  description: >-
                    산출물이 파일 여러 개(메시의 .mtl·텍스처 등)일 때, 주 파일
                    (digest/objectKey 가 가리키는 파일) 외 나머지의 basename 목록.
                    빈 배열(기본값)이면 파일 하나짜리 산출물이다
                    (mesh-multi-file-artifact-persistence).
                  type: array
                  items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$' }
                  default: []
                verticalReference:
                  description: >-
                    이 산출물 높이의 수직기준 + 그것을 왜 아는가(계약 정본:
                    contracts/schemas/processing-artifact.v1.2.json(검사점을 실으면 v1.3.json)). **생산자가
                    선언하고 Core 는 기록만 한다** — Core 는 산출물 바이트를 읽지
                    않아 이 값을 확인할 수 없다. 생략하면(옛 워커) null 로 남고,
                    Core 는 어떤 기본값도 채우지 않는다: "안 밝혔다"와 "타원체고다"는
                    다른 사실이고, 후자를 Core 가 대신 주장하면 설계 대비 비교가
                    그 가정 위에서 숫자를 낸다. 소비자는 null 을 '수직기준 미상'으로
                    읽고 fail-closed 해야 한다.
                  type: [object, 'null']
                  additionalProperties: false
                  required: [datum, basis, source]
                  properties:
                    datum:
                      type: string
                      enum: [ellipsoidal, ellipsoidal_native, orthometric_kngeoid2018, orthometric_kngeoid2024]
                    basis:
                      description: >-
                        왜 이 값을 아는가 — 비울 수 없다(예: 'ODM 이 RTK 타원체고를
                        변환 없이 그대로 출력'). 근거를 못 적는 선언은 추측이다.
                      type: string
                      minLength: 1
                    source:
                      description: >-
                        pipeline_declared = 처리 파이프라인이 자기 동작을 근거로
                        귀속. user_declared = 업로더의 주장. 둘 다 관측이 아니다.
                      type: string
                      enum: [pipeline_declared, user_declared]
      responses:
        '201':
          description: ARTIFACT_REGISTERED — verdict + 등록된 산출물의 계약 payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingArtifactMutationResponse' }
        '404': { description: UNKNOWN_JOB }
        '409':
          description: >-
            JOB_NOT_RUNNING · DUPLICATE_ARTIFACT ·
            LEASE_REQUIRED · LEASE_HELD_BY_ANOTHER
        '422':
          description: >-
            INVALID_ARTIFACT_ID · UNKNOWN_PARENT_ARTIFACT ·
            ARTIFACT_CONTRACT_VIOLATION(kind 별 crs/gsd 필수, derived 의 부모 필수)
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/missions/{mission_id}/volume-changes:
    post:
      summary: Record a zone volume-change report computed from two DSM epochs
      description: >-
        PROCESSING_WORK 권한 필요(PROCESSING_WORKER 전용) — **사람은 체적을 주장할
        수 없다.** 이 숫자는 정산·분쟁의 근거가 될 수 있고, 그럴수록 손으로 적히면
        안 된다(change-detection·defect-candidates 와 같은 원칙).


        `baseline`·`current` 는 **등록된 dsm 산출물**이어야 한다(422
        ARTIFACT_KIND_MISMATCH) — change-detection 이 point_cloud 를 요구하는 것과
        대칭이며, 체적은 표면 함수 z=f(x,y) 의 적분이라 입력이 2.5D 여야 한다.
        참조가 실재하지 않으면 "이만큼 깎였다"가 아무도 재현할 수 없는 주장이 된다
        (422 UNKNOWN_ARTIFACT).


        `uncertaintyM3` 는 nullable **필수**이고, null 일 때 `uncertaintyNote` 가
        왜 없는지를 밝힌다(INV-024). 기본 엔진 ODM 에는 구조화된 GCP/RMSE 리포트가
        없어(ADR-KSI-012 D3) 이 값은 지금 항상 null 이며, 그 비율 자체가 상용 엔진
        전환 트리거의 계측점이다.


        같은 `volumeChangeId` 로 다른 내용을 올리면 409 다(원장은 append-only).
        같은 내용의 재전송은 201 로 멱등 처리된다.


        **이 표면은 재비행을 트리거하지 않는다** — 사실을 적을 뿐이다(ADR-KSI-016 D8).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/volume-change-report.v1.json
      responses:
        '201':
          description: RECORDED — durable 기록 성공(멱등 재전송 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolumeChangeResponse' }
        '404': { description: UNKNOWN_MISSION }
        '409': { description: DUPLICATE_REPORT_ID — 같은 id 로 다른 내용 }
        '422':
          description: >-
            UNKNOWN_ARTIFACT · ARTIFACT_KIND_MISMATCH(dsm 이 아님) ·
            계약 위반(net≠fill-cut, 자기 비교, uncertaintyNote 누락)
        '503': { description: STORE_UNAVAILABLE — journal 봉인, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
    get:
      summary: List volume-change reports for a mission (newest first)
      description: >-
        MISSIONS_READ 권한 필요. **리포트가 없으면 404 다** — 빈 목록을 주면
        "아직 계산 안 됨"과 "변화가 없음"을 소비자가 구분할 수 없다.


        `latestTotalNetM3` 는 최신 리포트의 전 구역 순변화를 서버가 계산해 싣는다 —
        화면이 구역 배열을 직접 합산하면 합산 규칙이 두 곳에 생기고, 한쪽만
        고쳐지는 순간 화면 숫자와 원장이 갈라진다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          required: false
          description: 최신부터 몇 건까지. 무제한 반환을 계약으로 굳히지 않는다.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 최신 우선 이력 + 최신 리포트의 총 순변화
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolumeChangeListView' }
        '404': { description: 해당 임무의 체적 변화 리포트가 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/comparison-policy:
    get:
      summary: Read the fixed thresholds this deployment actually computes with (W2)
      description: >-
        MISSIONS_READ 권한 필요. **읽기 전용** — 사용자가 화면에서 임계값을
        입력하지 않는다(대표자 확정, 2026-08-10: 시스템 고정값을 쓰되 결과·제출
        화면 양쪽에 "이 값을 썼다"를 반드시 표시한다). 화면이 숫자를 자기
        코드에 복제하면 계산 쪽이 바뀌어도 화면은 옛 숫자를 계속 말하고 그
        거짓말은 어느 화면에서도 보이지 않는다 — 그래서 이 표면이 있다. 여기서
        내려주는 값과 워커가 실제로 쓰는 값은 같은 모듈
        (ksi_event_contracts.comparison_policy)에서 나온다. 비교 요청은 생성
        시점에 이 값을 불변 스냅샷으로 굳혀 두므로(policy 필드), 이후 이 값이
        바뀌어도 이미 만들어진 요청·결과는 그대로다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 지금 쓰이는 기준값 한 벌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonPolicy' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/comparison-preflight:
    post:
      summary: Explain whether two epochs are quantitatively comparable
      description: >-
        MISSIONS_READ 권한 필요. 비교 생성과 **같은 서버 측 fail-closed 판정**을
        실행하지만 원장을 쓰지 않는다. 도메인상 비교 불가(예: ANALYSIS_NOT_READY,
        PROCESSING_PROFILE_MISMATCH, CRS_MISMATCH)는 HTTP 오류가 아니라
        `compatible=false`와 typed `reason`으로 반환한다. 존재하지 않거나 조직 밖인
        mission은 정보 비노출을 위해 404다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baselineJobId, currentJobId]
              properties:
                baselineJobId: { type: string, minLength: 1 }
                currentJobId: { type: string, minLength: 1 }
                zones:
                  type: [object, 'null']
                  additionalProperties: { type: object }
                zoneCrs: { type: [string, 'null'] }
      responses:
        '200':
          description: compatible=true or a typed incompatibility reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonPreflightResponse' }
        '404': { description: UNKNOWN_MISSION }
        '422': { description: request shape validation failed }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/comparison-requests:
    post:
      summary: Request that two completed processing-jobs be compared (W2)
      description: >-
        MISSIONS_ISSUE 권한 필요 — 재구성 발급과 같은 사람의 결정이다("무엇과
        무엇을 비교할지"를 지목하는 것). 실제 계산(점군 C2C·DSM 체적)과 그
        제출은 워커(PROCESSING_WORK)의 일이고, 이 표면은 그 계산을 요청만
        한다. baselineJobId·currentJobId 는 둘 다 SUCCEEDED 이고 같은 현장에
        속해야 하며 서로 달라야 한다. 요청 생성 시점에 각 작업의 등록된
        산출물(point_cloud·dsm)을 조회해 changeDetectionEligible/
        volumeChangeEligible 을 판정한다 — 둘 다 false 면(비교할 것이 없음)
        요청 자체를 거부한다(422 NOTHING_TO_COMPARE). zones 는 site AOI 를
        참조하지 않고 그 순간 넘긴 값 그대로 불변 스냅샷으로 저장된다(대표자
        확정, 2026-08-10) — 나중에 현장 경계가 바뀌어도 이미 만든 요청에는
        영향이 없다. 같은 baselineJobId+currentJobId 조합의 재요청은 새로
        만들지 않고 기존 요청을 그대로 돌려준다(ALREADY_REQUESTED, 멱등).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          description: currentJobId 가 속한 임무와 같아야 한다.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baselineJobId, currentJobId]
              properties:
                baselineJobId: { type: string, minLength: 1 }
                currentJobId: { type: string, minLength: 1 }
                zones:
                  description: >-
                    zoneId -> GeoJSON Polygon. 생략하면 체적 비교는 시도되지
                    않는다(점군 비교는 zones 없이도 가능하면 시도된다).
                  type: object
                  additionalProperties: { type: object }
                zoneCrs: { type: string, minLength: 1 }
      responses:
        '201':
          description: CREATED — verdict + 생성된 요청(status=QUEUED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestMutationResponse' }
        '200':
          description: ALREADY_REQUESTED — 같은 조합의 기존 요청을 그대로 반환(멱등 재요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestMutationResponse' }
        '404': { description: UNKNOWN_MISSION }
        '422':
          description: >-
            UNKNOWN_JOB / JOB_NOT_SUCCEEDED / SELF_COMPARISON / SITE_MISMATCH /
            MISSION_MISMATCH / NOTHING_TO_COMPARE / ANALYSIS_NOT_READY /
            PROCESSING_PROFILE_UNKNOWN / PROCESSING_PROFILE_MISMATCH /
            SOURCE_LINEAGE_GAP / CRS_MISMATCH / VERTICAL_REFERENCE_MISMATCH
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
    get:
      summary: List comparison requests for a mission (newest first)
      description: MISSIONS_READ 권한 필요. 그 임무의 비교 요청 이력.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 비교 요청 목록(없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/comparison-requests:
    get:
      summary: List comparison requests a worker may pick up — QUEUED + orphaned RUNNING (FIFO)
      description: >-
        PROCESSING_WORK 권한 필요 — **사람은 이 표면을 쓰지 않는다.**
        `GET /v1/processing-jobs` 와 동형(최소권한 — jobId/requestId 만 노출,
        임무·현장·비교 대상은 워커가 알 필요가 없다). QUEUED 뿐 아니라 lease
        가 만료된 RUNNING(죽은 워커가 쥐고 있던 요청)도 나온다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 후보 목록(없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingComparisonRequestListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음(사람 Role 포함) }
  /v1/comparison-requests/{request_id}:
    get:
      summary: Read one comparison request
      description: MISSIONS_READ 권한 필요.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 요청 1건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestView' }
        '404': { description: 해당 비교 요청을 찾을 수 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/comparison-requests/{request_id}/lease:
    post:
      summary: Acquire (or renew) the lease on a comparison request
      description: >-
        PROCESSING_WORK 권한 필요. 같은 워커의 재호출은 갱신(heartbeat) —
        `POST /v1/processing-jobs/{jobId}/lease` 와 동일 원자적 획득 규칙
        (JobLease 재사용, W1 이 실기동으로 검증한 패턴).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: LEASED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestMutationResponse' }
        '200':
          description: LEASE_RENEWED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestMutationResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409':
          description: LEASE_HELD_BY_ANOTHER / REQUEST_NOT_ACTIVE
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/comparison-requests/{request_id}/input:
    get:
      summary: Read presigned download URLs for this request's baseline/current artifacts
      description: >-
        PROCESSING_WORK 권한 + 그 요청의 lease 필요. **워커가 baseline/current
        원본을 읽는 유일한 경로다** — `GET /v1/processing-jobs/{jobId}/artifacts/
        {artifactId}/download` 는 MISSIONS_READ 전용이라 워커가 남의 작업의
        산출물을 그 표면으로 읽을 수 없다. 이 표면은 **그 요청이 가리키는
        산출물에 한해서만** presigned GET 을 내준다 — 다른 임의 작업의 산출물은
        여전히 못 본다(최소권한 유지).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: INPUT_READY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestInputResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409': { description: LEASE_REQUIRED / LEASE_HELD_BY_ANOTHER }
        '503': { description: STORAGE_UNAVAILABLE — Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/comparison-requests/{request_id}/transitions:
    post:
      summary: Transition a comparison request's status
      description: >-
        PROCESSING_WORK 권한 필요 — RUNNING/SUCCEEDED/FAILED 는 계산을 실제로
        돌린 주체만 아는 사실이다(사람이 결과를 손으로 주장할 수 없다는 것과
        같은 원칙). W2 는 CANCELLED 를 다루지 않는다(허용 전이표에 없음).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus]
              properties:
                targetStatus: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
                detail: { type: [string, 'null'] }
      responses:
        '200':
          description: TRANSITIONED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonRequestMutationResponse' }
        '404': { description: UNKNOWN_REQUEST }
        '409': { description: ILLEGAL_TRANSITION / LEASE_REQUIRED / LEASE_HELD_BY_ANOTHER }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/processing-jobs/{job_id}/artifacts/upload-url:
    post:
      summary: Issue a presigned PUT target for a reconstruction artifact's bytes
      description: >-
        PROCESSING_WORK 권한 + 그 작업의 lease 필요. 활성(QUEUED·RUNNING) 작업에만
        발급한다 — 끝난 작업에 바이트를 더 쓰면 종료가 쓰기 종료를 뜻하지 않게 된다.


        **객체 키를 요청이 정하지 않는다.** 요청 스키마에 자리가 없고 Core 가
        `sites/{siteId}/processing-jobs/{jobId}/artifacts/{artifactId}` 로 유도한다 —
        워커가 고를 수 있으면 워커 토큰 하나로 버킷의 임의 경로에 쓸 수 있다.
        키가 저장되지 않고 유도되므로 같은 (작업, 산출물)은 항상 같은 자리이고,
        재시도가 두 번째 사본을 만들지 않는다.


        **바이트는 Core 를 통과하지 않는다** — 포인트 클라우드는 GB 단위라 워커가
        presigned PUT 으로 스토리지에 직접 쓴다. 등록(POST .../artifacts)과 분리한
        이유는 등록이 계보를 원장에 박는 durable 행위이고 이건 아니기 때문이다:
        합치면 "올리다 실패한" 상태가 원장에 남는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artifactId, contentType]
              properties:
                artifactId: { type: string, minLength: 1 }
                contentType: { type: string, minLength: 1 }
                filename:
                  description: >-
                    다중 파일 산출물(mesh 등)의 부속 파일 자리를 받을 때만
                    채운다 — 생략·null 이면 주 파일 자리(기존 동작과 동일,
                    mesh-multi-file-artifact-persistence). 주 파일 키 아래
                    이 이름의 하위 키가 발급된다.
                  type: [string, 'null']
      responses:
        '201':
          description: UPLOAD_READY — 서버가 정한 objectKey 와 presigned uploadUrl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactUploadUrlResponse' }
        '404': { description: UNKNOWN_JOB }
        '409': { description: 'JOB_NOT_ACTIVE · LEASE_REQUIRED · LEASE_HELD_BY_ANOTHER' }
        '422': { description: 'INVALID_ARTIFACT_ID — 객체 키 세그먼트로 안전하지 않다' }
        '503': { description: STORAGE_UNAVAILABLE — presign 실패, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: PROCESSING_WORK 권한 없음 }
  /v1/processing-jobs/{job_id}/artifacts/{artifact_id}/download:
    get:
      summary: Get a presigned download URL for a registered artifact's bytes
      description: >-
        MISSIONS_READ 권한 필요 — 산출물은 임무의 결과물이다. 워커의
        PROCESSING_WORK 는 이를 포함하지 않는다(워커는 올릴 자리만 받는다).


        **원장에 등록된 산출물만 내준다.** 객체 키가 식별자에서 유도되므로 등록
        여부와 무관하게 계산은 되는데, 대조 없이 발급하면 존재하지 않는 자리의
        링크가 나가고 소비자는 스토리지에서 404 를 받는다 — 원인이 한 단계
        멀어진다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ARTIFACT_READY — objectKey 와 presigned downloadUrl
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactDownloadResponse' }
        '404': { description: ARTIFACT_NOT_FOUND — 이 작업에 그 산출물이 등록돼 있지 않다 }
        '422': { description: INVALID_ARTIFACT_ID }
        '503': { description: STORAGE_UNAVAILABLE — presign 실패, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/contract:
    get:
      summary: Get the stored signed Mission Contract verbatim (INV-011)
      description: >-
        MISSIONS_READ 권한 필요. 발급 시점 서명 계약 전문을 재계산·재서명 없이
        그대로 반환한다 — 발급 응답과 정확 일치해야 한다(INV-011).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: 저장된 서명 MissionContract(v1.2 또는 v1.3) }
        '404': { description: 해당 임무 레코드를 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/kmz:
    get:
      summary: Download the issued mission's KMZ file
      description: >-
        MISSIONS_READ **또는** EDGE_MISSION_KMZ_READ 권한 필요. 사람과 기체가 같은
        표면을 쓰되 범위가 다르다: 사람은 아무 임무의 KMZ 를, EDGE_DEVICE 는
        `assignedDeviceId` 가 자기인 임무 하나만 받는다. 불일치는 403 이 아니라
        **404** 다 — 403 은 "그 missionId 는 존재한다"를 알려주는 존재 오라클이라
        장비 토큰 하나로 임무 식별자 공간을 훑을 수 있게 된다(edge-sync 의
        cross-device 404 와 같은 관습). 배정이 아예 없는(assignedDeviceId=null)
        임무도 장비에게는 404 다.

        신규 라우트를 만들지 않고 기존 표면의 권한을 넓힌다:
        아래 4단 폴백·캐시·서명키가 한 클로저에 있어 두 번 배선하면 재생성 비용이
        두 배가 되고, 폴백 하나가 한쪽에만 남으면 같은 임무의 KMZ 가 사람이 받을
        때와 기체가 받을 때 달라진다.

        저장된 plan_request 로 매 조회마다 재생성해 반환한다
        (build_kmz 계열은 시각·난수·UUID 의존이 없어 재생성이 결정론적이다). 재생성
        sha256 이 레코드의 kmzSha256 과 다르면 그 바이트를 발급된 파일로 내려주지
        않는다 — 이 엔드포인트가 약속하는 것은 "발급 당시 그 파일"이다.

        **오브젝트 스토리지가 조립된 배포에서는 발급 시 KMZ 바이트를 보관한다.**
        재생성이 현재 정책으로 실패하거나 재생성 바이트가 원본과 다르면 그 보관본을
        내려준다 — 재생성은 그 파일을 얻는 수단이었지 목적이 아니다. 이 폴백이 없으면
        서버 안전상수 한 줄이 바뀌는 순간 그 이전 발급분 **전량**의 다운로드가 영구
        409 가 된다(risk kmz-regeneration-determinism-timebomb — phase-2 의
        captureIntervalM 필수화가 실제로 이 경로를 발화시켰다).

        스토리지 없는 조립은 지금까지처럼 재생성에만 의존하고 그 경우 409 가 그대로
        난다 — 응답 detail 이 "발급 시 바이트도 보관돼 있지 않다"를 밝힌다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: KMZ 바이트(Content-Disposition 로 결정론적 파일명 `{mission_id}.kmz`)
          content:
            application/vnd.google-earth.kmz:
              schema: { type: string, format: binary }
        '404':
          description: >-
            레코드 없음(일반 문구), KMZ 산출물이 없는 계약 단독 레코드, 또는
            EDGE_DEVICE 가 자기에게 배정되지 않은 임무를 요청함(셋이 같은 문구로
            접힌다 — 존재 오라클 차단).
        '409':
          description: >-
            저장된 요청으로 산출물을 더 이상 재현할 수 없고(정책 변경 또는 해시
            불일치) **보관된 원본 바이트도 없다**(오브젝트 스토리지 없는 조립).
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ·EDGE_MISSION_KMZ_READ 둘 다 없음 }
  /v1/missions/contracts:
    post:
      summary: Issue a signed Mission Contract (v1.2)
      description: >-
        구역별 실값(siteFrame·flightEnvelope·objectives·정책팩 ID)만 받고, 안전
        정책 상수(coverage 1.0/1.0·battery reserve 30%·evidence 3/5/10s·통신단절
        정책)는 서버가 FINAL_DECISION_LEDGER 값으로 고정한다 — 요청 바디에 그
        필드 자리가 없다(extra=forbid). 서명키 미주입 조립에서는 이 경로 자체가
        존재하지 않는다. MISSIONS_ISSUE 권한 필요(DEC-010 운영자 승인 — 발급은
        FIELD_OPERATOR/ADMIN). site 미존재·siteFrame 등록본 불일치·missionId
        충돌은 서명 **전** 거부되고(UNKNOWN_SITE/SITE_FRAME_MISMATCH/
        MISSION_ID_CONFLICT — 등록 좌표계와 어긋난 계약 발급 차단, ADR-KSI-007),
        durable 기록 성공 후에만 201 이다(ADR-KSI-008 §3 — 고아 발급 금지).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                MissionIssuanceRequest(mission_issuance.py) 필드와 정확 대응 —
                안전 정책 상수(coveragePolicy 1.0/1.0·batteryPolicy·
                communicationLossPolicy·unknownObstaclePolicy·evidencePolicy)
                는 요청 바디에 자리가 없다(서버 고정, extra=forbid).
              required:
                - missionId
                - siteId
                - missionType
                - siteFrame
                - flightEnvelope
                - objectives
                - viewpointPolicyId
                - riskPolicyPackId
                - fallbackPolicyId
                - capturePolicyId
              properties:
                missionId: { type: string, minLength: 1 }
                siteId: { type: string, minLength: 1 }
                missionType:
                  enum:
                    - UNIFIED_SITE_SURVEY
                    - BASELINE_MAPPING
                    - SPATIAL_REFRESH
                    - AUTONOMOUS_PATROL
                    - ASSET_INSPECTION
                    - PROGRESS_CAPTURE
                    - INCIDENT_SURVEY
                    - SURVEY_GRADE_MAPPING
                siteFrame:
                  type: object
                  additionalProperties: false
                  required: [crs, verticalDatum, unit, transformVersion]
                  properties:
                    crs: { type: string }
                    verticalDatum: { type: string }
                    unit: { const: meter }
                    transformVersion: { type: string }
                  description: 등록된 site 의 것과 정확 일치해야 한다(SITE_FRAME_MISMATCH).
                flightEnvelope:
                  type: object
                  additionalProperties: false
                  required: [allowedVolumes, excludedVolumes, minAltitudeM, maxAltitudeM]
                  properties:
                    allowedVolumes: { type: array, items: { type: string } }
                    excludedVolumes: { type: array, items: { type: string } }
                    minAltitudeM: { type: number }
                    maxAltitudeM: { type: number, maximum: 150 }
                    minimumStructureStandoffM: { type: number }
                    minimumPersonStandoffM: { type: number }
                    altitudeReference:
                      enum: [relativeToStartPoint]
                      nullable: true
                  description: >-
                    altitudeReference 는 요청과 무관하게 서버가
                    relativeToStartPoint 로 고정한다(2026-07-29 대표자 확정).
                    보내도 거부하지는 않지만 **무시된다** — 서명 계약에 실리는
                    값은 항상 서버가 정한 값이다.
                objectives: { type: array, items: { type: string }, minItems: 1 }
                viewpointPolicyId: { type: string, minLength: 1 }
                riskPolicyPackId: { type: string, minLength: 1 }
                fallbackPolicyId: { type: string, minLength: 1 }
                capturePolicyId: { type: string, minLength: 1 }
                accessibleGeneralCoverage: { type: number, minimum: 0.95, maximum: 1.0 }
                artifacts:
                  type: object
                  additionalProperties: false
                  properties:
                    worldModelManifestId: { type: [string, 'null'] }
                    modelPackId: { type: [string, 'null'] }
                    calibrationProfileId: { type: [string, 'null'] }
                validForHours:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 168
                  description: 기본 24 — 7일(168시간) 상한(무기한 계약 발급 방지).
                assignedDeviceId:
                  type: [string, 'null']
                  minLength: 1
                  description: >-
                    이 임무를 수행할 장비(INV-010). **서명된 계약에는 실리지
                    않는다** — Core 가 커버리지 보고 수신 시 대조하는 운영
                    메타데이터일 뿐이다. 생략하면 배정을 신고하지 않은 것이고,
                    그 임무는 인증된 어느 EDGE_DEVICE 든 커버리지를 보고할 수
                    있다(하위호환).
      responses:
        '201': { description: 설정된 writer 버전의 서명 MissionContract(v1.2 또는 v1.3) }
        '422':
          description: >-
            구조 위반(필드 누락·범위 밖·validForHours>168) / UNKNOWN_SITE /
            SITE_FRAME_MISMATCH
        '409': { description: MISSION_ID_CONFLICT }
        '503': { description: STORE_UNAVAILABLE — durable 기록 실패, 산출물 미반환 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /v1/missions/plans:
    post:
      summary: Issue the dual mission artifacts — WPML/KMZ + signed contract (ADR-KSI-007)
      description: >-
        AOI 폴리곤+임무타입 한 요청이 두 산출물을 짝으로 낳는다 — 기체용
        WPML/KMZ(base64)와 Manifold 용 서명 계약. 경로 고도·이륙 안전고도는
        같은 요청의 flightEnvelope 로 게이트되어 어긋난 쌍이 성립할 수 없다.
        임무타입→패턴: 매핑 계열=lawnmower(spacingM·captureIntervalM 필수)·순찰 계열=perimeter·
        그 외(ASSET_INSPECTION 등)=422 거부(조용한 퇴화 금지). droneEnumValue 는
        호출자가 명시한다(M4D 값은 실기 H4 검증 전 서버가 추측하지 않는다). KMZ
        에는 계약과의 짝 식별자(contractSha256 등, wpmz/res/ksi-mission-pair.json)
        가 동봉된다(ADR-KSI-007 '동일 site_frame·policy_version 짝'의 실체화).
        MISSIONS_ISSUE 권한 필요 — site 미존재·missionId 충돌은 경로 생성·서명
        **전** 거부되고, durable 기록 성공 후에만 201 이다(ADR-KSI-008 §3).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contract, aoi, route, drone, wayline]
              properties:
                workOrderId:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >-
                    같은 organization·Site의 APPROVED WorkOrder 현재 회차. 선택이며
                    Mission 발급 레코드와 AcquisitionRun에 운영 계보로 남고 서명
                    Mission Contract payload에는 들어가지 않는다.
                contract:
                  type: object
                  additionalProperties: false
                  required:
                    - missionId
                    - siteId
                    - missionType
                    - siteFrame
                    - flightEnvelope
                    - objectives
                    - viewpointPolicyId
                    - riskPolicyPackId
                    - fallbackPolicyId
                    - capturePolicyId
                  properties:
                    missionId: { type: string, minLength: 1 }
                    siteId: { type: string, minLength: 1 }
                    missionType: { type: string }
                    siteFrame:
                      type: object
                      additionalProperties: false
                      required: [crs, verticalDatum, unit, transformVersion]
                      properties:
                        crs: { type: string }
                        verticalDatum: { type: string }
                        unit: { const: meter }
                        transformVersion: { type: string }
                    flightEnvelope:
                      type: object
                      additionalProperties: false
                      required: [allowedVolumes, excludedVolumes, minAltitudeM, maxAltitudeM]
                      properties:
                        allowedVolumes: { type: array, items: { type: string } }
                        excludedVolumes: { type: array, items: { type: string } }
                        minAltitudeM: { type: number }
                        maxAltitudeM: { type: number, maximum: 150 }
                        minimumStructureStandoffM: { type: number }
                        minimumPersonStandoffM: { type: number }
                        altitudeReference:
                          enum: [relativeToStartPoint]
                          nullable: true
                    objectives: { type: array, items: { type: string }, minItems: 1 }
                    viewpointPolicyId: { type: string, minLength: 1 }
                    riskPolicyPackId: { type: string, minLength: 1 }
                    fallbackPolicyId: { type: string, minLength: 1 }
                    capturePolicyId: { type: string, minLength: 1 }
                    accessibleGeneralCoverage: { type: number, minimum: 0.95, maximum: 1.0 }
                    validForHours: { type: number, exclusiveMinimum: 0, maximum: 168 }
                    artifacts:
                      # 구현(MissionIssuanceRequest.artifacts)이 수용하는 선택 필드 —
                      # additionalProperties:false 에서 누락되면 스펙 준수 클라이언트가
                      # 정당한 요청을 못 만든다(재검증 V2 P3).
                      type: object
                      additionalProperties: false
                      properties:
                        worldModelManifestId: { type: [string, 'null'] }
                        modelPackId: { type: [string, 'null'] }
                        calibrationProfileId: { type: [string, 'null'] }
                    assignedDeviceId:
                      type: [string, 'null']
                      minLength: 1
                      description: POST /v1/missions/contracts 의 같은 필드와 동일(INV-010).
                aoi:
                  type: object
                  additionalProperties: false
                  required: [vertices]
                  description: >-
                    닫힌 단순 폴리곤(마지막→첫 꼭짓점 변이 암묵적으로 닫는다,
                    3~256 꼭짓점).
                  properties:
                    vertices:
                      type: array
                      minItems: 3
                      items:
                        type: object
                        additionalProperties: false
                        required: [latDeg, lonDeg]
                        properties:
                          latDeg: { type: number, minimum: -90, maximum: 90 }
                          lonDeg: { type: number, minimum: -180, maximum: 180 }
                route:
                  type: object
                  additionalProperties: false
                  required: [altitudeM]
                  properties:
                    altitudeM: { type: number }
                    camera:
                      type: object
                      additionalProperties: false
                      required: [sensorWidthMm, focalLengthMm, imageWidthPx, imageHeightPx]
                      description: >-
                        **권장 경로** — 주면 서버가 카메라·고도·중복도로 spacingM·
                        captureIntervalM 을 계산하고, 계산 근거를 응답 gridBasis 로
                        돌려준다. 간격을 직접 적으면 서버는 그 값이 적정한지 판단할
                        근거가 없다(ADR-KSI-011 D2). camera 와 spacingM/
                        captureIntervalM 을 함께 주면 422 — 어느 쪽이 진짜인지
                        서버가 고르지 않는다.
                        imageWidthPx 는 across-track(라인 간격), imageHeightPx 는
                        along-track(사진 간격)이다(nadir·landscape 표준 배치).
                      properties:
                        sensorWidthMm: { type: number, exclusiveMinimum: 0 }
                        focalLengthMm: { type: number, exclusiveMinimum: 0 }
                        imageWidthPx: { type: integer, minimum: 1 }
                        imageHeightPx: { type: integer, minimum: 1 }
                        frontOverlap:
                          type: number
                          minimum: 0.6
                          exclusiveMaximum: 1.0
                          default: 0.8
                          description: 진행방향 중복도. 0.6 미만은 재구성 불성립이라 422.
                        sideOverlap:
                          type: number
                          minimum: 0.5
                          exclusiveMaximum: 1.0
                          default: 0.7
                          description: 라인 간 중복도. 0.5 미만은 422.
                    spacingM:
                      type: number
                      description: >-
                        lawnmower(매핑) 계열 — camera 를 주지 않을 때만 필수(측면
                        간격, m). 고도×1.5 를 넘으면 422.
                    captureIntervalM:
                      type: number
                      minimum: 0.1
                      description: >-
                        lawnmower(매핑) 계열 필수 — 진행방향 촬영 간격 상한(m).
                        없으면 스캔선당 사진이 양 끝 2장뿐이라 전방 중첩이 0 이 되어
                        정사영상·3D 재구성이 성립하지 않는다(422 거부).
                    sweepDirectionDeg:
                      type: number
                      description: 수학 규약(동=0·반시계, 도) — 나침반 방위 아님
                drone:
                  type: object
                  additionalProperties: false
                  required: [droneEnumValue, droneSubEnumValue, payloadEnumValue]
                  properties:
                    droneEnumValue: { type: integer }
                    droneSubEnumValue: { type: integer }
                    payloadEnumValue: { type: integer }
                    payloadSubEnumValue:
                      type: integer
                      default: 0
                      description: WPML payload sub-profile. Omit to use the device profile default.
                    payloadPositionIndex: { type: integer, enum: [0, 1, 2] }
                wayline:
                  type: object
                  additionalProperties: false
                  required: [autoFlightSpeedMs, takeoffSecurityHeightM, globalTransitionalSpeedMs]
                  properties:
                    autoFlightSpeedMs: { type: number, exclusiveMinimum: 0 }
                    # 하한 1.2 = WPML 공식 스펙 유효범위 [1.2, 1500] — 구현 상수
                    # _MIN_TAKEOFF_SECURITY_HEIGHT_M 과 동일 근거(재검증 V2 P2:
                    # 문서 1.5 vs 구현 1.2 이중 SSOT 해소).
                    takeoffSecurityHeightM: { type: number, minimum: 1.2, maximum: 1500 }
                    globalTransitionalSpeedMs: { type: number, exclusiveMinimum: 0, maximum: 15 }
                derivedFrom:
                  type: object
                  additionalProperties: false
                  required: [sourceMissionId, changeRegionSetId, regionId]
                  description: >-
                    재관측 임무의 계보(ADR-KSI-019 G5) — 이 임무가 어느 변화 영역
                    분석에서 나왔는가. **서명 계약의 일부가 아니다** —
                    assignedDeviceId·kmzSha256 과 같은 지위의 운영 메타데이터로
                    planRequest 에만 실려 영속된다. 값의 실재를 발급 시점에
                    대조하지 않는다(변화영역 리포트는 별도 보관 정책을 탄다).
                    최초 매핑 임무는 이 필드가 없다 — 선택이다.
                  properties:
                    sourceMissionId: { type: string, minLength: 1 }
                    changeRegionSetId: { type: string, minLength: 1 }
                    regionId: { type: string, minLength: 1 }
                    captureGrade:
                      type: [string, 'null']
                      enum: [STANDARD, DETAILED, INTENSIVE, null]
                      description: 초안이 제안한 촬영 등급. 운영자가 값을 고쳐도 이 필드는 그대로 남는다.
      responses:
        '201':
          description: 이원 산출물 짝
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract:
                    description: 설정된 writer 버전의 서명 MissionContract
                    oneOf:
                      - $ref: ../schemas/mission-contract.v1.2.json
                      - $ref: ../schemas/mission-contract.v1.3.json
                  kmzBase64: { type: string, description: KMZ(zip) base64 }
                  kmzSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  routePattern: { type: string, enum: [lawnmower, perimeter] }
                  waypointCount: { type: integer, minimum: 2 }
                  plannedCoverageRatio:
                    type: [number, 'null']
                    description: >-
                      **비행 전 계획 추정치**(CameraSpec에서 서버가 계산한 lawnmower만,
                      perimeter와 직접 spacing lawnmower는 null). 각 스캔선이
                      camera-derived footprint/overlap으로 뒷받침될 때의 스와스∩AOI
                      정확값이다 — 실제로 무엇을 관찰했는지는 날아본 기체만 안다.
                      **완료 판정의 권위가 아니다**: 그건 비행 후 CoverageReport
                      (POST /v1/missions/{mission_id}/coverage-report)가 소유하며
                      INV-010 의 세 조항 전부를 그쪽이 판정한다(MASTER_PRD §15.5).
                      이 값은 "계획이 애초에 요구를 겨냥하는가"의 사전 점검 결과이고,
                      계약 요구 미만이면 발급이 거부된다
                      (COVERAGE_BELOW_CONTRACT_PROMISE).
                  gridBasis:
                    type: [object, 'null']
                    additionalProperties: false
                    description: >-
                      **왜 이 간격이 나왔는가** — route.camera 로 계산했을 때만
                      실린다(간격을 직접 지정하면 null). 숫자만 남기면 다음 사람이
                      그 값을 다시 검증할 수 없다.
                    properties:
                      spacingM: { type: number }
                      captureIntervalM: { type: number }
                      gsdM: { type: number, description: 지상표본거리(m/px) }
                      footprintAcrossM: { type: number }
                      footprintAlongM: { type: number }
        '422':
          description: >-
            경로 생성 불가(봉투 밖 고도·이륙안전고도·spacing/camera 누락·
            camera 와 spacingM 동시 지정·중복도 하한 미달·미지원 타입) /
            UNKNOWN_SITE / SITE_FRAME_MISMATCH / COVERAGE_BELOW_CONTRACT_PROMISE
        '409': { description: MISSION_ID_CONFLICT }
        '503': { description: STORE_UNAVAILABLE — durable 기록 실패, 산출물 미반환 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /sites/{siteId}/missions:
    x-status: planned
    post:
      summary: Create a mission request (S3+ Wizard 추상화 — 미구현 설계)
      description: >-
        S3+ 대시보드 Wizard 가 아이템(target/outcomes/intensity)에서 Mission
        Contract 생성을 대행하는 추상화 스케치다 — 현재 실경로는
        POST /v1/missions/plans 를 대시보드가 직접 호출한다(ADR-KSI-008 비범위).
      parameters:
        - in: path
          name: siteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, outcomes, intensity]
              properties:
                target: { type: object }
                outcomes:
                  type: array
                  items: { type: string }
                intensity:
                  enum: [FAST, STANDARD, PRECISE]
      responses:
        '202': { description: Mission planning accepted }
  /v1/processing-jobs/{job_id}/artifacts/{artifact_id}/checkpoint-validations:
    post:
      summary: Register an independently acquired checkpoint CSV for one immutable DSM
      description: >-
        SITES_WRITE 권한 필요. 등록은 업로더의 선언과 서버가 정한 업로드 위치를
        원장에 결속할 뿐, RMSE를 받지 않고 CSV 바이트도 읽지 않는다. `declared`는
        파일 hash·크기·CRS·수직기준과 **처리와 독립적으로 취득했다는 true attestation**
        을 포함해야 한다. 검증은 SEALED 뒤 PROCESSING_WORK worker가 원본 DSM과 CSV
        bytes를 각각 재해싱하고 전 검사점을 nearest-pixel-center로 샘플한 뒤에만
        Core가 기록한다. registration feature flag가 꺼진 배포는 403
        REGISTRATION_DISABLED로 새 등록만 막고, 기존 검증 조회/worker 표면은 보존한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string } }
        - { in: path, name: artifact_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckpointValidationRegisterRequest' }
      responses:
        '201':
          description: REGISTERED — server-selected CSV object key and presigned PUT issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '200':
          description: ALREADY_REGISTERED may issue a fresh upload URL before seal; ALREADY_SEALED never reissues PUT access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '403': { description: SITES_WRITE permission required or REGISTRATION_DISABLED }
        '404': { description: Job or artifact is absent or outside the principal organization }
        '409': { description: Job is not SUCCEEDED, another validation is active, or a VALIDATED result already exists }
        '422': { description: Invalid declaration, non-DSM artifact, or immutable DSM CRS/vertical reference mismatch }
        '503': { description: Journal or presigned-upload issuance unavailable; Retry-After }
  /v1/checkpoint-validations/{validation_id}/seal:
    post:
      summary: Seal the checkpoint CSV declaration after direct object upload
      description: >-
        SITES_WRITE 권한 필요. 이 호출도 CSV bytes를 읽지 않는다. SEALED는 파일이
        존재하거나 선언과 일치한다는 뜻이 아니라 trusted worker가 검증할 수 있도록
        선언을 더 이상 바꾸지 않는다는 원장 상태다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: validation_id, required: true, schema: { type: string } }
      responses:
        '201':
          description: SEALED — worker validation queue admission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '200':
          description: ALREADY_SEALED or ALREADY_JUDGED (idempotent terminal response)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '404': { description: Validation absent or outside the principal organization }
        '503': { description: Durable journal unavailable; Retry-After }
        '401': { description: Authentication failed }
        '403': { description: SITES_WRITE permission required }
  /v1/processing-jobs/{job_id}/checkpoint-validations:
    get:
      summary: List checkpoint validation records visible for one processing job
      description: >-
        SITES_READ 권한 필요. REGISTERED·SEALED·VALIDATED·REJECTED를 숨기지 않으며,
        VALIDATED가 현장 독립성의 물리적 수용을 증명한다는 의미는 아니다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Organization-scoped validation records in deterministic registration order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationListResponse' }
        '401': { description: Authentication failed }
        '403': { description: SITES_READ permission required }
  /v1/checkpoint-validations/{validation_id}:
    get:
      summary: Read one organization-scoped checkpoint validation record
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: validation_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Checkpoint validation record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '401': { description: Authentication failed }
        '403': { description: SITES_READ permission required }
        '404': { description: Validation absent or outside the principal organization }
  /v1/checkpoint-validations:
    get:
      summary: List SEALED checkpoint validations for trusted processing workers
      description: >-
        PROCESSING_WORK 권한 필요. `status=SEALED`만 허용하며, worker는 다운로드
        URL과 immutable DSM CRS/snapshot만 받고 업로더의 checksum이나 RMSE를
        되읊어 통과할 수 있는 선언값은 받지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, default: SEALED }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: FIFO SEALED candidates; entries whose presigned URL cannot be issued are omitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingCheckpointValidationListResponse' }
        '422': { description: status is not SEALED }
        '401': { description: Authentication failed }
        '403': { description: PROCESSING_WORK permission required }
  /v1/checkpoint-validations/{validation_id}/observations:
    post:
      summary: Submit trusted worker measurements; Core compares them to immutable CSV/DSM declarations
      description: >-
        PROCESSING_WORK 권한 필요. Worker는 실측 digest·DSM CRS·잔차 통계만 보낸다.
        `measuredAt`와 `measuredBy`는 요청자가 정하지 못하고 Core가 server time과
        authenticated worker identity로 채운다. Core는 mismatch를 REJECTED로 기록하고
        worker가 VALIDATED 판정을 직접 선언할 수 없다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: validation_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckpointValidationObservationRequest' }
      responses:
        '201':
          description: VALIDATED after Core immutable-snapshot comparison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '200':
          description: ALREADY_JUDGED (idempotent terminal response)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '404': { description: Validation absent or outside the worker organization }
        '409': { description: NOT_SEALED or a VALIDATED result already exists for the DSM }
        '422':
          description: REJECTED after immutable digest/CRS mismatch, or INVALID_MEASUREMENT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '503': { description: Durable journal unavailable; Retry-After }
        '401': { description: Authentication failed }
        '403': { description: PROCESSING_WORK permission required }
  /v1/checkpoint-validations/{validation_id}/verification-failure:
    post:
      summary: Record a typed trusted-worker failure before residual measurement is possible
      description: >-
        PROCESSING_WORK 권한 필요. 허용되는 failure reason은 strict CSV parsing,
        missing sealed object, byte-size, point-count, CRS, outside/nodata, DSM
        readability/support에 한정된다. 임의의
        "정확도 부족" 또는 client RMSE는 이 표면으로 기록할 수 없다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: validation_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckpointValidationFailureRequest' }
      responses:
        '200':
          description: ALREADY_JUDGED (idempotent terminal response)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '404': { description: Validation absent or outside the worker organization }
        '409': { description: NOT_SEALED }
        '422':
          description: REJECTED with a permitted typed worker failure, or invalid request/reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointValidationResponse' }
        '503': { description: Durable journal unavailable; Retry-After }
        '401': { description: Authentication failed }
        '403': { description: PROCESSING_WORK permission required }
components:
  # ── 응답 본문 스키마 ───────────────────────────────────────────────────────
  #
  # 여기 적힌 **필드 집합**은 test_api_contract_sync.py 가 실구현(FastAPI 가
  # Pydantic 모델에서 생성하는 openapi)과 이름 단위로 대조한다. 필드를 더하거나
  # 빼면 구현이든 문서든 한쪽만 바뀐 순간 게이트가 실패한다.
  #
  # 왜 구현에서 자동 생성하지 않는가: 계약을 구현의 사본으로 만들면 drift 는
  # 정의상 0 이 되지만 게이트도 같이 무의미해진다. 이 파일은 "사람이 승인한
  # 의도"고, 대조의 의미는 그 의도와 구현이 갈라졌는지를 묻는 데 있다.
  #
  # 타입은 구현의 정밀도까지 복제하지 않는다(대조 대상은 필드 이름과 필수 여부다)
  # — 자유 형태 payload(bundle·transitions·siteFrame)는 계약상으로도 자유
  # 형태이고, 그 내부 구조의 정본은 contracts/schemas/*.json 이다.
  schemas:
    AcquisitionDeploymentProfileV1:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, siteId, operatingMode, gatewayKind, gatewayTransports,
         internetGate, manifoldDirectMode, routingPolicy, mediaPolicy, msdkBridgeMode,
         edgeDeviceId, gatewayDeviceId]
      properties:
        schemaVersion: { const: '1.0' }
        siteId: { type: string, minLength: 1, maxLength: 200 }
        operatingMode: { enum: [RC_ATTENDED, DOCK_AUTOMATED] }
        gatewayKind: { enum: [RC_PLUS_2, DOCK_3] }
        gatewayTransports:
          type: array
          items: { enum: [WIFI, CELLULAR, ETHERNET] }
        internetGate: { const: REQUIRED_FOR_MISSION_ISSUE }
        manifoldDirectMode: { enum: [DISABLED, CONNECTIVITY_ADD_ON] }
        routingPolicy: { enum: [RC_STANDARD, ROLE_SPLIT_DIRECT_EDGE] }
        mediaPolicy: { const: RESULTS_IMMEDIATE_RAW_POSTFLIGHT }
        msdkBridgeMode: { enum: [DISABLED, CONDITIONAL_PREFLIGHT_POSTFLIGHT] }
        edgeDeviceId: { type: string, minLength: 1, maxLength: 200 }
        gatewayDeviceId: { type: string, minLength: 1, maxLength: 200 }
    CapabilityReceiptV1:
      type: object
      additionalProperties: false
      required: [capability, hardwareModel, firmwareVersion, status, checkedAt, evidenceRef]
      properties:
        capability:
          enum: [WAYLINE_DELIVERY, EDGE_DOWNLINK, EDGE_UPLINK, MEDIA_PULL, MEDIA_UPLOAD]
        hardwareModel: { type: string, minLength: 1, maxLength: 100 }
        firmwareVersion: { type: string, minLength: 1, maxLength: 100 }
        status: { enum: [NOT_VERIFIED, VERIFIED, BLOCKED] }
        checkedAt: { type: string, format: date-time }
        evidenceRef: { type: [string, 'null'], maxLength: 500 }
    ConnectivitySnapshotV1:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, snapshotId, siteId, gatewayDeviceId, edgeDeviceId, observedAt,
         expiresAt, transport, internetReachable, gatewayState, edgeState, directEdgeState,
         queuedEventCount, queuedMediaCount, lastSuccessReceiptId, missionContractSync,
         rawMediaSync, capabilities]
      properties:
        schemaVersion: { const: '1.0' }
        snapshotId: { type: string, minLength: 1, maxLength: 200 }
        siteId: { type: string, minLength: 1, maxLength: 200 }
        gatewayDeviceId: { type: string, minLength: 1, maxLength: 200 }
        edgeDeviceId: { type: string, minLength: 1, maxLength: 200 }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        transport: { enum: [WIFI, CELLULAR, ETHERNET] }
        internetReachable: { type: boolean }
        gatewayState: { enum: [CONNECTED, DISCONNECTED, UNKNOWN] }
        edgeState: { enum: [CONNECTED, DISCONNECTED, UNKNOWN] }
        directEdgeState: { enum: [DISABLED, CONNECTED, DISCONNECTED, UNKNOWN] }
        queuedEventCount: { type: integer, minimum: 0 }
        queuedMediaCount: { type: integer, minimum: 0 }
        lastSuccessReceiptId: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        missionContractSync: { enum: [NOT_STARTED, PENDING, ACTIVATED, COMPLETE, FAILED] }
        rawMediaSync: { enum: [NOT_STARTED, PENDING, ACTIVATED, COMPLETE, FAILED] }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/CapabilityReceiptV1' }
    AcquisitionReadinessView:
      type: object
      additionalProperties: false
      required:
        [siteId, status, readyForMissionIssue, reasons, evaluatedAt, profile,
         connectivity, inFlightContractPolicy]
      properties:
        siteId: { type: string }
        status:
          enum: [READY, PROFILE_MISSING, DOCK_ADAPTER_NOT_IMPLEMENTED,
                 CONNECTIVITY_MISSING, CONNECTIVITY_STALE, GATEWAY_OFFLINE,
                 INTERNET_REQUIRED, DEVICE_MISMATCH, TRANSPORT_NOT_ALLOWED,
                 CAPABILITY_NOT_VERIFIED]
        readyForMissionIssue: { type: boolean }
        reasons: { type: array, items: { type: string } }
        evaluatedAt: { type: string, format: date-time }
        profile:
          oneOf:
            - $ref: '#/components/schemas/AcquisitionDeploymentProfileV1'
            - { type: 'null' }
        connectivity:
          oneOf:
            - $ref: '#/components/schemas/ConnectivitySnapshotV1'
            - { type: 'null' }
        inFlightContractPolicy: { const: REMAINS_VALID_UNTIL_CONTRACT_EXPIRY }
    GatewayOperationReceiptRequest:
      type: object
      additionalProperties: false
      required:
        [receiptId, idempotencyKey, siteId, missionId, capability, transport,
         outcome, artifactDigest, observedAt]
      properties:
        schemaVersion: { const: '1.0', default: '1.0' }
        receiptId: { type: string, minLength: 1, maxLength: 200 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 300 }
        siteId: { type: string, minLength: 1, maxLength: 200 }
        missionId: { type: string, minLength: 1, maxLength: 200 }
        capability:
          enum: [WAYLINE_DELIVERY, EDGE_DOWNLINK, EDGE_UPLINK, MEDIA_PULL, MEDIA_UPLOAD]
        transport: { enum: [WIFI, CELLULAR, ETHERNET] }
        outcome: { enum: [SUCCEEDED, FAILED] }
        artifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        observedAt: { type: string, format: date-time }
    GatewayOperationReceiptV1:
      type: object
      additionalProperties: false
      required:
        [receiptId, idempotencyKey, siteId, missionId, capability, transport,
         outcome, artifactDigest, observedAt, organizationId, gatewayDeviceId,
         receivedAt]
      properties:
        schemaVersion: { const: '1.0', default: '1.0' }
        receiptId: { type: string, minLength: 1, maxLength: 200 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 300 }
        siteId: { type: string, minLength: 1, maxLength: 200 }
        missionId: { type: string, minLength: 1, maxLength: 200 }
        capability:
          enum: [WAYLINE_DELIVERY, EDGE_DOWNLINK, EDGE_UPLINK, MEDIA_PULL, MEDIA_UPLOAD]
        transport: { enum: [WIFI, CELLULAR, ETHERNET] }
        outcome: { enum: [SUCCEEDED, FAILED] }
        artifactDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        observedAt: { type: string, format: date-time }
        organizationId: { type: string, minLength: 1, maxLength: 200 }
        gatewayDeviceId: { type: string, minLength: 1, maxLength: 200 }
        receivedAt: { type: string, format: date-time }
    AcquisitionMissionProgressView:
      type: object
      additionalProperties: false
      required: [missionId, issued, executionStatus]
      properties:
        missionId: { type: [string, 'null'] }
        issued: { type: boolean }
        executionStatus: { type: [string, 'null'] }
    AcquisitionGatewayProgressView:
      type: object
      additionalProperties: false
      required: [latestReceipt, succeededCapabilities, failedCapabilities]
      properties:
        latestReceipt:
          oneOf:
            - $ref: '#/components/schemas/GatewayOperationReceiptV1'
            - { type: 'null' }
        succeededCapabilities:
          type: array
          items:
            enum: [WAYLINE_DELIVERY, EDGE_DOWNLINK, EDGE_UPLINK, MEDIA_PULL, MEDIA_UPLOAD]
        failedCapabilities:
          type: array
          items:
            enum: [WAYLINE_DELIVERY, EDGE_DOWNLINK, EDGE_UPLINK, MEDIA_PULL, MEDIA_UPLOAD]
    AcquisitionContractProgressView:
      type: object
      additionalProperties: false
      required: [state, activatedAt]
      properties:
        state: { enum: [NOT_ISSUED, PENDING, ACTIVATED] }
        activatedAt: { type: [string, 'null'], format: date-time }
    AcquisitionMediaProgressView:
      type: object
      additionalProperties: false
      required: [state, itemCount, sourceBundleDigest]
      properties:
        state: { enum: [NOT_STARTED, SYNCING, VERIFYING, VERIFIED] }
        itemCount: { type: integer, minimum: 0 }
        sourceBundleDigest: { type: [string, 'null'] }
    AcquisitionProcessingProgressView:
      type: object
      additionalProperties: false
      required: [state, jobIds]
      properties:
        state: { enum: [NOT_STARTED, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        jobIds: { type: array, items: { type: string } }
    ObservationEpochView:
      description: >-
        WorkOrder 회차에서 결정적으로 파생한 v1 Observation Epoch. v1은
        한 회차=한 sortie=한 Mission이고, 새 mutable 원장이 아니다.
      type: object
      additionalProperties: false
      required:
        [epochId, workOrderId, cycleNumber, missionId, maxCaptureSpanSeconds,
         temporalPolicySchemaVersion, captureWindowStatus, capturedFrom, capturedTo]
      properties:
        epochId: { type: string }
        workOrderId: { type: string }
        cycleNumber: { type: integer, minimum: 1 }
        missionId: { type: [string, 'null'] }
        sortieCount: { const: 1, default: 1 }
        maxCaptureSpanSeconds: { type: [integer, 'null'], minimum: 1, maximum: 86400 }
        temporalPolicySchemaVersion: { type: [string, 'null'], pattern: '^1\.0$' }
        captureWindowStatus: { type: string, enum: [COMPLETE, INCOMPLETE, CONFLICT] }
        capturedFrom: { type: [string, 'null'], format: date-time }
        capturedTo: { type: [string, 'null'], format: date-time }
    AnalysisReadinessView:
      description: >-
        Coverage·촬영 품질·원본 무결성·capture-time·temporal policy·처리 계보에서
        파생한 분석 준비 판정이다. 비행 상태도, Edge가 직접 확정할 수 있는 상태도 아니다.
      type: object
      additionalProperties: false
      required: [status, ready, detail, epoch, evidenceRefs, evaluatedAt]
      properties:
        status:
          enum:
            [EVIDENCE_NOT_ASSEMBLED, WAITING_MISSION, WAITING_COVERAGE, COVERAGE_GAP,
             WAITING_CAPTURE_QUALITY, CAPTURE_QUALITY_GAP, WAITING_MEDIA,
             INTEGRITY_GAP, CAPTURE_TIME_INCOMPLETE, TEMPORAL_POLICY_UNDECLARED,
             TEMPORAL_COHERENCE_GAP, WAITING_PROCESSING, PROCESSING_FAILED, READY]
        ready: { type: boolean }
        detail: { type: string }
        epoch: { $ref: '#/components/schemas/ObservationEpochView' }
        evidenceRefs: { type: array, items: { type: string } }
        evaluatedAt: { type: string, format: date-time }
    AcquisitionProgressView:
      type: object
      additionalProperties: false
      required:
        [runId, workOrderId, siteId, cycleNumber, stage, nextAction, detail,
         readiness, mission, gateway, contractActivation, media, processing,
         evaluatedAt, inFlightContractPolicy]
      properties:
        schemaVersion: { const: '1.0', default: '1.0' }
        runId: { type: [string, 'null'] }
        workOrderId: { type: string }
        siteId: { type: string }
        cycleNumber: { type: integer, minimum: 1 }
        stage:
          enum: [WAITING_READINESS, WAITING_PLAN, MISSION_ISSUED, WAYLINE_PENDING,
                 CONTRACT_PENDING, READY_FOR_FLIGHT, MEDIA_SYNCING, MEDIA_VERIFYING,
                 PROCESSING, REVIEW_READY, BLOCKED]
        nextAction:
          enum: [APPROVE_WORK_ORDER, CHECK_ACQUISITION_READINESS, OPEN_MISSION_WIZARD,
                 WAIT_GATEWAY_DELIVERY, WAIT_CONTRACT_ACTIVATION, OPERATE_WITH_PILOT_2,
                 WAIT_MEDIA_SYNC, VERIFY_SOURCE_MEDIA, WAIT_PROCESSING, REVIEW_RESULTS,
                 RESOLVE_BLOCKER, NONE]
        detail: { type: string }
        readiness: { $ref: '#/components/schemas/AcquisitionReadinessView' }
        mission: { $ref: '#/components/schemas/AcquisitionMissionProgressView' }
        gateway: { $ref: '#/components/schemas/AcquisitionGatewayProgressView' }
        contractActivation: { $ref: '#/components/schemas/AcquisitionContractProgressView' }
        media: { $ref: '#/components/schemas/AcquisitionMediaProgressView' }
        processing: { $ref: '#/components/schemas/AcquisitionProcessingProgressView' }
        analysisReadiness:
          oneOf:
            - $ref: '#/components/schemas/AnalysisReadinessView'
            - { type: 'null' }
          description: >-
            Core 조립에 해당 evidence projection이 없는 경우 null이다. null은
            READY가 아니며, UI는 분석 준비 완료를 표시하면 안 된다.
        evaluatedAt: { type: string, format: date-time }
        inFlightContractPolicy: { const: REMAINS_VALID_UNTIL_CONTRACT_EXPIRY }
    SiteView:
      type: object
      required:
        [siteId, name, siteFrame, status, resumeTarget, registeredAt, updatedAt, aoi,
         dataResidency, aiEgressAllowed]
      properties:
        siteId: { type: string }
        name: { type: string }
        # 구조 정본은 SiteRegistrationRequest.siteFrame — 응답에서는 저장된 값 그대로.
        siteFrame: { type: object, additionalProperties: true }
        status:
          description: SiteStatus 10종(ADR-KSI-008 §4) — UNMAPPED 가 등록 직후 정상 중간 상태다.
          type: string
        # 일시중단(SUSPENDED)에서 복귀할 상태. 그 외에는 null.
        resumeTarget: { type: [string, 'null'] }
        registeredAt: { type: string }
        updatedAt: { type: string }
        # 설정된 적 없으면 null(등록 시 생략 또는 아직 PUT /v1/sites/{site_id}/aoi
        # 를 거치지 않음) — 구조 정본은 AreaOfInterest(POST /v1/sites.aoi 참조).
        aoi: { type: [object, 'null'], additionalProperties: true }
        # null 은 "반출 미선언"이고 그 뜻은 **반출 불가**다(INV-050). 화면이
        # 허용을 기본값처럼 보여주지 않게 null 을 그대로 싣는다.
        dataResidency: { type: [object, 'null'], additionalProperties: true }
        aiEgressAllowed: { type: boolean }
        # null 은 "노후 기준 미선언"이고 그 뜻은 **판정하지 않음**이지 "최신"이
        # 아니다(ADR-KSI-019 G1). PUT /v1/sites/{site_id}/model-age-policy 로 선언·철회.
        modelMaxAgeDays: { type: [integer, 'null'], minimum: 1 }
    SiteDetailView:
      type: object
      required:
        [siteId, name, siteFrame, status, resumeTarget, registeredAt, updatedAt, aoi,
         dataResidency, aiEgressAllowed, spatialModel]
      properties:
        siteId: { type: string }
        name: { type: string }
        siteFrame: { type: object, additionalProperties: true }
        status: { type: string }
        resumeTarget: { type: [string, 'null'] }
        registeredAt: { type: string }
        updatedAt: { type: string }
        aoi: { type: [object, 'null'], additionalProperties: true }
        dataResidency: { type: [object, 'null'], additionalProperties: true }
        aiEgressAllowed: { type: boolean }
        modelMaxAgeDays: { type: [integer, 'null'], minimum: 1 }
        spatialModel: { $ref: '#/components/schemas/SpatialModelView' }
    MissionExecutionHistoryEntry:
      type: object
      required: [missionId, before, after, updatedAt, updatedBy, detail]
      properties:
        missionId: { type: string }
        before: { type: string }
        after: { type: string }
        updatedAt: { type: string }
        updatedBy: { type: string }
        detail: { type: [string, 'null'] }
    MissionExecutionView:
      description: >-
        임무 실행 생애주기(ADR-KSI-019 G2). ISSUED → DISPATCHED → ACTIVATED →
        COMPLETED|ENDED_INCOMPLETE, 그리고 CANCELLED. **앞으로 건너뛰기를 허용한다** —
        수동 이관 임무는 DISPATCHED·ACTIVATED 신호가 아예 없고, 그 임무의 완료 보고를
        실행 상태 때문에 거부하면 INV-010 의 완료 판정 권위가 이 필드로 넘어간다.
        IN_FLIGHT 는 없다: KSI 는 비행 중 텔레메트리를 받지 않으므로(INV-001)
        "지금 날고 있다"는 서버가 아는 사실이 아니다.
      type: object
      required: [missionId, status, updatedAt, updatedBy, detail, history]
      properties:
        missionId: { type: string }
        status:
          type: string
          enum: [ISSUED, DISPATCHED, ACTIVATED, COMPLETED, ENDED_INCOMPLETE, CANCELLED]
        # 전이가 한 번도 없었으면 null — 그 경우 status 는 ISSUED 다.
        updatedAt: { type: [string, 'null'] }
        updatedBy: { type: [string, 'null'] }
        detail: { type: [string, 'null'] }
        history:
          type: array
          items: { $ref: '#/components/schemas/MissionExecutionHistoryEntry' }
    SpatialModelView:
      description: >-
        현장의 공간모델 판정(ADR-KSI-019 G1). 결론(state)과 그 결론이 나온
        근거(epochJobId·registeredAt·ageDays·maxAgeDays)를 함께 싣는다 — 근거 없는
        자동 판정은 운영자가 검토할 수 없다.
      type: object
      required:
        [siteId, state, epochJobId, registeredAt, ageDays, maxAgeDays,
         sourceArtifactCount, succeededEpochCount, siteStatus, siteStatusMatchesModel,
         capturedFrom, capturedTo, captureTimeStatus, freshnessBasis]
      properties:
        siteId: { type: string }
        state:
          description: >-
            ABSENT(원본 산출물을 가진 성공 재구성이 없다) / FRESH(선언된 기준 안,
            경계 포함) / STALE(기준 초과) / AGE_POLICY_UNDECLARED(epoch 은 있으나
            현장이 기준을 선언하지 않아 노후를 판정하지 않았다).
          type: string
          enum:
            [ABSENT, FRESH, STALE, AGE_POLICY_UNDECLARED, CAPTURE_TIME_UNAVAILABLE,
             SYSTEM_UNAVAILABLE]
        # 판정 근거가 된 최신 epoch 의 작업 id. ABSENT 면 null.
        epochJobId: { type: [string, 'null'] }
        # 그 epoch 이 SUCCEEDED 로 전이한 시각. **촬영 시각이 아니라 등록 시각**이다.
        registeredAt: { type: [string, 'null'] }
        ageDays: { type: [number, 'null'] }
        maxAgeDays: { type: [integer, 'null'] }
        sourceArtifactCount: { type: integer }
        succeededEpochCount: { type: integer }
        siteStatus: { type: string }
        # false 면 현장 상태가 실제 모델 유무와 어긋난다(자동 전진이 막혔거나
        # 사람이 근거 없이 상태를 올렸다). 조회는 판정만 하고 고치지 않는다.
        siteStatusMatchesModel: { type: boolean }
        capturedFrom: { type: [string, 'null'], format: date-time }
        capturedTo: { type: [string, 'null'], format: date-time }
        captureTimeStatus: { type: string, enum: [COMPLETE, INCOMPLETE, CONFLICT] }
        freshnessBasis: { type: string, enum: [CAPTURED_TO, NONE] }
    SiteListResponse:
      type: object
      required: [sites]
      properties:
        sites: { type: array, items: { $ref: '#/components/schemas/SiteView' } }
    SiteMutationResponse:
      description: 등록·전이 공통 응답. verdict 가 결과 코드고, site 는 성공 시에만 실린다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        site: { oneOf: [{ $ref: '#/components/schemas/SiteView' }, { type: 'null' }] }
        detail: { type: [string, 'null'] }
    WhoAmIResponse:
      type: object
      required: [principalId, organizationId, kind, role, deviceId, permissions]
      properties:
        principalId: { type: string }
        organizationId:
          description: Principal이 속한 고객 조직. 조회·변경 범위의 첫 번째 경계다.
          type: string
        kind: { type: string }
        # Gateway/Edge 장비 principal 은 role 이 없고, 운영자 principal 은 deviceId 가 없다.
        role: { type: [string, 'null'] }
        deviceId: { type: [string, 'null'] }
        permissions: { type: array, items: { type: string } }
    ObservationSchedule:
      type: object
      required:
        [scheduleId, organizationId, siteId, name, workAreaIds, intervalDays,
         timezone, status, createdAt, createdBy]
      properties:
        schemaVersion: { type: string }
        scheduleId: { type: string }
        organizationId: { type: string }
        siteId: { type: string }
        purpose: { type: string }
        name: { type: string }
        workAreaIds: { type: array, items: { type: string } }
        intervalDays: { type: integer }
        timezone: { type: string }
        approvedPolicyVersion: { type: [string, 'null'] }
        status: { type: string }
        createdAt: { type: string }
        createdBy: { type: string }
    ScheduleListResponse:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items: { $ref: '#/components/schemas/ObservationSchedule' }
    ObservationWorkOrder:
      type: object
      required:
        [workOrderId, organizationId, siteId, name, workAreaIds, status, version,
         createdAt, updatedAt, createdBy]
      properties:
        schemaVersion: { type: string }
        workOrderId: { type: string }
        organizationId: { type: string }
        siteId: { type: string }
        purpose: { type: string }
        name: { type: string }
        workAreaIds: { type: array, items: { type: string } }
        scheduleId: { type: [string, 'null'] }
        temporalPolicy:
          type: [object, 'null']
          additionalProperties: false
          properties:
            schemaVersion: { const: '1.0', default: '1.0' }
            maxCaptureSpanSeconds: { type: integer, minimum: 1, maximum: 86400 }
          required: [maxCaptureSpanSeconds]
        cycleNumber: { type: integer }
        status: { type: string }
        statusReason: { type: [string, 'null'] }
        missionIds: { type: array, items: { type: string } }
        processingJobIds: { type: array, items: { type: string } }
        reportRefs: { type: array, items: { type: string } }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        createdBy: { type: string }
        approvedAt: { type: [string, 'null'] }
        approvedBy: { type: [string, 'null'] }
    WorkOrderListResponse:
      type: object
      required: [workOrders]
      properties:
        workOrders:
          type: array
          items: { $ref: '#/components/schemas/ObservationWorkOrder' }
    ReobservationDraft:
      type: object
      required:
        [draftId, organizationId, siteId, workOrderId, reasonRefs, targetRegionRefs,
         proposedEffort, plannerVersion, policyVersion, expiresAt, status, version,
         createdAt, createdBy]
      properties:
        schemaVersion: { type: string }
        draftId: { type: string }
        organizationId: { type: string }
        siteId: { type: string }
        workOrderId: { type: string }
        reasonRefs: { type: array, items: { type: string } }
        targetRegionRefs: { type: array, items: { type: string } }
        proposedEffort: { type: string }
        plannerVersion: { type: string }
        policyVersion: { type: string }
        expiresAt: { type: string, format: date-time }
        status: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
    ReobservationDraftListResponse:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          items: { $ref: '#/components/schemas/ReobservationDraft' }
    CopilotCitation:
      type: object
      required: [citationId, objectType, objectId, label, sourcePath]
      properties:
        citationId: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        label: { type: string }
        sourcePath: { type: string }
        capturedFrom: { type: [string, 'null'] }
        capturedTo: { type: [string, 'null'] }
        modelVersion: { type: [string, 'null'] }
        geometryRef: { type: [string, 'null'] }
        uncertaintySummary: { type: [string, 'null'] }
    CopilotAnswer:
      type: object
      required: [status, answer]
      properties:
        schemaVersion: { type: string }
        status: { type: string, enum: [ANSWERED, BLOCKED] }
        answer: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/CopilotCitation' }
        missingData: { type: array, items: { type: string } }
        reobservationDraftId: { type: [string, 'null'] }
    CopilotConversation:
      type: object
      required: [conversationId, organizationId, siteId, status, createdBy, createdAt, updatedAt]
      properties:
        schemaVersion: { type: string }
        conversationId: { type: string }
        organizationId: { type: string }
        siteId: { type: string }
        workOrderId: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, CLOSED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CopilotMessage:
      type: object
      required:
        [messageId, conversationId, role, content, clientMessageId, answerStatus,
         citations, missingData, reobservationDraftId, provider, model, plannerVersion,
         createdBy, createdAt]
      properties:
        schemaVersion: { type: string }
        messageId: { type: string }
        conversationId: { type: string }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        clientMessageId: { type: [string, 'null'] }
        answerStatus: { enum: [ANSWERED, BLOCKED, null] }
        citations:
          type: array
          items: { $ref: '#/components/schemas/CopilotCitation' }
        missingData: { type: array, items: { type: string } }
        reobservationDraftId: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        plannerVersion: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ConversationListResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: '#/components/schemas/CopilotConversation' }
    ConversationDetailView:
      type: object
      required: [conversation, messages]
      properties:
        conversation: { $ref: '#/components/schemas/CopilotConversation' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/CopilotMessage' }
    CopilotExchangeResponse:
      type: object
      required: [conversation, userMessage, assistantMessage]
      properties:
        conversation: { $ref: '#/components/schemas/CopilotConversation' }
        userMessage: { $ref: '#/components/schemas/CopilotMessage' }
        assistantMessage: { $ref: '#/components/schemas/CopilotMessage' }
    WorkspaceNextAction:
      type: object
      required: [kind, label, href, reason]
      properties:
        kind: { type: string }
        label: { type: string }
        href: { type: [string, 'null'] }
        reason: { type: string }
    WorkspaceWorkOrderSummary:
      type: object
      required: [workOrderId, name, status, updatedAt, missionCount]
      properties:
        workOrderId: { type: string }
        name: { type: string }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
        missionCount: { type: integer }
    WorkspaceAnalysisSummary:
      type: object
      required:
        [status, processingJobId, capturedFrom, capturedTo, availableResultKinds,
         sourceWatermark]
      properties:
        status: { type: string }
        processingJobId: { type: [string, 'null'] }
        capturedFrom: { type: [string, 'null'], format: date-time }
        capturedTo: { type: [string, 'null'], format: date-time }
        availableResultKinds: { type: array, items: { type: string } }
        sourceWatermark: { type: [string, 'null'] }
    SiteWorkspaceView:
      type: object
      required:
        [siteId, siteName, siteStatus, latestObservationAt, reviewItemCount,
         activeWorkOrderCount, latestWorkOrder, latestAnalysis, nextAction]
      properties:
        schemaVersion: { type: string }
        siteId: { type: string }
        siteName: { type: string }
        siteStatus: { type: string }
        latestObservationAt: { type: [string, 'null'], format: date-time }
        reviewItemCount: { type: integer }
        activeWorkOrderCount: { type: integer }
        latestWorkOrder:
          oneOf: [{ $ref: '#/components/schemas/WorkspaceWorkOrderSummary' }, { type: 'null' }]
        latestAnalysis: { $ref: '#/components/schemas/WorkspaceAnalysisSummary' }
        nextAction: { $ref: '#/components/schemas/WorkspaceNextAction' }
    SiteBriefing:
      type: object
      required:
        [briefingId, organizationId, siteId, status, whatChanged, whyItMatters,
         decisionPrompt, citations, uncertainty, sourceWatermark, missingData, generatedAt]
      properties:
        schemaVersion: { type: string }
        briefingId: { type: string }
        organizationId: { type: string }
        siteId: { type: string }
        status: { type: string, enum: [READY, BLOCKED] }
        whatChanged: { type: string }
        whyItMatters: { type: string }
        decisionPrompt: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/CopilotCitation' }
        uncertainty: { type: string }
        sourceWatermark: { type: string }
        missingData: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
    IngestResponse:
      type: object
      required: [verdict]
      properties:
        verdict:
          description: ACCEPTED · DUPLICATE_IGNORED 등 수신 판정 코드.
          type: string
        detail: { type: [string, 'null'] }
    DeviceSequenceResponse:
      description: 장비가 재부팅 후 자기 순번을 복구하는 경로(ADR-KSI-008 §2).
      type: object
      required: [deviceId, lastSequence]
      properties:
        deviceId: { type: string }
        # 아직 한 건도 받지 않은 장비는 null — 0 이 아니다(0 은 유효한 첫 순번).
        lastSequence: { type: [integer, 'null'] }
    DispatchValidity:
      type: object
      required: [notBefore, notAfter]
      properties:
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
    Ed25519Signature:
      type: object
      required: [algorithm, keyId, digest, signature]
      properties:
        algorithm: { const: Ed25519 }
        keyId: { type: string }
        digest: { type: string }
        signature: { type: string }
    MissionDispatchEnvelopeV1:
      description: >-
        Mission Contract v1.2, RiskPolicyPack v1.0, EdgeRuntimeProfile v1.0을 원문 그대로 포함하는 outer
        signed dispatch. nested 구조의 wire 정본은
        contracts/schemas/mission-dispatch-envelope.v1.1.json 이다.
      type: object
      required:
        [dispatchId, edgeDeviceId, missionId, missionContract, missionContractDigest,
         riskPolicyPack, riskPolicyPackDigest, edgeRuntimeProfile, edgeRuntimeProfileDigest,
         validity, signature]
      properties:
        schemaVersion: { const: '1.0' }
        dispatchId: { type: string }
        edgeDeviceId: { type: string }
        missionId: { type: string }
        missionContract: { type: object, additionalProperties: true }
        missionContractDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        riskPolicyPack: { type: object, additionalProperties: true }
        riskPolicyPackDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        # Raw nested bytes are intentionally preserved for the outer Ed25519
        # signature. The detailed deployment contract lives in the separately
        # versioned JSON Schema, not in FastAPI's generated component registry.
        edgeRuntimeProfile: { type: object, additionalProperties: true }
        edgeRuntimeProfileDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        # v1.1 부터. bare hex 인 것은 발급 원장(MissionRecord.kmzSha256)의 표기를
        # 그대로 옮기기 때문이다. null 은 "아직 모른다"가 아니라 "이 임무에는 KMZ 가
        # 없다"(계약 단독 발급)는 확정 사실이고, 장비는 그때 남아 있던 이전 임무의
        # KMZ 를 지운다. 봉투 안에서는 필수 필드다(v1.1 스키마 파일 참조) —
        # 여기 required 에 없는 것은 FastAPI 모델에 기본값이 있어서일 뿐이다.
        kmzSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        validity: { $ref: '#/components/schemas/DispatchValidity' }
        signature: { $ref: '#/components/schemas/Ed25519Signature' }
    ActivationReceiptV1:
      type: object
      required:
        [dispatchId, edgeDeviceId, missionId, missionContractDigest,
         riskPolicyPackDigest, activatedAt, runtimeVersion]
      properties:
        schemaVersion: { const: '1.0' }
        dispatchId: { type: string }
        edgeDeviceId: { type: string }
        missionId: { type: string }
        missionContractDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        riskPolicyPackDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        activatedAt: { type: string, format: date-time }
        runtimeVersion: { type: string }
    EdgeDispatchVerdict:
      type: string
      enum:
        [ISSUED, EXISTING, NO_MISSION, NO_RUNTIME_PROFILE, ACTIVATED,
         ALREADY_ACTIVATED, NOT_FOUND, RECEIPT_MISMATCH, STORE_UNAVAILABLE,
         FLIGHT_START_RECORDED, FLIGHT_START_ALREADY_RECORDED, NOT_ACTIVATED]
    ActivationReceiptResponse:
      type: object
      required: [verdict, dispatchId]
      properties:
        verdict: { $ref: '#/components/schemas/EdgeDispatchVerdict' }
        dispatchId: { type: string }
    FlightStartVerdict:
      type: string
      description: >-
        Edge가 Action(START) 시도 결과로 보고하는 원인(ADR-KSI-021 §5 [0]~[10]).
        STARTED만 Action(START) 호출까지 실제로 도달했다는 뜻이고, 나머지는
        전부 그 호출 이전 관문에서 fail-closed로 멈췄다는 뜻이다.
      enum:
        [STARTED, STAGE_INSUFFICIENT, ACTIVATION_SNAPSHOT_INVALID,
         FLIGHT_AUTHORIZATION_INVALID, ARMING_TOKEN_INVALID, KMZ_DIGEST_MISMATCH,
         ENVELOPE_REVALIDATION_FAILED, CONSERVATIVE_CEILING_GUARD,
         SUPERVISOR_NOT_READY, VEHICLE_PRECONDITION_FAILED]
    FlightStartReceiptV1:
      type: object
      required:
        [dispatchId, edgeDeviceId, missionId, missionContractDigest,
         riskPolicyPackDigest, reportedAt, runtimeVersion, verdict]
      properties:
        schemaVersion: { const: '1.0' }
        dispatchId: { type: string }
        edgeDeviceId: { type: string }
        missionId: { type: string }
        missionContractDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        riskPolicyPackDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        reportedAt: { type: string, format: date-time }
        runtimeVersion: { type: string }
        verdict: { $ref: '#/components/schemas/FlightStartVerdict' }
        actionReturnCode:
          type: string
          nullable: true
          description: >-
            Action(START) 호출까지 도달했을 때만(verdict == STARTED) 존재하는
            원문 반환코드. 그 외에는 지어내지 않고 null이다.
    FlightStartReceiptResponse:
      type: object
      required: [verdict, dispatchId]
      properties:
        verdict: { $ref: '#/components/schemas/EdgeDispatchVerdict' }
        dispatchId: { type: string }
        outcome:
          type: string
          nullable: true
          description: 접수(RECORDED/ALREADY_RECORDED)에만 채워진다.
    EdgeEvidenceUploadRequest:
      type: object
      required: [artifactId, contentType, contentDigest]
      properties:
        artifactId: { type: string }
        contentType: { type: string }
        contentDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        attestation:
          oneOf:
            - $ref: '#/components/schemas/DeviceEvidenceAttestation'
            - type: 'null'
          description: >-
            CRITICAL 기계 증거에는 필수다. signature는 deviceId, siteId,
            missionId, eventKey, artifactId, contentType, contentDigest만 포함한
            canonical JSON의 Ed25519 서명이며 padding 없는 base64url이다.
    DeviceEvidenceAttestation:
      type: object
      additionalProperties: false
      required: [keyId, algorithm, signature]
      properties:
        keyId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        algorithm: { const: Ed25519 }
        signature:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          description: Padding 없는 base64url Ed25519 signature.
    EdgeEvidenceUploadResponse:
      type: object
      required: [artifactId, objectKey, uploadUrl, expiresAt, reusedRegistration, contentDigest, requiredUploadHeaders, deviceAttested, attestationKeyId]
      properties:
        artifactId: { type: string }
        objectKey: { type: string }
        uploadUrl: { type: string }
        expiresAt: { type: string, format: date-time }
        reusedRegistration: { type: boolean }
        contentDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        requiredUploadHeaders:
          type: object
          additionalProperties: { type: string }
        deviceAttested: { type: boolean }
        attestationKeyId: { type: [string, 'null'] }
    EventSummaryResponse:
      description: >-
        트리아지 대기열의 한 줄. eventType 은 목록에서 "무슨 일인지"를 답하는
        1순위 정보라 bundle 에서 최상위로 승격한다(2026-08-04 대표자 결정).
      type: object
      required:
        [eventKey, eventId, siteId, missionId, eventType, status, severity, triage,
         assignee, evidenceCount, edgeDeviceId, occurredAt, receivedAt]
      properties:
        # 서버 정본 신원 = {edgeDeviceId}::{eventId}. eventId 는 장비 로컬이라 단독으론 충돌한다.
        eventKey: { type: string }
        eventId: { type: string }
        siteId: { type: string }
        missionId: { type: string }
        eventType: { type: [string, 'null'] }
        status: { type: string }
        severity: { type: [string, 'null'] }
        triage: { type: string }
        assignee: { type: [string, 'null'] }
        evidenceCount:
          type: integer
          minimum: 0
          description: 폐기되지 않아 현재 열람 가능한 근거 artifact 수
        edgeDeviceId: { type: string }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    EventListResponse:
      type: object
      required: [events, count]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/EventSummaryResponse' } }
        count: { type: integer }
    CoverageRejectionListView:
      description: 그 임무에 대해 서버가 거부한 완료 주장들.
      type: object
      required: [missionId, rejectionCount, rejections]
      properties:
        missionId: { type: string }
        rejectionCount: { type: integer }
        rejections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [verdict, detail, reportedBy, rejectedAt]
            properties:
              verdict:
                type: string
                description: >-
                  UNKNOWN_MISSION / SITE_MISMATCH / UNSUPPORTED_COMPLETION /
                  UNEXPLAINED_GAP / NO_COVERAGE_EVIDENCE /
                  SELF_CONTRADICTORY_SUMMARY / INVALID_TIMESTAMP
              detail: { type: [string, 'null'] }
              reportedBy: { type: [string, 'null'] }
              rejectedAt: { type: string }
    CaptureQualityReportResponse:
      description: >-
        immutable CaptureQualityReport 기록/조회 결과. report는 성공 또는 동일 재시도에만
        있고, cycleNumber·receivedAt·receivedBy는 durable 수신 사실이다.
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict:
          enum:
            [RECORDED, DUPLICATE, REPORT_ID_CONFLICT, MISSION_ALREADY_REPORTED,
             UNKNOWN_MISSION, WORK_ORDER_MISMATCH, DEVICE_MISMATCH, STORE_UNAVAILABLE]
        detail: { type: [string, 'null'] }
        report:
          oneOf:
            - $ref: ../schemas/capture-quality-report.v1.json
            - { type: 'null' }
        cycleNumber: { type: [integer, 'null'] }
        receivedAt: { type: [string, 'null'], format: date-time }
        receivedBy: { type: [string, 'null'] }
    FlightArtifactCandidateResponse:
      description: >-
        Core가 exact KMZ bytes를 보관한 뒤 기록한 후보 메타데이터. 이것은 실행 명령도,
        Mission Contract의 일부도 아니다. status와 executable은 후보가 unbound이며
        비실행성임을 응답마다 명시한다.
      type: object
      additionalProperties: false
      required:
        [candidateId, revision, source, status, validatorVersion, provenanceRef,
         kmzSha256, sizeBytes, placemarkCount, minExecuteHeightM, maxExecuteHeightM,
         envelopeCheck, validationLimitation, validatedAt, validatedBy]
      properties:
        candidateId:
          type: string
          description: Server-derived full content-digest identity; never client supplied.
        revision:
          type: integer
          minimum: 1
          description: Recording order for distinct immutable candidate bytes within the Mission.
        source: { const: DJI_PILOT_EXPORT }
        status: { const: VALIDATED_CANDIDATE_UNBOUND }
        validatorVersion:
          const: '1.0'
          description: Structural KMZ validator contract version, not DJI firmware compatibility.
        provenanceRef: { type: string }
        kmzSha256: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        sizeBytes: { type: integer, minimum: 1 }
        placemarkCount: { type: integer, minimum: 1 }
        minExecuteHeightM: { type: number }
        maxExecuteHeightM: { type: number }
        envelopeCheck:
          enum: [COMPATIBLE, NOT_COMPARABLE]
          description: Structural comparison only; never a route-safety or Pilot import assertion.
        validationLimitation: { type: [string, 'null'] }
        validatedAt: { type: string, format: date-time }
        validatedBy: { type: string }
        executable:
          const: false
          default: false
          description: Always false. No candidate route binds this object to flight execution.
    FlightArtifactIngestResponse:
      description: >-
        Pilot-export candidate retention verdict. candidate is present only for RECORDED or
        DUPLICATE, and remains unbound/non-executable in either case.
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict:
          enum: [RECORDED, DUPLICATE, UNKNOWN_MISSION, STORE_UNAVAILABLE]
        detail: { type: [string, 'null'] }
        candidate:
          oneOf:
            - $ref: '#/components/schemas/FlightArtifactCandidateResponse'
            - { type: 'null' }
    CoverageReportResponse:
      description: 보고 수신 판정 + 기록된 보고 본문(거부 시 report 는 null).
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        report: { type: [object, 'null'], additionalProperties: true }
    CoverageReportView:
      description: 그 임무의 최신 보고 + 접수 건수 + 누가 보고했는지 + Coverage Recovery 권고 + 귀속·대사.
      type: object
      required:
        [
          missionId,
          reportCount,
          latest,
          reportedBy,
          recoveryRecommended,
          ratioAttributionNote,
          plannedGeneralCoverageRatio,
          plannedGeneralCoverageUnavailableReason,
        ]
      properties:
        missionId: { type: string }
        reportCount: { type: integer }
        # 구조 정본은 contracts/schemas/coverage-report.v1.1.json.
        latest: { type: object, additionalProperties: true }
        reportedBy:
          type: [string, 'null']
          description: 제출한 Principal id(보통 장비 id). 구 journal 재생 등으로 없으면 null.
        recoveryRecommended:
          type: boolean
          description: >-
            Coverage Recovery 권고(MASTER_PRD §15.2) — completionState 가
            COMPLETED 가 아니거나(COMPLETED_WITH_GAPS/ABORTED_SAFE/FAILED 전부)
            사유있는 미관찰 Cell 이 남아 있으면 true. 자동 재발급을 트리거하지
            않는다 — 운영자가 원본 site AOI 로 SPATIAL_REFRESH 임무를
            POST /v1/missions/plans 에 재발급하라는 신호일 뿐이다.
        ratioAttributionNote:
          type: string
          description: >-
            "이 세 비율은 기체가 신고한 값이고 서버는 재계산하지 못한다"는
            사실 — 항상 채워진다(대사 가능 여부와 무관, INV-010).
        plannedGeneralCoverageRatio:
          type: [number, 'null']
          description: >-
            발급 시점 lawnmower 경로 생성기가 계산한 일반영역 커버 상한 추정치.
            perimeter 패턴·계약 단독 발급이면 null 이고
            plannedGeneralCoverageUnavailableReason 이 대신 채워진다.
        plannedGeneralCoverageUnavailableReason:
          type: [string, 'null']
          description: plannedGeneralCoverageRatio 가 null 일 때만 채워지는 이름 붙인 사유.
    DefectCandidateBatchResponse:
      description: 결함 후보 배치 접수 판정. recordedCount 는 **새로** 기록된 건수다.
      type: object
      required: [verdict, detail, recordedCount]
      properties:
        verdict:
          type: string
          description: >-
            RECORDED / UNKNOWN_MISSION / EMPTY_BATCH / UNKNOWN_SOURCE_MEDIA /
            IMAGE_SIZE_MISMATCH / GEOMETRY_OUT_OF_BOUNDS / DUPLICATE_CANDIDATE_ID /
            STORE_UNAVAILABLE
        detail: { type: [string, 'null'] }
        recordedCount:
          type: integer
          description: >-
            새로 기록된 후보 수. 멱등 재전송(전건이 이미 같은 내용)이면 verdict 는
            RECORDED 이고 이 값은 0 이다 — 중복 기록하지 않는다.
    DefectCandidateListView:
      description: 그 임무의 결함 후보 목록 + 후보가 걸린 사진 목록.
      type: object
      required: [missionId, candidateCount, sourceMediaIds, candidates]
      properties:
        missionId: { type: string }
        candidateCount: { type: integer }
        sourceMediaIds:
          type: array
          items: { type: string }
          description: >-
            후보가 하나라도 걸린 사진 id 목록(정렬됨). 화면이 "어느 사진에 결함이
            있나"를 먼저 보여주고 사진별로 폴리곤을 겹치는 흐름을 위해, 클라이언트가
            전체 목록을 훑어 직접 집계하지 않아도 되게 서버가 함께 낸다.
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [candidate, reportedBy, recordedAt]
            properties:
              # 구조 정본은 contracts/schemas/defect-candidate.v1.json.
              candidate: { type: object, additionalProperties: true }
              reportedBy:
                type: [string, 'null']
                description: 제출한 워커의 Principal id. 구 journal 재생 등으로 없으면 null.
              recordedAt: { type: string }
    SourceMediaViewResponse:
      description: 사진 1장의 열람 URL + 원장이 아는 화소수·digest.
      type: object
      required: [mediaId, contentType, viewUrl, expiresAt, width, height, sha256, captureTime]
      properties:
        mediaId: { type: string }
        contentType: { type: string }
        viewUrl: { type: string }
        expiresAt: { type: string }
        width:
          type: integer
          description: >-
            업로더가 **신고한** 화소수(전 바이트를 읽은 워커가 대조하기 전까지는
            주장이다). 결함 후보의 imageSize 는 Core 가 이 값과 이미 대조했으므로,
            화면은 둘이 같다는 전제로 폴리곤 배율을 계산해도 된다.
        height: { type: integer }
        sha256: { type: string }
        captureTime: { $ref: '#/components/schemas/CaptureTimeView' }
    EquipmentSupportView:
      description: >-
        장비 클래스 1건의 지원단계. 계약(contracts/schemas/equipment-support-state.v1.json)
        필드 + 서버가 계산한 표시 플래그.
      type: object
      required:
        [classId, state, evidenceRefs, modelVersion, riskPackVersion,
         productionSupported, updatedAt, updatedBy]
      properties:
        classId: { type: string }
        state:
          enum:
            [DATASET_AVAILABLE, BASELINE_DETECTION, FIELD_VALIDATED,
             GEO_VALIDATED, RISK_VALIDATED, PRODUCTION_SUPPORTED]
        evidenceRefs:
          type: array
          items: { type: string }
          description: >-
            **이번 전이가 제시한** 증거만 담는다. 강등은 승급 때의 증거를 물려받지
            않는다 — 예전 증거를 달고 있으면 "이 단계는 검증됐다"는 잘못된 신호가 된다.
        modelVersion: { type: [string, 'null'] }
        riskPackVersion: { type: [string, 'null'] }
        productionSupported:
          type: boolean
          description: >-
            **이 값이 true 인 것만 상용 지원으로 표시한다**(REQ-MODEL-101). 서버가
            is_production_supported() 로 계산한 파생값이다 — 화면이 state 문자열을
            보고 스스로 판단하면 단계가 추가되는 날 조용히 틀린다.
        updatedAt: { type: string }
        updatedBy: { type: string }
    EquipmentSupportListView:
      description: 등록된 장비 클래스 전체(classId 오름차순).
      type: object
      required: [classCount, productionSupportedCount, classes]
      properties:
        classCount: { type: integer }
        productionSupportedCount:
          type: integer
          description: productionSupported 가 true 인 클래스 수 — 화면이 다시 세지 않아도 되게.
        classes:
          type: array
          items: { $ref: '#/components/schemas/EquipmentSupportView' }
    EquipmentSupportMutationResponse:
      description: 등록·전이 판정 + 성공 시 갱신된 레코드.
      type: object
      required: [verdict, detail, record]
      properties:
        verdict:
          type: string
          description: >-
            RECORDED / UNKNOWN_CLASS / ALREADY_REGISTERED / ILLEGAL_TRANSITION /
            STORE_UNAVAILABLE
        detail: { type: [string, 'null'] }
        record:
          oneOf:
            - { $ref: '#/components/schemas/EquipmentSupportView' }
            - { type: 'null' }
    EquipmentStateBatchResponse:
      description: 운동상태 배치 접수 판정.
      type: object
      required: [verdict, detail, recordedCount]
      properties:
        verdict:
          type: string
          description: RECORDED / UNKNOWN_SITE / SITE_FRAME_MISMATCH / STORE_UNAVAILABLE
        detail: { type: [string, 'null'] }
        recordedCount: { type: integer }
    EquipmentStateListView:
      description: 그 현장의 개체별 최신 운동상태(entityId 오름차순).
      type: object
      required: [siteId, entityCount, entities]
      properties:
        siteId: { type: string }
        entityCount: { type: integer }
        entities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [state, reportedBy, recordedAt, positionUncertaintyM]
            properties:
              # 구조 정본은 ksi_equipment_intelligence.kinematic_state.KinematicState.
              state: { type: object, additionalProperties: true }
              reportedBy: { type: [string, 'null'] }
              recordedAt: { type: string }
              positionUncertaintyM:
                type: number
                description: 공분산 trace 의 제곱근(RMS 반경 근사) — 좌표축 회전에 불변.
    RiskAssessmentView:
      description: 지목된 두 개체 쌍의 CPA/TTC + 재관찰 권고(PRD RISK-004/005).
      type: object
      required:
        [siteId, equipmentEntityId, subjectEntityId, observationGapS,
         closestApproachM, closestApproachTimeS, timeToCollisionS, horizonS,
         combinedRadiusM, positionUncertaintyThresholdM, reobservationRecommended]
      properties:
        siteId: { type: string }
        equipmentEntityId: { type: string }
        subjectEntityId: { type: string }
        observationGapS:
          type: number
          description: 두 상태의 observedAt 실제 시간차(초). 어떤 근거로 계산했는지가 남는다.
        closestApproachM: { type: number }
        closestApproachTimeS: { type: number }
        timeToCollisionS:
          type: [number, 'null']
          description: >-
            null 은 **"위험 없음"이 아니라 "이 지평선 안에서는 확인되지 않음"**이다
            (horizonS 와 짝을 이루는 스코프 한정). 화면이 둘을 같게 표시하면 안 된다.
        horizonS: { type: number }
        combinedRadiusM: { type: number }
        positionUncertaintyThresholdM: { type: number }
        reobservationRecommended:
          type: boolean
          description: >-
            두 상태 중 하나라도 위치 불확실성이 문턱을 초과하면 true(RISK-005).
            권고일 뿐 재관찰을 트리거하지 않는다 — Viewpoint 선택은 Edge 소관이다.
    ChangeDetectionResponse:
      description: 변화 탐지 결과 수신 판정.
      type: object
      required: [verdict, detail]
      properties:
        verdict:
          type: string
          description: >-
            RECORDED / UNKNOWN_MISSION / UNKNOWN_ARTIFACT / ARTIFACT_KIND_MISMATCH /
            SELF_COMPARISON / DUPLICATE_RESULT_ID / STORE_UNAVAILABLE
        detail: { type: [string, 'null'] }
    ChangeDetectionView:
      description: 그 임무의 최신 변화 탐지 결과 + 재방문 권고(PRD §15.2 ⑤).
      type: object
      required:
        [missionId, resultCount, latest, reportedBy, recordedAt,
         revisitRatioThreshold, revisitRecommended]
      properties:
        missionId: { type: string }
        resultCount: { type: integer }
        # 구조 정본은 contracts/schemas/change-detection-result.v1.json.
        latest: { type: object, additionalProperties: true }
        reportedBy: { type: [string, 'null'] }
        recordedAt: { type: string }
        revisitRatioThreshold:
          type: number
          description: >-
            이 조회가 **실제로 쓴** 임계값. 요청이 준 값이거나(revisitRatioThreshold
            쿼리) 생략 시 화면 초기값이다. 응답에 싣는 이유는 권고가 무슨 기준으로
            켜졌는지를 화면이 표시할 수 있어야 하기 때문이다.
        revisitRecommended:
          type: boolean
          description: >-
            candidateRatio > revisitRatioThreshold 이면 true(엄격 부등호).
            candidateCount 가 0 이면 임계값과 무관히 항상 false — "후보가 없는데
            재방문 권고"라는 모순을 만들지 않는다. 자동 재비행을 트리거하지 않는다.
    EventDetailResponse:
      description: 목록 필드 + 원본 bundle + 이 사건에 대한 journal 전이 이력 전체.
      type: object
      required:
        [eventKey, eventId, siteId, missionId, eventType, status, severity, triage,
         assignee, evidenceCount, edgeDeviceId, occurredAt, receivedAt, lastConflictAt, bundle,
         bundleDigest, transitions, evidence]
      properties:
        eventKey: { type: string }
        eventId: { type: string }
        siteId: { type: string }
        missionId: { type: string }
        eventType: { type: [string, 'null'] }
        status: { type: string }
        severity: { type: [string, 'null'] }
        triage: { type: string }
        assignee: { type: [string, 'null'] }
        evidenceCount:
          type: integer
          minimum: 0
          description: 폐기되지 않아 현재 열람 가능한 근거 artifact 수
        edgeDeviceId: { type: string }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        lastConflictAt: { type: [string, 'null'], format: date-time }
        # 구조 정본은 contracts/schemas/event-bundle.v1.2.json.
        bundle: { type: object, additionalProperties: true }
        # 전이 요청의 expectedBundleDigest 에 그대로 실을 값 — 클라이언트가 정규화
        # 규약을 재구현하면 JSON 표기 차이 하나로 영구 409 가 되므로 서버가 계산해
        # 돌려준다.
        bundleDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        transitions: { type: array, items: { type: object, additionalProperties: true } }
        # 폐기된 것도 포함한다(ADR-KSI-010 §3) — 목록에서 사라지면 "증거가 없다"와
        # "정책대로 폐기했다"를 구분할 수 없다. 열람 URL 은 여기 없다: URL 이 곧
        # 인가라서 권한 검사를 통과한 별도 요청에서만 발급한다.
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceSummary' } }
    TransitionResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        event: { oneOf: [{ $ref: '#/components/schemas/EventDetailResponse' }, { type: 'null' }] }
    EvidenceSummary:
      description: 상세 응답에 실리는 증거 1건. tombstonedAt 이 있으면 폐기된 것이다.
      type: object
      required:
        [artifactId, contentType, registeredAt, registeredBy, deviceBound, deviceAttested,
         attestationKeyId, tombstonedAt, tombstoneReason]
      properties:
        artifactId: { type: string }
        contentType: { type: string }
        registeredAt: { type: string, format: date-time }
        registeredBy: { type: string }
        # 장비 신원이 대조되는 경로(edge-sync)로 등록됐는가 — CRITICAL 확정의
        # riskField/trajectory/viewpointHistory 증거는 이게 참이어야 통과한다.
        deviceBound: { type: boolean }
        deviceAttested: { type: boolean }
        attestationKeyId: { type: [string, 'null'] }
        tombstonedAt: { type: [string, 'null'], format: date-time }
        tombstoneReason: { type: [string, 'null'] }
    EvidenceUploadResponse:
      description: >-
        presigned PUT URL. ``objectKey`` 는 서버가 만든 값이라 클라이언트가
        고를 수 없다 — 응답에 싣는 건 운영자가 스토리지에서 같은 객체를 찾을 수
        있게 하려는 것뿐이다.
      type: object
      required: [artifactId, objectKey, uploadUrl, expiresAt]
      properties:
        artifactId: { type: string }
        objectKey: { type: string }
        uploadUrl: { type: string }
        # 남은 시간이 아니라 절대 시각 — 클라이언트가 자기 시계로 계산하게 한다.
        expiresAt: { type: string, format: date-time }
    EvidenceViewResponse:
      type: object
      required:
        [artifactId, contentType, viewUrl, expiresAt, registeredAt, registeredBy,
         deviceBound, deviceAttested, attestationKeyId]
      properties:
        artifactId: { type: string }
        contentType: { type: string }
        viewUrl: { type: string }
        expiresAt: { type: string, format: date-time }
        registeredAt: { type: string, format: date-time }
        registeredBy: { type: string }
        deviceBound: { type: boolean }
        deviceAttested: { type: boolean }
        attestationKeyId: { type: [string, 'null'] }
    MissionRecordResponse:
      description: >-
        발급된 임무의 조회 표현. ADR-KSI-007 이원 산출물 중 이 레코드가 가리키는
        것은 artifactKind 가 말한다(KMZ 짝과 Mission Contract 짝의 무결성은
        서버가 발급 시점에 강제한다).
      type: object
      required:
        [missionId, siteId, organizationId, missionType, artifactKind, kmzSha256, routePattern,
         waypointCount, plannedCoverageRatio, issuedAt, issuedBy, assignedDeviceId,
         coverageCompletionState, derivedFrom]
      properties:
        missionId: { type: string }
        siteId: { type: string }
        organizationId:
          type: string
          description: >-
            이 발급 원장이 귀속된 조직. 모든 Mission 조회는 인증 Principal의
            organizationId로 먼저 범위가 좁혀지며, 다른 조직의 레코드는 존재하지
            않는 것과 같은 404로 처리된다(INV-060).
        missionType: { type: string }
        artifactKind: { type: string }
        # 경로 산출물이 없는 발급(계약만)은 이 넷이 전부 null 이다.
        kmzSha256: { type: [string, 'null'] }
        routePattern: { type: [string, 'null'] }
        waypointCount: { type: [integer, 'null'] }
        plannedCoverageRatio:
          type: [number, 'null']
          description: >-
            **비행 전 계획 추정치**(CameraSpec에서 서버가 계산한 lawnmower만,
            순찰과 직접 spacing lawnmower는 null). CameraSpec 근거 없이 요청자가
            준 spacing의 기하값은 coverage claim이 아니다. **완료 판정의 권위가
            아니다.** 실제 커버는 비행 후 기체가
            올리는 CoverageReport(Cell 상태·미관찰 원인코드)가 판정한다
            (MASTER_PRD §15.5, INV-010). 이 값은 "계획이 애초에 요구를 겨냥하는가"의
            사전 점검 결과다.
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        assignedDeviceId:
          type: [string, 'null']
          description: >-
            이 임무를 수행할 것으로 신고된 장비(INV-010). null 이면 배정을
            신고하지 않은 것 — 그 임무는 인증된 어느 EDGE_DEVICE 든 커버리지를
            보고할 수 있다.
        coverageCompletionState:
          type: [string, 'null']
          enum: [COMPLETED, COMPLETED_WITH_GAPS, ABORTED_SAFE, FAILED, null]
          description: >-
            **파생 필드** — 이 임무에 대해 접수된 최신 CoverageReport 의
            completionState 를 서버가 조회 시점에 계산해 그대로 싣는다(저장하지
            않는다). 완료 판정의 권위는 CoverageReport 하나다(INV-010) — 이 필드는
            그 판정을 다시 계산하지 않고 그대로 노출할 뿐이다. null 은 "아직 보고가
            없다"는 뜻이고, 발급됐지만 비행 전인지 비행했는데 보고가 없는지는 이
            값만으로 구분되지 않는다(GET .../coverage-report 404 와 함께 봐야 한다).
        derivedFrom:
          type: [object, 'null']
          additionalProperties: false
          description: >-
            이 임무가 어느 분석 결과에서 나왔는가(ADR-KSI-019 G5) — planRequest 에
            실려 영속되는 운영 메타데이터를 그대로 노출한다. null 이면 최초 매핑
            임무이거나 계약 단독 발급이다.
          properties:
            sourceMissionId: { type: string }
            changeRegionSetId: { type: string }
            regionId: { type: string }
            captureGrade: { type: [string, 'null'] }
    SourceMediaItemView:
      description: 배치 안 파일 1건의 결과. REGISTERED 일 때만 objectKey/uploadUrl/expiresAt 이 있다.
      type: object
      required: [mediaId, verdict]
      properties:
        mediaId: { type: string }
        verdict:
          type: string
          description: >-
            REGISTERED · INVALID_MEDIA_ID · UNSUPPORTED_CONTENT_TYPE ·
            CLAIM_CONFLICT(같은 mediaId 가 다른 내용으로 이미 등록됨) ·
            JOURNAL_UNAVAILABLE · STORAGE_UNAVAILABLE(등록은 됐으나 URL 발급 실패
            — 같은 내용으로 재요청하면 재발급된다).
        objectKey: { type: [string, 'null'] }
        uploadUrl: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        detail: { type: [string, 'null'] }
    SourceMediaBatchResponse:
      description: >-
        배치 요청 전체 판정(PROCESSED/UNKNOWN_MISSION/BUNDLE_SEALED/
        STORE_UNAVAILABLE) + 항목별 결과. PROCESSED 면 개별 실패가 섞여도 요청
        자체는 201 이고 results 각 항목의 verdict 로 갈린다.
      type: object
      required: [verdict, results]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        results: { type: array, items: { $ref: '#/components/schemas/SourceMediaItemView' } }
    SourceMediaBundleView:
      description: 원본 미디어 번들 상태 — 미검증 상태를 그대로 노출한다.
      type: object
      required:
        [missionId, status, mediaCount, sourceBundleDigest, sealedAt, verifiedAt,
         lastMismatchAt, captureWindow]
      properties:
        missionId: { type: string }
        status: { type: string, enum: [OPEN, SEALED] }
        mediaCount: { type: integer }
        sourceBundleDigest: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
        sealedAt: { type: [string, 'null'], format: date-time }
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            KSI 워커가 전 바이트를 읽어 재고 그 값이 업로더 신고값과 전부 일치함이
            확인된 시각(POST .../source-media/verify). 정확한 뜻은 "서버가 바이트를
            봤다"가 아니라 "워커가 실측을 보고했고 Core 대조가 통과했다"이다 —
            Core 는 객체 바이트를 중계하지 않는다(ADR-KSI-010 §1).
        lastMismatchAt:
          type: [string, 'null']
          format: date-time
          description: >-
            마지막 불일치 보고 시각. verifiedAt 이 null 인데 이 값이 있으면 "아직
            아무도 안 읽었다"가 아니라 **"재봤는데 어긋났다"**다 — 화면이 둘을
            같은 회색으로 그리면 안 된다.
        groundControlCrs:
          type: [string, 'null']
          description: >-
            이 조사에 붙은 기준점 파일의 좌표계. null 이면 기준점 없이 찍힌
            조사이고, 그 성과로는 두 시점 비교를 할 수 없다(엔진이 EXIF 로 UTM 을
            고른다) — 화면이 그 사실을 미리 말할 수 있게 목록에 함께 싣는다.
        groundControlSha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: >-
            기준점 파일의 지문. 같은 좌표계라도 성과가 다르면 다른 기준점이라,
            재실행하는 도구가 "이미 붙인 그 파일인가"를 이 값으로 판단한다.
        captureWindow: { $ref: '#/components/schemas/CaptureWindowView' }
    CaptureTimeView:
      type: object
      additionalProperties: false
      properties:
        capturedAt: { type: [string, 'null'], format: date-time, default: null }
        source:
          type: string
          enum: [EXIF_GPS_UTC, EXIF_DATETIME_OFFSET, DJI_XMP_EXPLICIT, NONE]
          default: NONE
        status:
          type: string
          enum: [VERIFIED, UNAVAILABLE, CONFLICT]
          default: UNAVAILABLE
    CaptureWindowView:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [COMPLETE, INCOMPLETE, CONFLICT] }
        capturedFrom: { type: [string, 'null'], format: date-time, default: null }
        capturedTo: { type: [string, 'null'], format: date-time, default: null }
    GroundControlRequest:
      description: >-
        기준점 파일 등록 요청 — 내용이 아니라 **신고**다(Core 는 바이트를 읽지 않는다).
      type: object
      required: [sha256, bytes, crs]
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bytes: { type: integer, minimum: 1, maximum: 67108864 }
        crs:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            이 기준점 성과의 좌표계(예: EPSG:5186). 현행 한국 평면직각좌표계
            (EPSG:5179·5185~5188)만 받는다 — 파일 첫 줄이 이 값과 같아야 하고,
            그 대조는 파일을 내려받는 워커가 제출 전에 한다.
    GroundControlResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        objectKey: { type: [string, 'null'] }
        uploadUrl: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        crs: { type: [string, 'null'] }
    SourceMediaSealResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        bundle:
          oneOf: [{ $ref: '#/components/schemas/SourceMediaBundleView' }, { type: 'null' }]
    SourceMediaVerifyResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        bundle:
          oneOf: [{ $ref: '#/components/schemas/SourceMediaBundleView' }, { type: 'null' }]
        mismatched:
          description: 신고값과 실측이 어긋난 mediaId.
          type: array
          items: { type: string }
        missing:
          description: 등록됐는데 측정값이 오지 않은 mediaId.
          type: array
          items: { type: string }
        unexpected:
          description: 등록되지 않았거나 중복 측정된 mediaId.
          type: array
          items: { type: string }
    JobInputView:
      description: >-
        워커가 실행에 필요한 것 — 무엇으로 돌릴지 + 어떤 파일을 읽을지.
        **업로더의 신고값(sha256·해상도)이 없는 것이 이 스키마의 요점이다.**
      type: object
      required:
        [jobId, missionId, siteId, status, provider, engineVersion, engineDigest,
         executionLocus, processingParams, processingProfileId, processingProfileDigest,
         processingProfileClassification, sourceBundleDigest, imageCount, media, siteCrs]
      properties:
        jobId: { type: string }
        missionId: { type: string }
        siteId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING] }
        provider: { type: string }
        engineVersion: { type: string }
        engineDigest: { type: string }
        executionLocus: { type: string }
        processingParams: { type: object, additionalProperties: true }
        processingProfileId:
          description: >-
            Core가 job 발급 시 확장해 고정한 immutable profile id. legacy job이면
            null이며 이 상태는 정량 비교 후보가 아니다.
          type: [string, 'null']
        processingProfileDigest:
          description: >-
            profile snapshot의 canonical SHA-256. legacy job이면 null이며 Core가
            과거 provider 값으로 추정해 채우지 않는다.
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        processingProfileClassification:
          type: string
          enum: [VERSIONED, LEGACY_UNMANAGED]
          description: >-
            VERSIONED만 REQ-INT-104 정량 비교 후보가 될 수 있다. LEGACY_UNMANAGED는
            조회/재생은 가능하지만 새 비교에는 쓰지 않는다.
        sourceBundleDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        imageCount: { type: integer }
        media:
          type: array
          items:
            type: object
            required: [mediaId, objectKey, downloadUrl, expiresAt]
            properties:
              mediaId: { type: string }
              objectKey: { type: string }
              downloadUrl: { type: string }
              expiresAt: { type: string, format: date-time }
        siteCrs:
          description: >-
            현장 등록 시점의 CRS(SiteFrame.crs). 워커가 산출물 등록 시 그대로
            싣는다 — processing_params 로 스스로 신고하지 않는다. null 이면
            현장 원장이 이상 상태다(정상 경로에서는 나타나지 않는다).
          type: [string, 'null']
        groundControl:
          description: >-
            이 조사에 붙은 기준점 파일(있으면). 워커는 이 파일을 받아 첫 줄이
            crs 신고와 같은지 대조한 뒤 재구성 엔진에 gcp_list.txt 로 넘긴다 —
            그래야 성과가 한국 좌표계로 나오고 두 시점 비교가 성립한다. null 이면
            기준점 없이 찍힌 조사이고, 엔진은 EXIF 로 UTM 을 고른다.
          oneOf:
            - $ref: '#/components/schemas/JobInputGroundControlView'
            - type: 'null'
    JobInputGroundControlView:
      type: object
      required: [crs, sha256, downloadUrl, expiresAt]
      properties:
        crs: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        downloadUrl: { type: string }
        expiresAt: { type: string, format: date-time }
    JobInputResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        input: { oneOf: [{ $ref: '#/components/schemas/JobInputView' }, { type: 'null' }] }
        detail: { type: [string, 'null'] }
    ProcessingJobView:
      description: >-
        처리 작업 1건 — 계약 payload(contract) + 운영 메타. 계약 필드의 구조 정본은
        contracts/schemas/processing-job.v1.json 이다.
      type: object
      required:
        [jobId, missionId, siteId, status, issuedAt, issuedBy, updatedAt, detail,
         inputVerified, processingProfileId, processingProfileDigest,
         processingProfileClassification, contract, artifacts, leaseWorkerId,
         leaseExpiresAt, captureWindow]
      properties:
        jobId: { type: string }
        missionId: { type: string }
        siteId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        # 종료 전이에 남긴 사유. 그 전에는 null.
        detail: { type: [string, 'null'] }
        inputVerified:
          type: boolean
          description: >-
            현재는 항상 false — input.totalMegapixels 는 업로더 신고 해상도의
            합이고 전 바이트를 읽어 대조한 값이 아니다. 원본 바이트 재검증 경로는
            아직 없다(산출물이 존재한다는 것과 입력이 신고대로였다는 것은 다른
            사실이라, INV-051 게이트가 이 필드를 대신하지 않는다).
            "검증된 척"하는 기본값을 쓰지 않는다.
        processingProfileId: { type: [string, 'null'] }
        processingProfileDigest:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        processingProfileClassification:
          type: string
          enum: [VERSIONED, LEGACY_UNMANAGED]
        contract: { type: object, additionalProperties: true }
        artifacts:
          description: >-
            이 작업에 등록된 산출물의 계약 payload(등록 순). 구조 정본은
            contracts/schemas/processing-artifact.v1.2.json(검사점을 실으면 v1.3.json) 이다. SUCCEEDED 를
            받쳐주는 근거가 무엇인지 화면이 상태값 하나가 아니라 계보로 볼 수
            있게 싣는다(INV-051).
          type: array
          items: { type: object, additionalProperties: true }
        leaseWorkerId:
          description: 지금 이 작업을 쥔 워커의 principalId. null 이면 아무도 안 쥐고 있다.
          type: [string, 'null']
        leaseExpiresAt:
          description: >-
            lease 만료 시각. **만료 여부를 불리언으로 싣지 않는다** — 응답을 만든
            순간과 화면이 읽는 순간 사이에 만료될 수 있어, 그 판정은 시각을 받은
            쪽이 자기 시계로 해야 한다.
          type: [string, 'null']
          format: date-time
        captureWindow: { $ref: '#/components/schemas/CaptureWindowView' }
    ProcessingJobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs: { type: array, items: { $ref: '#/components/schemas/ProcessingJobView' } }
    PendingProcessingJobView:
      description: >-
        워커가 다음에 잡을 후보 1건 — 최소 노출이다. PROCESSING_WORK 는
        MISSIONS_READ 를 포함하지 않으므로(auth.py) 임무·현장·계약 내용은 싣지
        않는다. jobId 로 lease 를 잡은 다음에야 /input 이 전체 사양을 준다.
      type: object
      required: [jobId, issuedAt]
      properties:
        jobId: { type: string }
        issuedAt: { type: string, format: date-time }
    PendingProcessingJobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs: { type: array, items: { $ref: '#/components/schemas/PendingProcessingJobView' } }
    ProcessingJobMutationResponse:
      description: 발급·전이 공통 응답. verdict 가 결과 코드고, job 은 성공 시에만 실린다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        job: { oneOf: [{ $ref: '#/components/schemas/ProcessingJobView' }, { type: 'null' }] }
        detail: { type: [string, 'null'] }
    ProcessingProfileListResponse:
      description: >-
        Core-issued immutable snapshots. API는 id만 입력받고 이 전체 recipe를 Core가
        확장한다; 이 응답은 편집 surface가 아니다.
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [processingProfileId, profileVersion, provider, engineVersion, ociImage,
               ociImageDigest, executionLocus, processingParams, preprocessing,
               requiredArtifacts, licenseBasis, agplBoundary, profileDigest]
            properties:
              processingProfileId: { type: string, minLength: 1 }
              profileVersion: { type: string, minLength: 1 }
              provider: { type: string, enum: [odm, pix4d_engine, dji_flighthub, metashape_spl, customer_workstation] }
              engineVersion: { type: string, minLength: 1 }
              nodeOdmVersion: { type: [string, 'null'] }
              ociImage: { type: string, minLength: 1 }
              ociImageDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              executionLocus: { type: string, enum: [site_onprem, ksi_server_gpu, customer_workstation, vendor_cloud] }
              processingParams: { type: object, additionalProperties: true }
              preprocessing:
                type: object
                additionalProperties: false
                required: [dynamicObjectMasking, policyVersion]
                properties:
                  dynamicObjectMasking: { type: boolean }
                  policyVersion: { type: string, minLength: 1 }
              requiredArtifacts:
                type: array
                minItems: 1
                items: { type: string }
              licenseBasis:
                type: object
                additionalProperties: false
                required: [licenseId, tier, attributionRequired]
                properties:
                  licenseId: { type: string, minLength: 1 }
                  tier: { type: string, minLength: 1 }
                  attributionRequired: { type: boolean }
              agplBoundary: { type: string, minLength: 1 }
              profileDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    ProcessingArtifactMutationResponse:
      description: >-
        산출물 등록 응답. artifact 는 성공 시에만 실리고, 구조 정본은
        contracts/schemas/processing-artifact.v1.2.json(검사점을 실으면 v1.3.json) 이다 — Core 가 채운
        jobId·lineage.sourceDigest 를 포함한 완전한 계약 payload 다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        artifact:
          oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }]
        detail: { type: [string, 'null'] }

    VolumeChangeResponse:
      description: 체적 리포트 수신 판정. RECORDED 만 durable 기록 성공이다.
      type: object
      required: [verdict, detail]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }

    VolumeChangeListView:
      description: >-
        임무의 체적 리포트 이력(최신 우선). report 의 구조 정본은
        contracts/schemas/volume-change-report.v1.json 이다.
      type: object
      required: [missionId, reportCount, latestTotalNetM3, reports]
      properties:
        missionId: { type: string }
        reportCount: { type: integer, minimum: 0 }
        latestTotalNetM3:
          type: [number, 'null']
          description: 최신 리포트의 전 구역 순변화(m³) — 서버가 계산해 싣는다.
        reports:
          type: array
          items:
            type: object
            required: [report, reportedBy, recordedAt]
            properties:
              report: { type: object, additionalProperties: true }
              reportedBy: { type: [string, 'null'] }
              recordedAt: { type: string, format: date-time }

    ComparisonRequestMutationResponse:
      description: 비교 요청 생성·lease·전이 공통 응답. verdict 가 결과 코드고, request 는 성공 시에만 실린다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        request:
          oneOf: [{ type: object, additionalProperties: true }, { type: 'null' }]
        detail: { type: [string, 'null'] }

    ComparisonPreflightResponse:
      description: >-
        원장을 만들지 않는 정량 비교 사전 판정. `reason`은 compatible=false일 때
        INV-053 typed blocker이고, true일 때 null이다.
      type: object
      required: [compatible]
      properties:
        compatible: { type: boolean }
        reason:
          type: [string, 'null']
          enum:
            - ANALYSIS_NOT_READY
            - PROCESSING_PROFILE_UNKNOWN
            - PROCESSING_PROFILE_MISMATCH
            - SOURCE_LINEAGE_GAP
            - CRS_MISMATCH
            - VERTICAL_REFERENCE_MISMATCH
            - DESIGN_SURFACE_NOT_VERIFIED
            - DESIGN_NORMALIZATION_MISMATCH
            - UNKNOWN_MISSION
            - UNKNOWN_JOB
            - JOB_NOT_SUCCEEDED
            - SELF_COMPARISON
            - SITE_MISMATCH
            - MISSION_MISMATCH
            - NOTHING_TO_COMPARE
            - null
        detail: { type: [string, 'null'] }

    ComparisonRequestListResponse:
      description: >-
        각 항목의 구조 정본은 contracts/schemas/comparison-request.v1.json 이다.
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { type: object, additionalProperties: true }

    PendingComparisonRequestView:
      description: >-
        워커가 다음에 잡을 후보 1건 — 최소 노출(PendingProcessingJobView 와 동형).
        PROCESSING_WORK 는 MISSIONS_READ 를 포함하지 않으므로 임무·현장·비교
        대상까지 여기서 드러내지 않는다.
      type: object
      required: [requestId, requestedAt]
      properties:
        requestId: { type: string }
        requestedAt: { type: string, format: date-time }

    PendingComparisonRequestListResponse:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/PendingComparisonRequestView' }

    ComparisonRequestView:
      description: >-
        비교 요청 1건의 조회 표현 — 계약 payload + 운영 메타(lease). request 의
        구조 정본은 contracts/schemas/comparison-request.v1.json 이다.
      type: object
      required: [request, leaseWorkerId, leaseExpiresAt]
      properties:
        request:
          type: object
          additionalProperties: true
          description: >-
            `contracts/schemas/comparison-request.v1.json` payload. schemaVersion=1.1
            request에는 Core가 판정해 고정한 `processingProfileDigest`,
            `baselineSourceBundleDigest`, `currentSourceBundleDigest`가 모두 있다.
            historical 1.0 request에는 세 anchor가 없으며 조회는 가능하지만 새
            정량 비교의 근거로 재사용할 수 없다.
          properties:
            schemaVersion: { type: string, enum: ['1.0', '1.1'] }
            processingProfileDigest: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
            baselineSourceBundleDigest: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
            currentSourceBundleDigest: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
        leaseWorkerId: { type: [string, 'null'] }
        leaseExpiresAt: { type: [string, 'null'], format: date-time }

    ComparisonRequestInputView:
      description: >-
        워커가 실제로 계산하는 데 필요한 것 — presigned GET URL + 그 산출물의
        참조(jobId+artifactId, ChangeDetectionResult/VolumeChangeReport 제출에
        필요하다).
      type: object
      required:
        [requestId, missionId, status, policy, pointCloudBaseline, pointCloudBaselineUrl,
         pointCloudCurrent, pointCloudCurrentUrl, dsmBaseline, dsmBaselineUrl,
         dsmCurrent, dsmCurrentUrl, zones, zoneCrs,
         dsmBaselineVerticalReference, dsmCurrentVerticalReference,
         dsmBaselineCheckpointRmseM, dsmCurrentCheckpointRmseM]
      properties:
        requestId: { type: string }
        missionId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        policy: { $ref: '#/components/schemas/ComparisonPolicy' }
        pointCloudBaseline:
          oneOf: [{ $ref: '#/components/schemas/ArtifactRef' }, { type: 'null' }]
        pointCloudBaselineUrl: { type: [string, 'null'] }
        pointCloudCurrent:
          oneOf: [{ $ref: '#/components/schemas/ArtifactRef' }, { type: 'null' }]
        pointCloudCurrentUrl: { type: [string, 'null'] }
        dsmBaseline:
          oneOf: [{ $ref: '#/components/schemas/ArtifactRef' }, { type: 'null' }]
        dsmBaselineUrl: { type: [string, 'null'] }
        dsmCurrent:
          oneOf: [{ $ref: '#/components/schemas/ArtifactRef' }, { type: 'null' }]
        dsmCurrentUrl: { type: [string, 'null'] }
        zones:
          oneOf:
            - { type: object, additionalProperties: { type: object } }
            - { type: 'null' }
        zoneCrs: { type: [string, 'null'] }
        dsmBaselineVerticalReference:
          oneOf: [{ $ref: '#/components/schemas/VerticalReference' }, { type: 'null' }]
        dsmCurrentVerticalReference:
          description: >-
            두 DSM 산출물이 등록 시 선언한 수직기준(contracts/schemas/
            processing-artifact.v1.2.json). VolumeChangeReport.verticalDatum 에
            실릴 값의 출처다 — 워커는 이 값을 쓰고, 상수를 가정하지 않는다.
            null 은 '수직기준 미상'(그 개념 이전에 등록된 산출물 등)이고 Core 는
            그 자리를 어떤 기본값으로도 채우지 않는다. 둘 중 하나라도 null 이면
            워커는 레거시 상수(ellipsoidal_native)로 대체하고 경고를 남긴다 —
            기존 M1/M2 산출물의 비교를 무효화하지 않기 위해서다.
          oneOf: [{ $ref: '#/components/schemas/VerticalReference' }, { type: 'null' }]
        dsmBaselineCheckpointRmseM:
          type: [number, 'null']
          minimum: 0
        dsmCurrentCheckpointRmseM:
          description: >-
            각 DSM 이 등록 시 신고한 독립 검사점 잔차(meter,
            processing-artifact.v1.3.json 의 checkpointRmseM). 워커의 체적
            오차한계(uncertaintyM3) 계산이 받을 자격이 있는 유일한 값이다 —
            accuracy.rmse(GCP 피팅 잔차)는 절대정확도가 아니므로 이 자리에
            싣지 않는다(INV-024). null 은 '그 epoch 은 검증되지 않음'이고,
            둘 중 하나라도 null 이면 오차한계는 null 이 된다(한쪽만 알면
            차분의 오차를 말할 수 없다). 값의 진위는 서버가 확인하지 않는다
            (귀속이지 관측이 아니다).
          type: [number, 'null']
          minimum: 0

    # ── ADR-KSI-031 independent checkpoint validation ─────────────────────
    CheckpointFileDeclared:
      type: object
      additionalProperties: false
      required: [filename, sha256, sizeBytes, crs, verticalReference, independentFromProcessingAttested, independenceBasis]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        crs: { type: string, minLength: 1 }
        verticalReference:
          allOf: [{ $ref: '#/components/schemas/VerticalReference' }]
          description: source must be user_declared; pipeline_declared is rejected by the live contract
        independentFromProcessingAttested: { const: true }
        independenceBasis: { type: string, minLength: 1, maxLength: 1000 }
    CheckpointValidationStatus:
      type: string
      enum: [REGISTERED, SEALED, VALIDATED, REJECTED]
    CheckpointValidationRejectionReason:
      type: string
      enum: [CHECKPOINT_DIGEST_MISMATCH, CHECKPOINT_SIZE_MISMATCH, CHECKPOINT_OBJECT_MISSING, DSM_DIGEST_MISMATCH, DSM_OBJECT_MISSING, DSM_CRS_MISMATCH, INVALID_CHECKPOINT_CSV, CHECKPOINT_COUNT_OUT_OF_RANGE, CHECKPOINT_OUTSIDE_DSM, DSM_NODATA_AT_CHECKPOINT, UNREADABLE_DSM, UNSUPPORTED_DSM, INVALID_MEASUREMENT]
    CheckpointValidationObserved:
      type: object
      additionalProperties: false
      required: [checkpointSha256, checkpointSizeBytes, dsmDigest, dsmCrs, pointCount, meanErrorM, maeM, rmseM, maxAbsErrorM, measuredAt, measuredBy]
      properties:
        checkpointSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        checkpointSizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        dsmDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        dsmCrs: { type: string, minLength: 1 }
        pointCount: { type: integer, minimum: 3, maximum: 10000 }
        meanErrorM: { type: number }
        maeM: { type: number, minimum: 0 }
        rmseM: { type: number, minimum: 0 }
        maxAbsErrorM: { type: number, minimum: 0 }
        measuredAt: { type: string, format: date-time }
        measuredBy: { type: string, minLength: 1 }
    CheckpointValidation:
      type: object
      additionalProperties: false
      required: [validationId, organizationId, missionId, siteId, dsm, dsmDigest, dsmCrs, dsmVerticalReference, declared, status, registeredAt, registeredBy]
      properties:
        schemaVersion: { const: '1.0', default: '1.0' }
        validationId: { type: string, minLength: 1 }
        organizationId: { type: string, minLength: 1 }
        missionId: { type: string, minLength: 1 }
        siteId: { type: string, minLength: 1 }
        dsm: { $ref: '#/components/schemas/ArtifactRef' }
        dsmDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        dsmCrs: { type: string, minLength: 1 }
        dsmVerticalReference: { $ref: '#/components/schemas/VerticalReference' }
        declared: { $ref: '#/components/schemas/CheckpointFileDeclared' }
        validationProfileId: { const: ksi-dsm-checkpoint-nearest-v1, default: ksi-dsm-checkpoint-nearest-v1 }
        validationProfileDigest: { const: 'sha256:be58e685bc92e5aa82003a03da1eb489b44db983b0838c4117afb538879b9b6c', default: 'sha256:be58e685bc92e5aa82003a03da1eb489b44db983b0838c4117afb538879b9b6c' }
        status: { $ref: '#/components/schemas/CheckpointValidationStatus' }
        registeredAt: { type: string, format: date-time }
        registeredBy: { type: string, minLength: 1 }
        sealedAt: { type: [string, 'null'], format: date-time }
        observed:
          oneOf: [{ $ref: '#/components/schemas/CheckpointValidationObserved' }, { type: 'null' }]
        rejectionReason:
          oneOf: [{ $ref: '#/components/schemas/CheckpointValidationRejectionReason' }, { type: 'null' }]
        rejectionDetail: { type: [string, 'null'], maxLength: 500 }
    CheckpointValidationRegisterRequest:
      type: object
      additionalProperties: false
      required: [declared]
      properties:
        declared: { $ref: '#/components/schemas/CheckpointFileDeclared' }
    CheckpointValidationObservationRequest:
      type: object
      additionalProperties: false
      required: [checkpointSha256, checkpointSizeBytes, dsmDigest, dsmCrs, pointCount, meanErrorM, maeM, rmseM, maxAbsErrorM]
      properties:
        checkpointSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        checkpointSizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        dsmDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        dsmCrs: { type: string, minLength: 1 }
        pointCount: { type: integer, minimum: 3, maximum: 10000 }
        meanErrorM: { type: number }
        maeM: { type: number, minimum: 0 }
        rmseM: { type: number, minimum: 0 }
        maxAbsErrorM: { type: number, minimum: 0 }
    CheckpointValidationFailureRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/CheckpointValidationRejectionReason' }
        detail: { type: [string, 'null'], maxLength: 500 }
    CheckpointValidationResponse:
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        validation:
          oneOf: [{ $ref: '#/components/schemas/CheckpointValidation' }, { type: 'null' }]
        validationId: { type: [string, 'null'] }
        objectKey: { type: [string, 'null'] }
        uploadUrl: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
    CheckpointValidationListResponse:
      type: object
      additionalProperties: false
      required: [validations]
      properties:
        validations:
          type: array
          items: { $ref: '#/components/schemas/CheckpointValidation' }
    PendingCheckpointValidation:
      type: object
      additionalProperties: false
      required: [validationId, checkpointDownloadUrl, dsmDownloadUrl, checkpointCrs, checkpointVerticalReference, dsmCrs, dsmVerticalReference, expiresAt]
      properties:
        validationId: { type: string }
        checkpointDownloadUrl: { type: string }
        dsmDownloadUrl: { type: string }
        checkpointCrs: { type: string }
        checkpointVerticalReference:
          allOf: [{ $ref: '#/components/schemas/VerticalReference' }]
          description: source is always user_declared
        dsmCrs: { type: string }
        dsmVerticalReference: { $ref: '#/components/schemas/VerticalReference' }
        expiresAt: { type: string, format: date-time }
    PendingCheckpointValidationListResponse:
      type: object
      additionalProperties: false
      required: [validations]
      properties:
        validations:
          type: array
          items: { $ref: '#/components/schemas/PendingCheckpointValidation' }

    VerticalReference:
      description: >-
        높이의 기준 + 그 기준을 아는 근거 + 귀속. 정본은
        packages/event-contracts 의 ksi_event_contracts.vertical_reference 다.
        값이 있어도 그것은 관측이 아니라 귀속이다 — 어떤 파일 포맷도 수직기준을
        신뢰성 있게 담지 않으므로 datum 하나가 아니라 basis(왜 아는가)와
        source(누구의 주장인가)를 함께 강제한다.
      type: object
      additionalProperties: false
      required: [datum, basis, source]
      properties:
        datum:
          type: string
          enum: [ellipsoidal, ellipsoidal_native, orthometric_kngeoid2018, orthometric_kngeoid2024]
        basis: { type: string, minLength: 1 }
        source: { type: string, enum: [pipeline_declared, user_declared] }

    ArtifactRef:
      description: 산출물 참조 — artifactId 는 처리 작업 단위로만 고유해 jobId 와 짝으로 해석한다.
      type: object
      required: [jobId, artifactId]
      properties:
        jobId: { type: string }
        artifactId: { type: string }

    ComparisonPolicy:
      description: >-
        두 시점 비교가 실제로 쓰는 고정 기준값 한 벌. 정본은
        ksi_event_contracts.comparison_policy 이고, 조회 표면(/v1/comparison-policy)과
        계산 코드(services/change-detection)가 같은 자리를 읽는다. 비교 요청은 생성
        시점에 이 값을 불변 스냅샷으로 굳혀 둔다(comparison-request.v1.json 의 policy).
      type: object
      # schemaVersion 은 기본값이 있어 요청 본문에서 생략 가능하다 — FastAPI 가
      # required 로 내지 않으므로 여기서도 빼야 계약과 구현이 갈리지 않는다
      # (응답에는 항상 실린다).
      required:
        [policyVersion, distanceThresholdM, volumeThresholdM, revisitRatioThreshold]
      properties:
        schemaVersion: { type: string, enum: ['1.0'] }
        policyVersion: { type: string }
        distanceThresholdM: { type: number, minimum: 0 }
        volumeThresholdM: { type: number, minimum: 0 }
        revisitRatioThreshold: { type: number, minimum: 0, maximum: 1 }

    ComparisonRequestInputResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        input:
          oneOf: [{ $ref: '#/components/schemas/ComparisonRequestInputView' }, { type: 'null' }]
        detail: { type: [string, 'null'] }


    ArtifactUploadUrlResponse:
      description: >-
        산출물 바이트를 올릴 자리. objectKey 는 Core 가 식별자에서 유도한 값이라
        같은 (작업, 산출물)이면 항상 같다 — 재시도가 사본을 만들지 않는다.
        uploadUrl 은 그 자리에 대한 presigned PUT 이고 expiresAt 이후 무효다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        objectKey: { type: [string, 'null'] }
        uploadUrl: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        detail: { type: [string, 'null'] }

    ArtifactDownloadResponse:
      description: >-
        등록된 산출물의 바이트를 받을 presigned GET. 원장에 없는 산출물에는
        발급하지 않는다(404 ARTIFACT_NOT_FOUND) — 키가 유도 가능하다고 해서
        존재하지 않는 자리의 링크를 내주면 원인이 스토리지까지 밀린다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        objectKey: { type: [string, 'null'] }
        downloadUrl: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        files:
          description: >-
            산출물이 파일 여러 개(메시 등)일 때만 채워진다 — 주 파일을 포함해
            **전부** 나열한다(objectKey/downloadUrl 과 겹쳐 특수 케이스하지
            않도록). 파일 하나짜리 산출물은 null(생략) —
            mesh-multi-file-artifact-persistence.
          type: [array, 'null']
          items:
            type: object
            required: [name, objectKey, downloadUrl]
            properties:
              name: { type: string }
              objectKey: { type: string }
              downloadUrl: { type: string }
        detail: { type: [string, 'null'] }

    # ── 설계 기준면(M4-A) ────────────────────────────────────────────────
    #
    # `surface` 필드의 구조 정본은 contracts/schemas/design-surface.v1.json 이다
    # (declared=주장 / observed=사실 두 블록 + 상태 + 거부 사유). 여기서는 자유
    # 형태로 두고 필드 이름만 대조한다 — 위 "타입은 구현의 정밀도까지 복제하지
    # 않는다" 주석과 같은 원칙.
    DesignSurfaceRegisterResponse:
      type: object
      required: [verdict]
      properties:
        verdict:
          description: REGISTERED · UNKNOWN_SITE · DECLARATION_CONFLICT · INVALID_SITE_ID · STORE_UNAVAILABLE
          type: string
        detail: { type: [string, 'null'] }
        designSurfaceId: { type: [string, 'null'] }
        objectKey: { type: [string, 'null'] }
        # REGISTERED 일 때만 채워진다 — 발급 실패는 STORE_UNAVAILABLE 로 격하되고
        # 원장 등록은 이미 durable 하다(같은 선언 재전송으로 재발급된다).
        uploadUrl: { type: [string, 'null'] }
        canonicalObjectKey:
          type: [string, 'null']
          description: >-
            LandXML에서 trusted worker가 올릴 canonical GeoTIFF의 서버 유도 키.
            원본 objectKey와 다르며 원본 XML을 덮어쓰지 않는다.
        expiresAt: { type: [string, 'null'] }
        surface: { type: [object, 'null'], additionalProperties: true }
    DesignSurfaceSealResponse:
      type: object
      required: [verdict]
      properties:
        verdict:
          description: SEALED · ALREADY_SEALED · UNKNOWN_DESIGN_SURFACE · ALREADY_JUDGED · STORE_UNAVAILABLE
          type: string
        detail: { type: [string, 'null'] }
        surface: { type: [object, 'null'], additionalProperties: true }
    DesignSurfaceListResponse:
      type: object
      required: [surfaces]
      properties:
        surfaces:
          type: array
          items: { type: object, additionalProperties: true }
    # ── M4-C 작업구역·진척 ────────────────────────────────────────────────
    # 계약 정본은 contracts/schemas/work-area.v1.json 과
    # packages/event-contracts 의 work_area.py·design_progress.py 다 —
    # 여기서는 API 표면의 봉투(verdict·detail)만 적는다.
    WorkAreaResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        workArea:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
    WorkAreaListResponse:
      type: object
      required: [workAreas]
      properties:
        workAreas:
          type: array
          items: { type: object, additionalProperties: true }
    ReportExportCreateRequest:
      type: object
      additionalProperties: false
      required: [exportId, exportFormat, baselineDesignConformanceId, latestDesignConformanceId]
      properties:
        exportId: { type: string, minLength: 1, maxLength: 128 }
        exportFormat: { type: string, enum: [PDF, CSV] }
        baselineDesignConformanceId: { type: string, minLength: 1, maxLength: 128 }
        latestDesignConformanceId: { type: string, minLength: 1, maxLength: 128 }
    ReportExportSource:
      type: object
      additionalProperties: false
      required:
        [designConformanceId, reportDigest, missionId, requestId, computedAt,
         currentJobId, currentArtifactId, diffRasterId, diffRasterDigest,
         coreRecomputedDiffRasterDigest, processingProfileDigest, sourceBundleDigest]
      properties:
        designConformanceId: { type: string }
        reportDigest:
          description: Core canonical digest of the complete immutable design-conformance report.
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        missionId: { type: string }
        requestId: { type: string }
        computedAt: { type: string, format: date-time }
        currentJobId: { type: string }
        currentArtifactId: { type: string }
        diffRasterId: { type: string }
        diffRasterDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        coreRecomputedDiffRasterDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        processingProfileDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        sourceBundleDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    ReportExportSnapshot:
      type: object
      additionalProperties: false
      required:
        [siteId, designSurfaceId, designSurfaceRevision,
         designSurfaceSha256, designNormalizationProfile, designNormalizationDigest,
         baseline, latest]
      properties:
        schemaVersion: { const: '1.0' }
        siteId: { type: string }
        designSurfaceId: { type: string }
        designSurfaceRevision: { type: string }
        designSurfaceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        designNormalizationProfile: { type: string }
        designNormalizationDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        baseline: { $ref: '#/components/schemas/ReportExportSource' }
        latest: { $ref: '#/components/schemas/ReportExportSource' }
    ReportExportCreateResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        exportId: { type: [string, 'null'] }
        recordedAt: { type: [string, 'null'], format: date-time }
        snapshotDigest: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
        contentProducedByServer:
          description: Always false. PDF/CSV bytes remain browser-produced and are never claimed by Core.
          const: false
        detail: { type: [string, 'null'] }
    ReportExportEntry:
      type: object
      additionalProperties: false
      required:
        [exportId, exportFormat, actor, recordedAt, snapshot, snapshotDigest]
      properties:
        exportId: { type: string }
        exportFormat: { type: string, enum: [PDF, CSV] }
        actor: { type: string }
        recordedAt: { type: string, format: date-time }
        snapshot: { $ref: '#/components/schemas/ReportExportSnapshot' }
        snapshotDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        contentProducedByServer: { const: false }
    ReportExportListView:
      type: object
      additionalProperties: false
      required: [siteId, exportCount, exports]
      properties:
        siteId: { type: string }
        exportCount: { type: integer, minimum: 0 }
        exports:
          type: array
          items: { $ref: '#/components/schemas/ReportExportEntry' }
    ProgressBaselineResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
    DesignProgressResponse:
      type: object
      # progress 와 detail 중 **하나는 항상 채워진다** — 빈 표를 200 으로 내면
      # 화면이 "데이터 없음"과 "이어붙일 수 없음"을 갈라 말할 수 없다.
      properties:
        progress:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        unmatchedZoneIds:
          description: 한쪽 시점에만 있던 구역 — 표에서 빠진 이유를 화면이 밝힌다.
          type: array
          items: { type: string }
        areaMismatchZoneIds:
          description: >-
            양쪽에 다 있었지만(zoneId 일치) 측정 면적이 크게 달라 "같은 곳을
            쟀다"고 볼 수 없어 표에서 뺀 구역 — unmatched 와는 다른 사유다.
          type: array
          items: { type: string }
        reason:
          description: >-
            progress가 null일 때의 typed fail-closed blocker. 예:
            PROCESSING_PROFILE_UNKNOWN / PROCESSING_PROFILE_MISMATCH /
            DESIGN_NORMALIZATION_MISMATCH. detail은 사람용 설명이고 reason은 UI
            행동(재처리·같은 설계 개정 선택 등)을 고르는 안정된 코드다.
          type: [string, 'null']
        detail: { type: [string, 'null'] }
        latestMissionId:
          description: >-
            최신 리포트가 속한 임무 — UI 편의값(히트맵은 임무 스코프 표면이라
            거기로 건너뛸 때만 쓴다). progress 가 없으면 항상 null.
          type: [string, 'null']
    PendingDesignSurfaceView:
      type: object
      # 선언값(sha256·crs)이 **없는 것이 이 모델의 요점이다** — 워커가 정답을
      # 되읊어 통과하는 경로를 구조적으로 없앤다.
      required: [designSurfaceId, siteId, sealedAt, downloadUrl, expiresAt]
      properties:
        designSurfaceId: { type: string }
        siteId: { type: string }
        sealedAt: { type: [string, 'null'] }
        downloadUrl: { type: string }
        sourceFormat: { type: string, enum: [geotiff, landxml], default: geotiff }
        surfaceSelector: { type: [string, 'null'] }
        declaredCrs:
          type: [string, 'null']
          description: >-
            LandXML TIN rasterization이 canonical GeoTIFF를 만들 때 쓸 declared CRS.
            GeoTIFF 직접 검증은 파일 관측값을 계속 사용한다.
        normalizationUploadUrl:
          type: [string, 'null']
          description: >-
            LandXML일 때만 canonical GeoTIFF bytes를 trusted worker가 올릴
            presigned URL. 원본 upload URL과 분리돼 있다.
        expiresAt: { type: string }
    PendingDesignSurfaceListResponse:
      type: object
      required: [surfaces]
      properties:
        surfaces:
          type: array
          items: { $ref: '#/components/schemas/PendingDesignSurfaceView' }
    DesignSurfaceObservationResponse:
      type: object
      required: [verdict]
      properties:
        verdict:
          description: >-
            VERIFIED · REJECTED · UNKNOWN_DESIGN_SURFACE · NOT_SEALED ·
            ALREADY_JUDGED · INVALID_MEASUREMENT · STORE_UNAVAILABLE
          type: string
        detail: { type: [string, 'null'] }
        # typed verdict — 화면이 한국어 문구로 번역한다(8종).
        rejectionReason: { type: [string, 'null'] }
        surface: { type: [object, 'null'], additionalProperties: true }
    DesignSurfaceSourceLineage:
      description: >-
        LandXML 원본을 canonical GeoTIFF로 바꾸는 불변 계보. 원본 XML bytes와
        정규화 결과 bytes는 다른 evidence object이고 각각의 digest가 여기에
        결속된다.
      type: object
      additionalProperties: false
      required:
        [sourceSha256, surfaceSelector, parserVersion,
         normalizationProfile, canonicalSha256]
      properties:
        sourceFormat: { type: string, enum: [landxml], default: landxml }
        sourceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        surfaceSelector: { type: string, minLength: 1 }
        parserVersion: { type: string, minLength: 1 }
        normalizationProfile: { type: string, minLength: 1 }
        canonicalSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    DesignConformanceRequestView:
      type: object
      description: >-
        설계 대비 요청 1건 — 지시 + **요청 시점 스냅샷**(설계면 해시·구역·기준값)
        + 운영 메타(lease·Core 가 확인한 래스터 digest).
      # nullable 이어도 **자리는 항상 있다**(모델에 기본값이 없다) — 소비자가
      # "키가 없다"와 "값이 null 이다"를 가르지 않아도 되게 한다.
      required:
        [requestId, designConformanceId, missionId, siteId, designSurfaceId,
         designSurfaceSha256, processingProfileDigest, sourceBundleDigest,
         designSurfaceRevision, designNormalizationProfile, designNormalizationDigest,
         current, zones, zoneCrs, policy, status,
         requestedAt, requestedBy, updatedAt, detail, leaseWorkerId,
         leaseExpiresAt, diffRasterDigest, diffRasterVerifiedAt]
      properties:
        requestId: { type: string }
        # 리포트 id — requestId 에서 결정적으로 도출된다(리포트에는 requestId 가
        # 없으므로 Core 가 결과를 지시로 되짚는 유일한 경로다).
        designConformanceId: { type: string }
        missionId: { type: string }
        siteId: { type: string }
        designSurfaceId: { type: string }
        # 요청 시점 VERIFIED 설계면의 **관측된** 해시(접두사 없는 16진).
        designSurfaceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        processingProfileDigest:
          description: >-
            current epoch의 immutable processing profile snapshot digest. legacy
            request에는 null일 수 있지만 새 정량 설계 대비 요청은 null을 허용하지
            않는다(INV-053).
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        sourceBundleDigest:
          description: current epoch이 결속한 sealed source bundle digest.
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        designSurfaceRevision:
          description: 요청 시점에 고정한 설계면 revision label.
          type: [string, 'null']
        designNormalizationProfile:
          description: >-
            설계면을 비교 가능한 canonical raster로 만든 정규화 profile. 직접
            GeoTIFF와 LandXML 변환을 서로 다른 규칙으로 조용히 섞지 않는다.
          type: [string, 'null']
        designNormalizationDigest:
          description: canonical normalized design raster digest.
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        current: { type: object, additionalProperties: true }
        zones: { type: object, additionalProperties: { type: object } }
        zoneCrs: { type: string }
        policy: { type: object, additionalProperties: true }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        requestedAt: { type: string, format: date-time }
        requestedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        detail: { type: [string, 'null'] }
        leaseWorkerId: { type: [string, 'null'] }
        leaseExpiresAt: { type: [string, 'null'], format: date-time }
        # Core 가 차분 래스터 바이트를 직접 재해싱해 확인한 값 — 아직 없으면 null.
        diffRasterDigest: { type: [string, 'null'] }
        diffRasterVerifiedAt: { type: [string, 'null'], format: date-time }
    DesignConformanceRequestMutationResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        request:
          oneOf:
            - { $ref: '#/components/schemas/DesignConformanceRequestView' }
            - { type: 'null' }
        detail: { type: [string, 'null'] }
    DesignConformanceRequestListResponse:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/DesignConformanceRequestView' }
    PendingDesignConformanceRequestListResponse:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            type: object
            required: [requestId, requestedAt]
            description: 최소 노출 — lease 를 잡은 다음에야 /input 이 전체 사양을 준다.
            properties:
              requestId: { type: string }
              requestedAt: { type: string, format: date-time }
    DesignConformanceInputResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        input:
          type: [object, 'null']
          additionalProperties: false
          required:
            [requestId, missionId, status, policy, designConformanceId, diffRasterId,
             designSurfaceId, designSurfaceSha256, designSurfaceUrl,
             designVerticalReference, current, currentUrl, currentVerticalReference,
             zones, zoneCrs]
          properties:
            requestId: { type: string }
            missionId: { type: string }
            status: { type: string }
            policy: { type: object, additionalProperties: true }
            designConformanceId: { type: string }
            diffRasterId: { type: string }
            designSurfaceId: { type: string }
            designSurfaceSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            designSurfaceUrl: { type: string }
            designVerticalReference: { type: object, additionalProperties: true }
            current: { type: object, additionalProperties: true }
            currentUrl: { type: string }
            currentVerticalReference: { type: object, additionalProperties: true }
            zones: { type: object, additionalProperties: { type: object } }
            zoneCrs: { type: string }
    DiffRasterUploadUrlResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        # 서버가 정한 자리 — 워커가 고르지 않는다.
        objectKey: { type: [string, 'null'] }
        uploadUrl: { type: [string, 'null'] }
        contentType: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        detail: { type: [string, 'null'] }
    DiffRasterVerificationResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        # **Core 가 스토리지 바이트에서 직접 계산한 값**(신고값이 아니다).
        digest: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'] }
        # 리포트의 diffRaster.coreVerifiedDigestAt 에 그대로 실린다.
        verifiedAt: { type: [string, 'null'], format: date-time }
        detail: { type: [string, 'null'] }
    DesignConformanceResponse:
      type: object
      required: [verdict, detail]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
    DesignConformanceListView:
      type: object
      required: [missionId, reportCount, latestTotalNetM3, reports]
      properties:
        missionId: { type: string }
        reportCount: { type: integer }
        # 최신 리포트의 전 구역 순 성토 필요량 — 화면이 배열을 직접 합산하지 않게
        # 서버가 계산해 준다(합산 규칙이 두 곳에 있으면 한쪽만 고쳐진다).
        latestTotalNetM3: { type: [number, 'null'] }
        reports:
          type: array
          items:
            type: object
            required: [report, recordedAt, coreRecomputedDigest]
            properties:
              report:
                description: contracts/schemas/design-conformance-report.v1.json
                type: object
                additionalProperties: true
              reportedBy: { type: [string, 'null'] }
              recordedAt: { type: string, format: date-time }
              coreRecomputedDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    DiffRasterViewResponse:
      type: object
      required:
        [designConformanceId, diffRasterId, digest, sizeBytes, downloadUrl, expiresAt]
      properties:
        designConformanceId: { type: string }
        diffRasterId: { type: string }
        digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        sizeBytes: { type: integer }
        downloadUrl: { type: string }
        expiresAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC operator JWT or opaque device credential
      description: >-
        Bearer 인증(ADR-KSI-008 §2, ADR-KSI-024) — 사람 OPERATOR는 배포 mode에
        따라 OIDC JWT를 사용하며 signature, iss, aud, exp, nbf, kid, algorithm과
        KSI principal/organization/role claim을 검증한다. GATEWAY_DEVICE,
        EDGE_DEVICE, PROCESSING_WORKER는 별도 opaque 장비 자격을 사용하고 서버는
        sha256(token) digest → Principal 매핑만 보유하며 원문을 저장하지 않는다. 인증 실패는
        사유(부재/형식오류/미지 토큰)를 가리지 않는 동일 401(WWW-Authenticate:
        Bearer) — detail 로 존재 여부 힌트를 주지 않는다. 공개 allowlist는
        /health·/capabilities 와 FastAPI 기본 문서 라우트(/openapi.json·
        /docs·/redoc, `create_app(expose_docs=...)` 로 끌 수 있다 — 기본
        True) 뿐이며, 나머지 전 경로는 인증 필수(재검토 P2 — 이전 서술은 문서
        라우트가 실제로 무인증 공개인 사실을 반영하지 않았다).
