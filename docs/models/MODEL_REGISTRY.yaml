# Model Registry — 모델·가중치 계보 SSOT (INV-043: Dataset/Model 라이선스·출처 계보 고정)
#
# 규칙:
# - 모델 이름에 "coco"가 들어 있다는 것만으로 계보를 신뢰하지 않는다 — revision·sha256 이
#   신원이다. adapter 는 이 파일의 digest 와 대조 검증한 파일만 로드한다.
# - 런타임 자동 다운로드 금지. 파일은 tools/fetch_model.py 로만 받는다.
# - deployment_status.production 은 MODEL-B1-001 production_gate 전부 통과 전에는
#   BLOCKED_LEGAL_REVIEW 를 유지한다. ENGINEERING 승인 ≠ PRODUCTION 승인.

models:
  - model_id: ksi-person-detector-dfine-s-coco
    architecture: D-FINE-S
    decision_ref: MODEL-B1-001

    source:
      repository: Peterande/D-FINE
      repository_commit: "7fe2f8889f0b7b817f20c315b40fc15a4fb64ae6"  # master 2026-07-09
      code_license: Apache-2.0

    weights:
      source: ustc-community/dfine-small-coco
      revision: "f79e65b5fbb33ceb9d3ebba042955d7410c608f8"  # immutable HF revision
      files:
        - name: model.safetensors
          sha256: "a144baff3a27bfd538fe37b11fa8d4fca5744b8c054b5301e7c699a1379cd18f"
        - name: config.json
          sha256: "9f206c4c935c67c957af2f15c3333b4ff224e72b1881bc7bbde9f873edf4448e"
        - name: preprocessor_config.json
          sha256: "7e9e2245806aa3ef068a5321f5eebee3116fa4cec560173231954ffaca930eca"
      declared_license: Apache-2.0

    model_facts:
      num_labels: 80            # COCO 80-class (config.json id2label 확인)
      person_label_id: 0        # id2label["0"] == "person"
      input_size: [640, 640]    # RTDetrImageProcessor resize
      params_m: 10.2
      coco_ap_50_95: 48.5       # 공식 README (T4 기준 — Manifold 실측 아님)

    pretraining:
      declared_dataset: COCO
      objects365_used: false
      visdrone_used: false
      # "깨끗"이 아니라 잔여 위험 포함 검토 완료 — COCO 이미지는 Flickr 개별 라이선스로
      # 권리가 이질적이다(대표자 판정 2026-07-27). Objects365 대비 명확히 낮은 위험의
      # 엔지니어링 기준선이지, 상용 법무 승인을 의미하지 않는다.
      lineage_status: REVIEWED_WITH_RESIDUAL_RISK

    # ONNX Export Recipe (B2 선결 — onnx-export-recipe risk 폐쇄, 2026-07-28 실측).
    # 산출물 자체는 git 에 넣지 않는다 — export 시 <output>.manifest.json 이 전체
    # 계보를 담고, 여기는 재현 계약의 요약이다. digest 는 **아래 toolchain 고정
    # 환경에서의 실측**이며, toolchain 이 바뀌면 digest 도 바뀐다(재실측 필요).
    export:
      exporter: "torch.onnx.export(dynamo=False)  # legacy — dynamo 는 aten._is_all_true 미지원(실측)"
      opset: 17
      toolchain:
        python: "3.12.13"
        torch: "2.13.0+cpu"
        transformers: "5.14.1"
        onnx: "1.22.0"
        onnxruntime: "1.28.0"
      inputs:
        - name: pixel_values
          shape: [1, 3, 640, 640]
          dtype: float32
          axes: "static (전처리가 640x640 고정, batch=1)"
      outputs: [logits, pred_boxes]
      graph_transforms:
        - "position embedding constants float64 → float32 (7 지점 — ORT CPU·TensorRT 는 double Cos/Sin 미지원)"
        - "surplus trace outputs 제거 — legacy exporter 가 남긴 내부 텐서 출력을 걷어내 그래프 출력을 선언 계약(logits·pred_boxes)으로 고정(재검토 P0 #8 세션 실계약 대조의 전제)"
      determinism: "BYTE-IDENTICAL — 동일 입력 2회 export sha256 일치 (2026-07-28 재실측, surplus 제거 반영)"
      onnx_sha256: "1becd2d3ae559cd075157f542bf754d2bdbf1982e71433d2ed367364df03298a"
      conformance:
        corpus: "tools/build_onnx_corpus.py 10종 (단일/다수/무탐지/소형/경계/겹침/차량/미지원/노이즈/부분가시) — 장면별 의도 현상은 실측 앵커로 고정(test_onnx_conformance)"
        criteria: "detection 수·canonical class·원시 id/이름/버전 정확 일치 · confidence atol 1e-3 · bbox atol 0.5px · drop 사유 정확 일치 · 경로별 결정성"
        cross_path_fingerprint: >-
          미보장 — ONNX 와 PyTorch 는 연산 순서가 달라 bit-exact 를 보장하지 않으므로
          cross-경로는 허용오차 기반 의미 비교, fingerprint 결정성은 경로 내 2회
          실행으로 고정(tests/contract/test_onnx_conformance.py)
      tensorrt_note: "TensorRT 변환·성능·발열 판정은 B2 Manifold HIL 의 몫 — 이 섹션은 export 계약까지만"

    deployment_status:
      b1_adapter: APPROVED
      manifold_hil: PENDING
      production: BLOCKED_LEGAL_REVIEW

  - model_id: ksi-crack-segmenter-mixercseg-deepcrack
    architecture: MixerCSeg
    decision_ref: MODEL-P4-001

    source:
      repository: spiderforest/MixerCSeg
      repository_commit: "7ad3fd6fd0e9bc60d1eb9c3b50292d876485dd1d"  # main 2026-03-09
      code_license: MIT
      vendored_at: "services/defect-detection/src/ksi_defect_detection/_vendor/mixercseg"
      vendoring_note: >-
        전체 clone이 아니라 순수 추론에 필요한 파일만 추적 import로 확인해
        선별 벤더링(_vendor/mixercseg/NOTICE.md 참고). VMamba/models/kernels 의
        커스텀 CUDA selective_scan 커널은 벤더링하지 않는다 — 미설치 시
        자동으로 순정 PyTorch 폴백 경로로 넘어간다(느림, 수치적으로 동등하나
        컴파일 커널과 bit-exact는 아님). CPU 경로는 이 워크스페이스(CPU-only
        torch 고정, 루트 pyproject.toml)에서 2026-08-07 실측(결정적,
        tests/contract/test_mixercseg_detector.py). GPU 경로는 같은 세션의
        격리 venv에서 무작위 가중치로만 확인했고 csm_triton.py patch 적용
        이후 GPU 재검증은 아직이다(_vendor/mixercseg/NOTICE.md "GPU status"
        절 — 2026-08-07 리뷰 지적으로 문구 정정, 과잉주장 있었음).
      local_patch: >-
        (1) models/encoder/vss_block.py의 HoGEdgeGateConv nbins를 36→180으로
        수정 — 업스트림 체크인 코드는 4개 배포 체크포인트 중 Crack500
        (nbins=36)만 반영돼 있고 DeepCrack 체크포인트(이 항목이 쓰는 것)는
        180으로 학습됐다(eval/evaluate.py 기본 결과경로 nbins_180_DeepCrack,
        2026-08-07 strict load_state_dict로 재검증 — 180에서만
        missing/unexpected 0건). (2) VMamba/models/csm_triton.py의
        cross_scan_fn/cross_merge_fn — CPU-safe 폴백 경로(CrossScanF)를 이미
        올바르게 선택해두고도 그 뒤 torch.cuda.device() 진입이 무조건이라
        CPU 텐서에서 죽던 버그를 x.is_cuda 조건부로 수정(CUDA 분기는 무변경 —
        상세는 _vendor/mixercseg/NOTICE.md).

    weights:
      # HuggingFace 계보(revision=불변 commit hash)와 달리 Google Drive는 자체
      # 버전 개념이 없다 — "revision"은 이 파일 자신의 sha256이다(자기서술
      # 식별자). 무결성의 실질 근거는 아래 sha256 대조이지 이 필드가 아니다.
      source: "google_drive:13cfgbyYiBMcxdLLkQTB984RyDQOiJ1B4/19_AZlM9SddUx3JM8CDnTAcqWyYwAPlei"
      source_type: google_drive
      revision: "d49451c03f8577e7487cd36c8eaa203e4ca5b93dce1b15d87ce57f876869cf3d"
      published: "2026-02-28"  # README "News" 절 — Drive 자체엔 실측 가능한 버전 이력이 없다
      files:
        - name: checkpoint_DeepCrack.pth
          sha256: "d49451c03f8577e7487cd36c8eaa203e4ca5b93dce1b15d87ce57f876869cf3d"
      declared_license: MIT
      # weights_only=False 필요(체크포인트에 model/optimizer/lr_scheduler/epoch/args
      # 가 함께 pickle됨) — safetensors 대비 약한 안전기반. digest 대조가 유일한
      # 방어선이다(mixercseg_adapter.py 모듈 docstring "알려진 잔여 리스크" 참고).
      pickle_format_residual_risk: >-
        .pth(pickle) 형식 — D-FINE의 safetensors와 달리 역직렬화 자체가 임의
        코드실행 표면이다. digest가 등재값과 다른 파일은 로더에 도달하지
        못하지만(fail-closed), pickle 형식 자체의 위험을 제거하진 않는다.

    model_facts:
      input_width_px: 512
      input_height_px: 512
      params_m: 2.51  # nbins=180 구성 실측(2026-08-07) — 논문 표기 2.54M과 근사 일치
      deepcrack_miou: 0.9151  # 논문 자기보고 + 자체 3-베이스라인 재현 테이블(준독립)
      output: "sigmoid 확률맵(H,W), threshold 0.5가 기본 crack/not-crack 경계"

    pretraining:
      declared_dataset: DeepCrack
      # D-FINE의 objects365_used/visdrone_used(사람 탐지 계보 리스크)에 대응하는
      # 필드가 이 도메인엔 없다 — 균열 세그멘테이션은 그 계보 리스크 범주 밖.

    deployment_status:
      adapter_development: APPROVED  # MODEL-P4-001 approval_scope
      weight_fetch_and_pin: APPROVED  # MODEL-P4-001 approval_scope — 이 항목으로 이행
      production: BLOCKED_LEGAL_REVIEW
