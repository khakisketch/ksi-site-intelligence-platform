[project]
name = "ksi-core"
version = "0.0.1"
description = "KSI Core Server — 인증·현장·임무·정책·이벤트·PostGIS control plane (ADR-KSI-001)"
requires-python = ">=3.12,<3.13"
# edge_sync(EventBundle 멱등 수신)가 offline_sync·EventBundle 계약을 소비하고,
# mission_issuance/mission_plans 가 계약 서명·경로 생성을 소비한다.
dependencies = [
    "ksi-domain",
    "ksi-event-contracts",
    "ksi-geo-core",
    "ksi-mission-contracts",
    "ksi-mission-planning",
    # Phase 3 장비 운동상태·CPA/TTC·재관찰 권고 — equipment_states.py 가 소비한다.
    "ksi-equipment-intelligence",
    # 설계 기준면 검증(design_surfaces.py)이 **계산 엔진과 같은** 좌표계 판정을
    # 써야 하기 때문이다(normalise_crs·SUPPORTED_PROJECT_CRS). Core 가 자기
    # 규칙을 따로 들면 "Core 는 받았는데 align_and_diff 는 거부하는" 설계면이
    # 생기고, 그 불일치는 업로드 며칠 뒤 비교 요청에서야 드러난다.
    # 비용은 알고 있다 — 이 패키지가 pyproj·rasterio(GDAL)를 물고 있어
    # control plane 이미지가 그만큼 무거워진다. 그럼에도 좌표계 화이트리스트를
    # 복제하는 것보다 낫다고 판단했다(구 측지계 혼입은 수백 미터 오차다).
    # Core 는 이 패키지의 **순수 판정 함수만** 쓴다 — 래스터 I/O 는 하지 않는다.
    "ksi-geo-spatial",
    "fastapi>=0.115",
    "cryptography>=42",
    "PyJWT>=2.10,<3",
    "httpx>=0.27",
]

# Evidence 미디어 스토리지(ADR-KSI-010 §1)는 **선택 의존**이다 — Core 는
# EvidenceStorage 포트에만 의존하고, evidence_storage 없이도 조립된다(그 경우
# 증거 라우트가 장착되지 않는다). S3 호환 어댑터를 쓸 배포만 이 extra 를 켠다.
[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_core"]

[tool.uv.sources]
ksi-domain = { workspace = true }
ksi-event-contracts = { workspace = true }
ksi-geo-core = { workspace = true }
ksi-mission-contracts = { workspace = true }
ksi-mission-planning = { workspace = true }
ksi-equipment-intelligence = { workspace = true }
ksi-geo-spatial = { workspace = true }
