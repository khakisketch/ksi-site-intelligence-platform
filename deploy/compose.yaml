# KSI 플랫폼 최소 조합 — Core · 객체저장소(MinIO) · 볼륨 초기화
#
# 고객 production 재구성·비행·자율 취득은 플랫폼 책임 밖이다(ADR-KSI-039).
# managed 워커·NodeODM은 이 기본 조합에 없다. 독립 외부 검사/분석 워커와
# 보호된 활성화 설정은 별도 준비 대상이며 이 템플릿이 생성하거나 기동하지 않는다.
#
# 이 파일이 하는 일은 "띄울 수 있는 하나의 조합"을 보여주는 것이다. 값은 전부
# deploy/.env 에서 오고, 그 원본은 deploy/.env.example 이다. 절차는
# docs/ops/DEPLOYMENT.md.
#
# ## 이 파일이 하지 않는 것
#
# - TLS 종단·역방향 프록시: 배포 환경(로드밸런서·Ingress)마다 달라 여기서 정하지 않는다.
#   Core 는 평문 HTTP 로 8000 을 연다 — **공개망에 그대로 노출하지 않는다.**
# - 대시보드(apps/dashboard): Next.js 앱은 별도 배포 경로다.
# - DJI Gateway: 취득 전용 역사적 범위이며 서비스를 추가하지 않는다.
#   capability는 모두 NOT_VERIFIED 상태다. 가짜 AVAILABLE 상태도 만들지 않는다.
# - 백업 실행/볼륨 삭제/기존 컨테이너 중지: 이 템플릿 변경은 그런 작업이 아니다.
#   기존 `ksi-data` 원장·`ksi-objects` 객체·`ksi-odm` 역사적 데이터는 보존한다.
#   플랫폼은 Mission 서명키를 마운트하지 않는다. 복구 증거/한계는 배포 문서를 따른다.

name: ksi

services:
  # 볼륨 소유권 초기화 — 이게 없으면 배포가 깨진다.
  #
  # Docker 명명 볼륨은 이미지에 그 경로가 없으면 **root:root 로 생성된다.** Core 는
  # uid 10001 로 도는 non-root 프로세스라(Dockerfile 의 useradd,
  # RCE 지속화를 막으려는 의도된 설계) 그대로 두면 원장 파일 하나 못 만들고 죽는다.
  # (P3 Task 3: managed 워커(uid 10002) 서비스가 archive 로 분리돼
  # worker 볼륨 초기화는 여기서 빠졌다.)
  # 이미지에 mkdir 를 넣어 해결할 수도 있지만, 그러면 "볼륨을 안 붙이면 컨테이너
  # 안에 쓰기 시작한다"는 더 나쁜 실패 모드가 생긴다 — 여기서 한 번만 맞춘다.
  init-volumes:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
      - sh
      - -c
      - |
        set -e
        chown 10001:10001 /mnt/data
        echo "volume ownership set"
    volumes:
      - ksi-data:/mnt/data
    user: root
    restart: "no"

  core:
    build:
      context: ..
      dockerfile: Dockerfile
    # 필수 환경변수가 하나라도 없으면 platform_production.py 가 RuntimeError 로 즉시 죽는다.
    # 조용히 뜨지 않는 것이 의도된 동작이다 — 로그에 어느 변수가 왜 문제인지 나온다.
    env_file: ${KSI_DEPLOY_ENV_FILE:-.env}
    volumes:
      # 원장. 이게 사라지면 현장·임무·산출물 이력이 사라진다.
      - ksi-data:/var/lib/ksi/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      # /health 가 아니라 /ready 를 본다 — /health 는 프로세스 생존만 보므로,
      # 원장이 봉인돼 모든 쓰기가 503 인 서버를 건강하다고 오판한다
      # (runtime_surfaces.py 의 ready() docstring; P3 Task 5 전에는
      # app_assembly.py 가 같은 문구를 소유했다).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  minio:
    # 객체 저장소. 이미 클라우드 S3 를 쓴다면 이 서비스를 지우고 .env 의
    # KSI_CORE_S3_ENDPOINT 만 그쪽으로 돌린다.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ksi-objects:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  # 원장과 객체의 기존 영속 식별자를 보존한다. 복구 검증은 별도다.
  ksi-data:
  ksi-objects:
  # 역사적 미사용 볼륨 선언 — 활성 플랫폼 서비스는 마운트하지 않는다.
  # 고유한 데이터가 있을 수 있으므로 삭제/이름 변경/마이그레이션을 뜻하지 않는다.
  ksi-odm:
