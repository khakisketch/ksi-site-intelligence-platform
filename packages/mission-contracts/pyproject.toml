[project]
name = "ksi-mission-contracts"
version = "0.0.1"
description = "Mission Contract 계약 모델·서명 검증 (contracts/schemas SSOT 준수)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7", "cryptography>=42", "ksi-domain", "ksi-event-contracts"]

[project.scripts]
ksi-mission-contract-consumer = "ksi_mission_contracts.consumer:main"
ksi-edge-dispatch-activate = "ksi_mission_contracts.edge_activation:main"
ksi-edge-dispatch-sync = "ksi_mission_contracts.edge_dispatch_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_mission_contracts"]

[tool.uv.sources]
ksi-domain = { workspace = true }
ksi-event-contracts = { workspace = true }
