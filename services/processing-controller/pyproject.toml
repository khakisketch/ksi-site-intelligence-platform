[project]
name = "ksi-processing-controller"
version = "0.0.1"
description = "Processing Controller — ProcessingJob 오케스트레이션·worker lease·engine adapter"
requires-python = ">=3.12,<3.13"
# ODM/NodeODM(AGPL-3.0)에 대한 의존이 **여기 없는 것**이 ADR-KSI-012 D2 의
# 실질이다 — 엔진과는 REST 프로세스 경계로만 말하므로 빌드 의존이 생기지 않는다.
# 계약 모델(kind·authority)만 공유한다.
# rasterio 는 AGPL 엔진과 무관한 BSD 라이브러리다 — GSD(픽셀 표본거리)를
# 등록하려는 GeoTIFF 자신의 아핀 변환에서 읽기 위해서만 쓴다(gsd.py). ODM/
# NodeODM 코드를 참조하지 않으므로 ADR-KSI-012 D2 AGPL 경계와 무관하다.
# ksi-change-detection 은 W2 비교 워커(comparison_worker.py)가 점군 C2C·체적
# 계산+제출 함수(run_change_detection.py/run_volume_change.py)를 그대로 부르기
# 위한 워크스페이스 의존이다 — 계산 로직을 이 패키지로 복제하지 않는다.
# ksi-perception(base, [dfine] extra 아님 — torch/transformers 는 끌려오지
# 않는다)은 odm_masking.py 가 동적 객체 bbox→영역배열 순수함수
# (dynamic_object_regions)를 재사용하기 위한 워크스페이스 의존이다(PRD
# §15.2 ④) — ODM/NodeODM 코드가 아니라 KSI 자체 패키지라 ADR-KSI-012 D2 와
# 무관하다. 실제 D-FINE-S 추론(torch 필요)은 worker.py 가 받는
# ``dynamic_object_detector`` 주입 지점의 호출자 몫이다 — 이 서비스 자신은
# 모델을 로드하지 않는다. ksi-domain 은 odm_masking.py 가 직접 참조하는
# AdapterResult 때문에 명시 선언한다(위 규칙과 동형).
# ksi-geo-spatial 과 laspy 는 odm.py 의 plan_artifacts 가 산출물의 실제
# CRS를 신고하기 전에 검증하려고(normalise_crs) 직접 import 한다(2026-08-15,
# 실물 확인으로 site crs 를 그대로 신고하던 이전 동작을 고쳤다 — 위와 같은
# "직접 import 하는 패키지는 직접 선언한다" 규칙). laspy 는 이미
# ksi-change-detection 을 통해 전이 의존으로 들어와 있었다.
dependencies = [
    "cryptography>=42",
    "ksi-change-detection",
    "ksi-domain",
    "ksi-event-contracts",
    "ksi-geo-spatial",
    "ksi-perception",
    "httpx>=0.27",
    "laspy>=2.5",
    "pillow>=10.0",
    "rasterio>=1.5.1",  # 1.5.1: numpy 2.5 shape-attribute DeprecationWarning 해소(gh-3592/PR#3597)
    # 설계면 검증(design_surface_verifier.py)이 직접 import 한다 — numpy 는 유효셀
    # 집계에, pyproj 는 compound CRS 의 수평·수직 성분 분해에 쓴다. 둘 다 rasterio·
    # ksi-change-detection 을 통해 이미 환경에 들어오지만, **직접 import 하는
    # 패키지는 직접 선언한다**(전이 의존이 사라지는 날 조용히 깨지지 않게).
    "numpy>=1.26",
    "pyproj>=3.7",
]

[project.scripts]
# 발행된(QUEUED) 재구성 작업을 사람 없이 집어서 끝까지 도는 워커 데몬
# (runner.py 모듈 docstring). Dockerfile.worker 의 CMD 가 이 이름을 부른다.
ksi-processing-worker = "ksi_processing_controller.runner:main"
ksi-external-inspector-daemon = "ksi_processing_controller.external_inspector_daemon:main"
ksi-external-inspector-entrypoint = "ksi_processing_controller.external_inspector_container_entrypoint:main"
ksi-external-measurement-entrypoint = "ksi_processing_controller.external_measurement_container_entrypoint:main"
ksi-external-measurement-daemon = "ksi_processing_controller.external_measurement_daemon:main"
ksi-external-validation-worker = "ksi_processing_controller.external_validation_worker:main"

[tool.uv.sources]
ksi-change-detection = { workspace = true }
ksi-domain = { workspace = true }
ksi-event-contracts = { workspace = true }
ksi-geo-spatial = { workspace = true }
ksi-perception = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_processing_controller"]
