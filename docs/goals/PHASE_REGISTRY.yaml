        항목이 아니다. ①·④·⑤ 는 닫혔다(위 주석 참조).
      # 2026-08-08 실사(technical-product-audit)로 확인: 아래 2건은 이미 해소됨
      # (.ksi/goals.json risk status=resolved, 2026-08-07) — 이 절이 최신 편집
      # (4a44828/4a2ab2f) 이후에도 반영이 안 돼 있었다. patrol-capture-interval-
      # direct-no-quality-floor, kmz-regeneration-determinism-timebomb 둘 다
      # resolved. 원장이 SSOT이며 이 절은 등재 시점 스냅샷일 뿐이다.

  - id: phase-3
    title: "Dynamic Equipment Intelligence"
    # Active Reobservation 의 실제 소비(재관찰 트리거 실행)는 Manifold 소관(Control
    # boundary, CLAUDE.md) — 하드웨어 종속이라 phase-3 전체는 DONE 이 아니다.
    #
    # ADR-KSI-016 D5: Autonomous Acquisition 축의 기능이고 그 축이 하드웨어
