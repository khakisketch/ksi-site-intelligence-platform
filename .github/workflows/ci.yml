name: ci

on:
  push:
    branches: [main]
  pull_request:

# 반영사항 3: 최소 권한 — 읽기 전용
permissions:
  contents: read

# 느린 job(특히 QEMU 에뮬레이션)이 쌓이는 것을 막는다 — 같은 PR/브랜치의 이전
# 실행을 취소하고 최신 커밋만 검증한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR에서만 취소한다. main 푸시까지 취소하면 커밋별 게이트 통과 증거가 사라져
  # "이 커밋이 초록이었나"를 사후에 확인할 수 없다(2026-08-04 감사 지적).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # 서브모듈은 클론하지 않는다 — 테스트·가드에 불필요하고 private 인증도 불필요.
      # 핀 검증은 gitlink SHA(ls-tree)로 수행한다 (scripts/verify_reference_pins.sh 폴백).
      # 서브모듈 실콘텐츠가 필요한 job이 생기면 fine-grained PAT(REFERENCE_REPOS_TOKEN)를
      # 사용한다 — docs/security/REFERENCE_SUBMODULE_AUTH.md 참조.
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: lock 무결성
        run: uv lock --check

      - name: 의존성 동기화 (locked)
        run: uv sync --locked --all-packages

      - name: production runtime image digest gate
        run: uv run --locked python tools/check_runtime_image_pins.py

      # Host Python tests cannot detect missing shared libraries in the slim image.
      # This checks the packaged production import, not deployment or readiness.
      - name: Core image production import smoke
        timeout-minutes: 10
        run: |
          docker build --tag "ksi-core-ci:${GITHUB_SHA}" .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges "ksi-core-ci:${GITHUB_SHA}" \
            /app/.venv/bin/python -c "import ksi_core.composition.platform_production"

      - name: repository normalization contract
        run: uv run --locked python tools/validate_repository_normalization.py

      - name: ruff
        run: uv run --locked ruff check .

      # tools/: 생성기(generate_action_intent_vectors.py)의 산출물이 C++ 테스트에
      # 소비되는 load-bearing 코드라 타입체크 대상에 포함한다.
      # tools/vector-extraction/ 는 참고 레포를 스크래치패드 venv에서 import하는
      # 설계라 pyproject의 mypy exclude로 제외돼 있다.
      - name: mypy
        run: uv run --locked mypy packages services tests tools

      # PSDK는 공개 고정 소스였으나 그 유일한 소비자(KMZ fidelity·PSDK 게이트
      # 테스트)가 P3 Task 6에서 아카이브로 이동했다. fixture provisioning은
      # bounded historical route(.github/workflows/historical-archive.yml,
      # workflow_dispatch 전용)가 스스로 수행한다 — main 게이트는 아카이브
      # 콘텐츠에 의존하지 않는다.
      - name: pytest
        run: uv run --locked pytest -q

      # 2026-07-27 CI 오염 실사례(gitignore 가 계보 SSOT 를 삼킴·빌드캐시 커밋) 재발 방지
      - name: repo 위생 가드 (빌드캐시/pyc/가중치 미추적 · 계보 SSOT 추적)
        run: bash scripts/check_repo_hygiene.sh

      # 감사 #29 폐쇄 후 첫 CI 가 즉시 실증: 러너에 rg 가 없어 이 가드는 지금까지
      # 조용한 no-op 이었다(검사 미수행이 초록으로 위장). 도구를 명시 설치한다.
      - name: ripgrep 설치 (reference 가드 전제 도구)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: reference 의존 가드 (import/manifest/symlink/dirty)
        run: bash scripts/check_no_reference_imports.sh

      - name: reference 핀 검증 (gitlink)
        run: bash scripts/verify_reference_pins.sh

  # These are independently promoted images.  Building and executing both
  # entrypoints catches lock/import/native-library and accidental CMD drift.
  # It does not create a registry digest, SBOM, scan approval, or deployment.
  external-runtime-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: inspector
            dockerfile: Dockerfile.external-inspector
            image_user: ksi-inspector-image
            command: /app/.venv/bin/ksi-external-inspector-entrypoint
          - role: measurement
            dockerfile: Dockerfile.external-measurement
            image_user: ksi-measurement-image
            command: /app/.venv/bin/ksi-external-measurement-entrypoint
    steps:
      - uses: actions/checkout@v4

      - name: Build locked external runtime image
        timeout-minutes: 15
        run: |
          mkdir -p download deploy/signing-keys deploy/secrets data/geoid/raw .secrets
          printf 'must-not-enter-image\n' > download/private-boundary-sentinel
          printf 'must-not-enter-image\n' > deploy/signing-keys/private-boundary-sentinel
          printf 'must-not-enter-image\n' > deploy/secrets/private-boundary-sentinel
          printf 'must-not-enter-image\n' > data/geoid/raw/private-boundary-sentinel
          printf 'must-not-enter-image\n' > .secrets/private-boundary-sentinel
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "ksi-external-${{ matrix.role }}-ci:${GITHUB_SHA}" .

      - name: Verify image identity and closed EOF behavior
        timeout-minutes: 5
        run: |
          image="ksi-external-${{ matrix.role }}-ci:${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = \
            "${{ matrix.image_user }}"
          test "$(docker image inspect --format '{{index .Config.Cmd 0}}' "$image")" = \
            "${{ matrix.command }}"
          timeout --foreground 30s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges "$image" \
            /app/.venv/bin/python -c \
            "import pathlib, ksi_processing_controller.external_${{ matrix.role }}_container_entrypoint; assert not any(pathlib.Path('/app').rglob('private-boundary-sentinel'))"
          package="$(timeout --foreground 30s docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges "$image" \
            dpkg-query -W '-f=${Package} ${Version}\n' libexpat1)"
          test "$package" = "libexpat1 2.8.3-1~deb13u1"
          set +e
          timeout --foreground 30s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /work:rw,nodev,nosuid,noexec,size=16m \
            "$image" </dev/null
          status=$?
          set -e
          test "$status" -eq 2

  # P3 Task 6: the edge native control-plane/manifold C++17 jobs retired from
  # the main CI with their sources (archive/acquisition-2026/edge/...). The
  # bounded historical verification route lives in historical-archive.yml
  # (workflow_dispatch only) — main CI never builds archived content.
  # apps/dashboard 는 2026-08-04 까지 CI 밖에 있었다 — 타입체크·lint·빌드 어느
  # 것도 자동으로 돌지 않아, 프런트 5.7천 줄의 회귀를 사람이 로컬에서 기억해
  # 돌리는 데 의존했다. 이 job 이 주장하는 것은 "타입·lint·순수 로직·프로덕션
  # 빌드가 유효하다"뿐이다 — **화면이 멀쩡하다는 주장이 아니다**. 렌더링·동선은
  # CLAUDE.md UI 절의 렌더 확인(390/768/1440 실캡처)과 /ui-audit 소관이다.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      # npm ci — lock 을 그대로 설치한다(npm install 은 lock 을 갱신해 버려서
      # "CI 가 검증한 트리"와 "커밋된 트리"가 갈라진다).
      - name: 의존성 설치 (locked)
        run: npm ci

      - name: tsc
        run: npx tsc --noEmit

      - name: eslint
        run: npx eslint .

      # 순수 로직만 본다(vitest.config.mts 주석 참조) — 서버 컴포넌트를 jsdom 으로
      # 흉내내면 그 흉내가 진짜 화면과 어긋나는 순간 초록불이 거짓말이 된다.
      - name: vitest
        run: npm test

      - name: next build
        run: npx next build
