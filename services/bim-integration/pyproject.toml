[project]
name = "ksi-bim-integration"
version = "0.0.1"
description = "Phase 4 BIM 연계 — IFC as-designed 모델을 change-detection의 baseline point cloud로 (PRD §5.1.4 'BIM/as-designed 대비 as-built 변화')"
requires-python = ">=3.12,<3.13"
# IfcOpenShell — LGPL-3.0. 이 프로젝트가 ODM(AGPL, ADR-KSI-012 D2)에 적용한 프로세스
# 경계 원칙과 달리, LGPL은 **미수정 라이브러리를 그대로 링크(=pip 의존)**하는 것을
# 허용한다(카피레프트가 그 라이브러리 자체의 소스공개 의무로 한정, 이 프로젝트
# 코드에는 전파되지 않음) — AGPL/GPL과 달리 별도 프로세스 경계가 불필요하다.
dependencies = ["ifcopenshell>=0.8", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_bim_integration"]
