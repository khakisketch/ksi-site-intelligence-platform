# 평가 입력 자산 원장 (반증 리뷰 F-A, 2026-07-28) — 실모델 E2E·conformance 의
# 입력 이미지 신원 SSOT.
#
# 배경: 모델 artifact 에는 sha256 게이트가 있는데 평가 **입력**에는 앵커가 없어,
# 파일 교체 시 "threshold 0.5 → 4건"·결정성 실측의 재현 근거가 무경고로 사라졌다.
# 이미지 실물은 git 밖(models/test-assets/, gitignore) — 이 원장의 digest 가 신원이고
# tools/fetch_test_assets.py 가 취득·검증 경로다.
#
# ⚠ digest 는 "원본 다운로드 → Pillow 리사이즈·재인코딩" 산출물 기준이라 Pillow
# 버전에 종속될 수 있다 — 불일치 시 fetch 스크립트가 fail-closed 로 알리며, 그때는
# 버전 차이를 확인하고 이 원장을 대표자 보고와 함께 갱신한다(조용한 교체 금지).

assets:
