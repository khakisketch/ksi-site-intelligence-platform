[project]
name = "ksi-site-intelligence-platform"
version = "0.0.1"
description = "KSI Site Intelligence Platform — workspace root (server-side Python)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]
# references/: 읽기 전용 참고 서브모듈 — dependency resolution 물리 차단 (REFERENCE_REPOS_LOCK rules)
# edge/: Manifold Python 환경은 서버 workspace와 분리 운용 (별도 pyproject, 대표자 반영사항 1)
exclude = ["references/*", "edge/*", "workers/*", "apps/*"]

# torch 는 CPU 인덱스 고정 — 서버 workspace 의 B1 기능 검증은 CPU 로 충분하며(MODEL-B1-001),
# CUDA 빌드(~2GB)는 워크스페이스 lock 을 불필요하게 무겁게 한다. Manifold TensorRT 는
# 별도 edge 환경(B2)이라 이 인덱스와 무관하다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
ksi-perception = { workspace = true }
ksi-processing-controller = { workspace = true }
ksi-change-detection = { workspace = true }
ksi-bim-integration = { workspace = true }
ksi-equipment-intelligence = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "jsonschema>=4.21",
    "types-jsonschema>=4.21",
    "types-pyyaml>=6.0",
    "scipy-stubs>=1.13",
    "httpx>=0.27",
    # apps/dashboard 로컬 개발 시 scripts/run_core_dev.py 가 실제 ASGI 서버를 띄우는 데만
    # 쓴다 — 프로덕션 조립·CI 게이트는 TestClient 만 사용.
    "uvicorn[standard]>=0.30",
    # leaf workspace 멤버 — 아무 패키지도 의존하지 않아 기본 sync 에서 빠지므로 dev 로
    # 명시한다(base 의존만 — torch 계열 [dfine] extra 는 모델 보유 환경에서만 설치).
    "ksi-perception",
    # 같은 이유의 leaf 멤버 — 이 워커 코드를 Core 가 의존하지 않아(서버 조립 그래프
    # 밖이다) 기본 sync 에서 빠진다. CI 는 --all-packages 라 무관하지만, 맨
    # `uv sync` 로 붙은 개발자가 ODM 어댑터 테스트에서 ImportError 를 보게 된다.
    "ksi-processing-controller",
    # 같은 이유의 leaf 멤버(Phase 4 change-detection, scipy 기반 point cloud C2C).
    "ksi-change-detection",
    # 같은 이유의 leaf 멤버(Phase 4 BIM 연계, ifcopenshell 기반 IFC 지오메트리 추출).
    "ksi-bim-integration",
    # 같은 이유의 leaf 멤버(Phase 3 Kinematic State/CPA-TTC/RiskField).
    "ksi-equipment-intelligence",
    # ksi-core[s3] 어댑터(ADR-KSI-010 §1)의 타입체크·테스트용. 런타임 필수 의존이
    # 아니다 — Core 는 evidence_storage 없이도 조립되고, 그 경우 boto3 를 import
    # 하지도 않는다(어댑터 모듈 안에서 지연 import).
    "boto3>=1.34",
    "boto3-stubs[s3]>=1.34",
]

[tool.ruff]
line-length = 100
# `dir/**` 형태로 **저장소 루트 기준 경로**를 명시한다. 슬래시 없는 "edge"는 ruff가
# basename 글롭으로 취급해 어느 depth의 edge 디렉터리든 매칭 — `tools/edge/`까지 삼켰다.
# 2026-08-03 신설한 tools/edge/{check_target_abi,fetch_psdk}.py 가 `ruff check .`
# 대상에서 통째로 빠져 있던 것을 2026-08-04 감사에서 실측 확인(명시 경로 지정 시에만
# 검사돼 "All checks passed"가 검사 미수행을 가렸다 — 이 저장소가 경계하는 조용한 no-op).
# 선행 슬래시("/edge")는 절대경로로 해석돼 제외가 아예 풀리므로 쓰지 않는다(실측).
extend-exclude = ["references/**", "edge/**", "apps/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 디자인 시안 생성기는 CSS/HTML을 문자열 리터럴로 들고 있다. 100자 제한을 맞추려고
# CSS 선언을 쪼개면 오히려 읽기 어려워진다 — E501만 끄고 F/B/SIM(실제 버그)은 살린다.
# 디렉터리 통째 exclude 를 쓰지 않는 이유는 위 extend-exclude 주석의 사고와 같다.
"design/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
# tools/vector-extraction/: 참고 레포(Scout)를 스크래치패드 venv에서 import하는
# 일회성 추출 스크립트라 메인 워크스페이스에서는 원래 해석 불가하다(설계상 의도).
#
# mypy exclude는 **정규식**이다(ruff의 gitignore 문법과 다르다) — `^`로 앵커링하지
# 않으면 substring 매칭이라 "edge/"가 `tools/edge/`까지 제외시킨다. 2026-08-04 감사에서
# tools/edge/*.py 가 이 오탐으로 타입체크 밖이었음을 확인하고 앵커링했다.
exclude = ["^references/", "^edge/", "^apps/", "^tools/vector-extraction/"]
# tests/hil, tests/contract 등이 `sys.path.insert(...) + from <module> import ...`
# (flat import) 로 tools/*/*.py 를 참조한다. mypy_path 로 두 디렉터리를 모듈 검색
# 경로에 명시해 이 flat import 가 스캔 순서와 무관하게 해석되게 한다
# (위 exclude 앵커링과 별개 사안 — 앵커링은 "파일이 체크되는가", mypy_path는
#  "그 파일이 import하는 모듈이 해석되는가").
mypy_path = ["tools/hil", "tools/edge"]

# [dfine] extra(torch·transformers·onnx 계열)는 CI 에 설치되지 않는다 — mypy 는
# 지연 import 도 모듈 해석을 시도해 미설치 시 import-not-found **에러**를 내므로
# (반증 리뷰 F1: 로컬은 extra 가 있어 green, CI 만 깨지는 env divergence),
# 이 계열은 missing import 를 무시한다. onnxruntime 은 설치돼도 스텁 미제공.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torch",
    "transformers.*",
    "transformers",
    "onnx.*",
    "onnx",
    "onnxruntime.*",
    "onnxruntime",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
norecursedirs = ["references", "edge", "apps", "node_modules", ".venv"]
