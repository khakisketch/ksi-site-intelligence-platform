# Phase Registry — 멀티세션 단계 원장 (정본)
# 근거: MASTER_PRD v3.0 §25(구현 단계)·§26(완료 기준). GitHub Milestone과 동기 유지.
# 상태: PLANNED | IN_PROGRESS | GATED(수용기준 검증 대기) | DONE | BLOCKED
# 완료 판정은 자기신고가 아니라 acceptance의 게이트 통과 증거로만 한다 (green≠작동).

version: 1
updated: "2026-08-26"

# 2026-08-24부터의 delivery 순서는 ADR-KSI-027이 정한다. 아래의 기존 phase는 도메인
# capability 원장이고, Console UX가 HIL/Field가 되었다는 뜻이 아니다.
operations_console_delivery:
  authority: "docs/architecture/ADR-KSI-027-console-first-delivery-gates.md"
  current_phase: phase-3-rc-first-hil
  phases:
    - id: phase-0-product-ux-baseline
      status: DONE
      evidence: "ADR-KSI-025/026/027 and Phase 1 UX standard/acceptance"
    - id: phase-1-console
      status: DONE
      scope: "actual Core projections, responsive Console, accessibility and navigation"
      excludes: "DJI capability verification, device write, flight, customer Cloud deployment"
      software_evidence_2026_08_25: >-
        Site workspace partial-failure semantics, open human-decision count, Event evidenceCount,
        complete pagination beyond the 500-item request cap, explicit Event/ProcessingJob organization
        scope outside HTTP requests, safe citation routing, deterministic work queues and customer-facing
        terminology are implemented. A real-domain-store synthetic fixture covers populated, empty and
        evidence-preview-failure states without inventing Mission, processing, report, spatial-model or
        device evidence. Full Python 3848 passed, 23 skipped and 3 expected-failed; Ruff and Mypy passed
        388 source files; Dashboard 58 files/527 tests, ESLint, TypeScript and production build passed. Chromium at
        390/768/1024/1440 passed 54 scenarios with 2 intentional desktop coarse-pointer skips, including
        OIDC organization isolation, keyboard/focus, overflow, reduced-motion, axe and visual snapshots.
        Authenticated in-app Browser review of the durable Tailnet Home, Sites, Work, Items and Site detail
        found no horizontal overflow or console warning/error and confirmed next-action-first ordering.
      remaining_gate: "none within Phase 1 software UI/UX scope"
    - id: phase-2-synthetic-cloud-ai-staging
      status: DONE
      scope: "isolated synthetic OIDC/TLS/S3/grounded-AI/backup staging on DGX Spark"
      excludes: "customer Cloud/data, actual external AI/IdP, public release, DJI/device/HIL"
      evidence: "docs/acceptance/SYNTHETIC_CLOUD_AI_STAGING_ACCEPTANCE.md"
      software_evidence_2026_08_25: >-
        Production Dashboard/Core profiles ran in an isolated Compose project behind Tailnet HTTPS.
        Synthetic OIDC organization login, actual MinIO PNG bytes and public presigned GET, one-site
        AI opt-in, grounded workspace citation, provider 503 and cross-site citation fail-closed paths,
        owner-only secrets, and SHA-256 checked journal/object/signing-key isolated restore passed.
        Chromium covered 390/768/1024/1440. No customer data, external AI, DJI service, device key,
        flight action, commit, push, or release was used.
    - id: phase-3-rc-first-hil
      status: BLOCKED
      stages:
        - id: phase-3a-code-sdk-readiness
          status: BLOCKED
          gate: "five candidate paths build with fail-closed routing and HIL v1.4 evidence tooling"
          software_evidence_2026_08_26: >-
            Five-path capability catalog, narrow fail-closed Gateway ports, exact evidence/flag/config
            routing, pinned HTTPS and Unix transports, idempotent v1.3 receipts, ConnectedEdgeManifest
            v1.4 approval/result/blocker/finalize/verify tooling, an unlinked PSDK Init/Upload/DeInit
            source boundary, and a pre/postflight-only MSDK contract boundary are implemented. Full
            Python regression passed 3894 tests with 23 skipped and 3 expected failures; Ruff passed;
            Mypy passed 399 source files; Dashboard passed 58 files/527 tests, ESLint and production
            build. The canonical arm64 Ubuntu 20.04/gcc 9.4 build and S0 strict symbol gate passed for
            the default PSDK app. The S1 link is correctly blocked because pinned PSDK 3.16 retains
            public DjiWaypointV3_Action in the same archive object as UploadKmzFile. MSDK/Dock SDK
            artifacts and account projects are absent, so no SDK or device support is inferred.
          blockers: >-
            Provide a DJI-supported upload-only PSDK artifact or a separately reviewed isolation that
            removes the public Action surface without patching or hiding vendor code; provide licensed
            MSDK/Dock SDK projects and build credentials. Re-run exact SDK gates before Phase 3B.
          machine_preflight_2026_08_26: >-
            check_psdk_waypoint_archive.py verifies the pinned archive SHA-256 and linker member closure;
            current PSDK 3.16 deterministically returns BLOCKED/ACTION_COLOCATED_WITH_UPLOAD before
            candidate compilation, while the independent post-build gate remains in place for a future
            safe artifact. check_dji_sdk_readiness.py reports MSDK and Dock as NOT_CONFIGURED, requires
            external-or-ignored licensed inputs, rejects dynamic MSDK versions, and checks credential
            files only for owner-only permissions without recording values, paths or digests. Tailnet
            reprobe found RC Plus 2 offline for five days and no Manifold peer, so Phase 3B remains blocked.
            After adding these gates, full Python regression passed 3907 tests with 23 skipped and 3
            expected failures; Ruff passed; Mypy passed 403 source files; repository hygiene passed;
            the canonical arm64 default PSDK app build and S0 strict symbol gate passed again.
        - id: phase-3b-approved-limited-hil
          status: BLOCKED
          gate: "physical RC Plus 2, M4D and Manifold 3 session with device-bound approval envelope"
      software_preflight_2026_08_26: >-
        FIELD-0a A/B/C checksums and KMZ structure pass; existing Pilot 2 A-file map evidence and
        original M4D WideCamera metadata were re-audited without device contact. Pilot-exported
        mapping KMZ provenance and explicit physical-session approval are still absent. All five
        Connected Edge capabilities remain NOT_VERIFIED.
    - id: phase-4-verified-integration
      status: PLANNED
      gate: "capability-specific HIL evidence"
    - id: phase-5-single-customer-pilot
      status: PLANNED
      gate: "FIELD-0a/0b/1/2 and Cloud legal/security approvals"

# 제품 구조(2축 폐루프)의 정본은 PRODUCT_CONSTITUTION §두 축과 폐루프이고,
# 그 근거는 ADR-KSI-016 D2 다. **이 파일이 소유하는 것은 "지금 어느 축이
# 진행 가능하고 어느 축이 막혀 있나"** 다 — 그 상태는 몇 주 만에 뒤집히므로
# 헌법·ADR 에 넣지 않는다.
axes:
  site_intelligence_core:
    title: "Site Intelligence Core — 공간·시간 이해, 변화·공정·물량, 설계 대비, Mission Planning"
    state: ACTIVE
    note: >-
      막힌 것 없음. M1(epoch 파이프라인 종단) 진행 중이며 M2(폐루프 실물)·
      M3(상용 기반)가 뒤따른다. 하드웨어 도착과 무관하게 진행된다.
  autonomous_acquisition:
    title: "Autonomous Acquisition — Manifold Runtime, Perception, Local World Model, Viewpoint/Path, Mission Execution"
    state: BLOCKED
    note: >-
      **우선순위가 낮아서가 아니라 차단돼 있다.** [2026-08-17 갱신] 이전 서술
      ("H1~H4 가 전부 장비 조달·PSDK 개발자 승인 대기")은 낡았다 — 2026-08-13
      실측으로 **장비도 자격도 확보됐고**(REMAINING_WORK_PLAN.md §하드웨어 트랙),
      남은 조달은 H2(셀룰러 동글+유심) 하나뿐이다. 실제 관문은 조달도 디버깅도
      아니고 **매니폴드가 네트워크에 없다는 것**, 즉 장비 세션 부재다
      (원장 track-a 사유 2026-08-14 재정정). 현재
      edge/ 에 있는 것은 명령 유효성 판정·안전 상태기·PSDK 탭이며 perception·
      tracking·next-best-view 는 미착수 — 목표 아키텍처(03_EDGE_AUTONOMY.md)가
      곧 현재 능력이 아니다. 게이트가 열리는 즉시 착수한다.

phases:
  - id: phase-0
    title: "Capability & Calibration Foundation"
    # 하드웨어 Spike(M4D·Manifold 실기)가 남아 있으므로 phase-0 전체는 DONE이 아니다.
    # [2026-08-17] 이 IN_PROGRESS 는 **하드웨어 포함 전체 phase** 기준이다.
    # 소프트웨어 수용은 이미 PASS 이고(아래 software_acceptance), 원장 goal
    # `phase-0`(제목이 "(SW)")가 그 범위만 추적해 completed 다 — 두 값이 다른 것이
    # 정상이다. **충돌로 읽고 원장을 invalidate 하지 말 것**(실제로 그 오독이 나왔다).
    status: IN_PROGRESS

    software_implementation: COMPLETE
    software_acceptance: PASS
    technical_gate: PASS

    independent_review: PASS
    independent_review_commit: "bcdad4c2064b6f683544434ba1c36cb5dd04d1a5"
    independent_review_date: "2026-07-26"
    independent_review_note: >-
      2026-07-26 독립 검토 2라운드 완료. 1차(REQUEST_CHANGES) P0 5건 — Capability
      register()의 evidence 없는 VERIFIED 우회 / TimestampSet의 UTC·monotonic 혼합 /
      project_foot_point의 NaN·치수·FOV·위경도 미검증 / Replay confirm_after=4의
      계약 불일치 / 장비지원 예외 타입 — 을 052ec8b에서 수정. 2차(REQUEST_CHANGES)
      P0 3건 — max_gap_s·buffer_size·보정값의 NaN/Inf/bool 통과 / 화면 밖 유한 픽셀이
      유효 광선으로 처리 / zoom_factor 조용한 clamp와 gnss_accuracy_m 음수 미검증 —
      을 bcdad4c에서 수정. 최종 게이트 234 passed·5 skipped, mypy 39파일 clean,
      ruff·lock·reference guard 통과. Phase 0 Software Acceptance PASS 판정.

    hardware_spikes: DEFERRED
    stage_c_allowed: true
    scope_now: "소프트웨어 기반만 (P0-1~P0-6). 하드웨어 Spike(PSDK/카메라/짐벌)는 장비 세션에서."
    acceptance:
      - "계약 모델이 contracts/schemas SSOT와 왕복 검증 통과 + Ed25519 실서명 네거티브 4종 (P0-1, INV-011)"
      - "typed InterpolationResult 시간동기 모델 — 각도 wraparound·gap 강등 골든 통과 (P0-2, INV-023)"
      - "golden vectors legacy_compat/ksi_correctness 분리 + source/script/runtime/tolerance 메타 (P0-3)"
      - "geo-core가 golden 회귀 전부 허용오차 내 통과 + 불확실성 단조성 (P0-4, INV-021/023)"
      - "Capability 2-enum 분리 + SPIKE/BLOCKED 미노출 + 무증거 전이 거부 (P0-5, INV-041)"
      - "Replay 2회 재생 fingerprint/observationHash/좌표/상태전이 동일 (P0-6, INV-022)"
      - "CI green (uv locked 게이트 + reference 가드 4중)"
    hardware_deferred:
      - "M4D 카메라 프레임·렌즈 전환·짐벌 API Spike (PRD 20.3 — Capability Registry에 SPIKE_REQUIRED로 등록)"
      - "시간동기 실측 p95≤50ms 검증 (PRD 21.1)"

  - id: phase-1
    title: "Geo-Referenced World Model"
    # 하드웨어가 필요한 단계가 아니므로 소프트웨어 수용으로 닫는다.
    status: DONE

    implementation: COMPLETE
    technical_gate: PASS
    software_acceptance: PASS

    independent_review: PASS
    independent_review_commit: "33a669abb092fd911ba90fac31d90562b5960e85"
    independent_review_date: "2026-07-27"
    independent_review_note: >-
      2026-07-27 독립 검토 2라운드 완료. 1차 지적 6건(공분산 SPD 미검증으로 -I가
      CONFIRMED / 모순 관측이 더 정밀한 결과로 승격 / 중복 observation_id 계상 /
      멱등 신원이 키에만 결합돼 다른 장비 항목 소멸 / payload canonicalization 예외 누출 /
      문턱·시각 검증 부재)을 33a669a에서 전부 수정. 정상 경로(상관 SPD 공분산, 정합
      산포, 정상 부동소수 payload, 서로 다른 viewpoint의 CONFIRMED)도 유지 확인 —
      게이트를 조여 기능을 막은 것이 아님. 401 passed·5 skipped, mypy 53파일 clean,
      C++ ctest 2/2, CI green.

    next_work_allowed: true
    acceptance:
      - "WorldEntity/Observation 계약 + covariance·CRS 필수 필드 불변식 (INV-020)"
      - "다중 시점 세계좌표 융합 기준 구현 + replay 재현"
      - "Event Bundle/Offline Sync 계약 검증"

    # HIL 이전 비차단 보완사항. 2026-08-26 실제 코드·회귀 근거를 재대조했다.
    pre_hil_followups:
      - "부분 완료 — max_normalized_residual 을 assemble_world_entity()까지 전달하고 replay 회귀 추가; Versioned Geo Safety Profile 관리는 별도 후속"
      - "viewpoint_id 를 임의 프레임 ID가 아니라 Calibration된 Camera Pose 또는 Viewpoint bin 참조로 정의 (완료 5cc7c9b — ViewpointEvidenceKind 등급 도입, INV-025로 정본화)"
      - "완료 — Offline Sync shared payload-canonicalization v1 vector와 Python consumer 회귀 추가; C++ 직접 계산 도입 시 같은 vector를 소비"
      - "완료 — observation_id·track_id·viewpoint_id 공백·whitespace-only 값 거부"
      - "완료 — assemble_world_entity 최대 관측 시간창과 invalid/초과 회귀 추가"

    # 수용(33a669a) 이후의 안전 경계 강화 — Phase 1 재수용이 아니라 후속 hardening 기록.
    # independent_review_commit 은 그대로 둔다(교체하면 전체를 새 SHA에서 재수용했다는 다른 의미가 된다).
    post_acceptance_hardening:
      - commit: "5cc7c9b"
        date: "2026-07-27"
        reason: >-
          SPATIAL_BIN 경계에서 근접 관측점이 서로 다른 viewpoint로 과다 계상되어
          localization CONFIRMED에 도달할 수 있던 경로를 차단.
        result: >-
          CONFIRMED는 전체 관측이 CALIBRATED_POSE이고 서로 다른 pose reference가
          2개 이상일 때만 가능. SPATIAL_BIN·UNKNOWN은 최대 LIKELY.
        gate: "488 passed·5 skipped / mypy 57 / C++ ctest 2/2"

    residual_risks:
      - >-
        CALIBRATED_POSE 등급은 현재 생산자 선언이다. 실기 통합 시 pose reference를
        Calibration Registry에서 해석하고 site/frame/camera/lens/timestamp 및
        실제 기선을 검증해야 한다.

  - id: phase-2
    title: "Baseline Mapping & Unified Mission"
    # Coverage Recovery 의 Edge 실시간 gap-fill(03_EDGE_AUTONOMY.md COVERAGE_RECOVERY
    # 상태)은 하드웨어 종속(Track A/B 계열)이므로 phase-2 전체는 DONE 이 아니다.
    # [2026-08-17] phase-0 과 같다 — 이 IN_PROGRESS 는 하드웨어 포함 전체 기준이고
    # 원장 goal `phase-2` 는 소프트웨어 범위만 추적한다. 충돌이 아니다.
    status: IN_PROGRESS

    software_implementation: COMPLETE
    software_acceptance: PASS
    technical_gate: PASS

    independent_review: PASS
    independent_review_commit: "0a5f80b5b7af8a34b28b7b46bb189d02da46b873"
    independent_review_date: "2026-08-06"
    independent_review_note: >-
      2026-08-06 adversarial 재검토 2라운드. 1차(refuted) P1 3건 —
      needs_coverage_recovery() 가 ABORTED_SAFE/FAILED 를 누락해 거짓음성 /
      고정 촬영간격이 MIN_FRONT_OVERLAP(0.6) 미달 가능 / captureIntervalM 배선
