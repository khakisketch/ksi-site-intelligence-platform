[project]
name = "ksi-site-intelligence-platform"
version = "0.0.1"
description = "KSI Site Intelligence Platform — workspace root (server-side Python)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

# mmcv/mmengine([mixercseg] extra, MODEL-P4-001)는 PyPI 메타데이터에 순정
# opencv-python 을 강제한다. base 는 opencv-python-headless 를 쓰는데, 두 배포판이
# 동일한 `cv2/` 최상위 네임스페이스에 파일을 설치해(둘 다 `cv2/__init__.py` 등을
# 같은 경로에 씀) uv/pip 가 그중 하나를 나중에 제거하면(RECORD 매니페스트 기준
# 삭제) 남은 배포판이 실제로 쓰던 cv2/ 디렉터리까지 통째로 지워진다 — `uv pip list`
# 엔 opencv-python-headless 가 설치돼 있다고 나오는데도 `import cv2` 가
# ModuleNotFoundError 로 깨지는 이유(2026-08-07, 2026-08-12 재현: extra 부착→해제
# 순서로 실측). 이건 uv 리졸버 버그가 아니라 두 배포판이 같은 파일 경로를 놓고
# 벌이는 설치 충돌이라 override-dependencies(버전 제약만 바꿈, 패키지 이름 교체
# 불가)로는 못 고친다 — opencv-python 을 애초에 설치 후보에서 빼야 한다.
# mmcv/mmengine 이 import cv2 로 쓰는 함수(imread/imwrite/resize/cvtColor 등)는
# headless 빌드에도 다 있다(GUI 전용 highgui, 예: imshow 만 빠짐 — 서버리스
# adapter 는 안 씀). exclude-dependencies 는 워크스페이스 루트 pyproject.toml
# 에서만 읽힌다(uv 0.11.15 문서 확인) — 멤버 pyproject.toml 에 적어도 무시된다.
exclude-dependencies = ["opencv-python"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]
# references/: 읽기 전용 참고 서브모듈 — dependency resolution 물리 차단 (REFERENCE_REPOS_LOCK rules)
# edge/: Manifold Python 환경은 서버 workspace와 분리 운용 (별도 pyproject, 대표자 반영사항 1)
exclude = ["references/*", "edge/*", "workers/*", "apps/*"]

# torch 는 CPU 인덱스 고정 — 서버 workspace 의 B1 기능 검증은 CPU 로 충분하며(MODEL-B1-001),
# CUDA 빌드(~2GB)는 워크스페이스 lock 을 불필요하게 무겁게 한다. Manifold TensorRT 는
# 별도 edge 환경(B2)이라 이 인덱스와 무관하다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# mmcv 1.7.2(legacy, MODEL-P4-001 [mixercseg] extra)는 setup.py 최상단에서
# pkg_resources 를 import 하는데 PEP517 build-system.requires 에 선언하지 않는다
# — uv 의 격리 빌드 환경엔 기본으로 없어 metadata 해석 자체가 실패한다(2026-08-07
# 실측, uv 가 직접 이 fix 를 제안). 설치 여부와 무관하게 lock 해석 단계에서 걸린다.
[tool.uv.extra-build-dependencies]
mmcv = ["setuptools<81"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
ksi-perception = { workspace = true }
ksi-processing-controller = { workspace = true }
ksi-change-detection = { workspace = true }
ksi-bim-integration = { workspace = true }
ksi-equipment-intelligence = { workspace = true }
ksi-defect-detection = { workspace = true }
ksi-geo-spatial = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "jsonschema>=4.21",
    "types-jsonschema>=4.21",
    "types-pyyaml>=6.0",
    "scipy-stubs>=1.13",
    "httpx>=0.27",
    # apps/dashboard 로컬 개발 시 scripts/run_core_dev.py 가 실제 ASGI 서버를 띄우는 데만
    # 쓴다 — 프로덕션 조립·CI 게이트는 TestClient 만 사용.
    "uvicorn[standard]>=0.30",
    # leaf workspace 멤버 — 아무 패키지도 의존하지 않아 기본 sync 에서 빠지므로 dev 로
    # 명시한다(base 의존만 — torch 계열 [dfine] extra 는 모델 보유 환경에서만 설치).
    "ksi-perception",
    # 같은 이유의 leaf 멤버 — 이 워커 코드를 Core 가 의존하지 않아(서버 조립 그래프
    # 밖이다) 기본 sync 에서 빠진다. CI 는 --all-packages 라 무관하지만, 맨
    # `uv sync` 로 붙은 개발자가 ODM 어댑터 테스트에서 ImportError 를 보게 된다.
    "ksi-processing-controller",
    # 같은 이유의 leaf 멤버(Phase 4 change-detection, scipy 기반 point cloud C2C).
    "ksi-change-detection",
    # 같은 이유의 leaf 멤버(Phase 4 BIM 연계, ifcopenshell 기반 IFC 지오메트리 추출).
    "ksi-bim-integration",
    # 같은 이유의 leaf 멤버(Phase 3 Kinematic State/CPA-TTC/RiskField).
    "ksi-equipment-intelligence",
    # 같은 이유의 leaf 멤버(M1 측지 기반 — EPSG:5186 재투영·KNGeoid 수직기준).
    "ksi-geo-spatial",
    # 같은 이유의 leaf 멤버(Phase 4 결함탐지 계약 + adapter, MODEL-P4-001). 실모델
    # 스택(torch/mmcv 등)은 [mixercseg] extra 로 격리 — 모델 보유 환경에서만 설치.
    "ksi-defect-detection",
    # tools/fetch_defect_model.py 전용 — MixerCSeg 체크포인트가 HuggingFace 가
    # 아니라 Google Drive 배포라 confirm-token 우회가 필요하다(urllib 로 직접
    # 구현하면 Drive 의 바이러스 스캔 인터스티셜 페이지를 다뤄야 해 깨지기 쉽다).
    "gdown>=5.2",
    # ksi-core[s3] 어댑터(ADR-KSI-010 §1)의 타입체크·테스트용. 런타임 필수 의존이
    # 아니다 — Core 는 evidence_storage 없이도 조립되고, 그 경우 boto3 를 import
    # 하지도 않는다(어댑터 모듈 안에서 지연 import).
    "boto3>=1.34",
    "boto3-stubs[s3]>=1.34",
]

[tool.ruff]
line-length = 100
# `dir/**` 형태로 **저장소 루트 기준 경로**를 명시한다. 슬래시 없는 "edge"는 ruff가
# basename 글롭으로 취급해 어느 depth의 edge 디렉터리든 매칭 — `tools/edge/`까지 삼켰다.
# 2026-08-03 신설한 tools/edge/{check_target_abi,fetch_psdk}.py 가 `ruff check .`
# 대상에서 통째로 빠져 있던 것을 2026-08-04 감사에서 실측 확인(명시 경로 지정 시에만
# 검사돼 "All checks passed"가 검사 미수행을 가렸다 — 이 저장소가 경계하는 조용한 no-op).
# 선행 슬래시("/edge")는 절대경로로 해석돼 제외가 아예 풀리므로 쓰지 않는다(실측).
extend-exclude = ["references/**", "edge/**", "apps/**", "services/defect-detection/src/ksi_defect_detection/_vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 디자인 시안 생성기는 CSS/HTML을 문자열 리터럴로 들고 있다. 100자 제한을 맞추려고
# CSS 선언을 쪼개면 오히려 읽기 어려워진다 — E501만 끄고 F/B/SIM(실제 버그)은 살린다.
# 디렉터리 통째 exclude 를 쓰지 않는 이유는 위 extend-exclude 주석의 사고와 같다.
"design/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
# tools/vector-extraction/: 참고 레포(Scout)를 스크래치패드 venv에서 import하는
# 일회성 추출 스크립트라 메인 워크스페이스에서는 원래 해석 불가하다(설계상 의도).
#
# mypy exclude는 **정규식**이다(ruff의 gitignore 문법과 다르다) — `^`로 앵커링하지
# 않으면 substring 매칭이라 "edge/"가 `tools/edge/`까지 제외시킨다. 2026-08-04 감사에서
# tools/edge/*.py 가 이 오탐으로 타입체크 밖이었음을 확인하고 앵커링했다.
exclude = [
    "^references/",
    "^edge/",
    "^apps/",
    # design/: 정적 디자인 사이트 생성기라 런타임 제품 코드가 아니고 어떤 CI 잡도
    # 타입체크하지 않는다. 빼두지 않으면 `mypy .` 만 이 파일을 끌어와 35개 오류를
    # 내고, CI 명령(`mypy packages services tests tools`)은 0건이라 두 명령이 다른
    # 답을 낸다 — 그 차이가 다음 세션에게 제품 회귀로 오인된다(2026-08-17).
    "^design/",
    "^tools/vector-extraction/",
    "^services/defect-detection/src/ksi_defect_detection/_vendor/",
]
# tests/hil, tests/contract 등이 `sys.path.insert(...) + from <module> import ...`
# (flat import) 로 tools/*/*.py 를 참조한다. mypy_path 로 두 디렉터리를 모듈 검색
# 경로에 명시해 이 flat import 가 스캔 순서와 무관하게 해석되게 한다
# (위 exclude 앵커링과 별개 사안 — 앵커링은 "파일이 체크되는가", mypy_path는
#  "그 파일이 import하는 모듈이 해석되는가").
mypy_path = ["tools/hil", "tools/edge"]

# [dfine] extra(torch·transformers·onnx 계열)는 CI 에 설치되지 않는다 — mypy 는
# 지연 import 도 모듈 해석을 시도해 미설치 시 import-not-found **에러**를 내므로
# (반증 리뷰 F1: 로컬은 extra 가 있어 green, CI 만 깨지는 env divergence),
# 이 계열은 missing import 를 무시한다. onnxruntime 은 설치돼도 스텁 미제공.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torch",
    "transformers.*",
    "transformers",
    "onnx.*",
    "onnx",
    "onnxruntime.*",
    "onnxruntime",
]
ignore_missing_imports = true

# [mixercseg] extra(MODEL-P4-001) — 같은 사유. cv2/mmcv/mmseg/mmengine/timm/
# fvcore/einops 는 CI 기본 sync 에 설치되지 않는다.
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "cv2",
    "mmcv.*",
    "mmcv",
    "mmseg.*",
    "mmseg",
    "mmengine.*",
    "mmengine",
    "timm.*",
    "timm",
    "fvcore.*",
    "einops.*",
]
ignore_missing_imports = true

# rasterio 는 설치되지만 py.typed 마커도 스텁 패키지도 제공하지 않는다(1.5.0 확인).
# 위 두 override 와 성격이 다르다 — 저건 "CI 에 미설치"라서고, 이건 "설치돼도
# 타입 정보가 없어서"다. types-rasterio 같은 공식 스텁이 나오면 이 항목을 지운다.
# pyproj 는 py.typed 를 제공하므로 여기 없다.
[[tool.mypy.overrides]]
module = [
    "rasterio.*",
    "rasterio",
]
ignore_missing_imports = true

# laspy 도 rasterio 와 같은 사유(설치되지만 py.typed 마커·스텁 패키지 없음, 2.7.0
# 확인) — run_change_detection.py 가 point cloud(.laz) 를 읽는 데 쓴다.
[[tool.mypy.overrides]]
module = [
    "laspy.*",
    "laspy",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
norecursedirs = ["references", "edge", "apps", "node_modules", ".venv"]
