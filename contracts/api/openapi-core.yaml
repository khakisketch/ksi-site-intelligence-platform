openapi: 3.1.0
info:
  title: KSI Site Intelligence Core API
  # 1.2.0 — S2: 인증(bearerAuth) 도입 + Site/Event/Mission 조회·전이 표면 신설.
  # 미배포·로컬 조립 한정 단계의 범프라 major 아님(인증 필수화가 기배포 클라이언트를
  # 깨는 시점이었다면 major 대상 — 배포 전 확정이므로 minor).
  # 1.3.0 — fix:contract-sync: event_key 도입(경로·응답 필드·필터)을 문서에
  # 반영, severity enum 을 실값(CANDIDATE 포함)으로 정정, expose_docs 스위치
  # 서술 추가. 이미 구현된 동작을 문서에 맞추는 정정이라 minor.
  # 1.4.0 — 2차 독립 재검토 P1/P2 폐쇄: eventId/edgeDeviceId/siteId 경로-안전
  # 문자 검증(INVALID_EVENT_IDENTITY 확장·INVALID_SITE 사유 추가) + occurredAt
  # tz-aware 강제(INVALID_EVENT_TIMESTAMP 신설) 를 계약에 반영.
  # 1.5.0 — risk api-contract-response-schema-void 폐쇄: 응답 본문을 자유
  # 문자열 description 대신 components/schemas 로 명세하고 필드 집합을
  # test_api_contract_sync.py 가 구현과 대조한다. 이전에는 대조할 정본 자체가
  # 없어 Core 가 EventSummaryResponse 에 eventType 을 추가해도 게이트가
  # 침묵했다(2026-08-04 실제 drift). 필드를 늘리는 변경이 아니라 이미 있는
  # 동작을 문서화하는 정정이므로 minor.
  # 1.6.0 — GET /v1/missions/{mission_id}/kmz 신설: 발급 응답에만 실리던 KMZ
  # 를 저장된 plan_request 로 재생성해 내려받을 수 있게 한다(운영자가 위저드를
  # 끝까지 눌러도 손에 파일이 없던 막다른 길 폐쇄). 새 표면 추가라 minor.
  # 1.7.0 — 현장 AOI 영속(risk site-aoi-not-persisted 폐쇄): POST /v1/sites 가
  # 선택 필드 aoi 를 받고, PUT /v1/sites/{site_id}/aoi 로 나중에 설정·교체할
  # 수 있다(UNMAPPED 상태에서만, siteFrame 정확 일치 필수 — SITE_FRAME_MISMATCH/
  # AOI_LOCKED). SiteView 에 aoi 필드 추가. 기존 표면을 깨지 않는 확장이라 minor.
  # 1.8.0 — 대시보드에 비행 결과 노출(발급 메타만 있고 "날았는가"가 어디에도
  # 없던 공백 폐쇄): MissionRecordResponse 에 파생 필드 coverageCompletionState
  # 추가(그 임무의 최신 CoverageReport 판정 — 서버가 조회 시점에 계산, 저장하지
  # 않는다). CoverageReportView 에 reportedBy 추가(누가 보고했는지, 독립 재검토
  # B-3). 기존 표면을 깨지 않는 확장이라 minor.
  # 1.9.0 — fix:contract-sync ADR-KSI-015(역할 3개 축소 + SITES_AUTONOMY_APPROVE
  # 신설): POST /v1/sites/{site_id}/transitions 설명에 관리자 전용 간선 게이트를
  # 반영하고(이미 구현된 동작 문서화), POST /v1/missions/contracts 설명의 구
  # 역할 이름을 FIELD_OPERATOR 로 정정. 신규 표면 없이 이미 있는 동작을
  # 문서화하는 정정이라 minor.
  # 1.10.0 — B1 원본 사진 번들 입구 신설: POST/GET /v1/missions/{mission_id}/
  # source-media·POST .../source-media/seal. Mission 에 종속된 별도 업로드
  # 입구(기존 evidence 는 Event 종속이라 매핑 원본에 맞지 않는다) — 배치
  # presigned PUT 발급, sourceBundleDigest 는 Core 가 정규 정렬된 매니페스트에서
  # 계산한다(요청이 자기 증명서를 쓰지 못하게). 새 표면 추가라 minor.
  # 1.11.0 — B2 처리 작업 발급·상태전이 신설: POST/GET /v1/missions/{mission_id}/
  # processing-jobs · GET /v1/processing-jobs/{job_id} · POST .../transitions.
  # 입력(장수·화소·digest)은 봉인된 번들에서 Core 가 집계하고 요청에는 자리가
  # 없다. 함께 POST /v1/sites 가 선택 필드 dataResidency 를 받는다 — INV-050 의
  # 반출 판정이 읽을 값이 저장소 어디에도 없어서, 그대로 두면 처리 작업 요청이
  # 자기 반출 허가서를 쓰게 된다. 미선언은 반출 불가로 읽히므로 기존 현장의
  # 동작이 느슨해지지 않는다. 새 표면 추가라 minor.
  # 1.12.0 — B3 산출물 원장 신설: POST /v1/processing-jobs/{job_id}/artifacts.
  # RUNNING→SUCCEEDED 가 authority=source 산출물 최소 1건을 요구하게 되면서
  # (INV-051) 그 근거를 만드는 표면이 필요해졌다. 계보 앵커(lineage.sourceDigest)
  # 는 요청 스키마에 자리가 없고 Core 가 작업의 봉인 digest 로 채운다.
  # 함께 POST .../transitions 의 요구 권한이 대상 상태별로 갈린다 —
  # RUNNING/SUCCEEDED/FAILED 는 PROCESSING_WORKER 전용(PROCESSING_WORK),
  # CANCELLED 는 사람(MISSIONS_ISSUE). **기존 사람 토큰으로 되던 실행 상태
  # 보고가 403 이 된다**(의도된 축소 — 사람이 성공을 손으로 찍는 경로를 닫는다).
  # 표면 축소가 아니라 권한 재배치라 minor 로 둔다.
  # 1.13.0 — 워커 경로 종단 연결: POST /v1/missions/{id}/source-media/verify(실측
  # 대조) + GET /v1/processing-jobs/{id}/input(워커 입력 수신). 업로더 신고값
  # (sha256·해상도)을 워커가 실측 보고하고 **Core 가** 대조한다 — 워커는 판정을
  # 보낼 수 없고, 입력 응답에 신고값이 실리지 않아 읽지 않고 되읊을 수도 없다.
  # RUNNING→SUCCEEDED 게이트에 "입력 실측 대조 완료"가 추가된다(기존 산출물
  # 조건과 AND). 실측 없이 성공을 주장하면 과금 근거(totalMegapixels)가 끝까지
  # 업로더 신고값으로 남기 때문이다. SourceMediaBundleView 에 lastMismatchAt 추가.
  # 1.14.0 — 워커 lease 신설: POST /v1/processing-jobs/{id}/lease. 작업 하나를
  # 워커 하나가 쥐고, /input·실행 상태 보고·산출물 등록이 전부 그 lease 를 요구한다
  # (상호배제 + 접근 범위 축소 — 워커 토큰 하나로 활성 작업 전체의 원본을 열람하던
  # 것을 닫는다). 만료는 저장 플래그가 아니라 expiresAt 대 now 비교라, 죽은 워커의
  # 작업이 별도 조치 없이 회수된다. **기존 워커 호출이 lease 없이는 409 가 된다.**
  # 취소(CANCELLED)만 lease 를 요구하지 않는다 — 워커가 죽어 lease 가 살아 있는
  # 동안 취소가 막히면 정확히 취소가 필요한 상황에서 막힌다.
  # ProcessingJobView 에 leaseWorkerId·leaseExpiresAt 추가.
  # 1.15.0 — GET /v1/processing-jobs/{id}/input 응답에 siteCrs 추가. 산출물의
  # crs 를 워커가 지어내거나 processing_params 로 자기 신고하지 않게, 현장
  # 등록 시점에 확정된 값을 Core 가 읽어 준다(발급 시점 INV-050 반출 판정이
  # site_store 를 읽는 것과 같은 원칙). 새 필드 추가라 minor.
  # 1.16.0 — phase-2 Spatial Refresh Backbone + Coverage Recovery(MASTER_PRD
  # §15.2). AUTONOMOUS_PATROL(perimeter) 이 route.captureIntervalM **또는**
  # route.camera 를 필수로 요구하게 된다(없으면 순찰 중 3D 갱신용 사진이 전혀
  # 수집되지 않는다 — 요청 스키마 자체는 안 바뀐다, lawnmower captureIntervalM
  # 필수화와 동일하게 서버 비즈니스 로직에서만 강제). camera 를 주면 lawnmower
  # 와 동일한 compute_grid_spacing 물리식으로 간격을 계산해 MIN_FRONT_OVERLAP
  # (0.6) 하한을 만족시킨다. CoverageReportView 에 recoveryRecommended 추가
  # (completionState 가 COMPLETED 가 아니거나 — COMPLETED_WITH_GAPS/ABORTED_SAFE/
  # FAILED 전부 — 또는 사유있는 미관찰 Cell 이 남으면 true — 자동 재발급을
  # 트리거하지 않는 권고 신호). **주의**: 이전엔 201 이던 AUTONOMOUS_PATROL 요청
  # (captureIntervalM/camera 미지정)이 이제 422 다 — 표면 확장이자 기존 호출자
  # 파괴 가능성이 있는 변경이지만, 신규 필드 추가가 아니라 비즈니스 로직 변경뿐
  # 이라 스키마 구조상 minor 로 둔다(계약 스키마 자체는 하위호환).
  # 1.18.0 — M1 체적 변화 리포트: POST·GET /v1/missions/{id}/volume-changes.
  # 두 시점 DSM 차분으로 잰 구역별 절토·성토. change-detection 과 형제이되 입력이
  # dsm(저기는 point_cloud)이고 결과 형태가 다르다(m³ vs candidateRatio).
  # 1.17.0 — M1 산출물 바이트 영속: POST /v1/processing-jobs/{id}/artifacts/
  # upload-url(워커가 올릴 자리 발급) + GET .../artifacts/{artifactId}/download
  # (등록된 산출물 열람). 이전에는 재구성이 성공해도 digest 만 남고 바이트가
  # 버려져 사람이 볼 수 있는 것이 없었다(ADR-KSI-016). 표면 추가라 minor.
  # 1.19.0 — M4-A 설계 기준면 자산 신설: POST·GET /v1/sites/{siteId}/design-surfaces ·
  # POST .../{id}/seal(SITES_WRITE) · GET /v1/design-surfaces(검증 대기 큐) ·
  # POST /v1/design-surfaces/{id}/observations · .../verification-failure
  # (PROCESSING_WORK, 워커 전용). 선언(업로더 주장)과 관측(워커가 바이트를 읽어
  # 잰 값)을 계약에서 이름으로 가르고, 대조 판정은 Core 가 한다 — SEALED 는
  # "업로드했다는 주장"일 뿐이고 비교 입력 자격은 VERIFIED 하나뿐이다.
  # 새 표면 추가라 minor.
  # 1.20.0 — M4-A 설계 대비 잔량: POST·GET /v1/missions/{id}/design-conformance-
  # requests(MISSIONS_ISSUE·MISSIONS_READ) · GET /v1/design-conformance-requests ·
  # POST .../{id}/lease · GET .../input · POST .../transitions ·
  # POST .../diff-raster-upload-url · POST .../diff-raster-verification
  # (PROCESSING_WORK) · POST·GET /v1/missions/{id}/design-conformance ·
  # GET .../{id}/diff-raster. **신뢰 경계가 이 판의 요점이다**: 워커의 "올렸다,
  # 해시는 이거다"는 근거가 아니라 신고일 뿐이고, Core 가 그 객체 바이트를 직접
  # 읽어 자기 hashlib 으로 다시 계산해 같을 때만 확인 사실이 남는다. 리포트를
  # 원장에 굳히는 순간에도 같은 재해싱을 한 번 더 해서, "유효한 리포트가 있는데
  # 그 지도는 다른 파일"인 상태를 구조적으로 없앤다. 새 표면 추가라 minor.
  # 1.21.0 — Manifold 3 Edge shadow vertical slice: GET signed dispatch,
  # activation receipt, device-owned evidence upload. Core does not expose any
  # flight-control API and Edge cannot create CONFIRMED_EVENT.
  # 1.22.0 — KMZ 를 사람 손 없이 장비까지 보낸다. ① GET /v1/missions/{id}/kmz 가
  # EDGE_MISSION_KMZ_READ(신설, EDGE_DEVICE 고정집합 전용)도 받는다 — 장비는 자기
  # 배정 임무 하나로 범위가 좁고 불일치는 404 다. MISSIONS_READ 를 주지 않은 이유는
  # 그 권한이 전 현장 임무 목록·상세·원본 미디어를 함께 열기 때문이다. ②
  # MissionDispatchEnvelope 에 kmzSha256 추가(v1.1) — ADR-KSI-007 의 "같은 요청에서
  # 짝으로 발급" 불변식이 지금까지 발급 시점의 서버 내부 규약일 뿐 전달 경로 어디서도
  # 검증되지 않았다. 이제 Edge 가 받은 바이트의 sha256 이 서명된 값과 다르면 활성화
  # 전체를 거부한다. 기존 표면을 깨지 않는 확장이라 minor(구 v1.0 봉투는 계속
  # 검증된다 — dispatch journal 재생이 과거 레코드를 다시 통과시키기 때문이다).
  # 1.23.0 — CRITICAL evidence Ed25519 장비 증명과 응답 attestation 상태,
  # Mission Contract v1.3 dual-reader/issuance ordering, AOL-1 촬영시각 계보를 추가한다.
  # Core가 완료 epoch에 captureWindow를 불변 스냅샷으로 남기고 freshness는 capturedTo만
  # 사용하며 미상/충돌은 등록시각으로 대체하지 않는다. 단일 site 상세에 공간모델
  # 요약을 중첩하고 기존 /spatial-model은 호환 유지한다.
  # 1.24.0 — 반복 관측 Observation Work Order·재관측 사람 승인·
  # 근거 제약 Copilot 표면을 추가한다. 모든 새 표면은 organizationId
  # 범위로 조회되며 Copilot은 읽기 tool allowlist와 재관측 초안만
  # 허용하고 임무 발급·승인을 할 수 없다.
  # 1.25.0 — RC-first AcquisitionDeploymentProfile, 만료되는 ConnectivitySnapshot,
  # 조직-scoped readiness와 GATEWAY_DEVICE heartbeat를 추가한다. 명시적 production
  # rollout flag가 켜지면 Mission 발급은 readiness=false에서 막지만, 이미 활성화된
  # 계약은 인터넷 단절로 무효화하지 않는다.
  # 1.26.0 — 승인 회차별 AcquisitionRun, WorkOrder→Mission lineage, capability별
  # Gateway operation receipt와 통합 acquisition progress를 추가한다. 장비 사실은
  # 기존 MissionExecution/SourceMedia/Processing 원장에서 읽고, heartbeat 만료는
  # 활성 계약을 이전 단계로 회귀시키지 않는다.
  # 1.27.0 — Edge final CaptureQualityReport와 evidence-derived Analysis Readiness를
  # WorkOrder progress에 추가한다. temporal policy와 coverage/media/capture-time/
  # processing lineage가 모두 있어야 READY이며, 처리 성공이나 비행 종료만으로는
  # 준비됨이 아니다. Pilot 2 export KMZ는 별도 immutable FlightArtifact candidate로만
  # ingest/list/download할 수 있고, 항상 unbound/non-executable이다. 새 읽기·입력
  # 표면 추가라 minor이며 실제 Pilot 2/PSDK 실행 검증을 뜻하지 않는다.
  # 1.28.0 — ADR-KSI-030 civil processing consistency v1. 새 ProcessingJob은
  # processingProfileId 하나로만 발급하고 Core가 immutable recipe를 확장한다.
  # LandXML 원본 보존형 ingress와 comparison preflight를 추가하며 과거 raw spec
  # 원장은 LEGACY_UNMANAGED로만 재생한다. 배포 전 계약 축소와 새 표면을 함께
  # 확정한 minor 버전이며 실제 토목 현장 정확도 수용을 뜻하지 않는다.
  # 1.29.0 — ADR-KSI-031 independent checkpoint validation v1. 업로더가 RMSE를
  # 신고하지 못하게 하고, sealed CSV와 immutable DSM을 trusted worker가 각각
  # 재해싱·전수 샘플한 관측만 Core가 VALIDATED/REJECTED 원장으로 굳힌다. 비교의
  # uncertainty producer를 추가하지만 물리적 독립성/측량급 수용을 주장하지 않는다.
  # 1.30.0 — Browser-print PDF와 browser-built CSV의 내보내기 감사 원장. Core는
  # 파일 bytes를 받거나 생성했다고 주장하지 않고, 인증 Principal·조직-scoped Site·
  # immutable design-conformance report 전체 canonical digest와 processing/design
  # lineage를 다시 대조한 snapshot만 append-only로 기록한다.
  version: 1.30.0
  description: >-
    구현된 계약과 계획된 계약을 구분한다(감사 #25·#35) — `x-status: planned`
    경로는 아직 구현되지 않은 설계 스케치이며, 표기 없는 경로는 실구현과
    tests/contract/test_api_contract_sync.py 가 대조한다.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200': { description: Process alive }
  /capabilities:
    get:
      summary: List operational (VERIFIED-only) capabilities
      description: SPIKE_REQUIRED/BLOCKED 항목은 절대 포함되지 않는다(INV-041).
      responses:
        '200': { description: Operational capabilities }
  /v1/auth/whoami:
    get:
      summary: Resolve the authenticated Principal and its effective permissions
      description: >-
        인증만 요구한다(인가 없음, ADR-KSI-008 §2). OPERATOR 는
        role·permissions 를, GATEWAY_DEVICE는 deviceId·GATEWAY_CONNECTIVITY_WRITE를,
        EDGE_DEVICE 는 deviceId·EDGE_SYNC_INGEST·EDGE_MISSION_PULL·
        EDGE_EVIDENCE_WRITE 고정 권한을 반환한다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 인증된 principal 자신
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoAmIResponse' }
        '401': { description: '인증 실패(부재/형식오류/미지 토큰) — WWW-Authenticate: Bearer' }
  /v1/sites/{site_id}/acquisition-profile:
    put:
      summary: Create or replace the Site acquisition deployment profile
      description: >-
        조직-scoped Site에 RC Plus 2/Manifold 또는 향후 Dock 장치 신원과 허용
        transport를 바인딩한다. binding 변경 시 이전 heartbeat는 즉시 폐기한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquisitionDeploymentProfileV1' }
      responses:
        '200':
          description: Stored profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionDeploymentProfileV1' }
        '401': { description: Authentication failed }
        '403': { description: SITES_WRITE permission required }
        '404': { description: Site not found in the principal organization }
        '422': { description: Invalid profile or path/body Site mismatch }
        '503': { description: Durable journal unavailable }
    get:
      summary: Get the Site acquisition deployment profile
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Organization-scoped profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionDeploymentProfileV1' }
        '401': { description: Authentication failed }
        '403': { description: SITES_READ permission required }
        '404': { description: Profile not found in the principal organization }
  /v1/sites/{site_id}/acquisition-readiness:
    get:
      summary: Evaluate readiness for issuing a new KSI Mission
      description: >-
        만료되지 않은 Gateway heartbeat, RC 인터넷, 장치 binding, 허용 transport,
        하드웨어·펌웨어별 VERIFIED capability를 fail-closed로 대조한다. 이 응답은
        기존에 서명·활성화된 Mission Contract를 중단하거나 무효화하지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: site_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Readiness projection, including blocked states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionReadinessView' }
        '401': { description: Authentication failed }
        '403': { description: SITES_READ permission required }
  /v1/gateway-sync/heartbeats:
    post:
      summary: Record an expiring Gateway connectivity and capability snapshot
      description: >-
        GATEWAY_DEVICE만 자기 gatewayDeviceId로 보고할 수 있다. 조직·Site·Edge
        binding은 저장된 profile에서 대조하고, snapshot TTL은 최대 5분이다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectivitySnapshotV1' }
      responses:
        '201':
          description: Durable heartbeat receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectivitySnapshotV1' }
        '401': { description: Authentication failed }
        '403': { description: GATEWAY_DEVICE permission required }
        '404': { description: Device binding or profile not found }
        '422': { description: Invalid or future-dated snapshot }
        '503': { description: Durable journal unavailable }
  /v1/gateway-sync/operation-receipts:
    post:
      summary: Record one capability-specific Gateway operation receipt
      description: >-
        GATEWAY_DEVICE만 호출한다. principal의 organization/device와 Site profile,
        Mission, AcquisitionRun binding을 대조한다. 같은 receiptId 전문 재전송은
        200 멱등이고, 같은 idempotencyKey와 digest는 WIFI↔CELLULAR fallback에서도
        유지할 수 있다. 다른 digest 재사용은 409다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayOperationReceiptRequest' }
      responses:
        '200':
          description: Identical receipt retry; no second journal append
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayOperationReceiptV1' }
        '201':
          description: Durable operation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayOperationReceiptV1' }
        '401': { description: Authentication failed }
        '403': { description: GATEWAY_DEVICE permission required }
        '404': { description: Device, Site, Mission, or AcquisitionRun binding not found }
        '409': { description: receiptId or idempotencyKey conflict }
        '422': { description: Invalid transport, digest, or future observedAt }
        '503': { description: Durable journal unavailable }
  /v1/observation-work-orders/{work_order_id}/acquisition-progress:
    get:
      summary: Get canonical acquisition progress for the current WorkOrder cycle
      description: >-
        AcquisitionRun 연결과 기존 MissionExecution, SourceMedia, Processing 원장을
        조합한다. READY_FOR_FLIGHT는 서명 activation 사실 뒤에만 표시하며 이후
        네트워크 단절은 경고일 뿐 계약 취소나 상태 회귀가 아니다. 분석 결과를
        검토할 수 있는지는 stage 또는 ProcessingJob 성공만으로 판단하지 않고,
        별도의 evidence-derived analysisReadiness가 Coverage·촬영 품질·원본
        무결성·capture-time·temporal policy·처리 계보를 함께 대조해 결정한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: work_order_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Organization-scoped current-cycle progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionProgressView' }
        '401': { description: Authentication failed }
        '403': { description: SITES_READ permission required }
        '404': { description: WorkOrder not found in the principal organization }
        '503': { description: AcquisitionRun journal unavailable during reconciliation }
