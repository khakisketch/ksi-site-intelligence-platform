openapi: 3.1.0
info:
  title: KSI Site Intelligence Core API
  # 1.2.0 — S2: 인증(bearerAuth) 도입 + Site/Event/Mission 조회·전이 표면 신설.
  # 미배포·로컬 조립 한정 단계의 범프라 major 아님(인증 필수화가 기배포 클라이언트를
  # 깨는 시점이었다면 major 대상 — 배포 전 확정이므로 minor).
  # 1.3.0 — fix:contract-sync: event_key 도입(경로·응답 필드·필터)을 문서에
  # 반영, severity enum 을 실값(CANDIDATE 포함)으로 정정, expose_docs 스위치
  # 서술 추가. 이미 구현된 동작을 문서에 맞추는 정정이라 minor.
  # 1.4.0 — 2차 독립 재검토 P1/P2 폐쇄: eventId/edgeDeviceId/siteId 경로-안전
  # 문자 검증(INVALID_EVENT_IDENTITY 확장·INVALID_SITE 사유 추가) + occurredAt
  # tz-aware 강제(INVALID_EVENT_TIMESTAMP 신설) 를 계약에 반영.
  # 1.5.0 — risk api-contract-response-schema-void 폐쇄: 응답 본문을 자유
  # 문자열 description 대신 components/schemas 로 명세하고 필드 집합을
  # test_api_contract_sync.py 가 구현과 대조한다. 이전에는 대조할 정본 자체가
  # 없어 Core 가 EventSummaryResponse 에 eventType 을 추가해도 게이트가
  # 침묵했다(2026-08-04 실제 drift). 필드를 늘리는 변경이 아니라 이미 있는
  # 동작을 문서화하는 정정이므로 minor.
  # 1.6.0 — GET /v1/missions/{mission_id}/kmz 신설: 발급 응답에만 실리던 KMZ
  # 를 저장된 plan_request 로 재생성해 내려받을 수 있게 한다(운영자가 위저드를
  # 끝까지 눌러도 손에 파일이 없던 막다른 길 폐쇄). 새 표면 추가라 minor.
  # 1.7.0 — 현장 AOI 영속(risk site-aoi-not-persisted 폐쇄): POST /v1/sites 가
  # 선택 필드 aoi 를 받고, PUT /v1/sites/{site_id}/aoi 로 나중에 설정·교체할
  # 수 있다(UNMAPPED 상태에서만, siteFrame 정확 일치 필수 — SITE_FRAME_MISMATCH/
  # AOI_LOCKED). SiteView 에 aoi 필드 추가. 기존 표면을 깨지 않는 확장이라 minor.
  # 1.8.0 — 대시보드에 비행 결과 노출(발급 메타만 있고 "날았는가"가 어디에도
  # 없던 공백 폐쇄): MissionRecordResponse 에 파생 필드 coverageCompletionState
  # 추가(그 임무의 최신 CoverageReport 판정 — 서버가 조회 시점에 계산, 저장하지
  # 않는다). CoverageReportView 에 reportedBy 추가(누가 보고했는지, 독립 재검토
  # B-3). 기존 표면을 깨지 않는 확장이라 minor.
  # 1.9.0 — fix:contract-sync ADR-KSI-015(역할 3개 축소 + SITES_AUTONOMY_APPROVE
  # 신설): POST /v1/sites/{site_id}/transitions 설명에 관리자 전용 간선 게이트를
  # 반영하고(이미 구현된 동작 문서화), POST /v1/missions/contracts 설명의 구
  # 역할 이름을 FIELD_OPERATOR 로 정정. 신규 표면 없이 이미 있는 동작을
  # 문서화하는 정정이라 minor.
  # 1.10.0 — B1 원본 사진 번들 입구 신설: POST/GET /v1/missions/{mission_id}/
  # source-media·POST .../source-media/seal. Mission 에 종속된 별도 업로드
  # 입구(기존 evidence 는 Event 종속이라 매핑 원본에 맞지 않는다) — 배치
  # presigned PUT 발급, sourceBundleDigest 는 Core 가 정규 정렬된 매니페스트에서
  # 계산한다(요청이 자기 증명서를 쓰지 못하게). 새 표면 추가라 minor.
  # 1.11.0 — B2 처리 작업 발급·상태전이 신설: POST/GET /v1/missions/{mission_id}/
  # processing-jobs · GET /v1/processing-jobs/{job_id} · POST .../transitions.
  # 입력(장수·화소·digest)은 봉인된 번들에서 Core 가 집계하고 요청에는 자리가
  # 없다. 함께 POST /v1/sites 가 선택 필드 dataResidency 를 받는다 — INV-050 의
  # 반출 판정이 읽을 값이 저장소 어디에도 없어서, 그대로 두면 처리 작업 요청이
  # 자기 반출 허가서를 쓰게 된다. 미선언은 반출 불가로 읽히므로 기존 현장의
  # 동작이 느슨해지지 않는다. 새 표면 추가라 minor.
  version: 1.11.0
  description: >-
    구현된 계약과 계획된 계약을 구분한다(감사 #25·#35) — `x-status: planned`
    경로는 아직 구현되지 않은 설계 스케치이며, 표기 없는 경로는 실구현과
    tests/contract/test_api_contract_sync.py 가 대조한다.
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200': { description: Process alive }
  /capabilities:
    get:
      summary: List operational (VERIFIED-only) capabilities
      description: SPIKE_REQUIRED/BLOCKED 항목은 절대 포함되지 않는다(INV-041).
      responses:
        '200': { description: Operational capabilities }
  /v1/auth/whoami:
    get:
      summary: Resolve the authenticated Principal and its effective permissions
      description: >-
        인증만 요구한다(인가 없음, ADR-KSI-008 §2). OPERATOR 는
        role·permissions 를, EDGE_DEVICE 는 deviceId·EDGE_SYNC_INGEST 고정
        권한을 반환한다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 인증된 principal 자신
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoAmIResponse' }
        '401': { description: '인증 실패(부재/형식오류/미지 토큰) — WWW-Authenticate: Bearer' }
  /v1/sites:
    post:
      summary: Register a new Site (initial status always UNMAPPED)
      description: >-
        SITES_WRITE 권한 필요. siteId 중복은 409, 구조 위반은 422 — 최종상태
        직접 등록은 불가하다(§6.1, 항상 UNMAPPED 로 시작). aoi 는 선택 — 등록과
        함께 줄 수도, 나중에 PUT /v1/sites/{site_id}/aoi 로 설정할 수도 있다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [siteId, name, siteFrame]
              properties:
                siteId: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                siteFrame:
                  type: object
                  additionalProperties: false
                  required: [crs, verticalDatum, unit, transformVersion]
                  properties:
                    crs: { type: string }
                    verticalDatum: { type: string }
                    unit: { const: meter }
                    transformVersion: { type: string }
                aoi:
                  type: object
                  additionalProperties: false
                  required: [vertices]
                  description: >-
                    선택 필드. 닫힌 단순 폴리곤(마지막→첫 꼭짓점 변이 암묵적으로
                    닫는다, 3~256 꼭짓점). 생략하면 등록 후 PUT
                    /v1/sites/{site_id}/aoi 로 설정한다.
                  properties:
                    vertices:
                      type: array
                      minItems: 3
                      items:
                        type: object
                        additionalProperties: false
                        required: [latDeg, lonDeg]
                        properties:
                          latDeg: { type: number, minimum: -90, maximum: 90 }
                          lonDeg: { type: number, minimum: -180, maximum: 180 }
                dataResidency:
                  type: object
                  additionalProperties: false
                  required: [egressAllowed, jurisdiction]
                  description: >-
                    선택 필드지만 **생략은 반출 불가를 뜻한다**(INV-050) — 관대한
                    기본값이 아니다. 처리 작업(POST /v1/missions/{mission_id}/
                    processing-jobs)이 executionLocus=vendor_cloud 를 요청할 때
                    이 값만 본다. 등록 이후 변경 경로는 의도적으로 없다 — 반출
                    허용은 법적 판단이라 SITES_WRITE 로 조용히 바꿀 값이 아니다.
                  properties:
                    egressAllowed: { type: boolean }
                    jurisdiction: { type: string, minLength: 1 }
      responses:
        '201':
          description: REGISTERED — verdict + 등록된 SiteView
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMutationResponse' }
        '409': { description: DUPLICATE_SITE_ID }
        '422':
          description: >-
            INVALID_SITE(siteId/name/siteFrame 필드 공백 — INV-020 / siteId 가
            경로-안전 문자 밖 — '/'·공백 등, /v1/sites/{site_id} 경로 세그먼트
            제약) / aoi 구조 위반(자기교차·중복 꼭짓점·범위 밖 좌표 등 —
            AreaOfInterest 파싱 실패, FastAPI 표준 422)
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
    get:
      summary: List sites (siteId 오름차순 결정적 정렬)
      description: SITES_READ 권한 필요.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 등록된 현장 전체
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}:
    get:
      summary: Get one Site by id
      description: SITES_READ 권한 필요. 미지 siteId 는 존재 여부 힌트 없는 일반 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 현장 하나
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteView' }
        '404': { description: 현장을 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: SITES_READ 권한 없음 }
  /v1/sites/{site_id}/transitions:
    post:
      summary: Transition a Site's status (10-state machine, MASTER_PRD §6.3)
      description: >-
        SITES_WRITE 권한 필요. evidence·reason 비공백 필수. SUSPENDED 이탈은
        저장소가 기억한 진입 직전 상태로만 복귀 허용(§6.1). PATROL_READY 도달은
        MODEL_VALIDATION→PROVISIONAL_AUTONOMY 경유가 강제된다(품질검증 생략 금지).
        blast radius 가 큰 간선(자율 시작 승인 MODEL_VALIDATION→
        PROVISIONAL_AUTONOMY·정식 순찰 승인 PROVISIONAL_AUTONOMY→PATROL_READY·
        모든 상태→SUSPENDED 진입·SUSPENDED→직전 상태 복귀)은 SITES_WRITE 만으로는
        부족하고 추가로 SITES_AUTONOMY_APPROVE 권한(관리자 전용)을 요구한다
        (ADR-KSI-015 D2). 간선(현재 상태 → 요청 상태) 쌍 기준 판정이다 —
        PATROL_ACTIVE→PATROL_READY(순찰 복귀)는 같은 목적지라도 게이트되지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus, evidence, reason]
              properties:
                targetStatus:
                  enum:
                    - UNMAPPED
                    - BASELINE_MAPPING
                    - MODEL_PROCESSING
                    - MODEL_VALIDATION
                    - PROVISIONAL_AUTONOMY
                    - PATROL_READY
                    - PATROL_ACTIVE
                    - MODEL_STALE
                    - REMAP_REQUIRED
                    - SUSPENDED
                evidence: { type: string, minLength: 1 }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: TRANSITIONED — verdict + 전이된 SiteView
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMutationResponse' }
        '404': { description: UNKNOWN_SITE }
        '409': { description: ILLEGAL_TRANSITION }
        '422': { description: INVALID_SITE(evidence/reason 공백) }
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403':
          description: >-
            SITES_WRITE 권한 없음, 또는 관리자 전용 간선인데 SITES_AUTONOMY_APPROVE
            권한이 없음(ADR-KSI-015 D2).
  /v1/sites/{site_id}/aoi:
    put:
      summary: Set or replace a Site's AOI (Area of Interest polygon)
      description: >-
        SITES_WRITE 권한 필요. AOI 는 ``UNMAPPED`` 상태에서만 설정·교체할 수
        있다(409 AOI_LOCKED — 매핑이 시작된 뒤 외곽을 바꾸면 이전 임무·누적
        중인 커버리지와의 대조가 무너진다, 막는 쪽이 기본). siteFrame 은
        등록된 site 의 것과 정확 일치해야 한다(422 SITE_FRAME_MISMATCH — 다른
        좌표계를 전제로 그려진 AOI 를 수락하지 않는다, POST /v1/missions/plans
        의 동일 게이트와 같은 관용구).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: site_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [aoi, siteFrame]
              properties:
                aoi:
                  type: object
                  additionalProperties: false
                  required: [vertices]
                  description: >-
                    닫힌 단순 폴리곤(마지막→첫 꼭짓점 변이 암묵적으로 닫는다,
                    3~256 꼭짓점).
                  properties:
                    vertices:
                      type: array
                      minItems: 3
                      items:
                        type: object
                        additionalProperties: false
                        required: [latDeg, lonDeg]
                        properties:
                          latDeg: { type: number, minimum: -90, maximum: 90 }
                          lonDeg: { type: number, minimum: -180, maximum: 180 }
                siteFrame:
                  type: object
                  additionalProperties: false
                  required: [crs, verticalDatum, unit, transformVersion]
                  properties:
                    crs: { type: string }
                    verticalDatum: { type: string }
                    unit: { const: meter }
                    transformVersion: { type: string }
                  description: 등록된 site 의 것과 정확 일치해야 한다(SITE_FRAME_MISMATCH).
      responses:
        '200':
          description: AOI_SET — verdict + 갱신된 SiteView
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteMutationResponse' }
        '404': { description: UNKNOWN_SITE }
        '409': { description: AOI_LOCKED(UNMAPPED 이후 상태에서 시도) }
        '422':
          description: >-
            SITE_FRAME_MISMATCH / aoi 구조 위반(자기교차·중복 꼭짓점·범위 밖
            좌표 등 — AreaOfInterest 파싱 실패, FastAPI 표준 422)
        '503': { description: STORE_UNAVAILABLE — journal 봉인됨, 재시작 필요 }
        '401': { description: 인증 실패 }
        '403': { description: SITES_WRITE 권한 없음 }
  /v1/edge-sync/event-bundles:
    post:
      summary: Ingest one idempotent EventBundle journal entry
      description: >-
        본문은 offline_sync JournalEntry(camelCase — idempotencyKey,
        deviceSequence, edgeDeviceId, payloadDigest "sha256:<hex64>", payload).
        payload 는 event-bundle.v1.2.json 을 만족해야 하며(분류 계보 필수,
        INV-031), wire 직렬화는 exclude_none 규약이다. 201/200 만 ACK 다 —
        Edge 는 그 둘을 받은 항목만 로컬에서 삭제한다. EDGE_SYNC_INGEST 권한
        필요(EDGE_DEVICE Principal 전용) — 인증 장비의 deviceId 가 본문
        edgeDeviceId 와 다르면 원장 반영 전에 403 DEVICE_MISMATCH 로 거부한다
        (ADR-KSI-008 §2 — 위조 순번 주입이 장비 신원 뒤로 차단된다).

        수신 전 세 정책 게이트(멱등 원장·순번축 선점 전에 판정 — events.py
        ``classify_edge_bundle``)를 통과해야 event projection 이 이뤄진다.
        ① payload.eventId·인증 edgeDeviceId 중 하나라도 경로-안전 문자
        (``ksi_core.identifiers``, 영숫자 시작 + 영숫자/``_``/``.``/``-``)
        밖의 문자('/'·공백·예약 구분자 ``::`` 등)를 포함하면 서버 정본 신원
        ``event_key = "{edgeDeviceId}::{eventId}"`` 가 라우트 경로 세그먼트로
        쓰일 수 없어 422 INVALID_EVENT_IDENTITY 로 거부(ACK 없음 — 검증 없이
        수락하면 상세·전이 라우트에 영구히 도달 못 하는 사건이 만들어진다).
        ② payload.occurredAt 이 tz-aware(offset 포함)가 아니면 422
        INVALID_EVENT_TIMESTAMP 로 거부(ACK 없음) — naive 값은 서버 로컬
        타임존으로 조용히 재해석돼 감사 시간축이 어긋난다. ③ payload.status 가
        CONFIRMED_EVENT/DISMISSED(종단 상태)면 422 STATUS_NOT_EDGE_ASSERTABLE
        로 거부(ACK 없음) — 확정/기각은 서버 트리아지(``POST
        /v1/events/{event_key}/transitions``)의 업무 판정 전용이며 Edge 가
        주장할 수 없다(MASTER_PRD §8.1/§7.6, INV-021 우회 차단). 실제 인지
        파이프라인은 OBSERVATION→CANDIDATE 까지만 발행한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, deviceSequence, edgeDeviceId, payloadDigest, payload]
              properties:
                idempotencyKey: { type: string, minLength: 1 }
                deviceSequence: { type: integer, minimum: 0 }
                edgeDeviceId: { type: string, minLength: 1 }
                payloadDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                payload:
                  $ref: ../schemas/event-bundle.v1.2.json
      responses:
        '201':
          description: ACCEPTED — durable persistence 후 ACK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '200':
          description: DUPLICATE_IGNORED — 멱등 재전송(ACK)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResponse' }
        '403': { description: DEVICE_MISMATCH(인증 장비 ≠ 요청 edgeDeviceId) / EDGE_SYNC_INGEST 권한 없음 }
        '409': { description: IDEMPOTENCY_CONFLICT / SEQUENCE_DUPLICATE / SEQUENCE_REGRESSION }
        '422':
          description: >-
            DIGEST_MISMATCH / MALFORMED_PAYLOAD / INVALID_EVENT_BUNDLE /
            INVALID_EVENT_IDENTITY(eventId·edgeDeviceId 가 경로-안전 문자
            밖 — '/'·공백·`::` 등) / INVALID_EVENT_TIMESTAMP(occurredAt 이
            tz-aware 아님) / STATUS_NOT_EDGE_ASSERTABLE(status 가
            CONFIRMED_EVENT/DISMISSED — 확정/기각은 서버 트리아지 전용)
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After 후 재전송 }
        '401': { description: 인증 실패 }
  /v1/edge-sync/devices/{device_id}/sequence:
    get:
      summary: Query a device's last accepted sequence (recovery path)
      description: >-
        edge-sync-preauth-sequence-lockout 해소 경로 — 장비가 재전송 시작점을
        판단하는 복구 API. EDGE_DEVICE 는 자기 자신만(타 장비는 일반 문구 403),
        OPERATOR 는 EVENTS_READ 로 임의 장비 조회 가능. 수락 이력이 없으면
        lastSequence 는 null(미지 장비와 구분하지 않는다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: device_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 이 장비의 마지막 수신 순번(미수신 장비는 null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSequenceResponse' }
        '401': { description: 인증 실패 }
        '403': { description: 자기 자신이 아닌 장비 조회 / EVENTS_READ 권한 없음(일반 문구) }
  /v1/events:
    get:
      summary: List projected events (필터·페이지네이션)
      description: >-
        EVENTS_READ 권한 필요. siteId/missionId/edgeDeviceId/status/severity/
        triage 필터, occurredAt desc 정렬(동률은 event_key 오름차순 tie-break —
        events.py). status 는 event-bundle.v1.2 EventStatus 7종과 1:1(확장 금지
        — ADR-KSI-008 §4), triage 는 서버측 TriageStatus(배정 이후 워크플로,
        EventStatus 와 분리된 2-enum). 응답 각 항목의 ``eventKey`` (=
        ``{edgeDeviceId}::{eventId}``) 가 조회·전이 경로의 사건 신원이다(모듈
        docstring "사건 신원은 장비별로 스코프된다" 절).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: siteId
          schema: { type: string }
        - in: query
          name: missionId
          schema: { type: string }
        - in: query
          name: edgeDeviceId
          schema: { type: string }
        - in: query
          name: status
          schema:
            enum:
              [OBSERVATION, CANDIDATE, EVIDENCE_COLLECTION, FINDING, CONFIRMED_EVENT, DISMISSED, UNRESOLVED]
        - in: query
          name: severity
          description: >-
            ksi_domain.enums.Severity 실값 — CANDIDATE(미확정 관찰)·MEDIUM·
            HIGH·CRITICAL(§17.2 확정 심각도 등급). LOW 는 실존하지 않는 값이라
            422 로 거부된다(재검토 P2 — 이전 문서의 LOW 는 오기였다).
          schema: { enum: [CANDIDATE, MEDIUM, HIGH, CRITICAL] }
        - in: query
          name: triage
          schema:
            enum: [NONE, ASSIGNED, ACTION_IN_PROGRESS, REINSPECTION_REQUESTED, RESOLVED, CLOSED]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: 필터 적용된 이벤트 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_READ 권한 없음 }
  /v1/events/{event_key}:
    get:
      summary: Get one event's full detail (bundle + transitions 감사이력)
      description: >-
        EVENTS_READ 권한 필요. ``event_key`` = ``{edgeDeviceId}::{eventId}``
        (목록 응답의 ``eventKey``) — ``eventId`` 는 장비 로컬 식별자라 장비 간
        충돌이 자연 발생하므로, 서버 정본 신원은 장비로 스코프된 이 합성키다
        (events.py "사건 신원은 장비별로 스코프된다" 절). transitions 는 이
        이벤트에 관련된 journal 레코드 전체.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 사건 하나의 전체 상세(bundle + 전이 이력)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetailResponse' }
        '404': { description: 이벤트를 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_READ 권한 없음 }
  /v1/events/{event_key}/transitions:
    post:
      summary: Transition an event's status or triage workflow (INV-021 확정 게이트)
      description: >-
        EVENTS_TRIAGE 권한 필요. ``event_key`` = ``{edgeDeviceId}::{eventId}``
        (목록 응답의 ``eventKey``). targetStatus·triageTarget 중 정확히 하나만
        지정. CONFIRMED_EVENT/DISMISSED 전이는 reason 필수. CONFIRMED_EVENT
        확정은 심각도별 Evidence 정책(§17.1 — HIGH+ 는 evidence.clips 필수,
        CRITICAL 은 riskField/trajectory/viewpointHistory artifact 도 필수)을
        통과해야 한다(INV-021). triage 전이(ASSIGNED 이후)는 대응 사건이
        CONFIRMED_EVENT 일 때만 허용된다. **확정/기각(CONFIRMED_EVENT/
        DISMISSED)은 이 서버 트리아지 경로로만 이뤄진다** — Edge 가 보내는
        EventBundle 의 ``status`` 로는 이 두 종단 상태를 주장할 수 없다(아래
        ``/v1/edge-sync/event-bundles`` 의 STATUS_NOT_EDGE_ASSERTABLE 게이트가
        그 시도를 ACK 없이 거부한다 — MASTER_PRD §8.1/§7.6 "사용자가 업무적으로
        확정한다").
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                targetStatus:
                  enum:
                    [OBSERVATION, CANDIDATE, EVIDENCE_COLLECTION, FINDING, CONFIRMED_EVENT, DISMISSED, UNRESOLVED]
                triageTarget:
                  enum: [NONE, ASSIGNED, ACTION_IN_PROGRESS, REINSPECTION_REQUESTED, RESOLVED, CLOSED]
                reason: { type: string }
                assignee: { type: string }
                expectedBundleDigest:
                  type: string
                  description: >-
                    선택적 낙관적 동시성 토큰 — 화면에 표시된 bundle 의
                    payloadDigest("sha256:<hex64>")를 그대로 실어 보내면, 그
                    사이 Edge 의 후행 update 로 내용이 바뀌었을 때 409
                    STALE_EVENT_VIEW 로 거부한다(전이는 적용되지 않는다).
                    생략하면 검사하지 않는다.
      responses:
        '200':
          description: TRANSITIONED — verdict + 전이 후 사건 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionResponse' }
        '404': { description: UNKNOWN_EVENT }
        '409': { description: ILLEGAL_TRANSITION / STALE_EVENT_VIEW(expectedBundleDigest 불일치) }
        '422': { description: EVIDENCE_INCOMPLETE / INVALID_REQUEST }
        '503': { description: STORE_UNAVAILABLE — Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_TRIAGE 권한 없음 }
  /v1/events/{event_key}/evidence:
    post:
      summary: Register an evidence artifact and get a presigned upload URL
      description: >-
        EVENTS_TRIAGE 권한 필요. Core 는 미디어 바이트를 중계하지 않는다
        (ADR-KSI-010 §1) — 원장에 등록한 뒤 짧은 수명(15분)의 presigned PUT URL
        만 발급하고, 업로드는 클라이언트가 스토리지와 직접 한다. **객체 키는
        서버가 만든다**(``sites/{siteId}/events/{edgeDeviceId}/{eventId}/{artifactId}``)
        — 클라이언트 문자열을 키에 그대로 쓰면 경로 탈출·타 현장 덮어쓰기가 열린다.

        ``artifactId`` 는 호출자가 정하는 멱등 키다(같은 증거 재전송 시 중복
        등록 방지). 경로-안전 문자만 허용하고, 이미 쓰인 id 는 폐기된 것이어도
        재사용할 수 없다(앞선 증거의 객체 키를 조용히 덮어쓰게 된다).

        ``contentType`` 은 allowlist 다 — 열람 URL 에서 브라우저가 스크립트로
        해석할 수 있는 타입(text/html·image/svg+xml)은 415 로 거부한다.

        **조립 의존**: Core 가 evidence_storage 없이 조립되면 이 경로는 아예
        장착되지 않는다(404). 스토리지 없이 라우트만 살려두면 "업로드했는데
        어디에도 없다"가 2xx 로 보인다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artifactId, contentType]
              properties:
                artifactId: { type: string, minLength: 1 }
                contentType:
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - video/mp4
                    - video/webm
                    - application/octet-stream
      responses:
        '201':
          description: REGISTERED — 원장 기록 완료 + presigned PUT URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceUploadResponse' }
        '404': { description: UNKNOWN_EVENT (또는 evidence_storage 미조립) }
        '409': { description: DUPLICATE_ARTIFACT — 폐기된 id 도 재사용 불가 }
        '415': { description: UNSUPPORTED_CONTENT_TYPE }
        '422': { description: INVALID_ARTIFACT_ID — 경로-안전 문자 밖 }
        '503': { description: EVIDENCE_STORAGE_UNAVAILABLE — 등록은 남고 URL 만 실패 }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_TRIAGE 권한 없음 }
  /v1/events/{event_key}/evidence/{artifact_id}:
    get:
      summary: Get a presigned view URL for one evidence artifact
      description: >-
        EVENTS_READ 권한 필요. 짧은 수명(5분)의 presigned GET URL 을 발급한다 —
        URL 자체가 인가이므로 수명을 짧게 두고 발급 경로를 유일한 관문으로 삼는다.

        폐기된 증거는 **410 Gone** 이다(404 아님, ADR-KSI-010 §3) — "증거가
        없다"와 "정책대로 폐기했다"는 사고 조사에서 다른 사실이고, 그 둘을
        구분하지 못하면 원장의 값어치가 없다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: event_key
          required: true
          schema: { type: string }
        - in: path
          name: artifact_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: presigned GET URL + 등록 계보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceViewResponse' }
        '404': { description: 이벤트·증거를 찾을 수 없다(일반 문구) }
        '410': { description: ALREADY_TOMBSTONED — 보관 정책으로 폐기됨 }
        '503': { description: EVIDENCE_STORAGE_UNAVAILABLE }
        '401': { description: 인증 실패 }
        '403': { description: EVENTS_READ 권한 없음 }
  /v1/missions:
    get:
      summary: List mission issuance records (durable 기록 이력)
      description: >-
        MISSIONS_READ 권한 필요. siteId 필터, (issuedAt, missionId) 결정적
        정렬. contract 전문은 이 응답에 없다(별도 /contract 엔드포인트).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: siteId
          schema: { type: string }
      responses:
        '200':
          description: 발급된 임무 목록(siteId 필터 가능)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MissionRecordResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}:
    get:
      summary: Get one mission issuance record's metadata
      description: MISSIONS_READ 권한 필요. artifactKind(pair/contract)·kmzSha256 등 메타데이터.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 임무 하나
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionRecordResponse' }
        '404': { description: 해당 임무 레코드를 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/coverage-report:
    post:
      summary: Submit the post-flight CoverageReport (INV-010 완료 게이트)
      description: >-
        **완료 판정의 권위는 이 보고서다** — 발급 시점의 plannedCoverageRatio 는
        요청자가 준 간격을 믿은 계획 추정치이고, 실제로 무엇을 관찰했는지는 날아본
        기체만 안다(MASTER_PRD §15.5 "임무 완료는 경로 완료가 아니라 Coverage,
        Evidence, Safety와 데이터 품질 기준으로 판단한다").

        **서버는 기체의 완료 주장을 그대로 믿지 않는다.** Cell 분류(위험구역/자산/
        일반)를 갖고 있지 않아 비율을 재계산할 수는 없지만, 그 비율이 주장을
        뒷받침하는지는 검사한다 — ① completionState=COMPLETED 인데 요약 비율이
        INV-010 임계(위험 100%·자산 100%·일반 ≥95%) 미만이면 422
        UNSUPPORTED_COMPLETION ② COMPLETED 인데 사유 없는 미관찰 Cell
        (NOT_OBSERVED)이 남으면 422 UNEXPLAINED_GAP(모든 미관찰 Cell 은 원인코드를
        가져야 한다). COMPLETED_WITH_GAPS/ABORTED_SAFE/FAILED 는 그 자체가 "완료가
        아니다"를 말하므로 임계 검사를 걸지 않는다 — 공백을 정직하게 신고한
        보고서를 거부하면 신고를 안 하게 만든다.

        보고는 **장비만** 올린다(EDGE_SYNC_INGEST, EDGE_DEVICE Principal 전용) —
        운영자가 커버리지를 손으로 주장할 수 없다. 같은 임무에 여러 번 올 수 있고
        덮어쓰지 않는다(감사 입력).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/coverage-report.v1.1.json
      responses:
        '201':
          description: RECORDED — durable 기록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageReportResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '422':
          description: >-
            SITE_MISMATCH(발급 기록의 siteId 와 불일치) /
            UNSUPPORTED_COMPLETION / UNEXPLAINED_GAP /
            INVALID_TIMESTAMP(tz-aware 아님) / 경로·본문 missionId 불일치
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: EDGE_DEVICE 가 아니거나 EDGE_SYNC_INGEST 권한 없음 }
    get:
      summary: Read the latest CoverageReport for a mission
      description: >-
        MISSIONS_READ 권한 필요. 최신 보고 + 접수 건수(덮어쓰지 않으므로) + 제출한
        Principal id(reportedBy, 보통 장비 id — 독립 재검토 B-3).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 최신 보고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageReportView' }
        '404': { description: 이 임무의 보고가 아직 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/source-media:
    post:
      summary: Batch-issue presigned PUT URLs for raw mapping photos (3D 파이프라인 입구)
      description: >-
        MISSIONS_ISSUE 권한 필요. 기존 evidence 업로드(사건 종속)와 달리 **Mission**
        에 종속된 별도 입구다 — 매핑 원본 수천 장에는 매달 사건이 없다. 파일마다
        신고값(sha256·bytes·width·height·contentType)을 받지만 이 시점에는
        검증하지 않는다(전 바이트를 읽는 B3 워커가 재계산해 대조) — 주장일 뿐이다.
        객체 키는 서버가 만든다(`sites/{siteId}/missions/{missionId}/source/{mediaId}`).
        `mediaId` 는 호출자가 정한다(evidence.py 의 artifactId 관습과 동일) — 같은
        mediaId·같은 신고값 재전송은 멱등 재발급(새 URL), 다른 신고값이면
        CLAIM_CONFLICT 로 거부한다. 요청 수준 판정(UNKNOWN_MISSION/BUNDLE_SEALED/
        STORE_UNAVAILABLE)은 배치 전체에 적용되고, 통과하면 파일마다 독립 판정한다
        — 한 파일의 문제가 나머지 파일의 등록을 막지 않는다. 한 요청 상한은 200장.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [mediaId, sha256, bytes, width, height, contentType]
                    properties:
                      mediaId: { type: string }
                      sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                      bytes: { type: integer, minimum: 1 }
                      width: { type: integer, minimum: 1 }
                      height: { type: integer, minimum: 1 }
                      contentType: { type: string }
      responses:
        '201':
          description: PROCESSED — 항목별 결과는 본문 참조(개별 실패가 섞여도 요청 자체는 201)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaBatchResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '409': { description: BUNDLE_SEALED — 이미 봉인된 번들 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
    get:
      summary: Read a mission's source-media bundle status (count · digest · seal state)
      description: >-
        MISSIONS_READ 권한 필요. `verifiedAt` 은 이 단계에서 항상 null 이다 — Core
        는 신고값을 검증하지 않는다("검증된 척"하는 필드명을 쓰지 않는다).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 번들 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaBundleView' }
        '404': { description: 이 임무에 등록된 미디어가 아직 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/source-media/seal:
    post:
      summary: Seal the source-media bundle and fix sourceBundleDigest (INV-013 재현성 앵커)
      description: >-
        MISSIONS_ISSUE 권한 필요. digest 는 Core 가 정규 정렬된 매니페스트에서
        직접 계산한다(요청이 자기 증명서를 쓰지 못한다) — 업로드 순서와 무관하게
        같은 파일 집합이면 같은 digest 가 나온다. 봉인 후 추가 업로드는
        BUNDLE_SEALED 로 거부된다. 이미 봉인된 번들의 재호출은 에러가 아니라
        ALREADY_SEALED(기존 digest 재반환) — 재시도가 안전하다. 빈 번들(등록 0건)은
        봉인할 수 없다(EMPTY_BUNDLE).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '201':
          description: SEALED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaSealResponse' }
        '200':
          description: ALREADY_SEALED — 기존 digest 재반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMediaSealResponse' }
        '404': { description: UNKNOWN_MISSION — 발급된 적 없는 임무 }
        '422': { description: EMPTY_BUNDLE — 등록된 미디어가 0건이다 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /v1/missions/{mission_id}/processing-jobs:
    post:
      summary: Issue a 3D reconstruction processing job on the sealed source bundle
      description: >-
        MISSIONS_ISSUE 권한 필요. 요청은 **무엇으로 어디서** 돌릴지만 정한다 —
        `input`(장수·총 화소·sourceBundleDigest)·`dataResidency`·`billing`·
        `status`·`jobId` 는 요청 스키마에 자리가 없고, 실어 보내면 422 다.
        입력은 봉인된 번들에서 Core 가 집계하고(봉인 전이면 BUNDLE_NOT_SEALED),
        반출 허용 여부는 그 임무의 **현장**이 정하며(POST /v1/sites 의
        dataResidency), 과금은 종료 보고 시점의 몫이다. 발급 시점 billing 은
        creditsCharged=0 · rateBasis=`unmetered-at-issue` — 0 이 "무료"가 아니라
        "아직 재지 않았다"를 뜻한다. `input.totalMegapixels` 는 업로더 **신고**
        해상도의 합이라 견적이고, 응답의 `inputVerified` 가 이 단계에서 항상
        false 인 이유다. 임무당 활성(QUEUED·RUNNING) 작업은 1건 — 같은 사양
        재요청은 기존 작업을 그대로 돌려주고(ALREADY_ISSUED, 200), 다른 사양이면
        409 다. 종료된 뒤에는 재처리 작업을 새로 만들 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, engineVersion, engineDigest, executionLocus, licenseBasis]
              properties:
                provider:
                  description: ADR-KSI-012 D1 — 기본값은 odm(자체 호스팅 오픈소스).
                  type: string
                  enum:
                    [odm, pix4d_engine, dji_flighthub, metashape_spl, customer_workstation]
                engineVersion: { type: string, minLength: 1 }
                engineDigest: { type: string, minLength: 1 }
                executionLocus:
                  description: >-
                    vendor_cloud 는 현장이 반출을 허용한 경우에만 발급된다(INV-050).
                  type: string
                  enum: [site_onprem, ksi_server_gpu, customer_workstation, vendor_cloud]
                licenseBasis:
                  type: object
                  additionalProperties: false
                  required: [licenseId, tier, attributionRequired]
                  properties:
                    licenseId: { type: string, minLength: 1 }
                    tier: { type: string, minLength: 1 }
                    attributionRequired: { type: boolean }
                processingParams: { type: object, additionalProperties: true }
      responses:
        '201':
          description: ISSUED — verdict + 발급된 작업(status=QUEUED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '200':
          description: ALREADY_ISSUED — 같은 사양의 활성 작업을 그대로 반환(멱등 재요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '404': { description: UNKNOWN_MISSION — 이 임무의 원본 미디어 번들이 없다 }
        '409': { description: ACTIVE_JOB_EXISTS — 다른 사양의 작업이 진행 중이다 }
        '422':
          description: >-
            BUNDLE_NOT_SEALED(봉인 전 — 장수·digest 미확정) /
            EGRESS_NOT_ALLOWED(INV-050 — 현장이 반출을 허용하지 않았다, 미선언 포함)
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
    get:
      summary: List processing jobs for a mission (issuedAt·jobId 결정적 정렬)
      description: MISSIONS_READ 권한 필요. 재처리 이력을 포함한 전체 목록이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 처리 작업 목록(없으면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobListResponse' }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/processing-jobs/{job_id}:
    get:
      summary: Read one processing job (계약 payload 포함)
      description: >-
        MISSIONS_READ 권한 필요. `contract` 는 어댑터로 나가는 payload 그대로다
        (processing-job.v1.json) — 화면이 계약 필드를 다시 조립하지 않게 한 벌로
        싣는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 처리 작업 1건
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobView' }
        '404': { description: 해당 처리 작업을 찾을 수 없다 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/processing-jobs/{job_id}/transitions:
    post:
      summary: Transition a processing job's status (QUEUED→RUNNING→SUCCEEDED|FAILED)
      description: >-
        MISSIONS_ISSUE 권한 필요. 전이표는 QUEUED→RUNNING→SUCCEEDED|FAILED 와
        QUEUED|RUNNING→CANCELLED 뿐이다 — 종료 상태(SUCCEEDED·FAILED·CANCELLED)
        에서 나가는 전이는 없다(끝난 작업의 결론을 고쳐 쓰지 않는다). QUEUED 에서
        RUNNING 을 건너뛴 성공 주장도 거부된다. `actor` 는 body 가 아니라 인증
        Principal 에서만 취득한다. **주의**: 이 표면은 지금 사람 권한으로 열려
        있다 — 처리 워커 전용 Principal 종류와 lease·heartbeat 는 워커 실행
        경로와 함께 설계한다(B3, 아직 없음).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetStatus]
              properties:
                targetStatus:
                  type: string
                  enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
                detail:
                  description: 왜 그렇게 끝났는지. 종료 전이에 남긴다.
                  type: [string, 'null']
      responses:
        '200':
          description: TRANSITIONED — verdict + 전이된 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingJobMutationResponse' }
        '404': { description: UNKNOWN_JOB }
        '409': { description: ILLEGAL_TRANSITION — 전이표에 없는 전이 }
        '503': { description: STORE_UNAVAILABLE — 봉인됨, Retry-After }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /v1/missions/{mission_id}/contract:
    get:
      summary: Get the stored signed Mission Contract verbatim (INV-011)
      description: >-
        MISSIONS_READ 권한 필요. 발급 시점 서명 계약 전문을 재계산·재서명 없이
        그대로 반환한다 — 발급 응답과 정확 일치해야 한다(INV-011).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: 서명된 MissionContract(mission-contract.v1.2.json) }
        '404': { description: 해당 임무 레코드를 찾을 수 없다(일반 문구) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/{mission_id}/kmz:
    get:
      summary: Download the issued mission's KMZ file (결정론적 재생성)
      description: >-
        MISSIONS_READ 권한 필요. KMZ 바이트 자체는 저장하지 않으므로(용량) 저장된
        plan_request 로 매 조회마다 재생성해 반환한다(build_kmz 계열은 시각·난수·
        UUID 의존이 없어 재생성이 결정론적이다). 재생성이 현재 정책으로 실패하거나
        재생성 sha256 이 레코드의 kmzSha256 과 다르면(하류 로직 변경으로 원본을
        더 이상 재현할 수 없다) 200 을 주지 않는다 — 다른 파일을 발급된 파일로
        속여 내려주지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mission_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: KMZ 바이트(Content-Disposition 로 결정론적 파일명 `{mission_id}.kmz`)
          content:
            application/vnd.google-earth.kmz:
              schema: { type: string, format: binary }
        '404': { description: 레코드 없음(일반 문구) 또는 KMZ 산출물이 없는 계약 단독 레코드 }
        '409': { description: 저장된 요청으로 산출물을 더 이상 재현할 수 없다(정책 변경 또는 해시 불일치) }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_READ 권한 없음 }
  /v1/missions/contracts:
    post:
      summary: Issue a signed Mission Contract (v1.2)
      description: >-
        구역별 실값(siteFrame·flightEnvelope·objectives·정책팩 ID)만 받고, 안전
        정책 상수(coverage 1.0/1.0·battery reserve 30%·evidence 3/5/10s·통신단절
        정책)는 서버가 FINAL_DECISION_LEDGER 값으로 고정한다 — 요청 바디에 그
        필드 자리가 없다(extra=forbid). 서명키 미주입 조립에서는 이 경로 자체가
        존재하지 않는다. MISSIONS_ISSUE 권한 필요(DEC-010 운영자 승인 — 발급은
        FIELD_OPERATOR/ADMIN). site 미존재·siteFrame 등록본 불일치·missionId
        충돌은 서명 **전** 거부되고(UNKNOWN_SITE/SITE_FRAME_MISMATCH/
        MISSION_ID_CONFLICT — 등록 좌표계와 어긋난 계약 발급 차단, ADR-KSI-007),
        durable 기록 성공 후에만 201 이다(ADR-KSI-008 §3 — 고아 발급 금지).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                MissionIssuanceRequest(mission_issuance.py) 필드와 정확 대응 —
                안전 정책 상수(coveragePolicy 1.0/1.0·batteryPolicy·
                communicationLossPolicy·unknownObstaclePolicy·evidencePolicy)
                는 요청 바디에 자리가 없다(서버 고정, extra=forbid).
              required:
                - missionId
                - siteId
                - missionType
                - siteFrame
                - flightEnvelope
                - objectives
                - viewpointPolicyId
                - riskPolicyPackId
                - fallbackPolicyId
                - capturePolicyId
              properties:
                missionId: { type: string, minLength: 1 }
                siteId: { type: string, minLength: 1 }
                missionType:
                  enum:
                    - UNIFIED_SITE_SURVEY
                    - BASELINE_MAPPING
                    - SPATIAL_REFRESH
                    - AUTONOMOUS_PATROL
                    - ASSET_INSPECTION
                    - PROGRESS_CAPTURE
                    - INCIDENT_SURVEY
                    - SURVEY_GRADE_MAPPING
                siteFrame:
                  type: object
                  additionalProperties: false
                  required: [crs, verticalDatum, unit, transformVersion]
                  properties:
                    crs: { type: string }
                    verticalDatum: { type: string }
                    unit: { const: meter }
                    transformVersion: { type: string }
                  description: 등록된 site 의 것과 정확 일치해야 한다(SITE_FRAME_MISMATCH).
                flightEnvelope:
                  type: object
                  additionalProperties: false
                  required: [allowedVolumes, excludedVolumes, minAltitudeM, maxAltitudeM]
                  properties:
                    allowedVolumes: { type: array, items: { type: string } }
                    excludedVolumes: { type: array, items: { type: string } }
                    minAltitudeM: { type: number }
                    maxAltitudeM: { type: number, maximum: 150 }
                    minimumStructureStandoffM: { type: number }
                    minimumPersonStandoffM: { type: number }
                    altitudeReference:
                      enum: [relativeToStartPoint]
                      nullable: true
                  description: >-
                    altitudeReference 는 요청과 무관하게 서버가
                    relativeToStartPoint 로 고정한다(2026-07-29 대표자 확정).
                    보내도 거부하지는 않지만 **무시된다** — 서명 계약에 실리는
                    값은 항상 서버가 정한 값이다.
                objectives: { type: array, items: { type: string }, minItems: 1 }
                viewpointPolicyId: { type: string, minLength: 1 }
                riskPolicyPackId: { type: string, minLength: 1 }
                fallbackPolicyId: { type: string, minLength: 1 }
                capturePolicyId: { type: string, minLength: 1 }
                accessibleGeneralCoverage: { type: number, minimum: 0.95, maximum: 1.0 }
                artifacts:
                  type: object
                  additionalProperties: false
                  properties:
                    worldModelManifestId: { type: [string, 'null'] }
                    modelPackId: { type: [string, 'null'] }
                    calibrationProfileId: { type: [string, 'null'] }
                validForHours:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 168
                  description: 기본 24 — 7일(168시간) 상한(무기한 계약 발급 방지).
      responses:
        '201': { description: 서명된 MissionContract(mission-contract.v1.2.json) }
        '422':
          description: >-
            구조 위반(필드 누락·범위 밖·validForHours>168) / UNKNOWN_SITE /
            SITE_FRAME_MISMATCH
        '409': { description: MISSION_ID_CONFLICT }
        '503': { description: STORE_UNAVAILABLE — durable 기록 실패, 산출물 미반환 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /v1/missions/plans:
    post:
      summary: Issue the dual mission artifacts — WPML/KMZ + signed contract (ADR-KSI-007)
      description: >-
        AOI 폴리곤+임무타입 한 요청이 두 산출물을 짝으로 낳는다 — 기체용
        WPML/KMZ(base64)와 Manifold 용 서명 계약. 경로 고도·이륙 안전고도는
        같은 요청의 flightEnvelope 로 게이트되어 어긋난 쌍이 성립할 수 없다.
        임무타입→패턴: 매핑 계열=lawnmower(spacingM·captureIntervalM 필수)·순찰 계열=perimeter·
        그 외(ASSET_INSPECTION 등)=422 거부(조용한 퇴화 금지). droneEnumValue 는
        호출자가 명시한다(M4D 값은 실기 H4 검증 전 서버가 추측하지 않는다). KMZ
        에는 계약과의 짝 식별자(contractSha256 등, wpmz/res/ksi-mission-pair.json)
        가 동봉된다(ADR-KSI-007 '동일 site_frame·policy_version 짝'의 실체화).
        MISSIONS_ISSUE 권한 필요 — site 미존재·missionId 충돌은 경로 생성·서명
        **전** 거부되고, durable 기록 성공 후에만 201 이다(ADR-KSI-008 §3).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contract, aoi, route, drone, wayline]
              properties:
                contract:
                  type: object
                  additionalProperties: false
                  required:
                    - missionId
                    - siteId
                    - missionType
                    - siteFrame
                    - flightEnvelope
                    - objectives
                    - viewpointPolicyId
                    - riskPolicyPackId
                    - fallbackPolicyId
                    - capturePolicyId
                  properties:
                    missionId: { type: string, minLength: 1 }
                    siteId: { type: string, minLength: 1 }
                    missionType: { type: string }
                    siteFrame:
                      type: object
                      additionalProperties: false
                      required: [crs, verticalDatum, unit, transformVersion]
                      properties:
                        crs: { type: string }
                        verticalDatum: { type: string }
                        unit: { const: meter }
                        transformVersion: { type: string }
                    flightEnvelope:
                      type: object
                      additionalProperties: false
                      required: [allowedVolumes, excludedVolumes, minAltitudeM, maxAltitudeM]
                      properties:
                        allowedVolumes: { type: array, items: { type: string } }
                        excludedVolumes: { type: array, items: { type: string } }
                        minAltitudeM: { type: number }
                        maxAltitudeM: { type: number, maximum: 150 }
                        minimumStructureStandoffM: { type: number }
                        minimumPersonStandoffM: { type: number }
                        altitudeReference:
                          enum: [relativeToStartPoint]
                          nullable: true
                    objectives: { type: array, items: { type: string }, minItems: 1 }
                    viewpointPolicyId: { type: string, minLength: 1 }
                    riskPolicyPackId: { type: string, minLength: 1 }
                    fallbackPolicyId: { type: string, minLength: 1 }
                    capturePolicyId: { type: string, minLength: 1 }
                    accessibleGeneralCoverage: { type: number, minimum: 0.95, maximum: 1.0 }
                    validForHours: { type: number, exclusiveMinimum: 0, maximum: 168 }
                    artifacts:
                      # 구현(MissionIssuanceRequest.artifacts)이 수용하는 선택 필드 —
                      # additionalProperties:false 에서 누락되면 스펙 준수 클라이언트가
                      # 정당한 요청을 못 만든다(재검증 V2 P3).
                      type: object
                      additionalProperties: false
                      properties:
                        worldModelManifestId: { type: [string, 'null'] }
                        modelPackId: { type: [string, 'null'] }
                        calibrationProfileId: { type: [string, 'null'] }
                aoi:
                  type: object
                  additionalProperties: false
                  required: [vertices]
                  description: >-
                    닫힌 단순 폴리곤(마지막→첫 꼭짓점 변이 암묵적으로 닫는다,
                    3~256 꼭짓점).
                  properties:
                    vertices:
                      type: array
                      minItems: 3
                      items:
                        type: object
                        additionalProperties: false
                        required: [latDeg, lonDeg]
                        properties:
                          latDeg: { type: number, minimum: -90, maximum: 90 }
                          lonDeg: { type: number, minimum: -180, maximum: 180 }
                route:
                  type: object
                  additionalProperties: false
                  required: [altitudeM]
                  properties:
                    altitudeM: { type: number }
                    camera:
                      type: object
                      additionalProperties: false
                      required: [sensorWidthMm, focalLengthMm, imageWidthPx, imageHeightPx]
                      description: >-
                        **권장 경로** — 주면 서버가 카메라·고도·중복도로 spacingM·
                        captureIntervalM 을 계산하고, 계산 근거를 응답 gridBasis 로
                        돌려준다. 간격을 직접 적으면 서버는 그 값이 적정한지 판단할
                        근거가 없다(ADR-KSI-011 D2). camera 와 spacingM/
                        captureIntervalM 을 함께 주면 422 — 어느 쪽이 진짜인지
                        서버가 고르지 않는다.
                        imageWidthPx 는 across-track(라인 간격), imageHeightPx 는
                        along-track(사진 간격)이다(nadir·landscape 표준 배치).
                      properties:
                        sensorWidthMm: { type: number, exclusiveMinimum: 0 }
                        focalLengthMm: { type: number, exclusiveMinimum: 0 }
                        imageWidthPx: { type: integer, minimum: 1 }
                        imageHeightPx: { type: integer, minimum: 1 }
                        frontOverlap:
                          type: number
                          minimum: 0.6
                          exclusiveMaximum: 1.0
                          default: 0.8
                          description: 진행방향 중복도. 0.6 미만은 재구성 불성립이라 422.
                        sideOverlap:
                          type: number
                          minimum: 0.5
                          exclusiveMaximum: 1.0
                          default: 0.7
                          description: 라인 간 중복도. 0.5 미만은 422.
                    spacingM:
                      type: number
                      description: >-
                        lawnmower(매핑) 계열 — camera 를 주지 않을 때만 필수(측면
                        간격, m). 고도×1.5 를 넘으면 422.
                    captureIntervalM:
                      type: number
                      minimum: 0.1
                      description: >-
                        lawnmower(매핑) 계열 필수 — 진행방향 촬영 간격 상한(m).
                        없으면 스캔선당 사진이 양 끝 2장뿐이라 전방 중첩이 0 이 되어
                        정사영상·3D 재구성이 성립하지 않는다(422 거부).
                    sweepDirectionDeg:
                      type: number
                      description: 수학 규약(동=0·반시계, 도) — 나침반 방위 아님
                drone:
                  type: object
                  additionalProperties: false
                  required: [droneEnumValue, droneSubEnumValue, payloadEnumValue]
                  properties:
                    droneEnumValue: { type: integer }
                    droneSubEnumValue: { type: integer }
                    payloadEnumValue: { type: integer }
                    payloadPositionIndex: { type: integer, enum: [0, 1, 2] }
                wayline:
                  type: object
                  additionalProperties: false
                  required: [autoFlightSpeedMs, takeoffSecurityHeightM, globalTransitionalSpeedMs]
                  properties:
                    autoFlightSpeedMs: { type: number, exclusiveMinimum: 0 }
                    # 하한 1.2 = WPML 공식 스펙 유효범위 [1.2, 1500] — 구현 상수
                    # _MIN_TAKEOFF_SECURITY_HEIGHT_M 과 동일 근거(재검증 V2 P2:
                    # 문서 1.5 vs 구현 1.2 이중 SSOT 해소).
                    takeoffSecurityHeightM: { type: number, minimum: 1.2, maximum: 1500 }
                    globalTransitionalSpeedMs: { type: number, exclusiveMinimum: 0, maximum: 15 }
      responses:
        '201':
          description: 이원 산출물 짝
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract:
                    description: 서명된 MissionContract(mission-contract.v1.2.json)
                    $ref: ../schemas/mission-contract.v1.2.json
                  kmzBase64: { type: string, description: KMZ(zip) base64 }
                  kmzSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  routePattern: { type: string, enum: [lawnmower, perimeter] }
                  waypointCount: { type: integer, minimum: 2 }
                  plannedCoverageRatio:
                    type: [number, 'null']
                    description: >-
                      **비행 전 계획 추정치**(lawnmower 만, perimeter 는 null).
                      각 스캔선이 ±spacing/2 를 덮는다는 **가정** 하의 스와스∩AOI
                      정확값이다 — 실제로 무엇을 관찰했는지는 날아본 기체만 안다.
                      **완료 판정의 권위가 아니다**: 그건 비행 후 CoverageReport
                      (POST /v1/missions/{mission_id}/coverage-report)가 소유하며
                      INV-010 의 세 조항 전부를 그쪽이 판정한다(MASTER_PRD §15.5).
                      이 값은 "계획이 애초에 요구를 겨냥하는가"의 사전 점검 결과이고,
                      계약 요구 미만이면 발급이 거부된다
                      (COVERAGE_BELOW_CONTRACT_PROMISE).
                  gridBasis:
                    type: [object, 'null']
                    additionalProperties: false
                    description: >-
                      **왜 이 간격이 나왔는가** — route.camera 로 계산했을 때만
                      실린다(간격을 직접 지정하면 null). 숫자만 남기면 다음 사람이
                      그 값을 다시 검증할 수 없다.
                    properties:
                      spacingM: { type: number }
                      captureIntervalM: { type: number }
                      gsdM: { type: number, description: 지상표본거리(m/px) }
                      footprintAcrossM: { type: number }
                      footprintAlongM: { type: number }
        '422':
          description: >-
            경로 생성 불가(봉투 밖 고도·이륙안전고도·spacing/camera 누락·
            camera 와 spacingM 동시 지정·중복도 하한 미달·미지원 타입) /
            UNKNOWN_SITE / SITE_FRAME_MISMATCH / COVERAGE_BELOW_CONTRACT_PROMISE
        '409': { description: MISSION_ID_CONFLICT }
        '503': { description: STORE_UNAVAILABLE — durable 기록 실패, 산출물 미반환 }
        '401': { description: 인증 실패 }
        '403': { description: MISSIONS_ISSUE 권한 없음 }
  /sites/{siteId}/missions:
    x-status: planned
    post:
      summary: Create a mission request (S3+ Wizard 추상화 — 미구현 설계)
      description: >-
        S3+ 대시보드 Wizard 가 아이템(target/outcomes/intensity)에서 Mission
        Contract 생성을 대행하는 추상화 스케치다 — 현재 실경로는
        POST /v1/missions/plans 를 대시보드가 직접 호출한다(ADR-KSI-008 비범위).
      parameters:
        - in: path
          name: siteId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, outcomes, intensity]
              properties:
                target: { type: object }
                outcomes:
                  type: array
                  items: { type: string }
                intensity:
                  enum: [FAST, STANDARD, PRECISE]
      responses:
        '202': { description: Mission planning accepted }
components:
  # ── 응답 본문 스키마 ───────────────────────────────────────────────────────
  #
  # 여기 적힌 **필드 집합**은 test_api_contract_sync.py 가 실구현(FastAPI 가
  # Pydantic 모델에서 생성하는 openapi)과 이름 단위로 대조한다. 필드를 더하거나
  # 빼면 구현이든 문서든 한쪽만 바뀐 순간 게이트가 실패한다.
  #
  # 왜 구현에서 자동 생성하지 않는가: 계약을 구현의 사본으로 만들면 drift 는
  # 정의상 0 이 되지만 게이트도 같이 무의미해진다. 이 파일은 "사람이 승인한
  # 의도"고, 대조의 의미는 그 의도와 구현이 갈라졌는지를 묻는 데 있다.
  #
  # 타입은 구현의 정밀도까지 복제하지 않는다(대조 대상은 필드 이름과 필수 여부다)
  # — 자유 형태 payload(bundle·transitions·siteFrame)는 계약상으로도 자유
  # 형태이고, 그 내부 구조의 정본은 contracts/schemas/*.json 이다.
  schemas:
    SiteView:
      type: object
      required:
        [siteId, name, siteFrame, status, resumeTarget, registeredAt, updatedAt, aoi,
         dataResidency]
      properties:
        siteId: { type: string }
        name: { type: string }
        # 구조 정본은 SiteRegistrationRequest.siteFrame — 응답에서는 저장된 값 그대로.
        siteFrame: { type: object, additionalProperties: true }
        status:
          description: SiteStatus 10종(ADR-KSI-008 §4) — UNMAPPED 가 등록 직후 정상 중간 상태다.
          type: string
        # 일시중단(SUSPENDED)에서 복귀할 상태. 그 외에는 null.
        resumeTarget: { type: [string, 'null'] }
        registeredAt: { type: string }
        updatedAt: { type: string }
        # 설정된 적 없으면 null(등록 시 생략 또는 아직 PUT /v1/sites/{site_id}/aoi
        # 를 거치지 않음) — 구조 정본은 AreaOfInterest(POST /v1/sites.aoi 참조).
        aoi: { type: [object, 'null'], additionalProperties: true }
        # null 은 "반출 미선언"이고 그 뜻은 **반출 불가**다(INV-050). 화면이
        # 허용을 기본값처럼 보여주지 않게 null 을 그대로 싣는다.
        dataResidency: { type: [object, 'null'], additionalProperties: true }
    SiteListResponse:
      type: object
      required: [sites]
      properties:
        sites: { type: array, items: { $ref: '#/components/schemas/SiteView' } }
    SiteMutationResponse:
      description: 등록·전이 공통 응답. verdict 가 결과 코드고, site 는 성공 시에만 실린다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        site: { oneOf: [{ $ref: '#/components/schemas/SiteView' }, { type: 'null' }] }
        detail: { type: [string, 'null'] }
    WhoAmIResponse:
      type: object
      required: [principalId, kind, role, deviceId, permissions]
      properties:
        principalId: { type: string }
        kind: { type: string }
        # 장비 principal 은 role 이 없고, 운영자 principal 은 deviceId 가 없다.
        role: { type: [string, 'null'] }
        deviceId: { type: [string, 'null'] }
        permissions: { type: array, items: { type: string } }
    IngestResponse:
      type: object
      required: [verdict]
      properties:
        verdict:
          description: ACCEPTED · DUPLICATE_IGNORED 등 수신 판정 코드.
          type: string
        detail: { type: [string, 'null'] }
    DeviceSequenceResponse:
      description: 장비가 재부팅 후 자기 순번을 복구하는 경로(ADR-KSI-008 §2).
      type: object
      required: [deviceId, lastSequence]
      properties:
        deviceId: { type: string }
        # 아직 한 건도 받지 않은 장비는 null — 0 이 아니다(0 은 유효한 첫 순번).
        lastSequence: { type: [integer, 'null'] }
    EventSummaryResponse:
      description: >-
        트리아지 대기열의 한 줄. eventType 은 목록에서 "무슨 일인지"를 답하는
        1순위 정보라 bundle 에서 최상위로 승격한다(2026-08-04 대표자 결정).
      type: object
      required:
        [eventKey, eventId, siteId, missionId, eventType, status, severity, triage,
         assignee, edgeDeviceId, occurredAt, receivedAt]
      properties:
        # 서버 정본 신원 = {edgeDeviceId}::{eventId}. eventId 는 장비 로컬이라 단독으론 충돌한다.
        eventKey: { type: string }
        eventId: { type: string }
        siteId: { type: string }
        missionId: { type: string }
        eventType: { type: [string, 'null'] }
        status: { type: string }
        severity: { type: [string, 'null'] }
        triage: { type: string }
        assignee: { type: [string, 'null'] }
        edgeDeviceId: { type: string }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    EventListResponse:
      type: object
      required: [events, count]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/EventSummaryResponse' } }
        count: { type: integer }
    CoverageReportResponse:
      description: 보고 수신 판정 + 기록된 보고 본문(거부 시 report 는 null).
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        report: { type: [object, 'null'], additionalProperties: true }
    CoverageReportView:
      description: 그 임무의 최신 보고 + 접수 건수 + 누가 보고했는지.
      type: object
      required: [missionId, reportCount, latest, reportedBy]
      properties:
        missionId: { type: string }
        reportCount: { type: integer }
        # 구조 정본은 contracts/schemas/coverage-report.v1.1.json.
        latest: { type: object, additionalProperties: true }
        reportedBy:
          type: [string, 'null']
          description: 제출한 Principal id(보통 장비 id). 구 journal 재생 등으로 없으면 null.
    EventDetailResponse:
      description: 목록 필드 + 원본 bundle + 이 사건에 대한 journal 전이 이력 전체.
      type: object
      required:
        [eventKey, eventId, siteId, missionId, eventType, status, severity, triage,
         assignee, edgeDeviceId, occurredAt, receivedAt, lastConflictAt, bundle,
         bundleDigest, transitions, evidence]
      properties:
        eventKey: { type: string }
        eventId: { type: string }
        siteId: { type: string }
        missionId: { type: string }
        eventType: { type: [string, 'null'] }
        status: { type: string }
        severity: { type: [string, 'null'] }
        triage: { type: string }
        assignee: { type: [string, 'null'] }
        edgeDeviceId: { type: string }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        lastConflictAt: { type: [string, 'null'], format: date-time }
        # 구조 정본은 contracts/schemas/event-bundle.v1.2.json.
        bundle: { type: object, additionalProperties: true }
        # 전이 요청의 expectedBundleDigest 에 그대로 실을 값 — 클라이언트가 정규화
        # 규약을 재구현하면 JSON 표기 차이 하나로 영구 409 가 되므로 서버가 계산해
        # 돌려준다.
        bundleDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        transitions: { type: array, items: { type: object, additionalProperties: true } }
        # 폐기된 것도 포함한다(ADR-KSI-010 §3) — 목록에서 사라지면 "증거가 없다"와
        # "정책대로 폐기했다"를 구분할 수 없다. 열람 URL 은 여기 없다: URL 이 곧
        # 인가라서 권한 검사를 통과한 별도 요청에서만 발급한다.
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceSummary' } }
    TransitionResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        event: { oneOf: [{ $ref: '#/components/schemas/EventDetailResponse' }, { type: 'null' }] }
    EvidenceSummary:
      description: 상세 응답에 실리는 증거 1건. tombstonedAt 이 있으면 폐기된 것이다.
      type: object
      required: [artifactId, contentType, registeredAt, registeredBy, tombstonedAt, tombstoneReason]
      properties:
        artifactId: { type: string }
        contentType: { type: string }
        registeredAt: { type: string, format: date-time }
        registeredBy: { type: string }
        tombstonedAt: { type: [string, 'null'], format: date-time }
        tombstoneReason: { type: [string, 'null'] }
    EvidenceUploadResponse:
      description: >-
        presigned PUT URL. ``objectKey`` 는 서버가 만든 값이라 클라이언트가
        고를 수 없다 — 응답에 싣는 건 운영자가 스토리지에서 같은 객체를 찾을 수
        있게 하려는 것뿐이다.
      type: object
      required: [artifactId, objectKey, uploadUrl, expiresAt]
      properties:
        artifactId: { type: string }
        objectKey: { type: string }
        uploadUrl: { type: string }
        # 남은 시간이 아니라 절대 시각 — 클라이언트가 자기 시계로 계산하게 한다.
        expiresAt: { type: string, format: date-time }
    EvidenceViewResponse:
      type: object
      required: [artifactId, contentType, viewUrl, expiresAt, registeredAt, registeredBy]
      properties:
        artifactId: { type: string }
        contentType: { type: string }
        viewUrl: { type: string }
        expiresAt: { type: string, format: date-time }
        registeredAt: { type: string, format: date-time }
        registeredBy: { type: string }
    MissionRecordResponse:
      description: >-
        발급된 임무의 조회 표현. ADR-KSI-007 이원 산출물 중 이 레코드가 가리키는
        것은 artifactKind 가 말한다(KMZ 짝과 Mission Contract 짝의 무결성은
        서버가 발급 시점에 강제한다).
      type: object
      required:
        [missionId, siteId, missionType, artifactKind, kmzSha256, routePattern,
         waypointCount, plannedCoverageRatio, issuedAt, issuedBy, coverageCompletionState]
      properties:
        missionId: { type: string }
        siteId: { type: string }
        missionType: { type: string }
        artifactKind: { type: string }
        # 경로 산출물이 없는 발급(계약만)은 이 넷이 전부 null 이다.
        kmzSha256: { type: [string, 'null'] }
        routePattern: { type: [string, 'null'] }
        waypointCount: { type: [integer, 'null'] }
        plannedCoverageRatio:
          type: [number, 'null']
          description: >-
            **비행 전 계획 추정치**(lawnmower 계열만, 순찰은 null). 각 스캔선이
            ±spacing/2 를 덮는다는 가정 하의 기하 계산이며 그 spacing 은 요청자가
            준 값이다 — **완료 판정의 권위가 아니다.** 실제 커버는 비행 후 기체가
            올리는 CoverageReport(Cell 상태·미관찰 원인코드)가 판정한다
            (MASTER_PRD §15.5, INV-010). 이 값은 "계획이 애초에 요구를 겨냥하는가"의
            사전 점검 결과다.
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        coverageCompletionState:
          type: [string, 'null']
          enum: [COMPLETED, COMPLETED_WITH_GAPS, ABORTED_SAFE, FAILED, null]
          description: >-
            **파생 필드** — 이 임무에 대해 접수된 최신 CoverageReport 의
            completionState 를 서버가 조회 시점에 계산해 그대로 싣는다(저장하지
            않는다). 완료 판정의 권위는 CoverageReport 하나다(INV-010) — 이 필드는
            그 판정을 다시 계산하지 않고 그대로 노출할 뿐이다. null 은 "아직 보고가
            없다"는 뜻이고, 발급됐지만 비행 전인지 비행했는데 보고가 없는지는 이
            값만으로 구분되지 않는다(GET .../coverage-report 404 와 함께 봐야 한다).
    SourceMediaItemView:
      description: 배치 안 파일 1건의 결과. REGISTERED 일 때만 objectKey/uploadUrl/expiresAt 이 있다.
      type: object
      required: [mediaId, verdict]
      properties:
        mediaId: { type: string }
        verdict:
          type: string
          description: >-
            REGISTERED · INVALID_MEDIA_ID · UNSUPPORTED_CONTENT_TYPE ·
            CLAIM_CONFLICT(같은 mediaId 가 다른 내용으로 이미 등록됨) ·
            JOURNAL_UNAVAILABLE · STORAGE_UNAVAILABLE(등록은 됐으나 URL 발급 실패
            — 같은 내용으로 재요청하면 재발급된다).
        objectKey: { type: [string, 'null'] }
        uploadUrl: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        detail: { type: [string, 'null'] }
    SourceMediaBatchResponse:
      description: >-
        배치 요청 전체 판정(PROCESSED/UNKNOWN_MISSION/BUNDLE_SEALED/
        STORE_UNAVAILABLE) + 항목별 결과. PROCESSED 면 개별 실패가 섞여도 요청
        자체는 201 이고 results 각 항목의 verdict 로 갈린다.
      type: object
      required: [verdict, results]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        results: { type: array, items: { $ref: '#/components/schemas/SourceMediaItemView' } }
    SourceMediaBundleView:
      description: 원본 미디어 번들 상태 — 미검증 상태를 그대로 노출한다.
      type: object
      required: [missionId, status, mediaCount, sourceBundleDigest, sealedAt, verifiedAt]
      properties:
        missionId: { type: string }
        status: { type: string, enum: [OPEN, SEALED] }
        mediaCount: { type: integer }
        sourceBundleDigest: { type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$' }
        sealedAt: { type: [string, 'null'], format: date-time }
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            현재는 항상 null(B1 범위) — Core 는 신고값(sha256·해상도)을 검증하지
            않는다. 전 바이트를 읽는 B3 워커가 실제로 대조하면 이 필드가 채워진다.
    SourceMediaSealResponse:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        detail: { type: [string, 'null'] }
        bundle:
          oneOf: [{ $ref: '#/components/schemas/SourceMediaBundleView' }, { type: 'null' }]
    ProcessingJobView:
      description: >-
        처리 작업 1건 — 계약 payload(contract) + 운영 메타. 계약 필드의 구조 정본은
        contracts/schemas/processing-job.v1.json 이다.
      type: object
      required:
        [jobId, missionId, siteId, status, issuedAt, issuedBy, updatedAt, detail,
         inputVerified, contract]
      properties:
        jobId: { type: string }
        missionId: { type: string }
        siteId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        # 종료 전이에 남긴 사유. 그 전에는 null.
        detail: { type: [string, 'null'] }
        inputVerified:
          type: boolean
          description: >-
            현재는 항상 false(B2 범위) — input.totalMegapixels 는 업로더 신고
            해상도의 합이고 전 바이트를 읽어 대조한 값이 아니다. 워커가 재계산해
            대조하면(B3) 참이 될 수 있다. "검증된 척"하는 기본값을 쓰지 않는다.
        contract: { type: object, additionalProperties: true }
    ProcessingJobListResponse:
      type: object
      required: [jobs]
      properties:
        jobs: { type: array, items: { $ref: '#/components/schemas/ProcessingJobView' } }
    ProcessingJobMutationResponse:
      description: 발급·전이 공통 응답. verdict 가 결과 코드고, job 은 성공 시에만 실린다.
      type: object
      required: [verdict]
      properties:
        verdict: { type: string }
        job: { oneOf: [{ $ref: '#/components/schemas/ProcessingJobView' }, { type: 'null' }] }
        detail: { type: [string, 'null'] }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Bearer 토큰 인증(ADR-KSI-008 §2) — 서버는 sha256(token) digest →
        Principal 매핑만 보유하고 토큰 원문을 저장하지 않는다. 인증 실패는
        사유(부재/형식오류/미지 토큰)를 가리지 않는 동일 401(WWW-Authenticate:
        Bearer) — detail 로 존재 여부 힌트를 주지 않는다. 공개 allowlist는
        /health·/capabilities 와 FastAPI 기본 문서 라우트(/openapi.json·
        /docs·/redoc, `create_app(expose_docs=...)` 로 끌 수 있다 — 기본
        True) 뿐이며, 나머지 전 경로는 인증 필수(재검토 P2 — 이전 서술은 문서
        라우트가 실제로 무인증 공개인 사실을 반영하지 않았다).
