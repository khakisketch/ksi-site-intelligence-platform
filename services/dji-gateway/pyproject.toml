[project]
name = "ksi-dji-gateway"
version = "0.0.1"
description = "DJI Integration Gateway — Cloud API/MQTT/미디어 연동 격리 계층 (프로토콜 EXTRACT)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ksi-dji-gateway = "ksi_dji_gateway.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_dji_gateway"]
