[project]
name = "ksi-analysis-mcp"
version = "0.0.1"
description = "Bounded local stdio MCP adapter for KSI Analysis API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "ksi-event-contracts",
    "mcp==2.2.0",
    "pydantic>=2.13",
]

[tool.uv.sources]
ksi-event-contracts = { workspace = true }

[project.scripts]
ksi-analysis-mcp = "ksi_analysis_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_analysis_mcp"]
