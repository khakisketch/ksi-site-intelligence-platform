[project]
name = "ksi-change-detection"
version = "0.0.1"
description = "Phase 4 시계열 변화탐지 — point cloud C2C 최근접거리 비교 (PRD RISK-003 인접, workers/change-detection 스텁의 실구현 위치)"
requires-python = ">=3.12,<3.13"
# Open3D(MIT)는 이 환경(Python 3.12, aarch64 linux)에 호환 wheel이 없어(2026-08-06
# 실측: uv pip install --dry-run open3d — cp312/manylinux_aarch64 wheel 부재) 채택하지
# 않았다. CloudCompare(M3C2 표준 구현)는 GPL이라 이 프로젝트의 AGPL/GPL 프로세스경계
# 정책(ADR-KSI-012 D2)과 별개로 애초에 배제 대상이다. scipy.spatial.cKDTree(BSD-3)로
# point-to-point 최근접 거리를 직접 구현한다 — M3C2 의 국소 법선 통계는 범위 밖(모듈
# docstring 명시).
# 재방문 권고 규칙과 ChangeDetectionResult wire 계약은 ksi-event-contracts 가 소유한다
# — Core 가 그 계약을 소비할 때 scipy 가 control plane 으로 딸려오지 않게 하기
# 위해서다(그쪽 change_detection_result.py docstring "왜 계약 패키지에 사는가").
# rasterio·ksi-geo-spatial 는 DSM 차분(dsm_diff.py) 용이다. point cloud C2C 는
# scipy 만 쓰므로 두 계열이 한 패키지에 있지만, 서로를 import 하지 않는다.
# laspy(BSD-3)+lazrs(MIT/Apache-2.0)는 ODM 산출 point cloud(.laz, odm_assets.py
# POINT_CLOUD_ID)를 읽는다(run_change_detection.py) — 둘 다 허용 라이선스이고
# AGPL/GPL 프로세스경계(ADR-KSI-012 D2)와 무관하다(point_cloud_diff.py 모듈
# docstring 이 CloudCompare/Open3D 를 배제한 것과 같은 기준으로 봤을 때 이
# 둘은 애초에 배제 대상이 아니다).
dependencies = [
    "ksi-event-contracts",
    "ksi-geo-spatial",
    "laspy>=2.5",
    "lazrs>=0.6",
    "numpy>=1.26",
    "rasterio>=1.3",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_change_detection"]

[tool.uv.sources]
ksi-event-contracts = { workspace = true }
ksi-geo-spatial = { workspace = true }
