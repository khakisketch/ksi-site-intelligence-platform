[project]
name = "ksi-mission-planning"
version = "0.0.1"
description = "AOI 지오메트리·커버리지 경로 생성·WPML/KMZ 산출 (ADR-KSI-007 기체측 산출물)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7", "ksi-geo-core", "ksi-mission-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_mission_planning"]

[tool.uv.sources]
ksi-geo-core = { workspace = true }
ksi-mission-contracts = { workspace = true }
