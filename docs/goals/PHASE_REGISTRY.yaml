    # 수용(33a669a) 이후의 안전 경계 강화 — Phase 1 재수용이 아니라 후속 hardening 기록.
    # independent_review_commit 은 그대로 둔다(교체하면 전체를 새 SHA에서 재수용했다는 다른 의미가 된다).
    post_acceptance_hardening:
      - commit: "5cc7c9b"
        date: "2026-07-27"
        reason: >-
          SPATIAL_BIN 경계에서 근접 관측점이 서로 다른 viewpoint로 과다 계상되어
          localization CONFIRMED에 도달할 수 있던 경로를 차단.
        result: >-
          CONFIRMED는 전체 관측이 CALIBRATED_POSE이고 서로 다른 pose reference가
          2개 이상일 때만 가능. SPATIAL_BIN·UNKNOWN은 최대 LIKELY.
        gate: "488 passed·5 skipped / mypy 57 / C++ ctest 2/2"

    residual_risks:
      - >-
        CALIBRATED_POSE 등급은 현재 생산자 선언이다. 실기 통합 시 pose reference를
        Calibration Registry에서 해석하고 site/frame/camera/lens/timestamp 및
        실제 기선을 검증해야 한다.

