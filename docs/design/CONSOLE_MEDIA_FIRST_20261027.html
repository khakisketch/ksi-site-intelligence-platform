  return `<div class="record ${selected ? 'selected' : ''}"><button class="record-select" data-record="${r.id}" data-k="record-${r.id}" aria-pressed="${selected}">${!unavailable(r) ? `<img src="${images[r.image]}" class="thumb" alt="">` : '<span class="thumb absent" aria-hidden="true"></span>'}<span class="record-copy"><strong>${r.kind}</strong><small>${r.format} · 공개 크롭</small></span><span class="roles">${roles}</span></button>${issue(r) ? `<button class="status-badge" data-info="${r.id}" popovertarget="material-info" data-k="badge-${r.id}" aria-label="${r.date} ${r.kind} ${issue(r)} 상세">${issue(r)}</button>` : ''}</div>`;
}
function catalog() {
  const items = filtered(); let lastDate = '';
  const rows = items.map(r => { const heading = lastDate !== r.date ? `<h4 class="date-group">${r.date}</h4>` : ''; lastDate = r.date; return heading + recordRow(r); }).join('');
  const empty = restricted() ? '자료 접근 제한' : state.area === 'empty' ? '이 구역에 연결된 자료가 없습니다' : '검색 결과가 없습니다';
  return `<section id="catalog" class="catalog" tabindex="-1" aria-labelledby="catalog-title"><header class="catalog-title"><h3 id="catalog-title">관측·자료</h3><span>${canList() ? records.length : '—'}</span><a class="back-to-view" href="#media-stage">보기로</a></header><label class="area-field" for="area">구역<select id="area" data-k="area"><option value="all" ${state.area === 'all' ? 'selected' : ''}>전체 공개 관측 범위</option><option value="empty" ${state.area === 'empty' ? 'selected' : ''}>자료 없는 구역 · 예시</option></select></label>${!restricted() ? `<div class="catalog-search">${icon('search')}<label class="sr-only" for="search">자료 검색</label><input id="search" data-k="search" type="search" value="${escapeHtml(state.q)}" placeholder="날짜·종류·파일명 검색"></div><details class="filters" ${filtersOpen ? 'open' : ''}><summary>필터${state.kind !== 'all' || state.q ? ' · 적용 중' : ''}</summary><div><label for="kind">자료 종류</label><select id="kind" data-k="kind"><option value="all" ${state.kind === 'all' ? 'selected' : ''}>모든 자료</option><option value="ortho" ${state.kind === 'ortho' ? 'selected' : ''}>정사영상</option><option value="dsm" ${state.kind === 'dsm' ? 'selected' : ''}>DSM</option></select><button data-clear>초기화</button></div></details>` : ''}${state.pair && canList() ? targetPicker() : ''}<div class="catalog-scroll" data-scroll="catalog">${canList() && items.length ? rows : `<div class="empty-list"><p>${empty}</p>${!restricted() ? `<button ${state.area === 'empty' ? 'data-area-all' : 'data-clear'}>${state.area === 'empty' ? '공개 범위 보기' : '검색 초기화'}</button>` : '<button data-session>접근 상태 확인</button>'}</div>`}</div><footer class="catalog-footer">${canList() && !items.some(r => r.id === state.b) ? '현재 선택은 검색 결과 밖 · 표시 유지' : '날짜 아래 자료를 선택하세요'}</footer></section>`;
}
function pane(role) {
  const r = byId(state[role]);
  const blocked = restricted() || state.area === 'empty';
  const title = blocked ? '표시할 수 있는 자료 없음' : `${r.date} · ${r.kind}`;
  return `<figure class="pane" aria-label="${blocked ? title : role.toUpperCase() + ' ' + title}"><figcaption><span class="pane-title">${state.pair && !blocked ? `<b>${role.toUpperCase()}</b>` : ''}${title}</span>${!blocked ? `<span class="pane-actions">${issue(r) ? `<button class="status-badge" data-info="${r.id}" popovertarget="material-info" aria-label="${title} ${issue(r)} 상세">${issue(r)}</button>` : ''}<button class="icon-button" data-info="${r.id}" popovertarget="material-info" data-k="info-${role}" aria-label="${title} 자료 정보">${icon('info')}</button>${!unavailable(r) ? `<button class="icon-button" data-zoom="${r.id}" data-k="zoom-${role}" aria-label="${title} 크게 보기">${icon('expand')}</button>` : ''}</span>` : ''}</figcaption><div class="media-window" data-image="${r.id}">${!unavailable(r) ? `<img src="${images[r.image]}" alt="${r.date} Floreat-f3 ${r.kind} 공개 표시 크롭. 등록·정량 자료 아님.">` : `<div class="unavailable"><span class="unavailable-icon">${icon('info')}</span><p>${blocked ? restricted() ? '자료 접근이 제한됩니다' : '선택할 관측이 없습니다' : state.scene === 'expired' ? '미리보기 보관 기간이 끝났습니다' : '이 자료의 미리보기가 없습니다'}</p><button ${restricted() ? 'data-session' : state.area === 'empty' ? 'data-area-all' : `data-info="${r.id}" popovertarget="material-info"`}>${blocked ? restricted() ? '접근 상태 확인' : '공개 범위 보기' : '상태·복구 보기'}</button></div>`}</div></figure>`;
}
function stage() {
  const mismatch = state.pair && byId(state.a).type !== byId(state.b).type;
  return `<section id="media-stage" class="media-stage" tabindex="-1" aria-label="${state.pair ? '두 시점 독립 표시' : '자료 미리보기'}"><div class="media-panes ${state.pair ? 'pair' : ''}">${state.pair ? pane('a') : ''}${pane('b')}</div><footer class="media-footer"><span><a href="https://catalogue.data.wa.gov.au/dataset/floreat-f3-orthomosaic-aug-${byId(state.b).year}" target="_blank" rel="noopener noreferrer">Cambridge Coastcare / DataWA</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a> · KSI 크롭</span><span>${mismatch && canList() ? '<button class="status-badge" data-mismatch popovertarget="material-info">자료 종류 다름</button>' : ''}공개 크롭 · 등록 자료 아님${state.pair ? ' · 독립 표시' : ''}</span></footer></section>`;
}
function notificationBody() {
  const notice = globalIssues();
  return notice ? `<div class="notice-content"><span class="notice-symbol">${icon(state.scene === 'loading' ? 'info' : 'alert')}</span><div><strong>${notice.title}</strong><p>${notice.text}</p><button data-notice-action>${notice.action}</button></div></div>` : '<p class="no-notifications">현재 화면 전체 알림이 없습니다.</p>';
}
function renderNotifications() {
  const notice = globalIssues();
  document.getElementById('toast-host').innerHTML = toastOpen && notice ? `<section class="floating-notice" aria-label="화면 전체 알림">${notificationBody()}<button class="icon-button close-toast" data-dismiss-toast aria-label="상단 알림 닫기">${icon('close')}</button></section>` : '';
  document.querySelector('#notifications .popover-body').innerHTML = notificationBody();
}
function render(focusKey) {
  const input = document.activeElement; const caret = input?.id === 'search' ? input.selectionStart : null;
  const scrollTop = document.querySelector('.catalog-scroll')?.scrollTop || 0;
  document.getElementById('app').classList.toggle('focus-view', state.focus);
  document.getElementById('app').innerHTML = `${rail()}<main class="work" id="workspace">${toolbar()}<div class="work-body">${catalog()}${stage()}</div></main>`;
  document.getElementById('scene').value = state.scene;
  renderNotifications();
  document.querySelector('.catalog-scroll').scrollTop = scrollTop;
  document.querySelector('.filters')?.addEventListener('toggle', e => filtersOpen = e.target.open);
  if (focusKey) {
    const next = document.querySelector(`[data-k="${CSS.escape(focusKey)}"]`); next?.focus({ preventScroll: true });
    if (caret !== null && next?.id === 'search') next.setSelectionRange(caret, caret);
  }
}
function infoBody(id, mismatch = false) {
  const host = document.querySelector('#material-info .popover-body');
  if (mismatch) {
    host.innerHTML = '<p>A와 B의 자료 종류가 다릅니다. 독립 표시는 가능하지만 정합·정량 비교가 아닙니다.</p><button data-match>같은 종류로 맞추기</button>';
    return;
  }
  const r = byId(id);
  const problem = issue(r);
  host.innerHTML = `<p class="info-title">${r.date} · ${r.kind}</p>${problem ? `<p class="material-problem">${problem}${problem === '기준 미확인' ? ' · DSM 수직기준 미확인' : ''}</p>` : ''}<dl><div><dt>원본 파일</dt><dd>${r.name}</dd></div><div><dt>출처</dt><dd>Cambridge Coastcare / DataWA · CC BY 4.0</dd></div><div><dt>원본 표기</dt><dd>EPSG:7850 · 현재 크롭의 지리정합을 뜻하지 않음</dd></div><div><dt>사용 범위</dt><dd>공개 해안 자료의 설계용 크롭. 등록·정량·정확도·제품 입력 지원을 뜻하지 않음.</dd></div></dl>${unavailable(r) && !restricted() ? '<p>다른 이미지로 대체하지 않습니다. 아래 복구는 실제 재준비 요청이 아닌 로컬 상태 예시입니다.</p><button data-recover>일반 표시 예시로</button>' : ''}`;
}
function openModal(title, body, action = '') {
  lastModalTrigger = document.activeElement;
  const modal = document.getElementById('modal');
  document.getElementById('modal-title').textContent = title;
  modal.querySelector('.modal-body').innerHTML = body;
  modal.querySelector('.modal-actions').innerHTML = `<button data-close-modal>닫기</button>${action}`;
  modal.showModal();
}
function sessionModal() {
  openModal('연결 상태를 확인해 주세요', '<p>세션 만료 또는 접근 제한을 보여주는 설계 예시입니다. 확인 전에는 자료를 표시하지 않습니다.</p><p>실제 로그인이나 계정 권한을 변경하지 않습니다. 화면을 닫아도 숨겨진 자료가 다시 나타나지 않습니다.</p>', '<button class="primary" data-reconnect>다시 연결 예시</button>');
}
function closePopovers() { document.querySelectorAll('[popover]:popover-open').forEach(p => p.hidePopover()); }
function recover() {
  closePopovers(); toastOpen = false; update({ scene: 'normal' }); announce('일반 상태 예시로 돌아왔습니다. 실제 요청은 하지 않았습니다.');
}
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (button) {
    if (button.hasAttribute('popovertarget') && button.getAttribute('popovertargetaction') !== 'hide') lastPopoverTrigger = button;
    if (button.dataset.info) infoBody(button.dataset.info);
    else if (button.hasAttribute('data-mismatch')) infoBody(null, true);
    else if (button.dataset.record) { update({ [state.pair ? state.target : 'b']: button.dataset.record }); announce(`${byId(button.dataset.record).date} ${byId(button.dataset.record).kind} 표시`); }
    else if (button.hasAttribute('data-focus-mode')) update({ focus: !state.focus });
    else if (button.dataset.screen) update({ screen: button.dataset.screen });
    else if (button.hasAttribute('data-swap')) update({ a: state.b, b: state.a });
    else if (button.hasAttribute('data-clear')) update({ q: '', kind: 'all' });
    else if (button.hasAttribute('data-area-all')) update({ area: 'all' });
    else if (button.hasAttribute('data-dismiss-toast')) { toastOpen = false; renderNotifications(); document.querySelector('[data-k=notifications]').focus(); }
    else if (button.hasAttribute('data-notice-action')) state.scene === 'session' ? sessionModal() : recover();
    else if (button.hasAttribute('data-recover')) recover();
    else if (button.hasAttribute('data-session')) sessionModal();
    else if (button.hasAttribute('data-match')) { closePopovers(); update({ a: records.find(r => r.type === byId(state.b).type && r.id !== state.b).id }); }
    else if (button.dataset.zoom) { const r = byId(button.dataset.zoom); if (!unavailable(r)) openModal(`${r.date} · ${r.kind}`, `<p>공개 표시 크롭 · 등록·정량 자료 아님</p><img class="zoom-image" src="${images[r.image]}" alt="${r.date} ${r.kind} 표시용 크롭">`); }
    else if (button.hasAttribute('data-close-modal')) document.getElementById('modal').close();
    else if (button.hasAttribute('data-reconnect')) { document.getElementById('modal').close(); recover(); }
    else if (button.dataset.out) { lastPopoverTrigger = button; document.querySelector('#material-info .popover-body').innerHTML = `<p>${escapeHtml(button.dataset.out)} 화면은 변경하지 않습니다. 이번 시안에서는 작업공간·자료 표시만 비교합니다.</p>`; document.getElementById('material-info').showPopover(); }
  }
  const link = event.target.closest('a[href="#catalog"],a[href="#media-stage"]');
  if (link) { event.preventDefault(); const target = document.querySelector(link.getAttribute('href')); target.scrollIntoView({ block: 'start' }); target.focus({ preventScroll: true }); }
});
document.addEventListener('input', e => { if (e.target.id === 'search') { update({ q: e.target.value }, false); announce(`${filtered().length}개 검색 결과. 기존 표시 선택은 유지합니다.`); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'scene') { closePopovers(); toastOpen = ['error', 'loading'].includes(el.value); update({ scene: el.value }); announce(`${globalIssues()?.title || el.options[el.selectedIndex].text} · 상태 예시`); if (el.value === 'session') sessionModal(); }
  else if (el.id === 'area') update({ area: el.value });
  else if (el.id === 'kind') update({ kind: el.value });
  else if (el.name === 'view') { update({ pair: el.value === 'pair' }); announce(state.pair ? '두 시점 독립 표시' : '한 장 표시'); }
  else if (el.name === 'target') update({ target: el.value });
});
document.querySelectorAll('[popover]').forEach(popover => popover.addEventListener('toggle', e => {
  if (e.newState === 'closed' && (document.activeElement === document.body || popover.contains(document.activeElement))) {
    if (lastPopoverTrigger?.isConnected) lastPopoverTrigger.focus(); else document.querySelector('[data-k=notifications]')?.focus();
  }
}));
document.getElementById('modal').addEventListener('close', () => { document.querySelector('.modal-body').innerHTML = ''; if (lastModalTrigger?.isConnected) lastModalTrigger.focus(); else document.querySelector('[data-k=notifications]')?.focus(); });
addEventListener('popstate', () => { state = readUrl(); toastOpen = ['error', 'loading'].includes(state.scene); render(); announce('이전 표시 상태를 복원했습니다.'); });
render();
if (state.scene === 'session') sessionModal();
</script></body></html>
